<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unit 2 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Unit 2 games hub</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}

/* added for the Unit 2 and Unit 8 engines */
.chunks.lines{flex-direction:column}
.chunks.lines .chunk{width:100%;font-variant-numeric:tabular-nums}
.taboo{margin:14px 0 4px;padding:18px 16px;border-radius:16px;border:2px solid var(--head);background:var(--card);text-align:center}
.taboo .sector{font-size:1.8em;font-weight:700;color:var(--head);line-height:1.15}
.taboo .dont{margin:10px 0 6px;color:var(--red);font-weight:700;font-size:.82em;text-transform:uppercase;letter-spacing:.08em}
.taboo .banned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

sks that people used to do."}, {"deck": "2.3", "term": "Drone", "def": "An aircraft with no pilot on board, from a small toy to a full size aircraft."}, {"deck": "2.3", "term": "Autonomous system", "def": "AI, vision, sensors and robotics combined so a machine can operate and direct itself."}, {"deck": "2.3", "term": "Automated against autonomous", "def": "Automated repeats a fixed sequence. Autonomous senses, decides and acts."}, {"deck": "2.3", "term": "Distributed energy", "def": "Many small local generating schemes, often renewable, in place of a few large power stations."}, {"deck": "2.3", "term": "Hybrid technology system", "def": "Two or more technologies combined in one system, such as solar panels working with a wind turbine."}, {"deck": "2.3", "term": "Cyber-physical system", "def": "Computing and networks joined to physical machinery, such as remote monitoring of wind turbines."}, {"deck": "2.3", "term": "Internet of things", "def": "Machines and devices fitted with sensors and network links so they can connect over the internet."}, {"deck": "2.3", "term": "Cloud computing", "def": "Using storage, software and networking over the internet instead of owning the equipment."}, {"deck": "2.3", "term": "Sustainability", "def": "Meeting our needs now without harming the ability of future generations to meet theirs."}, {"deck": "2.3", "term": "Circular economy", "def": "Keeping products in use through sharing, leasing, repairing, refurbishing and recycling, aiming for zero waste."}, {"deck": "2.3", "term": "Product life cycle", "def": "Design, raw materials, manufacture, distribution, use and disposal. Design has the biggest effect on sustainability."}, {"deck": "2.2", "term": "Bessemer process", "def": "Making steel by blowing air through molten pig iron to burn off carbon and impurities. From 1855."}, {"deck": "2.2", "term": "Composite", "def": "Two materials combined so the result beats either one alone."}, {"deck": "2.2", "term": "Reinforcement", "def": "The fibre in a composite. Carries the load, because it is stiff and strong along its length."}, {"deck": "2.2", "term": "Matrix", "def": "The resin in a composite. Holds the fibres in position and transfers load between them."}, {"deck": "2.2", "term": "Polymer", "def": "A long, repeating chain of molecules. Plastics are synthetic polymers."}, {"deck": "2.2", "term": "Bakelite", "def": "The first fully synthetic polymer, 1907. Mouldable and a good insulator."}, {"deck": "2.2", "term": "Carbon fibre", "def": "Patented in 1961. Very stiff and very light, used in aerospace, automotive and marine."}, {"deck": "2.2", "term": "Kevlar", "def": "A para aramid fibre from 1966. Light and very durable, used in ballistic and stab vests."}, {"deck": "2.2", "term": "Bioplastics", "def": "Plastics made from plant crops rather than from fossil fuels."}, {"deck": "2.2", "term": "Arc lamp", "def": "1806. Makes light by an electric arc through a gas. Still used in projector lamps."}, {"deck": "2.2", "term": "Incandescent lamp", "def": "Makes light from a filament heated white hot. On sale from 1880."}, {"deck": "2.2", "term": "The lamp energy figures", "def": "About 95 per cent of a light emitting diode's input energy becomes light, and about 5 per cent is heat. The reverse for filament and fluorescent. Say about."}, {"deck": "2.2", "term": "The national grid", "def": "Completed in 1935. By 1940 about two thirds of UK homes had a supply."}, {"deck": "2.2", "term": "Internal combustion engine", "def": "An engine in which the fuel burns inside the engine itself, not in a separate boiler."}, {"deck": "2.2", "term": "Three advantages of the electric motor", "def": "Each machine runs independently, far less maintenance, and much lower friction losses."}, {"deck": "2.2", "term": "Replaceable parts", "def": "Parts made to the same size, so any one fits any machine of that design. From 1798."}, {"deck": "2.2", "term": "Why interchangeable parts mattered", "def": "A part could be replaced without the original maker, who had hand fitted each part to one machine."}, {"deck": "2.2", "term": "The moving assembly line", "def": "1913. Output per worker rose, and each job narrowed to one repeated task at the pace of the line."}, {"deck": "2.2", "term": "Mechanical television", "def": "1920s. A spinning disc with holes scanned the picture, about thirty lines."}, {"deck": "2.2", "term": "Computer generations", "def": "First, thermionic valves. Second, transistors. Third, integrated circuits. Then the microprocessor."}, {"deck": "2.2", "term": "The internet and the World Wide Web", "def": "The internet is the network of networks. The web is one service running on it, invented in 1989."}, {"deck": "2.2", "term": "When automation started", "def": "1771 for the first fully automated machine and 1785 for the first fully automated process. It is over two hundred years old."}, {"deck": "2.2", "term": "The five named areas", "def": "Transport, healthcare, housing, employment and sustainability. Attach at least one to every advance."}, {"deck": "2.2", "term": "Bessemer process", "def": "Making steel by blowing air through molten pig iron to burn off carbon and impurities."}, {"deck": "2.2", "term": "Internal combustion engine", "def": "An engine that burns its fuel inside the engine itself."}, {"deck": "2.2", "term": "Interchangeable parts", "def": "Standard parts made accurately enough that any one fits, so machines can be repaired with spares."}, {"deck": "2.2", "term": "Thermionic valve", "def": "A vacuum tube that amplifies electrical signals by controlling a flow of electrons. The forerunner of the transistor."}, {"deck": "2.2", "term": "Cathode ray tube", "def": "A vacuum tube that fires a beam of electrons at a fluorescent coating to build up a picture."}, {"deck": "2.2", "term": "LED", "def": "Light emitting diode: an electronic device that gives out light when current flows through it."}, {"deck": "2.2", "term": "OLED", "def": "An LED with a layer of organic material that emits light, so each pixel makes its own light. Allows curved screens."}, {"deck": "2.2", "term": "4K resolution", "def": "A screen roughly 4,000 pixels wide. A 4K television is 3,840 pixels across by 2,160 down."}, {"deck": "2.3", "term": "The three actions of artificial intelligence", "def": "Gathers information, performs analysis, and makes autonomous decisions."}, {"deck": "2.3", "term": "Cobot", "def": "A robot with vision sensors and artificial intelligence that works safely alongside people."}, {"deck": "2.3", "term": "The automation ladder", "def": "Manual, mechanised, automated, autonomous. The step that matters is who decides."}, {"deck": "2.3", "term": "The four stages of a cyber physical system", "def": "Sense, transmit, analyse, act. The benefit only arrives when all four are present."}, {"deck": "2.3", "term": "The four layers", "def": "Cloud computing, then the internet of things, then the cyber physical system, then the physical equipment."}, {"deck": "2.3", "term": "Why laptops are not in the internet of things", "def": "The term covers everyday objects given sensing and connectivity, not computers that always had it."}, {"deck": "2.3", "term": "The six Rs", "def": "Reduce, reuse, recycle, rethink, refuse, repair."}, {"deck": "2.3", "term": "The waste hierarchy", "def": "Prevention, preparing for reuse, recycling, other recovery, disposal. Work down from the top."}, {"deck": "2.3", "term": "The product life cycle", "def": "Design, raw material extraction, manufacture, distribution, product use, disposal."}, {"deck": "2.3", "term": "Why design carries the most influence", "def": "It fixes the materials, the assembly method and whether the product can be opened at end of life."}, {"deck": "2.3", "term": "Payback in cycles", "def": "Programming time divided by the time saved per cycle. Leaving the programming time out makes automation look free."}, {"deck": "2.3", "term": "Recovery rate", "def": "Mass recovered divided by total mass, times 100. It can never exceed 100 per cent."}, {"deck": "2.3", "term": "Self consumption", "def": "The share of the electricity you generate that you use on site, rather than exporting."}, {"deck": "2.3", "term": "Renewable materials", "def": "Cotton, wool, straw and wood. Learners forget the materials half of renewables."}, {"deck": "2.3", "term": "Biomass", "def": "Organic material from plants or animals, including wood, sewage and ethanol from crops."}, {"deck": "2.3", "term": "Alternatives to petrol and diesel", "def": "LPG, biofuel, hydrogen, and electric power from batteries or a fuel cell."}, {"deck": "2.3", "term": "Writing about the future", "def": "Use current evidence suggests, is likely to, and the extent will depend on. A confident guess earns nothing."}, {"deck": "2.3", "term": "Why the circular economy is not recycling", "def": "It is a change to how products are designed and owned, not to how people sort their bins."}], "first": [{"a": {"event": "Replaceable parts in a firearms factory", "date": "1798"}, "b": {"event": "The moving assembly line", "date": "1913"}, "why": "The line cannot pause while a skilled worker files a part to fit, so the parts had to come first."}, {"a": {"event": "The arc lamp", "date": "1806"}, "b": {"event": "The incandescent lamp on sale", "date": "1880"}, "why": "The arc lamp lit public spaces long before anyone could buy a lamp for the house."}, {"a": {"event": "The incandescent lamp on sale", "date": "1880"}, "b": {"event": "The first large coal fired power station", "date": "1882"}, "why": "Demand for light created the market for supply, not the other way round."}, {"a": {"event": "The automated spinning frame", "date": "1771"}, "b": {"event": "The Bessemer process", "date": "1855"}, "why": "Automation is over two hundred years old, which surprises most people."}, {"a": {"event": "The Bessemer process", "date": "1855"}, "b": {"event": "The first synthetic polymer", "date": "1869"}, "why": "Cheap steel came first and paid for much of what followed."}, {"a": {"event": "Bakelite", "date": "1907"}, "b": {"event": "Polyester resins patented", "date": "1936"}, "why": "Bakelite was the first fully synthetic polymer. Polyester resins made composite moulding practical."}, {"a": {"event": "Carbon fibre patented", "date": "1961"}, "b": {"event": "Kevlar", "date": "1966"}, "why": "Five years apart, and both are reinforcement fibres rather than matrix materials."}, {"a": {"event": "The wireless telegraph", "date": "1895"}, "b": {"event": "BBC radio broadcasting", "date": "1922"}, "why": "Signals in morse code came first. Broadcasting to households followed."}, {"a": {"event": "Mechanical television", "date": "1920s"}, "b": {"event": "Commercial fluorescent lighting", "date": "1934"}, "why": "The spinning disc was already obsolete by 1934, when the electron beam took over."}, {"a": {"event": "The national grid completed", "date": "1935"}, "b": {"event": "The first practical light emitting diode", "date": "1962"}, "why": "The grid delivered the power. The LED cut how much of it a lamp needs."}, {"a": {"event": "The World Wide Web invented", "date": "1989"}, "b": {"event": "The first web page", "date": "1991"}, "why": "Two years between the idea and the first page anyone could read."}, {"a": {"event": "The first hydroelectric plant at Cragside", "date": "1878"}, "b": {"event": "The first large coal fired power station", "date": "1882"}, "why": "Cragside was hydroelectric and came first. The London station was coal fired and larger."}], "consequence": [{"advance": "The Bessemer process, 1855", "area": "Housing and transport", "options": ["Railways, bridges, dams and tall buildings could be built cheaply", "Homes could be lit without gas", "Any part would fit any machine", "Farm output rose sharply"], "correct": 0, "why": "Cheap mass produced steel is the enabling condition for most large structures."}, {"advance": "The first synthetic polymer, 1869", "area": "Employment and social access", "options": ["Goods that had needed ivory or tortoiseshell became affordable", "Factories could run night shifts", "Cars became affordable", "Signals could travel without wires"], "correct": 0, "why": "The social point is who could suddenly afford a manufactured object."}, {"advance": "The light emitting diode, 1962", "area": "Sustainability", "options": ["The same light for far less energy, so lower cost and lower emissions", "Pictures reached the living room", "Repair no longer needed the maker", "Steel became cheap"], "correct": 0, "why": "This is the clearest case in the unit of an advance whose main consequence is environmental."}, {"advance": "The national grid, 1935", "area": "Housing and employment", "options": ["Electricity became a national utility, and by 1940 about two thirds of homes had a supply", "Aircraft could be detected at a distance", "Composites replaced metal", "Farm jobs disappeared overnight"], "correct": 0, "why": "The grid turned a local novelty into something a household could rely on."}, {"advance": "The internal combustion engine", "area": "Housing", "options": ["Roads and suburbs spread outwards from town centres", "Factories no longer needed belts", "Steel became cheap", "Light became efficient"], "correct": 0, "why": "Transport, employment, food production and sustainability are all creditable too."}, {"advance": "The electric motor replacing line shafts", "area": "Employment and safety", "options": ["Factory layout was freed and a major cause of injury was removed", "Cars became affordable", "Plastics replaced ivory", "Colour reached television"], "correct": 0, "why": "Also creditable: far less maintenance, and much lower friction losses."}, {"advance": "Replaceable parts, 1798", "area": "Employment", "options": ["A broken part could be replaced without the original maker", "Machines ran faster", "Steel became cheaper", "Factories were quieter"], "correct": 0, "why": "Repair, not speed. That is the point the mark scheme rewards."}, {"advance": "The moving assembly line, 1913", "area": "Employment", "options": ["Each job narrowed to a single repeated task at the pace of the line", "Workers gained control of their day", "Craft skill increased", "Factories needed fewer parts"], "correct": 0, "why": "Output per worker rose at the same time. Both are true and a good answer holds both."}, {"advance": "Agricultural machinery, 1770 to 1850", "area": "Employment", "options": ["Farm jobs fell while town factory jobs grew, and people moved to find work", "Nobody lost work", "Farming stopped", "Wages rose immediately for everyone"], "correct": 0, "why": "Notice that the work moved rather than disappearing, and the people rarely moved with it."}, {"advance": "The World Wide Web, 1989", "area": "Employment and retail", "options": ["Remote working spread, and high street retail declined", "Steel became cheaper", "Lighting became efficient", "Composites replaced metal"], "correct": 0, "why": "Naming a negative as well as a positive is what an evaluate question asks for."}], "compositeSort": [{"text": "Carries the load along its length", "answer": 0, "why": "The fibre is stiff and strong in one direction, so it takes the load."}, {"text": "Holds the fibres in position", "answer": 1, "why": "That is the matrix. Without it the fibres would not hold their shape."}, {"text": "Transfers load between fibres so one break does not end the load path", "answer": 1, "why": "This is the job people forget, and it is why a composite is not a mixture."}, {"text": "Glass, carbon or aramid", "answer": 0, "why": "All three are reinforcement fibres."}, {"text": "Polyester or epoxy resin", "answer": 1, "why": "Resins are matrix materials. Polyester resins were patented in 1936."}, {"text": "Woven into a fabric before use", "answer": 0, "why": "Glass is drawn into fibres and woven, then set in resin."}, {"text": "Cures to a hard solid", "answer": 1, "why": "The curing behaviour of polyester resin made it the first choice for composite work."}, {"text": "Kevlar in a stab vest is this part", "answer": 0, "why": "Kevlar is a para aramid reinforcement fibre."}, {"text": "Gives the part its surface and shape", "answer": 1, "why": "The matrix takes the shape of the mould."}, {"text": "Remove it and the remaining part cannot carry the load", "answer": 0, "why": "Remove the fibres and the resin will not carry the load."}], "calc": [{"id": "K1", "q": "A lamp gives 460 lux at a fixed distance and draws 12 W. Calculate its efficiency.", "formula": "efficiency = illuminance ÷ power", "answer": 38.33, "raw": 38.333333333333336, "dp": 2, "units": ["lux per W", "W per lux", "kWh", "N per g"], "unit": 0, "tol": 0.02, "worked": ["efficiency = illuminance ÷ power", "efficiency = 460 lux ÷ 12 W", "efficiency = 38.33 lux per W"]}, {"id": "K2", "q": "A light emitting diode lamp gives 505 lux at the same distance and draws 9 W. Calculate its efficiency.", "formula": "efficiency = illuminance ÷ power", "answer": 56.11, "raw": 56.111111111111114, "dp": 2, "units": ["lux per W", "W per lux", "lumens", "per cent"], "unit": 0, "tol": 0.02, "worked": ["efficiency = illuminance ÷ power", "efficiency = 505 lux ÷ 9 W", "efficiency = 56.11 lux per W"]}, {"id": "K3", "q": "A 45 W lamp runs for 1,720 hours in a year. Calculate the energy it uses.", "formula": "energy E = power P × time t", "answer": 77.4, "raw": 77.39999999999999, "dp": 2, "units": ["kWh", "W", "kW", "£"], "unit": 0, "tol": 0.02, "worked": ["E = P × t", "E = 0.045 kW × 1,720 h", "E = 77.40 kWh", "Watch the units. 45 × 1,720 gives 77,400, which is a thousand times out."]}, {"id": "K4", "q": "A workshop has 180 fittings of 38 W, running 1,950 hours a year. Calculate the total energy.", "formula": "energy E = power P × time t", "answer": 13338.0, "raw": 13337.999999999998, "dp": 2, "units": ["kWh", "kW", "W", "£"], "unit": 0, "tol": 0.5, "worked": ["E = P × t", "E = 0.038 kW × 1,950 h = 74.10 kWh per fitting", "for 180 fittings, E = 74.10 × 180 = 13,338.00 kWh"]}, {"id": "K5", "q": "That workshop pays 26 pence per kWh. Calculate the annual cost of the 13,338.00 kWh.", "formula": "cost C = energy E × unit price", "answer": 3467.88, "raw": 3467.88, "dp": 2, "units": ["£", "kWh", "pence per kWh", "kW"], "unit": 0, "tol": 0.02, "worked": ["C = E × unit price", "C = 13,338.00 kWh × £0.26", "C = £3,467.88, to the nearest penny"]}, {"id": "K6", "q": "The same 180 fittings are changed to 6 W lamps for the same 1,950 hours at 26 pence per kWh. Calculate the new annual cost.", "formula": "cost C = energy E × unit price", "answer": 547.56, "raw": 547.5600000000001, "dp": 2, "units": ["£", "kWh", "W", "per cent"], "unit": 0, "tol": 0.02, "worked": ["E = 0.006 kW × 1,950 h = 11.70 kWh per fitting", "for 180 fittings, E = 11.70 × 180 = 2,106.00 kWh", "C = 2,106.00 × £0.26 = £547.56", "The annual saving is £3,467.88 - £547.56 = £2,920.32"]}, {"id": "K7", "q": "Seven learners work for four minutes and make 33 units, of which 29 are good. Calculate the output per person per minute.", "formula": "output = good units ÷ (people × minutes)", "answer": 1.04, "raw": 1.0357142857142858, "dp": 2, "units": ["units per person per minute", "units", "per cent", "minutes"], "unit": 0, "tol": 0.02, "worked": ["output = good units ÷ (people × minutes)", "output = 29 ÷ (7 × 4)", "output = 1.04 units per person per minute", "Rejects do not count as output."]}, {"id": "K8", "q": "The same run made 33 units and 4 were rejected. Calculate the reject rate.", "formula": "reject rate = (rejects ÷ total made) × 100", "answer": 12.12, "raw": 12.121212121212121, "dp": 2, "units": ["per cent", "units", "units per minute", "N per g"], "unit": 0, "tol": 0.02, "worked": ["reject rate = (rejects ÷ total made) × 100", "reject rate = (4 ÷ 33) × 100", "reject rate = 12.12 per cent", "Divide by everything made, not by the good ones."]}, {"id": "K9", "q": "A composite coupon fails at 112 N and has a mass of 23 g. Calculate its specific strength.", "formula": "specific strength = failure force , "items": [{"id": "N1", "q": "A person takes 14 seconds a cycle and a machine would take 8 seconds. Calculate the time saved per cycle.", "formula": "time saved = human cycle time - machine cycle time", "answer": 6.0, "raw": 6.0, "dp": 0, "units": ["seconds", "cycles", "minutes", "per cent"], "unit": 0, "tol": 0.01, "worked": ["time saved = human cycle time - machine cycle time", "time saved = 14 s - 8 s", "time saved = 6 s per cycle"]}, {"id": "N2", "q": "Programming that machine takes 38 minutes. Calculate the payback in cycles, using the 6 seconds saved.", "formula": "payback N = programming time ÷ time saved per cycle", "answer": 380.0, "raw": 380.0, "dp": 0, "units": ["cycles", "seconds", "minutes", "days"], "unit": 0, "tol": 0.5, "worked": ["programming time = 38 × 60 = 2,280 s", "N = programming time ÷ time saved per cycle", "N = 2,280 ÷ 6", "N = 380 cycles", "Leaving the programming time out makes automation look free. It is the most common error here."]}, {"id": "N3", "q": "The cell runs 160 cycles a day. How many whole working days before the programming is paid back?", "formula": "days = payback cycles ÷ cycles per day, rounded up", "answer": 3.0, "raw": 3.0, "dp": 0, "units": ["days", "cycles", "hours", "per cent"], "unit": 0, "tol": 0.01, "worked": ["days = 380 ÷ 160 = 2.375", "A part day still needs the cell running, so round up.", "days = 3 working days"]}, {"id": "N4", "q": "A 14 kW rooftop array averages 4.2 productive hours a day. Calculate the energy generated in one day.", "formula": "energy E = power P × time t", "answer": 58.8, "raw": 58.800000000000004, "dp": 2, "units": ["kWh", "kW", "W", "£"], "unit": 0, "tol": 0.02, "worked": ["E = P × t", "E = 14 kW × 4.2 h", "E = 58.80 kWh per day"]}, {"id": "N5", "q": "That array is productive on 290 days a year. Calculate the annual energy generated.", "formula": "energy E = daily energy × days", "answer": 17052.0, "raw": 17052.0, "dp": 2, "units": ["kWh", "kW", "days", "£"], "unit": 0, "tol": 0.5, "worked": ["annual E = 58.80 kWh × 290", "annual E = 17,052.00 kWh"]}, {"id": "N6", "q": "Electricity costs 27 pence per kWh. Calculate the annual value of that 17,052.00 kWh.", "formula": "value = energy × unit price", "answer": 4604.04, "raw": 4604.04, "dp": 2, "units": ["£", "kWh", "pence per kWh", "per cent"], "unit": 0, "tol": 0.02, "worked": ["value = E × unit price", "value = 17,052.00 kWh × £0.27", "value = £4,604.04, to the nearest penny"]}, {"id": "N7", "q": "The site uses 12,400 kWh of that 17,052.00 kWh on site. Calculate the self consumption.", "formula": "self consumption = (energy used on site ÷ energy generated) × 100", "answer": 72.72, "raw": 72.71874266948159, "dp": 2, "units": ["per cent", "kWh", "£", "days"], "unit": 0, "tol": 0.02, "worked": ["self consumption = (used on site ÷ generated) × 100", "self consumption = (12,400 ÷ 17,052) × 100", "self consumption = 72.72 per cent"]}, {"id": "N8", "q": "A stripped product has a total mass of 5.15 kg and 3.42 kg can be recovered. Calculate the recovery rate.", "formula": "recovery rate = (mass recovered ÷ total mass) × 100", "answer": 66.41, "raw": 66.40776699029126, "dp": 2, "units": ["per cent", "kg", "g", "N per g"], "unit": 0, "tol": 0.02, "worked": ["recovery rate = (mass recovered ÷ total mass) × 100", "recovery rate = (3.42 ÷ 5.15) × 100", "recovery rate = 66.41 per cent", "A recovery rate can never exceed 100 per cent. If yours does, you divided by the wrong number."]}, {"id": "N9", "q": "Calculate the mass from that product that goes to landfill.", "formula": "mass to landfill = total mass - mass recovered", "answer": 1.73, "raw": 1.7300000000000004, "dp": 2, "units": ["kg", "g", "per cent", "N"], "unit": 0, "tol": 0.005, "worked": ["mass to landfill = total mass - mass recovered", "mass to landfill = 5.15 kg - 3.42 kg", "mass to landfill = 1.73 kg"]}]}], "errors": [{"title": "A bridge score", "lines": ["The bridge failed at 5.6 kg and the bridge has a mass of 41 g.", "score = 5.6 ÷ 41", "score ", "options": ["Name it, no explanation needed", "Say what happens and why", "Similarities and differences", "Both sides, then a judgement"], "correct": 0, "why": "Usually 1 to 2 marks. Do not spend a paragraph on it."}, {"word": "Discuss or evaluate", "options": ["Give both sides, then a judgement", "Name it, no explanation needed", "Show the formula and the unit", "Say what it is and what happens"], "correct": 0, "why": "Usually 6 to 9 marks. No judgement means the top band is out of reach."}, {"word": "Describe or outline", "options": ["Say what it is and what happens", "Say why it happens", "Give reasons for your choice", "Reach a judgement"], "correct": 0, "why": "Usually 2 to 3 marks. Explain goes one step further and gives the reason."}, {"word": "Calculate", "options": ["Show the formula, the substitution, the answer and the unit", "Give a rough estimate", "Explain the method in words only", "Name the equation only"], "correct": 0, "why": "Usually 2 to 4 marks. Marks are lost for a bare answer with no working and no unit."}, {"word": "Justify", "options": ["Give reasons for the choice you made", "List the options", "Name the thing being asked for", "Describe what happens"], "correct": 0, "why": "Usually 4 to 6 marks. A ranking with no criterion named is not a justification."}, {"word": "Compare", "options": ["Give the similarities and the differences", "Give one side only", "Give a judgement with no evidence", "Define both terms and stop"], "correct": 0, "why": "Usually 3 to 4 marks. Both sides of the comparison are needed."}], "games": [{"no": "G1", "name": "Sector Taboo", "crit": "2.1 Sectors", "key": "taboo"}, {"no": "G2", "name": "Sector Match", "crit": "2.1 Sectors", "key": "match"}, {"no": "G3", "name": "Timeline builder", "crit": "2.2 History", "key": "timeline"}, {"no": "G4", "name": "Which came first?", "crit": "2.2 History", "key": "first"}, {"no": "G5", "name": "Consequence match", "crit": "2.2 History", "key": "consequence"}, {"no": "G6", "name": orking added to equipment that did not have them."}, {"text": "Precision farming that measures the soil then directs the fertiliser", "answer": 2, "why": "Sense, transmit, analyse and act, all four stages present."}, {"text": "Conveyors, pumps and presses on the shop floor", "answer": 3, "why": "No computing of its own. It is what the layers above act on."}, {"text": "A 3D simulation linked to the machine it represents", "answer": 2, "why": "Modelling software joined to the physical machine."}, {"text": "Processing paid for by the hour on somebody else's servers", "answer": 0, "why": "The commercial argument for the cloud: subscribe rather than buy."}], "stages": ["Sense", "Transmit", "Analyse", "Act"], "stageItems": [{"text": "A soil probe measures the moisture in the field", "answer": 0, "why": "Sensors measure a condition. That is stage one."}, {"text": "The reading travels over a mobile network to the control system", "answer": 1, "why": "The data goes over a network."}, {"text": "The control system compares the reading with the target and works out what is needed", "answer": 2, "why": "A control system interprets the data."}, {"text": "A valve opens and water is released onto that part of the field", "answer": 3, "why": "Something physical changes as a result."}, {"text": "A vibration sensor on a gearbox records how much it is shaking", "answer": 0, "why": "Measuring the condition, nothing more yet."}, {"text": "Software works out that the bearing will fail within a fortnight", "answer": 2, "why": "This is the analysis step, and it is predictive maintenance."}, {"text": "A work order is raised and the bearing is changed at the weekend", "answer": 3, "why": "Analysing alone produces a conclusion that changes nothing."}, {"text": "The offshore turbine sends its data to shore over a satellite link", "answer": 1, "why": "Transmission, not sensing. The reading already exists."}, {"text": "A camera on the line photographs every part as it passes", "answer": 0, "why": "Vision is a sensor like any other."}, {"text": "The reject gate swings and the faulty part leaves the line", "answer": 3, "why": "The benefit only arrives when all four stages are present."}], "sixRs": [{"r": "Reduce", "means": "Decrease the amount of material used", "look": "Over thick mouldings, unnecessary packaging, redundant parts"}, {"r": "Reuse", "means": "Use an old item again for the same or another purpose", "look": "Whether sub assemblies could be recovered whole"}, {"r": "Recycle", "means": "Reprocess a material to make something else", "look": "Whether materials separate cleanly, and whether they are marked"}, {"r": "Rethink", "means": "Ask whether this many products need to be made at all", "look": "Whether the product is designed for a short life"}, {"r": "Refuse", "means": "If it is not needed, do not buy or make it", "look": "Features that add material but no function"}, {"r": "Repair", "means": "Fix a product rather than replacing it", "look": "Standard fixings, available spares, access to wear parts"}], "sixrItems": [{"text": "Make the moulding thinner so it uses less polymer", "answer": 0, "why": "Less material for the same job."}, {"text": "Fit four screws so the housing opens and the pump can be changed", "answer": 5, "why": "Standard fixings and access to wear parts."}, {"text": "Melt the swarf and turn it into something else", "answer": 2, "why": "Reprocessing the material into a new product."}, {"text": "Ask whether this many products need to be made at all", "answer": 3, "why": "The hardest one to act on and the one with the most effect."}, {"text": "Take a sub assembly out of an old unit and fit it to a new one", "answer": 1, "why": "The item is used again as it is."}, {"text": "Leave out the feature that adds material but no function", "answer": 4, "why": "If it is not needed, do not make it."}, {"text": "Cut the packaging in half", "answer": 0, "why": "Less material and lighter shipping."}, {"text": "Reprocess the polymer housing into he work and a person controls it."}, {"date": "3rd", "event": "Automated", "note": "The machine repeats a fixed sequence on its own."}, {"date": "4th", "event": "Autonomous", "note": "The machine senses, decides and acts without a person."}]}], "careful": [{"options": ["Current evidence suggests drones could be used for stocktaking without closing the aisles", "Drones will replace all warehouse stocktaking within five years"], "correct": 0, "why": "Could be used is an accurate claim. The second sentence is a confident guess with nothing behind it."}, {"options": ["Cyber physical systems will double crop yields", "Cyber physical systems are likely to raise yields, although the extent will depend on the sensors installed"], "correct": 1, "why": "Is likely to, and the extent will depend on, are the phrases this criterion rewards."}, {"options": ["Artificial intelligence is already used to spot faults before a machine breaks down", "Artificial intelligence has solved maintenance"], "correct": 0, "why": "The first is a statement of what happens now, and it is true. The second claims far more than the evidence."}, {"options": ["Every factory will run without people by 2035", "Automation is likely to keep removing repetitive tasks, and to create work in programming and maintenance"], "correct": 1, "why": "The honest answer holds both the job removed and the job created."}, {"options": ["An electric vehicle produces no emissions at the point of use, although the emissions depend on how the electricity was made", "Electric vehicles are zero carbon"], "correct": 0, "why": "Questioning whether an alternative is actually cleaner is exactly the reasoning this criterion rewards."}, {"options": ["Robotics is an emerging technology that has not reached manufacturing yet", "Robotics is already widespread in welding, painting and assembly, and its next step is autonomy"], "correct": 1, "why": "Being honest that robotics is mature keeps the word emerging meaningful."}, {"options": ["T /* ---------- Sector Taboo: a pair game with a timer. One describes, one guesses. ---------- */
function runTaboo(key){
  var cfg = Object.assign({secs:60, support:false, stretch:false, shuffle:false}, Store.get("taboo", {}));
  function setup(){
    function segBtns(){ return [45,60,90].map(function(n){ return '<button data-secs="'+n+'" aria-pressed="'+(cfg.secs===n)+'">'+n+' seconds</button>'; }).join(""); }
    function box(id, on, text){ return '<label class="check"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span>'+esc(text)+'</span></label>'; }
    screen(gameHeader(TITLE[key], 0, 0) + '<div class="wrap"><div class="card">' +
      '<p class="qtext" style="margin-top:0">Play with a partner</p>' +
      '<p style="margin:0 0 10px">The describer holds the phone so the guesser cannot see it. Describe the sector without saying any of the three banned words. Your partner names the sector, then one job in it. Swap roles halfway.</p>' +
      '<b style="color:var(--head)">Seconds for each card</b><div class="seg" role="group" aria-label="Seconds for each card" style="grid-template-columns:repeat(3,1fr)">'+segBtns()+'</div>' +
      box("sup", cfg.support, "Support: one banned word is allowed on each card") +
      box("str", cfg.stretch, "Stretch: describe products and services only, no activities") +
      box("shf", cfg.shuffle, "Shuffle the deck (leave it off to match the printed cards)") +
      '<p class="small muted" style="margin:10px 0 0">The score that goes to your tutor is the number of sectors your pair guessed.</p></div>' +
      '<div class="dock"><button class="btn amber block" id="go">Start the deck</button></div></div>', {game:true, done:true});
    $$("[data-secs]").forEach(function(b){ b.onclick = function(){ cfg.secs = +b.dataset.secs; $$("[data-secs]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); }; });
    $("#go").onclick = function(){
      cfg.support = $("#sup").checked; cfg.stretch = $("#str").checked; cfg.shuffle = $("#shf").checked; Store.set("taboo", cfg); play();
    };
  }
  function play(){
    var base = DATA.tabooOrder.slice(), order = cfg.shuffle ? shuffle(base) : base, n = order.length, half = Math.ceil(n/2);
    var i = 0, guessed = [], passed = [], log = [], started = Date.now(), swapped = false;
    function card(phase){
      var c = DATA.taboo[order[i]], left = cfg.secs;
      screen(gameHeader(TITLE[key], i, n) + '<div class="wrap"><div class="card">' +
        '<div class="qno">Card '+(i+1)+' of '+n+'. Describer holds the phone.</div>' +
        (phase === "card" ? '<div class="meter" role="img" aria-label="'+left+' seconds left" id="tbar"><i style="width:100%"></i></div><p class="small muted" id="tleft" style="margin:6px 0 0">'+left+' seconds left</p>' : '') +
        '<div class="taboo"><div class="sector">'+esc(c.sector)+'</div><div class="dont">'+(cfg.support ? "Do not say (one is allowed)" : "Do not say")+'</div>' +

        $("#next").onclick = function(){ card("card"); };
        return;
      }
      card("card");
    }
    card("card");
  }
  setup();
}

<script>

};
window.addEventListener("online", function(){ Sync.flush(); });
setInterval(function(){ Sync.flush(); }, 30000);

function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : HUB_CONFIG.prefix + " " + title; }

function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;

function resultLine(game, score, max, when){
  var code = S.me ? S.me.code : "";
  return code + " | " + sentName(game) + " | " + score + " of " + max + " | check " + checkCode(code, game, score, max) + " | " + niceDate(when);
}
function copyText(text, done){
  function fallback(){
    var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select(); var ok=false; try { ok = document.execCommand("copy"); } catch(e) {} t.remove(); done(ok);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback); else fallback();
}

/* ---------- the games, in the order they appear ---------- */
var GAMES = UNIT.games;
var TITLE = {flash:"Key word cards", exit:"Exit ticket"};
GAMES.forEach(function(g){ TITLE[g.key] = g.title; });
TITLE.checkin1 = UNIT.checkin.p1.title; TITLE.checkin2 = UNIT.checkin.p2.title;
var LEVELS = [{name:"Apprentice",at:0},{name:"Engineering Technician",at:400},{name:"Incorporated Engineer",at:1000},{name:"Chartered Engineer",at:2000}];
function levelOf(xp){ var i=0; while (i<LEVELS.length-1 && xp>=LEVELS[i+1].at) i++; return {i:i, name:LEVELS[i].name, next:LEVELS[i+1]||null, from:LEVELS[i].at}; }
function streak(){
  var d = S.prog.days.slice().sort(), n = 0, day = new Date();
  if (d.indexOf(todayKey(day)) < 0) day.setDate(day.getDate()-1);
  while (d.indexOf(todayKey(day)) >= 0) { n++; day.setDate(day.getDate()-1); }
  return n;
}
function firstName(){ if (!S.me) return ""; var n = S.me.name || S.me.code; return n.split(" ")[0]; }
function initials(){ var n = (S.me && (S.me.name || S.me.code)) || "?"; var p = n.trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1]||""))).toUpperCase(); }

var inGame = false, stopTimers = [];
function clearTimers(){ stopTimers.forEach(function(f){ try { f(); } catch(e){} }); stopTimers = []; }
function screen(html, opts){

/* ---------- sign in ---------- */
function signIn(msg){
  var list = CLASS.length > 0;
  screen(fullHeader() + '<div class="wrap stack">' +
    '<div class="card stack"><h2 style="margin:0">Sign in</h2>' +
    (list ? '<p class="muted" style="margin:0">Tap your name.</p><div class="names">' + CLASS.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.name)+'</button>'; }).join("") + '</div><p class="muted small" style="margin:6px 0 0">Name not there? Type your code instead.</p>' : '') +
    '<label for="code"><b>Your hub code</b><br><span class="small muted">Four letters and numbers, on the slip from your tutor. It is the same code for every unit.</span></label>' +
    '<input id="code" class="textin codebox" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="err">' +
    '<button class="btn amber block" id="go">Start</button>' +
    '<p id="err" class="small" role="alert" style="color:var(--red);margin:0">' + esc(msg||"") + '</p></div>' +
    '<div class="panel amber"><h3>Nothing here is marked</h3><p>These games are for practice. Your scores stay on this phone until you choose to send them to your tutor.</p></div>' +
    '<p class="foot">Your tutor sees your code, your scores, what you write in the exit ticket and when you played, so they know what to go over again. Nothing else is collected.</p></div>', {out:true});
  var inp = $("#code"), go = $("#go");
  inp.addEventListener("input", function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go.click(); });
  function finish(code, name){
    S.me = {code:code, name:name || code}; rememberMe(S.me); loadProg(); logEvent("open","hub"); home();
  }
  function tryCode(code, name){
    if (!/^[A-Z0-9]{4}$/.test(code)) { $("#err").textContent = "Your code has four letters and numbers."; return; }
    var m = Net.mode();
    if (m === "gas" || m === "remote") {
      go.disabled = true; go.textContent = "Checking";
      Net.call("hello", {code:code}).then(function(r){
        if (r && r.ok) finish(code, name || r.first);
        else { go.disabled=false; go.textContent="Start"; $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; }
      }).catch(function(){ go.disabled=false; go.textContent="Start"; $("#err").textContent = "Cannot reach the hub right now. Check your wifi or data and try again."; });
      return;
    }
    if (CLASS.length && !name) {
      var hit = CLASS.filter(function(c){ return c.code === code; })[0];
      if (!hit) { $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; return; }
      name = hit.name;
    }
    finish(code, name);
  }
  go.onclick = function(){ tryCode(inp.value.trim()); };
  $$(".names button").forEach(function(b){ b.onclick = function(){ var c = CLASS[+b.dataset.i]; tryCode(c.code, c.name); }; });
  if (!list) setTimeout(function(){ try { inp.focus(); } catch(e){} }, 60);
}
function signOut(silent){
  if (!silent && !confirm("Sign out on this phone? Your record stays here for next time.")) return;
  S.me = null; Store.del("me"); Store.rawSet(SHARED_ME, null); Store.rawSet("u11hub.me", null); loadProg(); signIn();
}

/* ---------- home ---------- */
async function loadServer(){
  var m = Net.mode(); if (m !== "gas" && m !== "remote") return;
  try {
    var r = await Net.call("stats", {});
    if (r && r.ok) Object.assign(S.server, {state:"ok", focus:r.focus, target:r.target, week:r.week, message:r.message||"", nameOnly:!!r.nameOnly});
  } catch(e) { S.server.state = "offline"; }
}
function home(){
  if (!S.me) return signIn();
  S.tab = "games";
  var p = S.prog, lv = levelOf(p.xp), focus = S.server.focus || HUB_CONFIG.defaultFocus;

    return '<button class="tile" data-game="'+g.key+'" aria-label="'+esc(g.title+". "+g.what+" "+rec+(isF?". Set for this week":""))+'">' +
      '<div class="art">'+tileArt(g.key)+'</div>' +
      (good ? '<span class="tick" aria-hidden="true">'+icon("check")+'</span>' : '') +

  }
  var order = GAMES.slice().sort(function(a,b){ return (focus.indexOf(b.key)>=0) - (focus.indexOf(a.key)>=0); });
  var cls = (S.server.week != null && S.server.target) ?
    '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="color:var(--head)">Class total this week</b><span class="muted small">'+S.server.week+' of '+S.server.target+'</span></div>' +
    '<div class="meter"><i style="width:'+Math.min(100, Math.round(100*S.server.week/S.server.target))+'%"></i></div><p class="small muted" style="margin:8px 0 0">Every game anyone in the group finishes counts towards this.</p></div>' : '';
  function row(act, ic, title, sub, pill){
    return '<button class="rowbtn" data-go="'+act+'"><span class="ic">'+icon(ic)+'</span><span class="tx"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+(pill||'<span aria-hidden="true" class="muted">'+icon("chev")+'</span>')+'</button>';
  }
  var done = p.done;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="card"><div class="me"><span class="avatar" aria-hidden="true">'+esc(initials())+'</span><div><h2>Hello, '+esc(firstName())+'</h2>' +
    '<div class="lvl">'+esc(lv.name)+', '+p.xp+' points</div></div></div>' +
    '<div class="meter" aria-hidden="true"><i style="width:'+fill+'%"></i></div>' +
    '<div class="small muted" style="margin-top:6px">'+(lv.next ? toNext+' points to '+esc(lv.next.name) : 'Top level reached. Keep your scores sharp.')+'</div>' +
    '<div class="chips"><span class="chip">'+icon("flame")+streak()+' day streak</span><span class="chip">'+icon("check")+checked+' checked</span><span class="chip">'+icon("games")+played+' played</span></div></div>' +
    (S.server.message ? '<div class="panel amber" style="margin-top:12px"><p>'+esc(S.server.message)+'</p></div>' : '') +
    (cls ? '<div style="margin-top:12px">'+cls+'</div>' : '') +
    '<div class="sec"><h2>Games</h2>'+(UNIT.refCard ? '<button class="link" data-act="refcard">'+esc(UNIT.refCard.title)+'</button>' : '')+'</div>' +
    '<div class="grid">' + order.map(tile).join("") + '</div>' +
    '<div class="sec"><h2>After the lesson</h2></div><div class="rows">' +
      row("exit", "exit", "Exit ticket", UNIT.exit.blurb, done.exit ? '<span class="pill">Handed in</span>' : '<span class="pill amber">To do</span>') +
      row("checkin1", "check", "Part 1 check-in", UNIT.checkin.p1.blurb, done.checkin1 ? '<span class="pill">Sent</span>' : '') +
      row("checkin2", "check", "Part 2 check-in", UNIT.checkin.p2.blurb, done.checkin2 ? '<span class="pill">Sent</span>' : '') +
      row("flash", "flash", "Key word cards", UNIT.flashBlurb) +
    '</div><p class="foot">This is formative. Nothing here is marked or graded. <span data-sync>'+esc(syncText())+'</span></p></div>', {tab:"games"});
  $$(".tile").forEach(function(t){ t.onclick = function(){ startGame(t.dataset.game); }; });
  $$("[data-go]").forEach(function(b){ b.onclick = function(){ var g=b.dataset.go;
    if (g==="exit") runExit(); else if (g==="checkin1") runCheckin("p1","checkin1"); else if (g==="checkin2") runCheckin("p2","checkin2"); else startGame("flash"); }; });

/* ---------- my record ---------- */
var RECORD_KEYS = GAMES.map(function(g){ return g.key; }).concat(["flash","exit","checkin1","checkin2"]);
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode(), tag = HUB_CONFIG.transfer + "-";
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });
  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="'+esc(tag)+'..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = tag + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(tag) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(tag.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done);
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code for this unit. Copy it again on the other phone."; }
  };
}

/* ---------- formula card ---------- */
function openRefCard(){
  var R = UNIT.refCard;
  var old = $(".modal"); if (old) old.remove();
  var m = document.createElement("div"); m.className = "modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label", R.title);
  m.innerHTML = '<div class="sheet stack"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap"><h2 style="margin:0">'+esc(R.title)+'</h2>' +
    '<button class="iconbtn plain" data-close aria-label="Close">'+icon("close")+'</button></div>' +
    (R.intro ? '<p class="small" style="margin:0">'+esc(R.intro)+'</p>' : '') +
    '<div style="overflow-x:auto"><table class="dtable ftable"><caption class="sr">'+esc(R.title)+'</caption>' +
    '<thead><tr><th scope="col">To find</th><th scope="col">Use</th><th scope="col">Unit</th></tr></thead><tbody>' +
    R.rows.map(function(r){ return '<tr><th scope="row">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>'; }).join("") +
    '</tbody></table></div>' + (R.foot ? '<p class="small muted" style="margin:0">'+esc(R.foot)+'</p>' : '') + '</div>';
  document.body.appendChild(m);
  function close(){ m.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if (e.key === "Escape") close(); }

  $("[data-close]", m).onclick = close;
  $("[data-close]", m).focus();
}

/* ---------- navigation ---------- */
function startGame(key){
  if (key === "quick") return runQuick();
  if (key === "flash") return UNIT.flashDecks ? chooseRound("flash", UNIT.flashDecks.map(function(d){ return {title:d.title, sub:d.sub}; }), function(i){ runFlash(UNIT.flashDecks[i].cards()); }) : runFlash(UNIT.flash);
  var g = GAMES.filter(function(x){ return x.key === key; })[0];
  if (g && g.run) g.run(key);
}
document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var b = $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])")[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
    var n = $("#next"); if (n) { e.preventDefault(); n.click(); }
  }
});

/* ---------- pick a round before playing ---------- */
function chooseRound(key, rounds, go){
  screen(gameHeader(TITLE[key], 0, 0) + '<div class="wrap"><div class="card"><p class="qtext" style="margin-top:0">Pick a round</p>' +
