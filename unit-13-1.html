oint such as competitive pricing or very high quality [1]. Higher VAT and extra transport costs [1], which could cut the profit margin [1]. Also credited: meeting supply levels over the distance, local standards and regulations, potential sales growth."},{"id":"X03","src":"Core Paper 2, Summer 2023, Q13(a)","q":"A UK tool-making company plans to sell to an overseas client in an area with a strong local tool-making sector. Explain two considerations the company may need to take into account when selling its products overseas.","max":4,"sl":66,"got":2,"a":"The tools must meet the standards and regulations in that country, otherwise they cannot legally be sold there.","why":"One consideration with its explanation earns 2. The question asks for two considerations, so a second one was needed for full marks.","model":"Strong local competition [1], so the tools need a unique selling point such as competitive pricing or very high quality [1]. Higher VAT and extra transport costs [1], which could cut the profit margin [1]. Also credited: meeting supply levels over the distance, local standards and regulations, potential sales growth."},{"id":"X04","src":"Core Paper 2, Autumn 2023, Q4","q":"State three of the '8 wastes' of lean manufacturing.","max":3,"sl":122,"got":3,"a":"Transport, waiting, defects.","why":"Three wastes from the list, one mark each. A list is enough for a state question.","model":"Any three of: transportation, inventory, motion, waiting, excess production, over-processing, defects, unused talent [1 each]. Only the first three responses are marked."},{"id":"X05","src":"Core Paper 2, Autumn 2023, Q4","q":"State three of the '8 wastes' of lean manufacturing.","max":3,"sl":122,"got":1,"a":"Transport, overtime, time.","why":"Transport earns the mark. Overtime and time are not wastes: the second O is over-processing and the W is waiting.","model":"Any three of: transportation, inventory, motion, waiting, excess production, over-processing, defects, unused talent /* ---------- transport: Microsoft Forms (main route), Google Apps Script (optional), or this phone only ---------- */
var Net = {
  mode: function(){
    if (window.google && google.script && google.script.run) return "gas";
    if (HUB_CONFIG.endpoint) return "remote";
    if (FORM_PREFILL) return "forms";
    return "local";
  },
  call: function(action, payload){
    var m = this.mode();
    return new Promise(function(resolve, reject){
      if (m === "gas") {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload || {});
      } else if (m === "remote") {
        var ctrl = ("AbortController" in window) ? new AbortController() : null;
        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
        fetch(HUB_CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify(Object.assign({action:action}, payload||{})), signal: ctrl ? ctrl.signal : undefined})
          .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(timer); resolve(j); })
          .catch(function(e){ clearTimeout(timer); reject(e); });
      } else reject(new Error("no_server"));
    });
  }
};
/* Only used by the Google route: results queue on the phone until they send. */
var Sync = {
  q: Store.get("queue", []), busy:false,
  add: function(ev){ this.q.push(ev); Store.set("queue", this.q); this.flush(); },
  flush: function(){
    var self = this, m = Net.mode();
    if (self.busy || !self.q.length || (m!=="gas" && m!=="remote")) return;
    if (navigator.onLine === false) return;
    self.busy = true;
    var batch = self.q.slice(0, 25);
    Net.call("log", {events: batch}).then(function(res){
      if (res && res.ok) {
        var sent = {}; batch.forEach(function(e){ sent[e.id]=1; });
        self.q = self.q.filter(function(e){ return !sent[e.id]; }); Store.set("queue", self.q); S.server.state = "ok";
      } else if (res && res.error === "unknown_code") {
        var bad = S.me ? S.me.code : ""; self.q = self.q.filter(function(e){ return e.code !== bad; }); Store.set("queue", self.q);
        toast("Your code was not recognised. Please sign in again."); signOut(true);
      } else { S.server.state = "error"; }
    }).catch(function(){ S.server.state = "offline"; }).then(function(){
      self.busy = false; updateSyncLine();
      if (self.q.length && S.server.state==="ok") setTimeout(function(){ self.flush(); }, 400);
    });
  }
};
window.addEventListener("online", function(){ Sync.flush(); });

/* ---------- verification code: short, and it changes if the code, game or score is edited ----------
   The tracker works out the same number in Excel, so an edited score shows up there.   */
/* The game name the tracker sees: unit prefix, a space, then the title, e.g. 13.1 Profit Lab.
   Every unit hub sends to the same form, so the prefix keeps the units apart.            */
function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : "13.1 " + title; }
function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;
  for (var k=0;k<s.length;k++) h += s.charCodeAt(k)*(k+1)*7;
  h += 11*Number(score) + 13*Number(max);
  return String(h % 9973).padStart(4,"0");
}
function formsLink(game, score, max, detail){
  var u = FORM_PREFILL;
  function rep(tok, val){ u = u.split(tok).join(encodeURIComponent(val)); }
  rep("LEARNERHERE", S.me ? S.me.code : "");
  rep("GAMEHERE", sentName(game)); rep("SCOREHERE", String(score)); rep("MAXHERE", String(max));
  rep("CHECKHERE", checkCode(S.me ? S.me.code : "", game, score, max));
  rep("DETAILHERE", String(detail||"").slice(0, 900));
  return u;
}
function resultLine(game, score, max, when){
  var code = S.me ? S.me.code : "";
  return code + " | " + sentName(game) + " | " + score + " of " + max + " | check " + checkCode(code, game, score, max) + " | " + niceDate(when);
}

function initials(){ var n = (S.me && (S.me.name || S.me.code)) || "?"; var p = n.trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1]||""))).toUpperCase(); }

/* ---------- spaced review (Embedding: revisit once-learnt material to stop it being forgotten) ----------
   Each question in the review bank sits in a box. Wrong: back to box 0, due tomorrow.
   Right: up one box, due after 1, 3, 7 then 14 days. Lesson-anchored questions (section 1.6) also come back
   one day and one week after they were first answered right, because a right answer straight after the
   lesson shows little about what was remembered.                                                       */
var GAPS = [1, 3, 7, 14];
function addDays(n){ var d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }
function srsMark(id, ok, anchored){
  if (!id) return false;
  var box = S.prog.srs[id];
  if (!ok) { S.prog.srs[id] = {b:0, due:addDays(1)}; return true; }
  if (box) { var b = Math.min(box.b + 1, GAPS.length - 1); if (box.a && box.b === 1) b = 2; S.prog.srs[id] = {b:b, due:addDays(GAPS[b]), a:box.a}; }
  else if (anchored) S.prog.srs[id] = {b:1, due:addDays(1), a:1};
  return false;
}
function dueIds(){ var t = todayKey(); return Object.keys(S.prog.srs).filter(function(id){ return S.prog.srs[id].due <= t && REG[id]; }); }
var REG = {};

/* ---------- item builders shared by the games ---------- */
function cap1(s){ s = String(s||""); return s.charAt(0).toUpperCase() + s.slice(1); }
/* multiple choice for the classic engine (runMCQ) */
function mcqFrom(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));
  return {id:x.id, rid:x.id, lead:lead||"", prompt:x.q, options:m.options, correct:m.correct, why:x.why, wf:x.fb||null, a:x.a}; }
/* multiple choice for the retrieval engine (cue level 1: recognise) */
function mcqItem(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));
  return {id:x.id, rid:x.id, k:"mcq", lead:lead||"", q:x.q, options:m.options, correct:m.correct, why:x.why, wf:x.fb||null, a:x.a, ladder:!!x.t, levelName:x.t ? "Pick it" : ""}; }
/* the typed form of a multiple choice question (cue level 3: free recall) */
function typedFrom(x, lead){ var t = x.t;
  return {id:x.id, rid:x.id, k:t.k, lead:lead||"", q:x.q, acc:t.acc, v:t.v, unit:t.unit, tol:t.tol, money:t.money, why:x.why, a:x.a, ans:x.opts[0], rivals:x.opts.slice(1), ladder:true, lvl:2, levelName:"From memory"}; }
/* other key words and every form they accept: typing one of those is a different term, not a spelling slip */
function rivalsFor(kw){ var r = []; CONTENT.keywords.forEach(function(o){ if (o.id !== kw.id) r = r.concat([o.term], o.acc); }); return r; }
/* first-letter clue (cue level 2): each word stays on one line, so the clue never breaks mid-word */
function cueHtml(t){
  var words = t.split(" ");
  return '<p class="cue" aria-label="'+esc("First letters clue: " + words.map(function(w){ return w.charAt(0) + ", " + w.length + " letters"; }).join("; "))+'">' +
    words.map(function(w){ return '<span class="cw" aria-hidden="true">'+esc(w.split("").map(function(c, i){ return i === 0 || !/[a-z]/i.test(c) ? c : "_"; }).join("\u2009"))+'</span>'; }).join(" ") + '</p>'; }
/* a key word as a retrieval item at cue level L (1 pick it, 2 first letters, 3 from memory) */
function termItem(kw, L){
  L = L || S.prog.lvl[kw.id] || (guided() ? 2 : 3);
  var base = {id:kw.id, rid:kw.id, q:kw.def, acc:kw.acc, ans:kw.term, a:kw.slide, ladder:true, rivals:rivalsFor(kw), lvl:L, why:kw.term+": "+kw.def};
  if (L <= 1) {
    var same = shuffle(CONTENT.keywords.filter(function(o){ return o.part === kw.part && o.id !== kw.id && o.term !== kw.term; })).slice(0, 3).map(function(o){ return o.term; });
    var m = mix(kw.term, same);
    return Object.assign(base, {k:"mcq", options:m.options, correct:m.correct, levelName:"Pick it", prompt:kw.def});
  }
  if (L === 2) return Object.assign(base, {k:"term", cue:kw.term, levelName:"First letters"});
  return Object.assign(base, {k:"term", levelName:"From memory"});
}
function buildReg(){
  CONTENT.recall.concat(CONTENT.waste).forEach(function(x){ REG[x.id] = function(){ return x.t ? typedFrom(x) : mcqItem(x); }; });
  CONTENT.keywords.forEach(function(k){ REG[k.id] = function(){ return termItem(k, Math.max(S.prog.lvl[k.id]||2, 2)); }; });
  PARTN.forEach(function(n){ CONTENT.last[n].concat(CONTENT.boss[n], CONTENT.checkinRecall["p"+n]).forEach(function(x){ REG[x.id] = function(){ return Object.assign({rid:x.id}, x); }; }); });
}

/* ---------- my record ---------- */
var TRANSFER = "U131-";   /* this hub's own transfer-code prefix */
var RECORD_KEYS = []; GAMES.forEach(function(g){ if (g.parts) PARTN.forEach(function(n){ RECORD_KEYS.push(g.key+n); }); else RECORD_KEYS.push(g.key); });
RECORD_KEYS = RECORD_KEYS.concat(["review","flash","exit"], PARTN.map(function(n){ return "checkin"+n; }));
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode();
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });

    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  var cal = p.cal || {sr:0, sw:0, gr:0, gw:0}, calN = cal.sr + cal.sw + cal.gr + cal.gw;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (calN ? '<div class="card" style="margin-bottom:12px"><b style="color:var(--head)">Do you know what you know?</b><p class="small" style="margin:6px 0 0">From Sure or Not?: sure and right '+cal.sr+', sure but wrong '+cal.sw+', guessed and right '+cal.gr+', guessed and wrong '+cal.gw+'. '+
      (cal.sw ? 'Sure but wrong is the one to shrink: those are the mistakes you would not spot in the exam.' : 'No confident mistakes so far. Good.')+'</p></div>' : '') +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="'+TRANSFER+'..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = TRANSFER + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(TRANSFER) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(TRANSFER.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done); Object.assign(cur.srs, inc.srs); Object.assign(cur.rag, inc.rag); Object.assign(cur.lvl, inc.lvl||{}); Object.assign(cur.flash, inc.flash||{});
      if (cur.goal == null) cur.goal = inc.goal;
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code. Copy it again on the other phone."; }
  };
}

document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var conf = $$(".conf button:not([disabled])");   /* Sure or Not?: once an answer is picked, the keys rate confidence */
    var b = (conf.length ? conf : $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])"))[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
    var n = $("#next"); if (n) { e.preventDefault(); n.click(); }
  }
});

<script>
"use strict";
/* ---------- results ---------- */
function resultMessage(pct){
  if (pct >= 90) return "Excellent. That is exam ready.";
  if (pct >= 70) return "Good work. Check the ones below, then go again.";
  if (pct >= 40) return "Getting there. Read the fixes, then play it again.";
  return "Early days. Read each fix below and try again. It gets easier every round.";
}
function sendPanel(title, score, max, detail){
  var m = Net.mode(), code = S.me ? S.me.code : "", chk = checkCode(code, title, score, max);
  if (m === "forms") return '<div class="panel amber stack" style="margin-top:12px"><h3>Send this to your tutor</h3>' +
    '<p>One tap opens the form with your code, the game and your score already filled in. Press Submit on the form.</p>' +
    '<p>Check code <span class="code">'+chk+'</span></p>' +
    '<div class="row"><a class="btn amber" id="send" target="_blank" rel="noopener" href="'+esc(formsLink(title, score, max, detail))+'">'+icon("send")+'Send my result</a>' +
    '<button class="btn ghost" id="copy1">'+icon("copy")+'Copy it instead</button></div></div>';
  if (m === "local") return '<div class="panel amber stack" style="margin-top:12px"><h3>Keep a copy</h3>' +
    '<p>This hub is not linked to your tutor&#39;s form yet. Copy this line and paste it where your tutor asks.</p>' +
    '<p class="small"><b>'+esc(resultLine(title, score, max))+'</b></p><button class="btn ghost" id="copy1">'+icon("copy")+'Copy it</button></div>';
  return '<p class="small muted" style="margin:12px 2px" data-sync>'+esc(syncText())+'</p>';
}
function wireSend(title, score, max){
  var c = $("#copy1"); if (c) c.onclick = function(){ copyText(resultLine(title, score, max), function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the line and copy it."); }); };
  var s = $("#send"); if (s) s.addEventListener("click", function(){ toast("The form is opening. Press Submit on it."); });
}
/* Interacting: turn the result into one clear, actionable next step */
function nextStep(key, pct, extra){
  var added = extra.added || 0, ind = !guided(), out = [];
  if (extra.conf && extra.conf.sw) out.push("You were sure but wrong on " + extra.conf.sw + (extra.conf.sw>1?" questions":" question") + ". Read those fixes twice: they are the mistakes you would not notice in the exam.");
  if (pct < 50) out.push(ind ? "Switch to Guided on the home page and play this again with hints on." : "Read the fixes below, open the key word cards, then play this again.");
  else if (pct < 80) out.push("Play it once more today. A score of 80% puts a tick on it.");
  else if (!ind) out.push("That is a tick. Try it in Independent mode next: no hints, and 50% more points.");
  else { var n = suggestNext(); if (n !== key) out.push("Move on to " + TITLE[n] + " next."); else out.push("Try the Boss round for this part to keep it fluent."); }
  if (added) out.push(added + (added>1 ? " questions have" : " question has") + " gone on your review list for tomorrow.");
  return '<div class="card nextstep"><h3 style="margin:0 0 6px">Your next step</h3><ul class="review">' + out.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("") + '</ul></div>';
}
function finishGame(key, score, max, items, started, review, extra){
  extra = extra || {};
  var p = S.prog, title = TITLE[key], pct = max ? Math.round(100*score/max) : 0, secs = Math.round((Date.now()-started)/1000);
  var prev = p.best[key], newBest = prev == null || pct > prev;
  if (newBest) { p.best[key] = pct; p.raw[key] = [score, max]; }
  p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  var gain = 20 + score*10 + (extra.bonus||0); if (!guided()) gain = Math.round(gain * 1.5); p.xp += gain;
  var stamp = pct >= 80, firstStamp = stamp && !p.stamps[key]; if (stamp) p.stamps[key] = true;
  var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t);
  if (extra.conf) { p.cal = p.cal || {sr:0, sw:0, gr:0, gw:0}; ["sr","sw","gr","gw"].forEach(function(k){ p.cal[k] += extra.conf[k]||0; }); }
  saveProg();
  logEvent("finish", title, {score:score, max:max, secs:secs, items:items});
  var missed = items.filter(function(x){ return !x.ok; }).map(function(x){ return x.l; });
  var detail = (guided() ? "Guided" : "Independent") + ". " + (missed.length ? "To go over: " + missed.slice(0,6).join("; ") : "All correct") +
    (extra.conf ? ". Sure but wrong: " + (extra.conf.sw||0) : "") + (extra.det ? ". " + extra.det : "");
  var calPanel = extra.conf ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Do you know what you know?</h3>' +
    '<div class="calgrid"><div><b>'+(extra.conf.sr||0)+'</b><span>Sure and right</span></div><div class="warn"><b>'+(extra.conf.sw||0)+'</b><span>Sure but wrong</span></div>' +
    '<div><b>'+(extra.conf.gr||0)+'</b><span>Guessed, but right</span></div><div><b>'+(extra.conf.gw||0)+'</b><span>Guessed and wrong</span></div></div>' +
    '<p class="small muted" style="margin:8px 0 0">Guessed but right is luck, not knowledge. Go back over those too.</p></div>' : '';
  screen(gameHeader(title, 0, 0) + '<div class="wrap">' +
    '<div class="card result"><p class="muted" style="margin:0 0 4px">'+esc(title)+(guided() ? '' : ', independent')+'</p><div class="big">'+score+'<small> of '+max+'</small></div>' +
    '<p style="margin:10px 0 4px">'+resultMessage(pct)+'</p><p class="small muted" style="margin:0">+'+gain+' points'+(newBest && prev != null ? ', a new best' : '')+'</p>' +
    (stamp ? '<span class="seal'+(firstStamp?' pop':'')+'">'+icon("check")+'Checked</span>' : '') + '</div>' +
    nextStep(key, pct, extra) + calPanel +
    sendPanel(title, score, max, detail) +
    (review.length ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">What to fix</h3><ol class="review">' +
      review.map(function(r){ return '<li><b>'+esc(r.q)+'</b><br>The answer: '+esc(r.right)+(r.why ? '. <span class="muted">'+esc(r.why)+'</span>' : '')+'</li>'; }).join("") + '</ol></div>'
      : '<div class="panel" style="margin-top:12px"><p>Nothing to fix this round.</p></div>') +
    '<div class="dock"><div class="row"><button class="btn amber" id="again">Play again</button><button class="btn ghost" id="hub">Back to the games</button></div></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#again").onclick = function(){ startGame(key); };
  $("#hub").onclick = function(){ home(); };
  say(score + " out of " + max + ". " + resultMessage(pct));
}

/* ---------- one engine for every multiple choice game ----------
   Adds, on top of the Unit 1.1 engine:
   wf     feedback written for a specific wrong answer (Interacting)
   hint   shown only in Guided mode (Structuring: scaffolds that come away)
   conf   rate how sure you are before the answer is shown (Activating)
   master a missed question returns two questions later until it is right (Embedding)
   rid    marks the question on the spaced review list (Embedding)                   */
function optButtons(opts){ return opts.map(function(o,k){ return '<button class="opt" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span class="l">'+esc(o)+'</span><span class="s"></span></button>'; }).join(""); }
function markOpts(correct, chosen){
  var ok = correct.indexOf(chosen) >= 0;
  $$(".opt").forEach(function(b){
    var j = +b.dataset.k; b.disabled = true; b.classList.remove("picked");
    if (correct.indexOf(j) >= 0) { b.classList.add("correct"); $(".s", b).textContent = (j === chosen || !ok) ? "Right answer" : "Also right"; }
    else if (j === chosen) { b.classList.add("wrong"); $(".s", b).textContent = "Not this one"; }
    else b.classList.add("dim");
  });
  return ok;
}
function showFeedback(ok, rightText, why, nextLabel, onNext, chosenFb){
  var fb = $("#fb");
  fb.className = "fb" + (ok ? "" : " bad");
  fb.innerHTML = '<strong>' + (ok ? pick(["Right.","Yes, that is it.","Correct."]) : "Not this time.") + '</strong>' +
    (ok ? "" : "The answer is: " + esc(rightText) + ". ") +
    (!ok && chosenFb ? '<span class="whyno"><b>About your answer:</b> ' + esc(chosenFb) + '</span>' : '') + esc(why || "");
  $("#dock").innerHTML = '<button class="btn amber block" id="next">'+nextLabel+'</button>';
  $("#next").onclick = onNext;
  say(ok ? "Right." : "Not this time. The answer is " + rightText);
  try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
}

  }

}

/* ---------- Sort It: tap a card, tap its group, then check the whole sort ---------- */

    var it = sets[i], order = shuffle(it.cards.map(function(_, k){ return k; })), place = {}, sel = null, checked = false;
    function draw(keep){
      var pool = order.filter(function(k){ return place[k] == null; });

        '<div class="qno">Set '+(i+1)+' of '+sets.length+'</div>' + tagSlide(it.a) + '<p class="qtext">'+esc(it.title)+'</p>' +

        '<div class="pool">' + (pool.length ? pool.map(function(k){ return '<button class="chip2'+(sel === k ? ' sel' : '')+'" data-card="'+k+'" aria-pressed="'+(sel === k)+'">'+esc(it.cards[k][0])+'</button>'; }).join("") : (checked ? '' : '<span class="small muted">All placed. Check your sort.</span>')) + '</div>' +
        '<div class="bins'+(it.grid ? ' grid2' : '')+'">' + it.bins.map(function(b, bi){
          var inb = order.filter(function(k){ return place[k] === bi; });
          return '<div class="bin"><button class="binhead" data-b="'+bi+'"'+(checked ? ' disabled' : '')+' aria-label="Group: '+esc(b)+(sel != null ? '. Put the card here' : '')+'">'+esc(b)+'</button>' +
            inb.map(function(k){ var ok = fits(it.cards[k], b);

                (checked && !ok ? '<span class="small" style="display:block">Belongs in: '+esc(groupsOf(it.cards[k]))+'</span>' : '')+'</button>'; }).join("") + '</div>'; }).join("") + '</div>' +
        '<div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true, keep:!!keep});
      $$("[data-card]").forEach(function(b){ b.onclick = function(){ var k = +b.dataset.card; sel = sel === k ? null : k; draw(true); var x = $('[data-card="'+k+'"]'); if (x) x.focus({preventScroll:true}); }; });
      $$("[data-b]").forEach(function(b){ b.onclick = function(){ if (sel == null) { toast("Tap a card first, then its group."); return; } place[sel] = +b.dataset.b; sel = null; draw(true); }; });
      $$("[data-p]").forEach(function(b){ b.onclick = function(){ place[+b.dataset.p] = null; draw(true); }; });
      var full = order.every(function(k){ return place[k] != null; });

        fb.className = "fb" + (got === order.length ? "" : " bad");

          (it.tricky ? Object.keys(it.tricky).map(function(c){ return '<span class="whyno">'+esc(it.tricky[c])+'</span>'; }).join("") : '');
        var last = i === sets.length - 1;
        $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(last ? "See my score" : "Next set")+'</button>';
        $("#next").onclick = function(){ if (last) finishGame(key, score, max, log, started, review); else { i++; show(); } };
        try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
      } else {
        $("#dock").innerHTML = '<button class="btn amber block" id="chk" '+(full ? "" : "disabled")+'>'+(full ? "Check my sort" : "Place every card first")+'</button>';
        $("#chk").onclick = function(){
          checked = true;
          order.forEach(function(k){ var ok = fits(it.cards[k], it.bins[place[k]]); if (ok) score++; else review.push({q:it.title + ": " + it.cards[k][0], right:groupsOf(it.cards[k]), why:""});
            log.push({i:it.id+"-"+k, ok:ok?1:0, l:(it.cards[k][0] + ": " + groupsOf(it.cards[k])).slice(0, 90)}); });
          draw(true);
        };
      }
    }
    draw(false);
  }
  show();

function runSequence(key, seqs, firstId){
  var first = seqs.filter(function(q){ return q.id === firstId; })[0] || seqs[0];
  var set = [first].concat(shuffle(seqs.filter(function(q){ return q !== first; })).slice(0,2));
  var i = 0, score = 0, max = 0, log = [], review = [], started = Date.now();
  set.forEach(function(q){ max += q.steps.length; });
  function show(){
    var it = set[i], n = it.steps.length, pool = shuffle(it.steps.map(function(_,k){ return k; })), placed = [], checked = false;
    function draw(keepScroll){
      var left = pool.filter(function(k){ return placed.indexOf(k) < 0; });
      screen(gameHeader(TITLE[key], i, set.length) + '<div class="wrap"><div class="card">' +
        '<div class="qno">Sequence '+(i+1)+' of '+set.length+'</div>'+tagSlide(it.a)+'<p class="qtext">'+esc(it.title)+'</p>' +
        '<p class="qprompt">Tap the steps in the order they happen. Tap a numbered step to send it back.</p>' +
        '<div class="pool">' + (left.length ? left.map(function(k){ return '<button class="chip2" data-step="'+k+'">'+esc(it.steps[k])+'</button>'; }).join("") : '<span class="small muted">All placed.</span>') + '</div>' +
        '<div class="slots">' + it.steps.map(function(_,k){ var v = placed[k];
          var cls = v == null ? "" : (checked ? (v === k ? " filled ok" : " filled no") : " filled");
          return '<button class="slot'+cls+'" data-slot="'+k+'" '+((v == null || checked) ? "disabled" : "")+' aria-label="Step '+(k+1)+(v == null ? ", empty" : ": "+esc(it.steps[v]))+'"><b>'+(k+1)+'</b><span>'+(v == null ? '<span class="muted small">Empty</span>' : esc(it.steps[v]))+'</span></button>'; }).join("") + '</div>' +
        '<div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true, keep:!!keepScroll});
      $$(".chip2").forEach(function(b){ b.onclick = function(){ if (checked) return; var free = -1; for (var k=0;k<n;k++){ if (placed[k] == null) { free = k; break; } }
        if (free >= 0) { placed[free] = +b.dataset.step; draw(true); } }; });
      $$(".slot").forEach(function(b){ b.onclick = function(){ if (checked) return; placed[+b.dataset.slot] = null; draw(true); }; });
      var full = placed.filter(function(v){ return v != null; }).length === n;
      if (checked) {
        var got = 0; for (var k=0;k<n;k++) if (placed[k] === k) got++;
        var fb = $("#fb"); fb.className = "fb" + (got === n ? "" : " bad");
        fb.innerHTML = '<strong>'+got+' of '+n+' in the right place.</strong>The order: <ol>'+it.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join("")+'</ol>'+esc(it.why||"");
        var last = i === set.length-1;
        $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(last ? "See my score" : "Next sequence")+'</button>';
        $("#next").onclick = function(){ if (last) finishGame(key, score, max, log, started, review); else { i++; show(); } };
      } else {
        $("#dock").innerHTML = '<button class="btn amber block" id="chk" '+(full ? "" : "disabled")+'>'+(full ? "Check my order" : "Place every step first")+'</button>';
        $("#chk").onclick = function(){
          checked = true; var got = 0;
          for (var k=0;k<n;k++){ var ok = placed[k] === k; if (ok) got++; log.push({i:it.id+"-"+(k+1), ok:ok?1:0, l:(it.title+": step "+(k+1)).slice(0,90)}); }
          score += got; if (got < n) review.push({q:it.title, right:it.steps.join(", "), why:it.why});
          draw(true);
        };
      }
    }
    draw(false);
  }
  show();
}

      if (r.res === "noratio") return done(true, "Write it as a ratio next time: " + right + ". ");
      var why = r.res === "unit" ? (r.none ? "Right number, but this one has no units. " : "Right number, wrong unit. ") : r.res === "upside" ? "That is upside down: driven ÷ driver. " : "";
      if (tries === 1) {
        if (guided()) $("#hintbox").innerHTML = '<div class="worked"><b>Hint.</b> '+esc(it.hint)+'</div>';
        var f2 = $("#fb"); f2.className = "fb info"; f2.innerHTML = "<strong>Not quite. Have one more go.</strong>" + esc(why) + (guided() ? "The hint is showing above." : "Check your units and each step.");
        inp.dataset.spoken = ""; inp.select(); say("Not quite. Have one more go.");
      } else done(false, why);
    };
    setTimeout(function(){ try { inp.focus({preventScroll:true}); } catch(e) {} }, 60);
  }
  show();
}

/* ---------- Market Graph (Part 4): the graph and the answer come from the same numbers ---------- */
var HINT_G = "Equilibrium is where the lines cross. Above it, supply is greater than demand: a surplus. Below it, demand is greater: a shortage.";
function gParams(){
  for (var t = 0; t < 400; t++) {
    var g = {pStep:pick([2,5,10,20]), e:pick([2,3,4]), sd:pick([50,100]), ss:pick([50,100]), Q:pick([300,400,500,600])};
    if (g.Q - g.sd*(6 - g.e) < 0) continue;
    g.Qmax = Math.ceil(Math.max(gQd(g, 0), gQs(g, 6))/100)*100; if (g.Qmax > 1200) continue;
    g.qStep = g.Qmax <= 700 ? 100 : 200;
    if (g.qStep === 200 && (g.sd !== 100 || g.ss !== 100)) continue;
    return g;
  }
  return {pStep:10, e:3, sd:100, ss:100, Q:400, Qmax:700, qStep:100};
}
function money(k, g){ return fmtMoney(k*g.pStep); }
function gEqPrice(){
  var g = gParams(), o = [money(g.e + 1, g), money(g.e - 1, g), money(g.e + 2, g)];
  var b = build(money(g.e, g), [[o[0], "Find where the two lines cross, then read across to the price axis."], ["£" + nf(g.Q), "That number is the quantity, read from the bottom axis. The price is on the side axis."],
    [o[1], "Find where the two lines cross, then read across to the price axis."], [o[2], "Read across from the crossing point to the price axis."]]);
  return {id:nid("G"), a:135, label:"Equilibrium price", prompt:"Read the graph. What is the equilibrium price?", art:graphArt(g, null), options:b.options, correct:b.correct, wf:b.wf,
    why:"The lines cross at "+money(g.e, g)+" and "+nf(g.Q)+" units. There the amount supplied matches the amount wanted.", hint:HINT_G};
}
function gEqQty(){
  var g = gParams();
  var b = build(nf(g.Q)+" units", [[nf(g.Q + g.sd)+" units", "Read straight down from the point where the two lines cross."], [nf(g.e*g.pStep)+" units", "That number is the price, read from the side axis. The quantity is on the bottom axis."],
    [nf(Math.max(0, g.Q - g.ss))+" units", "Read straight down from where the lines cross."], [nf(g.Q + 2*g.sd)+" units", "Read straight down from the crossing point."]]);
  return {id:nid("G"), a:135, label:"Equilibrium quantity", prompt:"Read the graph. How many units are bought and sold at equilibrium?", art:graphArt(g, null), options:b.options, correct:b.correct, wf:b.wf,
    why:"Straight down from where the lines cross: "+nf(g.Q)+" units, at a price of "+money(g.e, g)+".", hint:HINT_G};
}
function gState(above){
  for (var t = 0; t < 100; t++) {
    var g = gParams(), k = above ? g.e + pick([1,2]) : g.e - pick([1,2]);
    if (k < 0 || k > 6) continue; var qd = gQd(g, k), qs = gQs(g, k); if (qs < 0 || qd < 0) continue; break;
  }
  var gap = Math.abs(qs - qd), word = qs > qd ? "surplus" : "shortage", other = word === "surplus" ? "shortage" : "surplus";
  var b = build("A "+word+" of "+nf(gap)+" units", [["A "+other+" of "+nf(gap)+" units", qs > qd ? "Above equilibrium, more is supplied than wanted, so it is a surplus." : "Below equilibrium, more is wanted than supplied, so it is a shortage."],
    ["A "+word+" of "+nf(qs > qd ? qs : qd)+" units", "That is the amount "+(qs > qd ? "supplied" : "demanded")+". The "+word+" is the gap between the two lines at that price."],
    ["Neither: the market is at equilibrium", "Equilibrium is only where the lines cross. At "+money(k, g)+" they are "+nf(gap)+" units apart."]]);
  return {id:nid("G"), a:137, label:"Surplus or shortage", prompt:"The price is set at "+money(k, g)+" (the dashed line). What does the market have?", art:graphArt(g, k), options:b.options, correct:b.correct, wf:b.wf,
    why:"At "+money(k, g)+", supply is "+nf(qs)+" units and demand is "+nf(qd)+" units: a "+word+" of "+nf(Math.max(qs, qd))+" − "+nf(Math.min(qs, qd))+" = "+nf(gap)+" units.", hint:HINT_G};
}
function gMove(){
  var g = gParams(), above = Math.random() < 0.5, k = above ? Math.min(6, g.e + 1) : Math.max(0, g.e - 1);
  var right = above ? "Down, towards "+money(g.e, g) : "Up, towards "+money(g.e, g);
  var b = build(right, [[above ? "Up, away from "+money(g.e, g) : "Down, away from "+money(g.e, g), above ? "A surplus pushes the price down: stock is cut in price to shift it." : "A shortage pushes the price up: customers compete for the few items there are."],
    ["It stays at "+money(k, g), "A surplus or shortage does not last. The price moves until the market settles at equilibrium."],
    [above ? "Down to £0" : "Up to "+money(6, g), "It moves only as far as equilibrium, where the lines cross."]]);
  return {id:nid("G"), a:140, label:"Which way the price moves", prompt:"The price is "+money(k, g)+" (the dashed line). Which way will the market push the price?", art:graphArt(g, k), options:b.options, correct:b.correct, wf:b.wf,
    why:(above ? "At "+money(k, g)+" there is a surplus, so prices are cut to shift the stock" : "At "+money(k, g)+" there is a shortage, so the price tends to rise")+", until the market settles back at "+money(g.e, g)+".", hint:HINT_G};
}
function gShift(){
  var g = gParams(), c = pick([
    {s:"A craze makes everyone want this product. Demand rises at every price.", r:"It rises", w:["It falls","It stays the same","It drops to zero"], why:"More is wanted at every price, so the demand line moves right and crosses supply at a higher price.", a:138},
    {s:"A key component becomes scarce, so supply falls at every price.", r:"It rises", w:["It falls","It stays the same","It drops to zero"], why:"Less can be supplied at every price, so the supply line moves left and crosses demand at a higher price, as with protective equipment in 2020 (lesson slide 139).", a:139},
    {s:"The market is saturated: everyone who wants one has bought one. Demand falls at every price.", r:"It falls", w:["It rises","It stays the same","It doubles"], why:"Less is wanted at every price, so the demand line moves left and crosses supply at a lower price.", a:136},
    {s:"A new machine lets the company make far more for the same cost. Supply rises at every price.", r:"It falls", w:["It rises","It stays the same","It doubles"], why:"More can be supplied at every price, so the supply line moves right and crosses demand at a lower price.", a:136}]);
  var fb = {}; c.w.forEach(function(x){ fb[x] = x === "It stays the same" ? "When a line moves, the crossing point moves too." : "Think about where the moved line now crosses the other one."; });
  var b = build(c.r, c.w.map(function(x){ return [x, fb[x]]; }));
  return {id:nid("G"), a:c.a, label:"A line moves", prompt:c.s+" What happens to the equilibrium price?", art:graphArt(g, null), options:b.options, correct:b.correct, wf:b.wf, why:c.why, hint:HINT_G};
}
function runGraph(){ runMCQ("graph", [gEqPrice(), gEqQty(), gState(true), gState(false), gMove(), gShift()], {label:"Graph"}); }

/* ---------- exit ticket and check-ins: typed and spoken recall, self-ratings; only scores leave the phone ---------- */
function runExit(){
  var E = CONTENT.exit, G = CONTENT.goals.map(function(g){ return g.t; }), NG = G.length;
  function radios(name, q){ return '<fieldset class="q"><legend>'+esc(q.q)+'</legend>'+q.opts.map(function(o,k){ return '<label class="check"><input type="radio" name="'+name+'" value="'+k+'"><span>'+esc(o)+'</span></label>'; }).join("")+'</fieldset>'; }
  screen(gameHeader(TITLE.exit, 0, 0) + '<div class="wrap"><div class="card">' +
    '<p style="margin:0">Five minutes, on your own. This is for feedback, not a mark. Your words stay on this phone; only your score goes to your tutor.</p>' +
    '<div class="q"><label for="q1">1. '+esc(E.q1.q)+'</label><textarea id="q1" class="textin" maxlength="600"></textarea>'+micBlock("q1")+'</div>' +
    radios("q2", {q:"2. "+E.q2.q, opts:E.q2.opts}) +
    '<fieldset class="q"><legend>3. '+esc(E.q2b.q)+'</legend>'+E.q2b.opts.map(function(o,k){ return '<label class="check"><input type="checkbox" name="q2b" value="'+k+'"><span>'+esc(o)+'</span></label>'; }).join("")+'</fieldset>' +
    radios("q3", {q:"4. "+E.q3.q, opts:E.q3.opts}) +
    '<div class="q"><label for="q4">5. '+esc(E.q4.q)+'</label><input id="q4" class="textin" autocomplete="off" placeholder="For example £1,350">'+micBlock("q4")+'</div>' +
    '<div class="q"><label for="q5">6. '+esc(E.q5.q)+'</label><input id="q5" class="textin" autocomplete="off">'+micBlock("q5")+'</div>' +
    '<h3 style="margin:22px 0 4px">Can you do all nine? Be honest.</h3>' + ragBlock("x", G) +
    '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Hand it in</button></div></div>', {game:true});
  wireRag(); wireMics();
  $("#send2").onclick = function(){
    stopListening();
    var q1 = $("#q1").value.trim(), q2 = $('input[name="q2"]:checked'), q3 = $('input[name="q3"]:checked'), q4 = $("#q4").value.trim(), q5 = $("#q5").value.trim();
    var q2b = $$('input[name="q2b"]:checked').map(function(x){ return +x.value; }), rag = readRag("x", NG);
    if (!q1 || !q2 || !q3 || !q4 || !q5 || rag.indexOf("-") >= 0) { $("#err").textContent = "Answer questions 1 to 6 and rate all nine lines before handing in. Not sure? Write your best guess."; return; }
    var found = ideasFound(q1, E.q1.ideas), nf1 = found.filter(Boolean).length, ok1 = nf1 >= E.q1.need;
    var ok2 = +q2.value === E.q2.ans, ok2b = q2b.length === 3 && E.q2b.ans.every(function(a){ return q2b.indexOf(a) >= 0; }), ok3 = +q3.value === E.q3.ans;
    var r4 = markNum(q4, E.q4.v, E.q4.unit, E.q4.tol), ok4 = r4.res === "right" || r4.res === "nounit", r5 = markText(q5, E.q5.acc, E.q5.rivals || []), ok5 = r5.res === "right" || r5.res === "near";
    var score = [ok1, ok2, ok2b, ok3, ok4, ok5].filter(Boolean).length;
    var lowIdx = rag.indexOf("R") >= 0 ? rag.indexOf("R") : (rag.indexOf("A") >= 0 ? rag.indexOf("A") : 0), lowest = G[lowIdx];
    S.prog.rag = {}; rag.split("").forEach(function(v,k){ S.prog.rag[k] = v; });
    if (rag.replace(/G/g,"").length) S.prog.goal = lowIdx;
    var typedRight = (ok1 ? 1 : 0) + (ok4 ? 1 : 0) + (ok5 ? 1 : 0);
    logEvent("exit", TITLE.exit, {score:score, max:6, extra:{rag:rag, keyIdeasQ1:nf1, typedRight:typedRight}, items:[{i:"X1",ok:ok1?1:0,l:"Turnover and profit explained"},{i:"X2",ok:ok2?1:0,l:"Profit margin 15%"},{i:"X3",ok:ok2b?1:0,l:"Three wastes"},{i:"X4",ok:ok3?1:0,l:"Surplus: prices cut"},{i:"X5",ok:ok4?1:0,l:"Value added £37.50"},{i:"X6",ok:ok5?1:0,l:"Business model innovation"}]});
    function li(ok, good, bad){ return '<li>'+(ok ? '<b style="color:var(--green)">Right:</b> '+good : '<b style="color:var(--red)">Check this:</b> '+bad)+'</li>'; }
    var body = '<p style="margin:0">Thank you. Your tutor will see your score before the next lesson.</p><ul class="review">' +
      li(ok1, "you covered "+nf1+" of the 3 key ideas in question 1.", "question 1 covered "+nf1+" of the 3 key ideas. A full answer: "+esc(E.q1.model)) +
      li(ok2, "the profit is £12,000, and 12,000 ÷ 80,000 × 100 = 15%.", "the profit is £80,000 − £68,000 = £12,000, so the margin is 12,000 ÷ 80,000 × 100 = <b>15%</b>. Margin divides by turnover, not costs.") +
      li(ok2b, "waiting, over-production and defects are all in TIMWOODS.", "the wastes are <b>waiting, over-production and defects</b>. Turnover, dividends and competition are business terms, not wastes.") +
      li(ok3, "a surplus builds up and prices are cut to shift it.", "with supply greater than demand, <b>surplus stock builds up and prices are cut</b>. Prices rise when demand is greater than supply.") +
      li(ok4, "£52.00 − £14.50 = £37.50.", "value added = selling price − bought in materials = £52.00 − £14.50 = <b>£37.50</b>.") +
      li(ok5, "business model innovation.", "it is <b>business model innovation</b>: a new way of charging for the same thing.") + '</ul>' +
      '<div class="panel amber"><p><b>Your first thing to work on:</b> '+esc(lowest)+'</p><p class="small" style="margin:0">It is now set as your goal on the home page, with the games that practise it.</p></div>';
    var detail = "Lines: " + rag + " | Typed right " + typedRight + " of 3 | Key ideas in Q1: " + nf1 + " of 3";
    doneScreen("exit", TITLE.exit, score, 6, "Handed in", body, detail);
  };
}
function runCheckin(part, key){
  var C = CONTENT.checkin[part], R = CONTENT.checkinRecall[part];
  screen(gameHeader(C.title, 0, 0) + '<div class="wrap"><div class="card"><p style="margin:0">First, two questions from memory. Then rate each line honestly. It tells your tutor what to go over again.</p>' +
    R.map(function(x, k){ var id = "cr"+k; return '<div class="q"><label for="'+id+'">'+(k+1)+'. '+esc(x.q)+(x.k === "num" ? ' <span class="small muted" style="font-weight:400">'+(x.money ? '(the amount in pounds)' : '(number and unit)')+'</span>' : '')+'</label><input id="'+id+'" class="textin" autocomplete="off">'+micBlock(id)+'</div>'; }).join("") +
    '<h3 style="margin:22px 0 4px">Rate yourself</h3>' + ragBlock("c", C.lines) + '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Send my check-in</button></div></div>', {game:true});
  wireRag(); wireMics();
  $("#send2").onclick = function(){
    stopListening();
    var rag = readRag("c", C.lines.length), ans = R.map(function(_, k){ return $("#cr"+k).value; });
    if (ans.some(function(a){ return !a.trim(); }) || rag.indexOf("-") >= 0) { $("#err").textContent = "Have a go at both questions and rate every line first. A best guess is fine."; return; }
    var oks = R.map(function(x, k){ var r = markAny(x, ans[k]); return r.res === "right" || r.res === "near" || r.res === "nounit" || r.res === "noratio"; }), nr = oks.filter(Boolean).length;
    R.forEach(function(x, k){ srsMark(x.id, oks[k], !!x.a); });
    var g = rag.split("").filter(function(x){ return x === "G"; }).length;
    logEvent("checkin", C.title, {score:g, max:C.lines.length, extra:{rag:rag, part:part, recallRight:nr}});
    var weak = C.lines.filter(function(_,k){ return rag[k] !== "G"; });
    var body = '<ul class="review">' + R.map(function(x, k){ return '<li>'+(oks[k] ? '<b style="color:var(--green)">Right:</b> ' : '<b style="color:var(--red)">Check this:</b> ')+esc(x.q)+' The answer: <b>'+esc(answerText(x))+'</b>.</li>'; }).join("") + '</ul>' +
      '<p style="margin:0">You rated '+g+' of '+C.lines.length+' lines as got it.</p>' +
      (weak.length ? '<p style="margin:0">Go over these next:</p><ul class="review">'+weak.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join("")+'</ul>' : '<p style="margin:0">Everything rated got it. Try the Boss round for this part to prove it.</p>');
    saveProg();
    doneScreen(key, C.title, g, C.lines.length, "Sent", body, "Lines: " + rag + " | Recall right: " + nr + " of 2");
  };
}

/* ---------- start ---------- */
(function init(){
  applyPrefs();
  var labels = {games:["games","Games"], record:["record","My record"], help:["help","Help"]};
  $$("#tabs button").forEach(function(b){ var l = labels[b.dataset.tab]; b.innerHTML = icon(l[0]) + '<span>'+l[1]+'</span>';
    b.onclick = function(){ if (b.dataset.tab === "games") home(); else if (b.dataset.tab === "record") record(); else help(); }; });
  if (!CONTENT) { $("#app").innerHTML = '<div class="wrap"><p>The question bank did not load. Ask your tutor for a fresh copy of this file.</p></div>'; return; }
  buildReg();
  var qc = ""; try { qc = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase(); } catch(e) {}
  if (/^[A-Z0-9]{4}$/.test(qc)) {
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
    if (!S.me || S.me.code !== qc) {
      var hit = CLASS.filter(function(c){ return c.code === qc; })[0];
      S.me = {code:qc, name: hit ? hit.name : qc}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} logEvent("open","hub");
    }
  }
  if (S.me) { loadProg(); home(); loadServer().then(function(){ if (!inGame && S.tab === "games" && S.me) home(); }); Sync.flush(); }
  else { loadServer().then(function(){ signIn(); }); signIn(); }
})();
