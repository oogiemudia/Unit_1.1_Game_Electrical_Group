      var r = +b.dataset.r, lb = $('[data-l="'+sel+'"]');
      if (r === sel) {
        done[sel] = true; lb.classList.remove("sel"); lb.classList.add("ok"); b.classList.add("ok"); lb.disabled = true; b.disabled = true;
        var ok = !missed[sel]; if (ok) score++; else review.push({q:it.p[sel][0], right:it.p[sel][1], why:""});
        log.push({i:it.id+"-"+sel, ok:ok?1:0, l:(it.p[sel][0]+": "+it.p[sel][1]).slice(0,90)}); sel = null;
        say("Matched.");
        if (Object.keys(done).length === it.p.length) {
          var last = i === sets.length-1, fb = $("#fb"), got = it.p.length - Object.keys(missed).length;
          fb.className = "fb" + (got === it.p.length ? "" : " bad"); fb.innerHTML = '<strong>'+got+' of '+it.p.length+' matched first time.</strong>';
          $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(last ? "See my score" : "Next set")+'</button>';
          $("#next").onclick = function(){ if (last) finishGame("pairs", score, max, log, started, review); else { i++; show(); } };
        }
      } else {
        missed[sel] = true; b.classList.add("no"); lb.classList.add("no"); say("Not a pair. Try again.");
        setTimeout(function(){ b.classList.remove("no"); lb.classList.remove("no"); }, 600);
      }
    }; });
  }
  show();
}

/* ---------- Calculation Ladder with fading worked examples ----------
   Explaining and Structuring: rungs 1 and 2 show a fully worked example with different numbers,
   rungs 3 to 5 show this question's method with the last step left to you, rungs 6 to 9 are on your own.
   Independent mode removes all of it.                                                                 */
function rung(kind){
  var r = {};
  if (kind === "freq") { var X = pick([2,4,5,8,10,20,25,40,50]), f = 1000/X;
    r = {lvl:"Low", q:"A square wave has a period of "+X+" ms. What is its frequency?", ans:f, tol:0.5, unit:"Hz", hint:"Change ms to seconds, then f = 1 ÷ T.",
      work:["T = "+X+" ms = "+(X/1000)+" s.", "f = 1 ÷ T = 1 ÷ "+(X/1000)+" = "+fmt(f)+" Hz."]}; }
  else if (kind === "vpk") { var V = pick([6,9,12,15,18,24]), a = Math.round(V*1.414*100)/100;
    r = {lvl:"Low", q:"A transformer gives "+V+" V rms. What is the peak voltage? Two decimal places.", ans:a, tol:0.05, unit:"V", hint:"Peak is bigger than rms: Vpk = Vrms × 1.414.",
      work:["Vpk = Vrms × 1.414.", "Vpk = "+V+" × 1.414 = "+fmt(a)+" V."]}; }
  else if (kind === "half") { var P = pick([10,15,17,20,24,34]), h = Math.round(0.318*P*100)/100;
    r = {lvl:"Moderate", q:"A half wave rectifier has a peak of "+P+" V. What is the average DC output? Two decimal places.", ans:h, tol:0.05, unit:"V", hint:"Half wave: Vdc = 0.318 × Vpk.",
      work:["Half wave, so use 0.318.", "Vdc = 0.318 × "+P+" = "+fmt(h)+" V."]}; }
  else if (kind === "full") { var Q = pick([12,17,20,24,30,34]), g = Math.round(0.637*Q*100)/100;
    r = {lvl:"Moderate", q:"A bridge rectifier has a peak of "+Q+" V. What is the average DC output? Two decimal places.", ans:g, tol:0.05, unit:"V", hint:"A bridge is full wave: Vdc = 0.637 × Vpk.",
      work:["A bridge rectifier is full wave, so use 0.637.", "Vdc = 0.637 × "+Q+" = "+fmt(g)+" V."]}; }
  else if (kind === "hfe") { var H = pick([50,80,100,120,150,200,250]), B = pick([20,25,40,50,60]), c = H*B/1000;
    r = {lvl:"Moderate", q:"A transistor has hFE = "+H+" and a base current of "+B+" µA. What is the collector current in mA?", ans:c, tol:0.01, unit:"mA", hint:"Ic = hFE × Ib. Then change µA to mA by dividing by 1000.",
      work:["Ic = hFE × Ib = "+H+" × "+B+" µA = "+(H*B)+" µA.", "Change to mA: "+(H*B)+" ÷ 1000 = "+fmt(c)+" mA."]}; }
  else if (kind === "duty") { var mk = pick([1,2,3,5]), sp = pick([3,4,6,7,9].filter(function(x){ return x !== mk; })), d = Math.round(1000*mk/(mk+sp))/10;
    r = {lvl:"Moderate", q:"A signal is high for "+mk+" ms and low for "+sp+" ms. What is its duty cycle? One decimal place.", ans:d, tol:0.15, unit:"%", hint:"Period = mark + space. Duty cycle = mark ÷ period × 100.",
      work:["Period = "+mk+" + "+sp+" = "+(mk+sp)+" ms.", "Duty cycle = "+mk+" ÷ "+(mk+sp)+" × 100 = "+fmt(d)+"%."]}; }
  else if (kind === "loopf") { var Rg = pick([100,200,300,400,500]), fr = pick([0.25,0.5,0.75,0.2,0.4,0.6,0.8]), T = Rg*fr, I = Math.round((4+16*fr)*100)/100;
    r = {lvl:"Advanced", q:"A transmitter covers 0 to "+Rg+" °C as 4 to 20 mA. What current does it send at "+fmt(T)+" °C?", ans:I, tol:0.05, unit:"mA", hint:"Find the fraction of the range, times it by the 16 mA span, then add the 4 mA live zero.",
      work:["Fraction of range = "+fmt(T)+" ÷ "+Rg+" = "+fr+".", "Share of the 16 mA span = "+fr+" × 16 = "+fmt(16*fr)+" mA.", "Add the live zero: 4 + "+fmt(16*fr)+" = "+fmt(I)+" mA."]}; }
  else if (kind === "loopb") { var Rb = pick([100,200,300,400,500]), Ic = pick([6,8,10,12,14,16,18]), Tb = (Ic-4)/16*Rb;
    r = {lvl:"Advanced", q:"A transmitter covers 0 to "+Rb+" °C as 4 to 20 mA. The PLC reads "+Ic+" mA. What is the temperature? One decimal place.", ans:Math.round(Tb*10)/10, tol:0.15, unit:"°C", hint:"Take off the 4 mA live zero first, divide by the 16 mA span, then times by the range.",
      work:["Above the live zero: "+Ic+" − 4 = "+(Ic-4)+" mA.", "Fraction of range: "+(Ic-4)+" ÷ 16 = "+fmt((Ic-4)/16)+".", "Temperature: "+fmt((Ic-4)/16)+" × "+Rb+" = "+fmt(Tb)+" °C."]}; }
  else if (kind === "adc") { var n = pick([3,4]), sp2 = pick([["10 V",10,"V"],["10 mA",10,"mA"],["5 V",5,"V"]]), st = Math.round(sp2[1]/(Math.pow(2,n)-1)*1000)/1000;
    r = {lvl:"Advanced", q:"A "+n+"-bit ADC covers 0 to "+sp2[0]+". What is the size of one step? Three decimal places.", ans:st, tol:0.002, unit:sp2[2], hint:"n bits give 2ⁿ codes, so 2ⁿ − 1 steps between the bottom and the top. Divide the span by the number of steps.",
      show:st.toFixed(3), work:[n+" bits give 2"+(n===3?"³":"⁴")+" = "+Math.pow(2,n)+" codes.", "That is "+(Math.pow(2,n)-1)+" steps from bottom to top.", "Step = "+sp2[1]+" ÷ "+(Math.pow(2,n)-1)+" = "+st.toFixed(3)+" "+sp2[2]+"."]}; }
  r.kind = kind; return r;
}
var RUNGS = ["freq","vpk","half","full","hfe","duty","loopf","loopb","adc"];
function withUnit(it){ var v = it.show || fmt(it.ans); return it.unit === "%" ? v + "%" : v + " " + it.unit; }
function runLadder(){
  var rungs = RUNGS.map(function(k,idx){ var r = rung(k); r.id = "L"+(idx+1); r.ex = rung(k); var g = 0; while (r.ex.q === r.q && g++ < 10) r.ex = rung(k); return r; });
  var i = 0, score = 0, tries = 0, log = [], review = [], started = Date.now();
  function show(){
    if (i >= rungs.length) return finishGame("ladder", score, rungs.length, log, started, review);
    tries = 0; var it = rungs[i], fade = !guided() ? "none" : (i < 2 ? "full" : (i < 5 ? "part" : "none"));
    var scaffold = "";
    if (fade === "full") scaffold = '<div class="worked"><b>Worked example first.</b> '+esc(it.ex.q)+'<ol>'+it.ex.work.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'</ol>Now do yours the same way.</div>';
    if (fade === "part") scaffold = '<div class="worked"><b>Part worked.</b> The method is started for you. Finish the last step.<ol>'+it.work.slice(0,-1).map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'<li>Your turn.</li></ol></div>';
    screen(gameHeader(TITLE.ladder, i, rungs.length) + '<div class="wrap"><div class="card">' +
      '<div class="rungs" aria-hidden="true">' + rungs.map(function(_,k){ return '<i class="'+(k<i ? (log[k] && log[k].ok ? "done" : "miss") : (k===i ? "now" : ""))+'"></i>'; }).join("") + '</div>' +
      '<div class="qno">Rung '+(i+1)+', '+it.lvl.toLowerCase()+(fade === "none" ? ", on your own" : "")+'</div>' + scaffold + '<p class="qtext">'+esc(it.q)+'</p>' +
      '<div class="numrow"><label class="sr" for="ans">Your answer in '+esc(it.unit)+'</label>' +
      '<input id="ans" class="textin" inputmode="decimal" autocomplete="off" enterkeyhint="done"><span class="unit">'+esc(it.unit)+'</span></div>' +
      '<div class="row" style="margin-top:4px">'+(guided() ? '<button class="link" id="hint">Show a hint</button>' : '')+'<button class="link" data-act="formula">Formula card</button></div>' +
      '<div id="hintbox"></div><div id="fb" role="status"></div></div>' +
      '<div class="dock" id="dock"><button class="btn amber block" id="chk">Check</button></div></div>', {game:true});
    var inp = $("#ans");
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); var b = $("#chk") || $("#next"); if (b) b.click(); } });
    var hb = $("#hint"); if (hb) hb.onclick = function(){ $("#hintbox").innerHTML = '<div class="worked">'+esc(it.hint)+'</div>'; };
    function done(ok){
      if (ok) score++;
      log.push({i:it.id, ok:ok?1:0, l:it.q.slice(0,90)});
      if (!ok) review.push({q:it.q, right:withUnit(it), why:it.work.join(" ")});
      inp.disabled = true;
      var fb = $("#fb"); fb.className = "fb" + (ok ? "" : " bad");
      fb.innerHTML = '<strong>'+(ok ? (tries === 1 ? "Correct first time." : "Correct on the second go.") : "The answer is "+esc(withUnit(it))+".")+'</strong>' +
        '<ol>'+it.work.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'</ol>';
      $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(i+1 < rungs.length ? "Next rung" : "See my score")+'</button>';
      $("#next").onclick = function(){ i++; show(); };
      say(ok ? "Correct." : "The answer is " + withUnit(it));
    }
    $("#chk").onclick = function(){
      var v = parseFloat(inp.value.replace(/,/g,"").replace(/[^\d.\-]/g,""));
      if (isNaN(v)) { var f = $("#fb"); f.className = "fb info"; f.innerHTML = "<strong>Type a number first.</strong>"; return; }
      tries++;
      if (Math.abs(v - it.ans) <= it.tol + 1e-9) return done(true);
      if (tries === 1) {
        if (guided()) $("#hintbox").innerHTML = '<div class="worked">'+esc(it.hint)+'</div>';
        var f2 = $("#fb"); f2.className = "fb info"; f2.innerHTML = "<strong>Not quite. Have one more go.</strong>" + (guided() ? "The hint is showing above." : "Check your units and each step.");
        inp.select(); say("Not quite. Have one more go.");
      } else done(false);
    };
    setTimeout(function(){ try { inp.focus(); } catch(e) {} }, 60);
  }
  show();
}

/* ---------- key word cards: look, think, flip, be honest ---------- */
function runFlash(){
  var queue = shuffle(CONTENT.flash).map(function(c){ return Object.assign({n:0}, c); }), total = queue.length, firstGo = 0, log = [], started = Date.now();
  function show(){
    if (!queue.length) return finishGame("flash", firstGo, total, log, started,
      log.filter(function(x){ return !x.ok; }).map(function(x){ var c = CONTENT.flash.filter(function(f){ return f.id === x.i; })[0] || {}; return {q:x.l, right:c.def||"", why:""}; }));
    var c = queue[0], known = total - queue.length;
    screen(gameHeader(TITLE.flash, known, total) + '<div class="wrap">' +
      '<p class="qprompt" style="margin:0 0 6px">Say the meaning out loud, then turn the card over.</p>' +
      '<button class="flip" id="fc" aria-label="'+esc(c.term)+'. Tap to turn over."><span class="inner"><span class="face front"><strong>'+esc(c.term)+'</strong><span class="small muted" style="margin-top:10px">Tap to turn over</span></span>' +
      '<span class="face back"><span>'+esc(c.def)+'</span></span></span></button>' +
      '<div class="dock" id="dock"><div class="row"><button class="btn ghost" id="no" disabled>Not yet</button><button class="btn" id="yes" disabled>I knew that</button></div>' +
      '<button class="link" id="stop" style="width:100%">Stop here and see my score</button></div></div>', {game:true});
    var fc = $("#fc");
    fc.onclick = function(){ fc.classList.toggle("on"); $("#yes").disabled = false; $("#no").disabled = false; fc.setAttribute("aria-label", fc.classList.contains("on") ? c.def : c.term); };
    $("#yes").onclick = function(){ if (c.n === 0) { firstGo++; log.push({i:c.id, ok:1, l:c.term}); } queue.shift(); show(); };
    $("#no").onclick = function(){ if (c.n === 0) log.push({i:c.id, ok:0, l:c.term}); c.n++; queue.shift(); if (c.n < 3) queue.push(c); show(); };
    $("#stop").onclick = function(){ queue.forEach(function(q){ if (q.n === 0) log.push({i:q.id, ok:0, l:q.term}); }); queue = []; show(); };
  }
  show();
}

/* ---------- exit ticket and check-ins ---------- */
function ragBlock(prefix, lines){
  return lines.map(function(l,k){ return '<div class="q"><p id="'+prefix+k+'l" style="font-weight:400;color:var(--ink)">'+(k+1)+'. '+esc(l)+'</p>' +
    '<div class="rag" role="group" aria-labelledby="'+prefix+k+'l">' +
    '<button class="r" data-rag="'+prefix+k+'" data-v="R" aria-pressed="false">Not yet</button><button class="a" data-rag="'+prefix+k+'" data-v="A" aria-pressed="false">Nearly</button><button class="g" data-rag="'+prefix+k+'" data-v="G" aria-pressed="false">Got it</button></div></div>'; }).join("");
}
function wireRag(){ $$("[data-rag]").forEach(function(b){ b.onclick = function(){ $$('[data-rag="'+b.dataset.rag+'"]').forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); }; }); }
function readRag(prefix, n){ var out = ""; for (var k=0;k<n;k++){ var on = $('[data-rag="'+prefix+k+'"][aria-pressed="true"]'); out += on ? on.dataset.v : "-"; } return out; }
function doneScreen(key, title, score, max, heading, body, detail){
  var p = S.prog; p.raw[key] = [score, max]; p.best[key] = Math.round(100*score/max); p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  p.done[key] = true; p.xp += 30; var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t); saveProg();
  screen(gameHeader(title, 0, 0) + '<div class="wrap"><div class="card stack"><h2 style="margin:0">'+heading+'</h2>'+body+'</div>' +
    sendPanel(title, score, max, detail) + '<div class="dock"><button class="btn amber block" id="hub">Back to the games</button></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#hub").onclick = function(){ home(); };
}
function runExit(){
  var E = CONTENT.exit, G = CONTENT.goals.map(function(g){ return g.t; });
  function radios(name, q){ return '<fieldset class="q"><legend>'+esc(q.q)+'</legend>'+q.opts.map(function(o,k){ return '<label class="check"><input type="radio" name="'+name+'" value="'+k+'"><span>'+esc(o)+'</span></label>'; }).join("")+'</fieldset>'; }
  screen(gameHeader(TITLE.exit, 0, 0) + '<div class="wrap"><div class="card">' +
    '<p style="margin:0">Five minutes, on your own. This is for feedback, not a mark.</p>' +
    '<div class="q"><label for="q1">1. '+esc(E.q1)+'</label><textarea id="q1" class="textin" maxlength="400"></textarea></div>' +
    radios("q2", {q:"2. "+E.q2.q, opts:E.q2.opts}) +
    '<fieldset class="q"><legend>'+esc(E.q2b.q)+'</legend>'+E.q2b.opts.map(function(o,k){ return '<label class="check"><input type="checkbox" name="q2b" value="'+k+'"><span>'+esc(o)+'</span></label>'; }).join("")+'</fieldset>' +
    radios("q3", {q:"3. "+E.q3.q, opts:E.q3.opts}) + radios("q4", {q:"4. "+E.q4.q, opts:E.q4.opts}) +
    '<div class="q"><label for="q4b">'+esc(E.q4b)+'</label><textarea id="q4b" class="textin" maxlength="300" style="min-height:70px"></textarea></div>' +
    '<h3 style="margin:22px 0 4px">Can you do all eight? Be honest.</h3>' + ragBlock("x", G) +
    '<div class="q"><label for="fz">Anything still fuzzy? (optional)</label><textarea id="fz" class="textin" maxlength="300" style="min-height:70px"></textarea></div>' +
    '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Hand it in</button></div></div>', {game:true});
  wireRag();
  $("#send2").onclick = function(){
    var q1 = $("#q1").value.trim(), q2 = $('input[name="q2"]:checked'), q3 = $('input[name="q3"]:checked'), q4 = $('input[name="q4"]:checked');
    var q2b = $$('input[name="q2b"]:checked').map(function(x){ return +x.value; }), rag = readRag("x", G.length);
    if (!q1 || !q2 || !q3 || !q4 || rag.indexOf("-") >= 0) { $("#err").textContent = "Answer questions 1 to 4 and rate all eight lines before handing in."; return; }
    var ok2 = +q2.value === E.q2.ans, ok2b = q2b.length === 3 && E.q2b.ans.every(function(a){ return q2b.indexOf(a) >= 0; }), ok3 = +q3.value === E.q3.ans, ok4 = +q4.value === E.q4.ans;
    var score = (ok2 ? 1 : 0) + (ok2b ? 1 : 0) + (ok3 ? 1 : 0) + (ok4 ? 1 : 0);
    var lowIdx = rag.indexOf("R") >= 0 ? rag.indexOf("R") : (rag.indexOf("A") >= 0 ? rag.indexOf("A") : 0), lowest = G[lowIdx];
    S.prog.rag = {}; rag.split("").forEach(function(v,k){ S.prog.rag[k] = v; });
    if (rag.replace(/G/g,"").length) S.prog.goal = lowIdx;
    var extra = {q1:q1, q2:E.q2.opts[+q2.value], q2b:q2b.map(function(k){ return E.q2b.opts[k]; }).join("; "), q3:E.q3.opts[+q3.value], q4:E.q4.opts[+q4.value], q4b:$("#q4b").value.trim(), rag:rag, fuzzy:$("#fz").value.trim()};
    logEvent("exit", TITLE.exit, {score:score, max:4, extra:extra, items:[{i:"X2",ok:ok2?1:0,l:"Depletion layer in forward bias"},{i:"X2b",ok:ok2b?1:0,l:"Three digital signals"},{i:"X3",ok:ok3?1:0,l:"Timebase waveform"},{i:"X4",ok:ok4?1:0,l:"4 to 20 mA scaling"}]});
    function li(ok, good, bad){ return '<li>'+(ok ? '<b style="color:var(--green)">Right:</b> '+good : '<b style="color:var(--red)">Check this:</b> '+bad)+'</li>'; }
    var body = '<p style="margin:0">Thank you. Your tutor will read this before the next lesson.</p><ul class="review">' +
      li(ok2, "in forward bias the depletion layer narrows.", "in forward bias the depletion layer <b>narrows</b>, so current can flow above the knee voltage.") +
      li(ok2b, "the push button, the clock and the ADC code are digital.", "the digital ones are <b>the push button, the clock and the ADC code</b>. A 4 to 20 mA signal is analogue.") +
      li(ok3, "a sawtooth sweeps the oscilloscope trace.", "the timebase is a <b>sawtooth</b>: a steady ramp, then a sudden drop.") +
      li(ok4, "150 °C is half the range: 4 + 8 = 12 mA.", "150 °C is half the range, so 4 + (0.5 × 16) = <b>12 mA</b>. Do not forget the 4 mA live zero.") + '</ul>' +
      '<div class="panel amber"><p><b>Your first thing to work on:</b> '+esc(lowest)+'</p><p class="small" style="margin:0">It is now set as your goal on the home page, with the games that practise it.</p></div>';
    var detail = "Q1: " + q1 + " | Q4 working: " + extra.q4b + " | Lines: " + rag + (extra.fuzzy ? " | Fuzzy: " + extra.fuzzy : "");
    doneScreen("exit", TITLE.exit, score, 4, "Handed in", body, detail);
  };
}
function runCheckin(part, key){
  var C = CONTENT.checkin[part];
  screen(gameHeader(C.title, 0, 0) + '<div class="wrap"><div class="card"><p style="margin:0">Rate each line honestly. It tells your tutor what to go over again.</p>' +
    ragBlock("c", C.lines) + '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Send my check-in</button></div></div>', {game:true});
  wireRag();
  $("#send2").onclick = function(){
    var rag = readRag("c", C.lines.length);
    if (rag.indexOf("-") >= 0) { $("#err").textContent = "Rate every line first."; return; }
    var g = rag.split("").filter(function(x){ return x === "G"; }).length;
    logEvent("checkin", C.title, {score:g, max:C.lines.length, extra:{rag:rag, part:part}});
    var weak = C.lines.filter(function(_,k){ return rag[k] !== "G"; });
    var body = '<p style="margin:0">You rated '+g+' of '+C.lines.length+' lines as got it.</p>' +
      (weak.length ? '<p style="margin:0">Go over these next:</p><ul class="review">'+weak.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join("")+'</ul>' : '<p style="margin:0">Everything rated got it. Try the games to prove it.</p>');
    doneScreen(key, C.title, g, C.lines.length, "Sent", body, "Lines: " + rag);
  };
}

    }
  }
  if (S.me) { loadProg(); home(); loadServer().then(function(){ if (!inGame && S.tab === "games" && S.me) home(); }); Sync.flush(); }
  else { loadServer().then(function(){ signIn(); }); signIn(); }
})();
