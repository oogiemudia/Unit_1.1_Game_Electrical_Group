<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unit 1.1 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Unit 1.1 games hub</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}
</style>
</head>
<body class="out">
<div id="app"></div>
<nav class="tabbar" id="tabs" aria-label="Main">

  <button data-tab="record">My record</button>
  <button data-tab="help">Help</button>
</nav>
<div id="live" class="sr" aria-live="polite"></div>
<script>
"use strict";
/* ==========================================================================
   TUTOR SETTINGS. These are the only two lines in this file you need to edit.

   upload it to the class team. Every learner who opens it gets these.

var CONTENT = {"families":["Forming","Shaping","Casting","Wasting","Joining","Finishing","Additive"],"family":[{"id":"F01","op":"Rolling","ok":["Forming"],"why":"Bulk forming. The shape changes by compression and no material is removed."},{"id":"F02","op":"Extrusion","ok":["Forming"],"why":"Bulk forming. Material is pushed through a die to make a profile."},{"id":"F03","op":"Wire drawing","ok":["Forming"],"why":"Bulk forming. Wire is pulled through a die, so tension does the work."},{"id":"F04","op":"Deep drawing","ok":["Forming"],"why":"Sheet metal forming. A flat sheet is drawn into a cup or box shape."},{"id":"F05","op":"Bending sheet steel","ok":["Forming"],"why":"Sheet metal forming. The sheet changes shape but keeps its mass."},{"id":"F06","op":"Die casting","ok":["Casting","Shaping"],"why":"Casting with a permanent mould. Casting is one of the four categories of shaping, so both answers are fair."},{"id":"F07","op":"Sand casting","ok":["Casting","Shaping"],"why":"Casting with an expendable mould. Casting sits inside shaping, so both answers are fair."},{"id":"F08","op":"Investment casting","ok":["Casting","Shaping"],"why":"Casting with an expendable mould. Casting sits inside shaping, so both answers are fair."},{"id":"F09","op":"Pressing","ok":["Shaping","Forming"],"why":"A manipulative shaping process that also counts as forming, because plastic deformation changes the shape."},{"id":"F10","op":"Forging","ok":["Forming","Shaping"],"why":"Bulk forming, and also a manipulative shaping process. Say which family you mean and why."},{"id":"F11","op":"Compacting powder into a die","ok":["Shaping","Forming"],"why":"Shaping (powder techniques). It overlaps powder metal forming, so forming is also fair."},{"id":"F12","op":"Grinding a shaft to final size","ok":["Shaping","Wasting"],"why":"Shaping (cutting and grinding). The removed material becomes swarf, so it also counts as wasting."},{"id":"F13","op":"Guillotining","ok":["Wasting"],"why":"Wasting. A blade chops through sheet material."},{"id":"F14","op":"Laser cutting","ok":["Wasting"],"why":"Wasting. Material is cut away to leave the shape."},{"id":"F15","op":"CNC routing","ok":["Wasting"],"why":"Wasting. A spinning cutter follows a programmed route."},{"id":"F16","op":"Drilling","ok":["Wasting"],"why":"Wasting. The metal from the hole comes away as swarf."},{"id":"F17","op":"MIG welding","ok":["Joining"],"why":"Joining. A permanent joint."},{"id":"F18","op":"Brazing","ok":["Joining"],"why":"Joining. A filler metal bonds the parts."},{"id":"F19","op":"Bolting","ok":["Joining"],"why":"Joining, and a temporary joint because it can be taken apart."},{"id":"F20","op":"Riveting","ok":["Joining"],"why":"Joining. Parts are fixed together with rivets."},{"id":"F21","op":"Adhesive bonding","ok":["Joining"],"why":"Joining. Glue holds the parts together."},{"id":"F22","op":"Anodising","ok":["Finishing"],"why":"Finishing, adding and altering. A new surface layer is formed."},{"id":"F23","op":"Polishing","ok":["Finishing"],"why":"Finishing, removing and reshaping. A thin layer comes off."},{"id":"F24","op":"Electroplating","ok":["Finishing"],"why":"Finishing, adding and altering. A metal layer goes on."},{"id":"F25","op":"Powder coating","ok":["Finishing"],"why":"Finishing, adding and altering. Charged powder is baked on."},{"id":"F26","op":"Laser ablation","ok":["Finishing"],"why":"Finishing, removing and reshaping. Not the same as laser cutting, which is wasting."},{"id":"F27","op":"Powder bed fusion","ok":["Additive"],"why":"Additive. A laser or electron beam melts one layer of powder at a time."},{"id":"F28","op":"Vat photopolymerisation","ok":["Additive"],"why":"Additive. Liquid resin is set hard by UV light, layer by layer."},{"id":"F29","op":"3D printing with filament (material extrusion)","ok":["Additive"],"why":"Additive. Hot filament is laid through a nozzle. Not the same as extrusion, which is forming."},{"id":"F30","op":"Binder jetting","ok":["Additive"],"why":"Additive. Binder is printed onto powder, then the part is sintered."}],"errors":[{"id":"E01","chunks":["Shaping has four categories:","casting, manipulative processes,","powder techniques,","and welding."],"wrong":3,"fix":"The fourth category is cutting and grinding. Welding is joining."},{"id":"E02","chunks":["Forming changes the shape","using tension, compression or shear,","and removes a small amount of material."],"wrong":2,"fix":"No material is removed in forming, so the mass stays the same."},{"id":"E03","chunks":["A sand mould is expendable,","so it is reused","for every casting."],"wrong":1,"fix":"An expendable mould is destroyed to remove each casting."},{"id":"E04","chunks":["A part must be 40 mm after sintering","and it shrinks by 20%,","so it should be printed at 48 mm."],"wrong":2,"fix":"Print it at 40 ÷ 0.8 = 50 mm. Check: 20% of 50 is 10, and 50 − 10 = 40 mm."},{"id":"E05","chunks":["Sintering heats the powder","above its melting point","so the particles bond together."],"wrong":1,"fix":"Sintering happens below the melting point. The metal never melts."},{"id":"E06","chunks":["Polishing is a finishing process","that adds a new layer","to the surface."],"wrong":1,"fix":"Polishing removes a thin layer. It is removing and reshaping."},{"id":"E07","chunks":["The design brief is written by the client,","in their own words,","and every line in it is measurable."],"wrong":2,"fix":"The brief is not yet measurable. The product design specification makes it measurable."},{"id":"E08","chunks":["In the linear design process,","testing comes","before manufacturing."],"wrong":2,"fix":"Testing is step 7, after manufacturing at step 6."},{"id":"E09","chunks":["Controls must be within reach of","the largest user,","so everyone else can reach them too."],"wrong":1,"fix":"Reach is designed for the smallest user, using the 5th percentile."},{"id":"E10","chunks":["Doorway height is a clearance problem,","so it is based on","the 5th percentile stature."],"wrong":2,"fix":"Clearance uses the 95th percentile, then adds footwear and head clearance."},{"id":"E11","chunks":["Environmental requirements mean the product","must stand up to where it is used,","and nothing else."],"wrong":2,"fix":"They also cover the product's effect on the environment: visual impact and pollution."},{"id":"E12","chunks":["User centred design","is a form of linear design","that involves users at every stage."],"wrong":1,"fix":"User centred design is a form of iterative design. It cannot be run in one pass."},{"id":"E13","chunks":["Design for assembly aims to","increase the number of parts","so each one is simpler."],"wrong":1,"fix":"It aims to reduce the number of parts, which is called component elimination."},{"id":"E14","chunks":["The 6Rs are applied","only when a product is thrown away."],"wrong":1,"fix":"The 6Rs are applied at the design stage, before any material is bought."},{"id":"E15","chunks":["Qualitative research uses","words and opinions,","such as timed trials."],"wrong":2,"fix":"Timed trials give numbers, which is quantitative. Qualitative examples are interviews and open questions."},{"id":"E16","chunks":["A non-technical audience needs","plain language and images,","and plenty of jargon."],"wrong":2,"fix":"A non-technical audience needs no jargon."},{"id":"E17","chunks":["Additive manufacturing","builds a part layer by layer","and produces a lot of swarf."],"wrong":2,"fix":"Additive manufacturing has minimal waste. Swarf comes from wasting."},{"id":"E18","chunks":["A reusable mould needs a draft angle","so the user can grip the part."],"wrong":1,"fix":"The draft angle is there for the process: it lets the part release from the mould."},{"id":"E19","chunks":["Hanging holes in sheet metal parts","let every face be coated at once,","and are added for the user."],"wrong":2,"fix":"Hanging holes are there for the process, not the user."},{"id":"E20","chunks":["A product is fit for purpose","when it looks attractive,","judged against stated requirements."],"wrong":1,"fix":"It is fit for purpose when it meets the purpose it was intended for."},{"id":"E21","chunks":["A product that meets every desirable requirement","but misses one essential requirement","is still fit for purpose."],"wrong":2,"fix":"Missing one essential requirement means it is not fit for purpose."},{"id":"E22","chunks":["Fatigue testing checks","how a product performs","under one very large load."],"wrong":2,"fix":"Fatigue testing uses fluctuating loads repeated many thousands of times."}],"briefspec":[{"id":"B01","s":"The client wants a lightweight folding stool for festival use.","ans":"Brief","why":"Client's words, not measurable."},{"id":"B02","s":"It must survive being left out in the rain.","ans":"Brief","why":"A need, but not yet measurable."},{"id":"B03","s":"It should be comfortable to sit on.","ans":"Brief","why":"How would you measure comfortable? Not yet a specification."},{"id":"B04","s":"Easy to carry.","ans":"Brief","why":"The worked example on the slide turns this into a mass limit."},{"id":"B05","s":"It should look good in a modern kitchen.","ans":"Brief","why":"A matter of opinion, so it belongs in the brief."},{"id":"B06","s":"Cheap enough for students to buy.","ans":"Brief","why":"No price is given, so it is not measurable yet."},{"id":"B07","s":"Safe for children to use.","ans":"Brief","why":"A need. The specification would name the tests and limits."},{"id":"B08","s":"The handle should feel nice to hold.","ans":"Brief","why":"Everyday words, not a measurable target."},{"id":"S01","s":"Mass not greater than 2.5 kg.","ans":"Spec","why":"A measurable limit."},{"id":"S02","s":"Must withstand a static load of 120 kg without permanent deformation.","ans":"Spec","why":"Gives a load and a test."},{"id":"S03","s":"Folded thickness not greater than 90 mm.","ans":"Spec","why":"A measurable limit."},{"id":"S04","s":"Seat height 430 mm plus or minus 10 mm.","ans":"Spec","why":"A dimension with a tolerance."},{"id":"S05","s":"Retail price not greater than £25.","ans":"Spec","why":"A measurable limit."},{"id":"S06","s":"All external corners to have a radius of at least 2 mm.","ans":"Spec","why":"Measurable, and it turns 'safe' into something you can check."},{"id":"S07","s":"No red rust after a 48 hour salt spray test.","ans":"Spec","why":"Names a test and a pass condition."},{"id":"S08","s":"Handle grip diameter between 30 mm and 40 mm.","ans":"Spec","why":"A measurable range."}],"expert":[{"id":"D01","q":"A one-off replacement bracket for a machine. Low risk, needed this week. Which process suits it?","opts":["Linear design","Iterative design","User centred design","Inclusive design"],"ans":0,"why":"A low-risk one-off may not justify prototyping, so one pass is sensible."},{"id":"D02","q":"A new electric toothbrush for the mass market. Which process suits it?","opts":["Iterative design","Linear design","Design for assembly only","No design process"],"ans":0,"why":"A new consumer product almost always needs prototypes, testing and improvement."},{"id":"D03","q":"Users are interviewed and watched at every stage, and the design changes after each round. Which approach?","opts":["User centred design","Linear design","Design for manufacture","Ergonomic design"],"ans":0,"why":"User centred design keeps going back to users at every phase."},{"id":"D04","q":"A museum joins its rooms with shallow ramps so everyone uses the same route. Which approach?","opts":["Inclusive design","Design for assembly","Linear design","Sustainable design"],"ans":0,"why":"One design that the widest range of people can use."},{"id":"D05","q":"A workbench height is set from elbow height data. Which approach?","opts":["Ergonomic design","Inclusive design","Design for manufacture","Iterative design"],"ans":0,"why":"Design based on measured body dimensions is ergonomic design."},{"id":"D06","q":"A casting is given a slight taper so it releases from a reusable mould. Which approach?","opts":["Design for manufacture","Design for assembly","User centred design","Inclusive design"],"ans":0,"why":"The draft angle is there for the process. That is design for manufacture."},{"id":"D07","q":"A 24-part assembly is redesigned to use 2 parts. Which approach?","opts":["Design for assembly","Ergonomic design","Linear design","Sustainable design"],"ans":0,"why":"Component elimination. Most of the saving is in the parts themselves."},{"id":"D08","q":"Fixing holes are made asymmetric so a panel can only fit one way. Which approach?","opts":["Design for assembly","Design for manufacture","Inclusive design","User centred design"],"ans":0,"why":"A part that only fits one way cannot be fitted wrongly."},{"id":"D09","q":"A kettle is redesigned to use less plastic, less energy and to be easy to repair. Which approach?","opts":["Sustainable design","Design for assembly","Linear design","Ergonomic design"],"ans":0,"why":"Reduce and repair are two of the 6Rs of sustainable design."},{"id":"D10","q":"Legroom under a workshop desk. Which percentile?","opts":["95th percentile","5th percentile","50th percentile","Adjustable, 5th to 95th"],"ans":0,"why":"Clearance: design for the largest user."},{"id":"D11","q":"An emergency stop button on a machine. Which percentile?","opts":["5th percentile","50th percentile","95th percentile","Adjustable, 5th to 95th"],"ans":0,"why":"Reach: design for the smallest user."},{"id":"D12","q":"The seat height of an office chair. Which percentile?","opts":["Adjustable, 5th to 95th","5th percentile","50th percentile","95th percentile"],"ans":0,"why":"One chair must suit everyone, so it adjusts across the span."},{"id":"D13","q":"Why not design a doorway for the 50th percentile?","opts":["Half of users would have to stoop","It would cost too much","Doors are always adjustable","The 50th is the smallest user"],"ans":0,"why":"The 50th is the middle. Half the users are taller than it."},{"id":"D14","q":"A cycle helmet is checked against the standard it must meet to be sold. Which testing methodology?","opts":["Compliance","Functional","User experience","Fatigue"],"ans":0,"why":"Compliance asks: can it legally be sold?"},{"id":"D15","q":"Riders wear the helmet for a week and say whether the strap is easy to use. Which testing methodology?","opts":["User experience","Compliance","Functional","Fastener stress"],"ans":0,"why":"Does it work for real people? Field tests in plain language."},{"id":"D16","q":"The helmet is crash tested to see whether it could fail and hurt the rider. Which testing methodology?","opts":["Safety","User experience","Compliance","Qualitative research"],"ans":0,"why":"Safety asks: could it hurt anyone?"},{"id":"D17","q":"A bolted joint is loaded until the connectors fail. Which test method?","opts":["Fastener stress","Fatigue","Temperature and pressure","User experience"],"ans":0,"why":"A joint is often the weak point, so bolts and connectors are tested under stress."},{"id":"D18","q":"A bracket is loaded and unloaded 100,000 times. Which test method?","opts":["Fatigue","Fastener stress","Compliance","Temperature and pressure"],"ans":0,"why":"Fatigue is failure under fluctuating loads, like bending a paperclip back and forth."},{"id":"D19","q":"You present a new design to the client's finance director. What do you lead with?","opts":["What it does for them, in plain words","The full tolerance table","The wiring schematic","The material specification codes"],"ans":0,"why":"A non-technical audience needs the message summarised, with no jargon."},{"id":"D20","q":"A lift brake clamps on when the power fails. What does this show?","opts":["Failing safely","Component elimination","Design for manufacture","Linear design"],"ans":0,"why":"If something goes wrong, it should go wrong in the safest way."},{"id":"D21","q":"Market research asks 200 people to rate a handle from 1 to 5. What kind of research?","opts":["Quantitative","Qualitative","Mixed methods","Compliance"],"ans":0,"why":"Rated questions give numbers you can measure."},{"id":"D22","q":"A timed trial is followed by an interview about it. What kind of research?","opts":["Mixed methods","Quantitative","Qualitative","Functional testing"],"ans":0,"why":"Numbers from the trial plus words from the interview."}],"sequences":[{"id":"Q1","title":"The linear design process","steps":["Client brief","Product design specification","Investigation","Ideas","Development","Manufacturing","Testing","Evaluation"],"why":"One pass, one solution. The common slip is putting testing before manufacturing."},{"id":"Q2","title":"Sand casting, pattern to part","steps":["Make the pattern","Pack sand round the pattern to make the mould","Pour in the molten metal","Let it cool and solidify","Break the mould to get the casting out"],"why":"The sand mould is expendable, so it is broken every time."},{"id":"Q3","title":"Binder jetting","steps":["Print binder onto the powder, layer by layer","Lift the green part out of the powder bed","De-bind the part","Sinter it in an oven","Part is dense and hard, and about 20 to 25% smaller"],"why":"This is why the part is printed oversize."},{"id":"Q4","title":"The iterative cycle (after the brief and PDS)","steps":["Investigation","Ideas","Development","Make a model or prototype","Test the prototype","Evaluate","Feed improvements back to investigation"],"why":"The loop repeats until the design meets every requirement."},{"id":"Q5","title":"User centred design","steps":["Understand the context of use","Specify the user requirements","Produce design solutions","Evaluate against the user requirements"],"why":"Then round again until the design succeeds."}],"flash":[{"id":"K01","term":"Manufacturing process","def":"A way of turning raw material into a useful part or product."},{"id":"K02","term":"Wasting","def":"Making a shape by cutting material away. The bits removed are waste, called swarf."},{"id":"K03","term":"Forming","def":"Changing the shape by force (bending, squeezing, stretching) without removing any material."},{"id":"K04","term":"Shaping","def":"The family of processes that change a part's size and shape. It has four categories, and casting is one."},{"id":"K05","term":"Casting","def":"Pouring liquid material into a mould and letting it set."},{"id":"K06","term":"Joining","def":"Fixing parts together, for good (like welding) or so they come apart (like bolting)."},{"id":"K07","term":"Finishing","def":"Treating the surface, taking a layer off or putting one on, to protect it or improve it."},{"id":"K08","term":"Additive manufacturing","def":"Building a part layer by layer from a 3D computer model. Industrial 3D printing."},{"id":"K09","term":"Fit for purpose","def":"It does the job it was made for, judged against the stated requirements."},{"id":"K10","term":"Functional requirements","def":"What the product must do: its features and functions."},{"id":"K11","term":"Design brief","def":"The client's description of what they need, in their own words."},{"id":"K12","term":"Product design specification","def":"The list of measurable targets the design must meet. Often shortened to PDS."},{"id":"K13","term":"Linear design","def":"One pass through the design steps, giving one final solution."},{"id":"K14","term":"Iterative design","def":"A loop of prototype, test, evaluate and improve, repeated until the design meets the brief."},{"id":"K15","term":"Anthropometric data","def":"Measurements of the human body, used to size products so they fit people."},{"id":"K16","term":"Percentile","def":"A position in a group. The 5th percentile means 5 in every 100 people are smaller."},{"id":"K17","term":"Design for manufacture","def":"Designing a part so it is easy and cheap to make."},{"id":"K18","term":"Design for assembly","def":"Designing so parts go together quickly and easily, often by using fewer parts."},{"id":"K19","term":"The 6Rs","def":"Reduce, refuse, rethink, repair, reuse, recycle. Six questions for greener design."},{"id":"K20","term":"Qualitative and quantitative","def":"Research using words and opinions, and research using numbers and measurements."},{"id":"K21","term":"Draft angle","def":"A slight taper that lets a part release from a reusable mould. It is there for the process, not the user."},{"id":"K22","term":"Swarf","def":"The chips of material removed by wasting processes such as drilling and milling."},{"id":"K23","term":"Sintering","def":"Heating compacted powder below its melting point so the particles bond. The part shrinks."},{"id":"K24","term":"Green compact","def":"Pressed or printed powder that has not been sintered yet, like clay before it is fired."},{"id":"K25","term":"Component elimination","def":"Reducing the number of separate parts in an assembly."},{"id":"K26","term":"Fail safe","def":"If the product does fail, it fails in the safest way, like a lift brake that clamps on."}],"sixr":[{"id":"R01","q":"A designer cuts the wall thickness of a moulded case from 3 mm to 2 mm.","ans":"Reduce","why":"Using less material for the same job is reduce."},{"id":"R02","q":"A factory switches to a process that needs a lower furnace temperature.","ans":"Reduce","why":"Less energy in manufacture is reduce."},{"id":"R03","q":"A client asks for a single-use plastic cup. The designer says no and offers another option.","ans":"Refuse","why":"Saying no to an unsustainable product or material is refuse."},{"id":"R04","q":"The designer will not specify any material that cannot be recycled.","ans":"Refuse","why":"Turning down a material on sustainability grounds is refuse."},{"id":"R05","q":"Before sketching anything, the team asks whether the product is needed at all.","ans":"Rethink","why":"Questioning whether the product is essential, or could be done differently, is rethink."},{"id":"R06","q":"A kettle is redesigned from scratch so it lasts ten years instead of three.","ans":"Rethink","why":"Changing the whole approach to give a longer life is rethink."},{"id":"R07","q":"A drill is sold with spare motor brushes and a guide to fitting them.","ans":"Repair","why":"Spare parts that let the owner fix it are repair."},{"id":"R08","q":"A phone is built so a cracked screen can be swapped without replacing the phone.","ans":"Repair","why":"Replacing one part rather than the whole product is repair."},{"id":"R09","q":"Old car tyres are cut up and used as playground surfacing.","ans":"Reuse","why":"Using a product or its parts again, in the same or a new way, is reuse."},{"id":"R10","q":"A chair is held together with bolts, not glue, so the frame can go into a new chair.","ans":"Reuse","why":"Easy dismantling so parts can be used again is reuse."},{"id":"R11","q":"A bracket is specified in aluminium made from melted-down drinks cans.","ans":"Recycle","why":"Using material that has been reprocessed is recycle."},{"id":"R12","q":"Every plastic part is marked with its material code so it can be sorted at end of life.","ans":"Recycle","why":"Making the product easy to reprocess into new material is recycle."},{"id":"R13","q":"Customers walk away from a product with wasteful packaging, so the designer drops it.","ans":"Refuse","why":"Consumers and designers refusing unsustainable designs is refuse."},{"id":"R14","q":"Packaging is cut to a card sleeve with no plastic window.","ans":"Reduce","why":"Less waste and packaging is reduce."}],"datacard":[{"dim":"Stature (height)","m":[1630,1745,1860],"f":[1510,1620,1730]},{"dim":"Eye height","m":[1520,1640,1760],"f":[1410,1515,1620]},{"dim":"Shoulder height","m":[1340,1445,1550],"f":[1240,1330,1420]},{"dim":"Elbow height","m":[1020,1100,1180],"f":[950,1020,1090]},{"dim":"Sitting elbow height","m":[210,250,290],"f":[190,235,280]},{"dim":"Popliteal height","m":[410,450,490],"f":[370,410,450]},{"dim":"Buttock to popliteal length","m":[450,510,570],"f":[440,500,560]},{"dim":"Thigh thickness","m":[130,155,180],"f":[120,150,180]},{"dim":"Shoulder breadth","m":[440,485,530],"f":[390,440,490]},{"dim":"Hip breadth","m":[350,390,430],"f":[350,405,460]},{"dim":"Hand length","m":[170,190,210],"f":[160,175,190]},{"dim":"Forward grip reach","m":[720,790,860],"f":[660,725,790]},{"dim":"Vertical reach standing","m":[1950,2100,2250],"f":[1810,1940,2070]}],"quick":[{"id":"K1-01","q":"What is the goal of any manufacturing process?","opts":["A product with a useful form","The lowest possible cost","The fastest production rate","Zero waste material"],"ans":0},{"id":"K1-02","q":"Which is NOT one of the three stages of a manufacturing process?","opts":["Test the product with users","Change the physical properties","Change the shape and size","Achieve the required accuracy"],"ans":0},{"id":"K1-03","q":"In which family is no material removed, so the mass stays the same?","opts":["Forming","Wasting","Finishing","Additive"],"ans":0},{"id":"K1-04","q":"Rolling, extrusion and forging are examples of which type of forming?","opts":["Bulk forming","Sheet metal forming","Powder metal forming","Additive forming"],"ans":0},{"id":"K1-05","q":"Casting is one of the four categories of which family?","opts":["Shaping","Forming","Joining","Wasting"],"ans":0},{"id":"K1-06","q":"Which shaping category is the only one that starts from a liquid?","opts":["Casting","Manipulative processes","Powder techniques","Cutting and grinding"],"ans":0},{"id":"K1-07","q":"Which shaping category also counts as wasting?","opts":["Cutting and grinding","Casting","Powder techniques","Manipulative processes"],"ans":0},{"id":"K1-08","q":"Sand casting uses which type of mould?","opts":["Expendable","Permanent","Reusable metal die","Gravity die"],"ans":0},{"id":"K1-09","q":"Why does a permanent mould need a draft angle?","opts":["So the part releases from the mould","To make the part stronger","So the user can grip the part","To stop the part shrinking"],"ans":0},{"id":"K1-10","q":"What is the waste from drilling and milling called?","opts":["Swarf","Slag","Flash","Sprue"],"ans":0},{"id":"K1-11","q":"Butt, tee, corner, lap and which other joint type?","opts":["Edge","Mitre","Dovetail","Scarf"],"ans":0},{"id":"K1-12","q":"Powder coating is which category of finishing?","opts":["Adding and altering","Removing and reshaping","Joining","Wasting"],"ans":0},{"id":"K1-13","q":"Which additive process lays heated filament through a nozzle?","opts":["Material extrusion","Powder bed fusion","Binder jetting","Sheet lamination"],"ans":0},{"id":"K1-14","q":"A part must be 40 mm after sintering and shrinks by 20%. What length do you print?","opts":["50 mm","48 mm","45 mm","32 mm"],"ans":0},{"id":"K1-15","q":"Hanging holes in sheet metal parts are there so that...","opts":["Every face can be coated at once","The user can hang it on a wall","The part weighs less","Air can cool the part"],"ans":0},{"id":"K1-16","q":"MIG welding belongs to which family?","opts":["Joining","Finishing","Forming","Additive"],"ans":0},{"id":"K2-01","q":"A product is fit for purpose when it...","opts":["Meets its purpose, judged against requirements","Looks better than its rivals","Is the cheapest option","Uses sustainable materials"],"ans":0},{"id":"K2-02","q":"It meets every desirable need but misses one essential one. Is it fit for purpose?","opts":["No","Yes","Yes, if it is cheap enough","Yes, if the client likes it"],"ans":0},{"id":"K2-03","q":"Which is an ESSENTIAL requirement for a sofa bed?","opts":["Works as a seat and as a bed","Provides storage","Comes in six colours","Costs under £200"],"ans":0},{"id":"K2-04","q":"Environmental requirements cover two things. Which pair is right?","opts":["Stands up to conditions, and its impact","Price and weight","Colour and texture","Recycling and reuse only"],"ans":0},{"id":"K2-05","q":"Untreated wood rotting in a damp place is a failure of which requirement?","opts":["Environmental","Functional","User","Aesthetic"],"ans":0},{"id":"K2-06","q":"Who writes the design brief?","opts":["The client","The design engineer","The machine operator","The quality inspector"],"ans":0},{"id":"K2-07","q":"Who turns the brief into the product design specification?","opts":["Design engineers, agreed with the client","The client alone","The sales team","The end user"],"ans":0},{"id":"K2-08","q":"Which statement belongs in the product design specification?","opts":["Mass not greater than 2.5 kg","Easy to carry","Light and folds up","Comfortable to sit on"],"ans":0},{"id":"K2-09","q":"'It must survive being left out in the rain' belongs in the...","opts":["Design brief","Product design specification","Test report","Evaluation"],"ans":0},{"id":"K2-10","q":"Measuring the human body is called...","opts":["Anthropometry","Ergonomics","Biometrics","Physiology"],"ans":0},{"id":"K2-11","q":"5th percentile female elbow height is 950 mm. Add female footwear. Total?","opts":["995 mm","975 mm","1000 mm","950 mm"],"ans":0},{"id":"K2-12","q":"Which influence on design is about how attractive a product looks?","opts":["Aesthetics","Performance","Obsolescence","Target market"],"ans":0},{"id":"K2-13","q":"A better performing material usually pulls against which influence?","opts":["Economics","Aesthetics","Fashion and trends","Niche market"],"ans":0},{"id":"K2-14","q":"What do poorly written user requirements usually cause?","opts":["Confusion, wasted time and money","Faster manufacture","Lower material costs","Better test results"],"ans":0},{"id":"K3-01","q":"How many steps are in the linear design process?","opts":["8","5","6","10"],"ans":0},{"id":"K3-02","q":"In the linear process, what comes straight after manufacturing?","opts":["Testing","Evaluation","Development","Ideas"],"ans":0},{"id":"K3-03","q":"What is the main weakness of linear design?","opts":["The first developed idea gets made","It has no client brief","It takes too long to prototype","It cannot use a specification"],"ans":0},{"id":"K3-04","q":"Iterative design adds which step before manufacture?","opts":["Make and test a prototype","Write a brief","Evaluate once at the end","Skip investigation"],"ans":0},{"id":"K3-05","q":"In iterative design, improvements feed back into which stage?","opts":["Investigation","Manufacturing","Client brief","Testing"],"ans":0},{"id":"K3-06","q":"User centred design is a form of...","opts":["Iterative design","Linear design","Design for assembly","Sustainable design"],"ans":0},{"id":"K3-07","q":"One product designed to be usable by as many people as possible is...","opts":["Inclusive design","Ergonomic design","Design for manufacture","Linear design"],"ans":0},{"id":"K3-08","q":"Design based on measured body dimensions is called...","opts":["Ergonomic design","Inclusive design","User centred design","Sustainable design"],"ans":0},{"id":"K3-09","q":"A doorway is a clearance problem. Which percentile do you design for?","opts":["95th","5th","50th","5th to 95th"],"ans":0},{"id":"K3-10","q":"A control button must be within reach. Which percentile do you design for?","opts":["5th","50th","95th","99th"],"ans":0},{"id":"K3-11","q":"Doorway: 1860 mm stature + 25 mm footwear + 50 mm head clearance = ?","opts":["1935 mm","1885 mm","1910 mm","1860 mm"],"ans":0},{"id":"K3-12","q":"Reducing a 24-part assembly to 2 parts is called...","opts":["Component elimination","Draft angle","Sintering","Tolerancing"],"ans":0},{"id":"K3-13","q":"Which of the 6Rs asks 'Is this product essential?'","opts":["Rethink","Reduce","Refuse","Reuse"],"ans":0},{"id":"K3-14","q":"Interviews and open questions give which kind of data?","opts":["Qualitative","Quantitative","Mixed methods","Statistical"],"ans":0},{"id":"K3-15","q":"Checking a product meets the standards so it can legally be sold is...","opts":["Compliance testing","Functional testing","User experience testing","Fatigue testing"],"ans":0},{"id":"K3-16","q":"What does a non-technical audience need?","opts":["Plain language, images, no jargon","Full tolerances and test data","Detailed schematics","Technical abbreviations"],"ans":0},{"id":"K3-17","q":"Loading a part thousands of times to see if it cracks is a test for...","opts":["Fatigue","Fastener stress","Compliance","Temperature"],"ans":0}],"exit":{"q1":"Name a manufacturing process and one design feature it forces onto a product.","q2":{"q":"Casting is one of the four categories of which manufacturing process?","opts":["Forming","Wasting","Shaping","Finishing"],"ans":2},"q2b":{"q":"Tick the other three categories of that process.","opts":["Sheet metal forming","Manipulative processes","Joining","Powder techniques","Anodising","Cutting and grinding"],"ans":[1,3,5]},"q3":{"q":"Which is a difference between linear and iterative design?","opts":["Linear design has no client brief","Iterative design makes and tests a prototype before manufacture","Linear design tests before it manufactures","Iterative design does not use a specification"],"ans":1},"q4":{"q":"A shelf must be reachable by nearly everyone. Which percentile do you design for?","opts":["95th percentile, the largest user","50th percentile, the average user","Adjustable, 5th to 95th","5th percentile, the smallest user"],"ans":3},"q4b":"Why? Give your reason in one sentence.","rag":["Name the seven manufacturing processes, and the four categories of shaping.","Explain, with an example, how a manufacturing process changes a design.","Define fitness for purpose and tell the brief apart from the specification.","Name the eight steps of the linear design process in order.","State the two differences between linear and iterative design.","Read a value from the anthropometric table and justify the percentile you chose.","Name the three research methodologies and the four testing methodologies.","State two things a non-technical audience needs that a technical audience does not."]},"checkin":{"p1":{"title":"Part 1 check-in: manufacturing processes","lines":["State the three stages of a manufacturing process.","Name the seven types of manufacturing process.","Name the three types of forming.","Name the four categories of shaping and say which one starts from a liquid.","State the difference between an expendable and a permanent mould.","Name the two categories of finishing and the five joint types.","Explain, with an example, how a process forces a feature onto a design."]},"p2":{"title":"Part 2 check-in: fitness for purpose","lines":["Define fitness for purpose in one sentence.","State the difference between an essential and a desirable requirement.","Give the two meanings of environmental requirements.","State who writes the design brief and who writes the specification.","Name two influences on design and explain how they pull against each other.","Read the 5th percentile female elbow height from the data card."]}},"fault":[{"id":"D01","q":"Tall staff keep hitting their heads on a new mezzanine doorway.","steps":[{"label":"Name the cause","correct":"The height was set from 50th percentile stature, not the 95th","wrongs":["Footwear was added to the stature value","The door was sized from 5th percentile reach","The doorway was made too wide"]},{"label":"Pick the fix","correct":"Use 95th percentile male stature, then add footwear and head clearance","wrongs":["Use 5th percentile female stature","Average the male and female 50th percentiles","Add a warning sign above the door"]}]},{"id":"D02","q":"Shorter staff cannot reach the top shelf in the new store room.","steps":[{"label":"Name the cause","correct":"The shelf was sized for an average user, not the smallest","wrongs":["Footwear was left out of the 95th percentile","The shelf depth was too shallow","The 95th percentile was used for clearance"]},{"label":"Pick the fix","correct":"Set the top shelf from 5th percentile female vertical reach, plus footwear","wrongs":["Set it from 95th percentile male vertical reach","Set it from 50th percentile stature","Fit a step and keep the same height"]}]},{"id":"D03","q":"A sand cast bracket tears the mould every time the pattern is lifted out.","steps":[{"label":"Name the cause","correct":"There is no draft angle on the vertical faces","wrongs":["The metal was poured too hot","The pattern was made from wood","There are too many holes in the part"]},{"label":"Pick the fix","correct":"Add a small taper, a draft angle, to every vertical face","wrongs":["Make the walls thicker","Switch the pattern to metal","Polish the finished casting"]}]},{"id":"D04","q":"Binder jetted parts come out of the sintering oven too small to fit.","steps":[{"label":"Name the cause","correct":"They were printed at final size, with no allowance for about 20% shrinkage","wrongs":["The binder was the wrong colour","They were sintered for too long","The powder bed was too deep"]},{"label":"Pick the fix","correct":"Print them larger: printed size = final size divided by 0.8","wrongs":["Print them 20% smaller","Add 20 mm to every dimension","Machine them up to size afterwards"]}]},{"id":"D05","q":"A product passed every lab test, but users cannot work out how to open the battery cover.","steps":[{"label":"Name the cause","correct":"Real users were never involved in testing the design","wrongs":["The materials were too weak","The specification had no size limits","The cover was made by casting"]},{"label":"Pick the fix","correct":"Take a user centred approach: test prototypes with real users and feed back","wrongs":["Test it again in the lab","Add a longer instruction booklet","Make the cover a brighter colour"]}]},{"id":"D06","q":"The product meets our specification, but the client says it is not what they asked for.","steps":[{"label":"Name the cause","correct":"The specification did not reflect the client brief","wrongs":["The product was tested too late","The wrong percentile was used","The product was too expensive to make"]},{"label":"Pick the fix","correct":"Agree the specification with the client and trace each requirement to the brief","wrongs":["Write a longer brief without the client","Add more desirable features","Skip the specification next time"]}]},{"id":"D07","q":"A hire company's drills keep coming back broken and cannot be fixed at a sensible cost.","steps":[{"label":"Name the cause","correct":"The casing is glued shut, so parts cannot be replaced","wrongs":["The drill is too light","The battery lasts too long","The styling is too plain"]},{"label":"Pick the fix","correct":"Use screws and standard parts so it can be repaired, which is repair from the 6Rs","wrongs":["Make it cheaper so it can be thrown away","Glue it with a stronger adhesive","Recycle every returned drill"]}]},{"id":"D08","q":"The spec says the case must be light. At review nobody can say whether the prototype passed.","steps":[{"label":"Name the cause","correct":"The requirement is not measurable","wrongs":["The prototype was too heavy","The client wrote the specification","The case was additive manufactured"]},{"label":"Pick the fix","correct":"Rewrite it with a value and a test: mass no more than 1.2 kg, checked on scales","wrongs":["Write that it must be very light","Remove the requirement","Ask users if it feels light"]}]},{"id":"D09","q":"A linear design went straight to manufacture. Final testing found a fault in all 5,000 units.","steps":[{"label":"Name the cause","correct":"Testing only happened after manufacture, with no prototype stage","wrongs":["Too many ideas were generated","The client brief was too short","The evaluation was too detailed"]},{"label":"Pick the fix","correct":"Use an iterative approach: prototype and test before manufacture","wrongs":["Test a larger batch after manufacture","Skip testing to save time","Change the manufacturing process only"]}]},{"id":"D10","q":"Powder coated brackets have bare patches exactly where they hung on the rack.","steps":[{"label":"Name the cause","correct":"The design gave nowhere to hang the part except a show face","wrongs":["The powder was too thick","The oven was too cool","The brackets were cast, not formed"]},{"label":"Pick the fix","correct":"Add a hanging hole in a hidden position so every face can be coated","wrongs":["Coat them twice","Polish the bare patches","Switch to anodising"]}]}],"parts":[{"id":"P01","draw":"cast","q":"Tapered walls, a line running round the middle and rounded inside corners.","correct":"Casting","wrongs":["Extrusion","Additive","Sheet metal forming"],"why":"The taper is a draft angle and the line is where the mould split. Both are marks of casting."},{"id":"P02","draw":"extrude","q":"The same cross section all the way along, with a flat cut end.","correct":"Extrusion","wrongs":["Casting","Milling","Powder bed fusion"],"why":"A constant profile is pushed through a die. That is extrusion, a bulk forming process."},{"id":"P03","draw":"sheet","q":"Even thickness everywhere, bent corners with a radius, punched holes.","correct":"Sheet metal forming","wrongs":["Casting","Turning","Additive"],"why":"Uniform thickness and bend radii come from bending sheet, which is forming."},{"id":"P04","draw":"weld","q":"Two plates meeting at a right angle, with a triangular bead along the joint.","correct":"Joining","wrongs":["Casting","Finishing","Forming"],"why":"The triangular bead is a fillet weld. Welding is a joining process."},{"id":"P05","draw":"turn","q":"A round shaft stepping down in diameter, with chamfered ends.","correct":"Wasting","wrongs":["Casting","Forming","Additive"],"why":"Steps and chamfers on a round part are cut on a lathe. Turning removes material, so it is wasting."},{"id":"P06","draw":"lattice","q":"An open lattice inside the part that no mould or cutter could reach.","correct":"Additive","wrongs":["Casting","Wasting","Forming"],"why":"Internal lattices are built layer by layer. Only additive manufacturing can make them."},{"id":"P07","draw":"cup","q":"A seamless cup with thin, even walls and a rounded base.","correct":"Forming","wrongs":["Casting","Joining","Wasting"],"why":"A flat blank pushed into a die makes a seamless cup. That is deep drawing, a forming process."},{"id":"P08","draw":"mill","q":"A flat plate with a pocket cut into it. The pocket has rounded inside corners.","correct":"Wasting","wrongs":["Casting","Forming","Additive"],"why":"The corner radius matches the cutter. Milling removes material, so it is wasting."}],"body":[{"id":"M01","fig":"stand","dim":"stature","correct":"Stature (height)","wrongs":["Eye height","Shoulder height","Vertical reach standing"],"why":"Floor to the top of the head. Used for door and headroom clearance."},{"id":"M02","fig":"stand","dim":"eye","correct":"Eye height","wrongs":["Stature (height)","Shoulder height","Elbow height"],"why":"Floor to the eye. Used to place displays and sight lines."},{"id":"M03","fig":"stand","dim":"shoulder","correct":"Shoulder height","wrongs":["Elbow height","Eye height","Stature (height)"],"why":"Floor to the top of the shoulder. Used for shelf and control heights."},{"id":"M04","fig":"stand","dim":"elbow","correct":"Elbow height","wrongs":["Shoulder height","Hand length","Popliteal height"],"why":"Floor to the underside of the elbow. Used to set worktop heights."},{"id":"M05","fig":"stand","dim":"reach","correct":"Vertical reach standing","wrongs":["Stature (height)","Shoulder height","Forward grip reach"],"why":"Floor to the fingertips of the raised arm. Used for top shelves and overhead controls."},{"id":"M06","fig":"side","dim":"grip","correct":"Forward grip reach","wrongs":["Hand length","Vertical reach standing","Shoulder breadth"],"why":"Back to the centre of the gripping hand. Used to place controls within reach."},{"id":"M07","fig":"sit","dim":"popliteal","correct":"Popliteal height","wrongs":["Sitting elbow height","Thigh thickness","Buttock to popliteal length"],"why":"Floor to the underside of the thigh behind the knee. Used to set seat height."},{"id":"M08","fig":"sit","dim":"selbow","correct":"Sitting elbow height","wrongs":["Popliteal height","Elbow height","Thigh thickness"],"why":"Seat to the underside of the elbow. Used to set armrest and desk heights."},{"id":"M09","fig":"sit","dim":"bpl","correct":"Buttock to popliteal length","wrongs":["Forward grip reach","Popliteal height","Hip breadth"],"why":"Back of the buttocks to the back of the knee. Used to set seat depth."}],"words":[{"id":"W01","q":"Fitness for purpose","correct":"It meets the requirements it was designed for, judged against the specification","wrongs":["It works well and looks good","It is the best product on the market"],"why":"Fitness for purpose is judged against stated requirements, not taste."},{"id":"W02","q":"A good specification point","correct":"Maximum mass 1.2 kg, checked on scales","wrongs":["The product should be light","The product must be as light as possible"],"why":"A specification point needs a value and a way to test it."},{"id":"W03","q":"The 95th percentile","correct":"95% of the population is at or below this value","wrongs":["The size of the biggest person","The average of the tallest people"],"why":"A percentile is a proportion of the population, not one person."},{"id":"W04","q":"Iterative design","correct":"A prototype is made, tested and evaluated, and the results feed into the next version","wrongs":["The design is started again from scratch each time","The design is done faster by skipping stages"],"why":"The feedback loop through a tested prototype is the point."},{"id":"W05","q":"Wasting","correct":"Material is removed to create the shape","wrongs":["Material is wasted during manufacture","The part is made from scrap material"],"why":"Wasting names the method: cutting material away."},{"id":"W06","q":"Forming","correct":"The shape changes without adding or removing material, so the mass stays the same","wrongs":["The material is formed into a shape","Heat is used to shape the part"],"why":"Say what happens to the material and the mass."},{"id":"W07","q":"Draft angle","correct":"A slight taper on vertical faces so the part or pattern releases from the mould","wrongs":["An angle drawn on the design","The angle of the cutting tool"],"why":"Name what the taper is for: release from the mould."},{"id":"W08","q":"User centred design","correct":"Users are involved at every stage, from requirements to evaluation","wrongs":["The product is designed to look nice for users","The designer imagines what users want"],"why":"Involvement of real users at each stage is the defining feature."},{"id":"W09","q":"Anthropometric data","correct":"Measurements of the human body, used to size a product","wrongs":["The study of how people feel about products","Data about how many people buy a product"],"why":"Anthropometric means body measurement."},{"id":"W10","q":"Destructive testing","correct":"The sample is tested until it fails, so it cannot be used again","wrongs":["Testing that damages the product by accident","Testing that is not very careful"],"why":"The sample is deliberately taken to failure."},{"id":"W11","q":"The design brief","correct":"A short statement of the problem and the client's needs, written with the client","wrongs":["A detailed list of measurable targets","The drawings used for manufacture"],"why":"The brief states the need; the specification makes it measurable."}],"command":[{"id":"C01","q":"Give the meaning of a term, precisely.","correct":"Define","wrongs":["Describe","Explain","State"],"why":"Define asks for the meaning, nothing more."},{"id":"C02","q":"Give a short answer with no reasoning. For example, name two joining processes.","correct":"State","wrongs":["Explain","Evaluate","Discuss"],"why":"State or identify: a short fact is enough."},{"id":"C03","q":"Say what something is like or what happens, in detail, without giving reasons.","correct":"Describe","wrongs":["Explain","Justify","Define"],"why":"Describe is the what. Explain adds the why."},{"id":"C04","q":"Give reasons, linking a cause to its effect. Words like because and so that do the work.","correct":"Explain","wrongs":["Describe","State","Identify"],"why":"Explain needs the because."},{"id":"C05","q":"Weigh up strengths and weaknesses, then reach a judgement.","correct":"Evaluate","wrongs":["Describe","Compare","State"],"why":"Evaluate must end with a judgement."},{"id":"C06","q":"Give reasons that support a choice or decision you have made.","correct":"Justify","wrongs":["Describe","Define","Identify"],"why":"Justify defends a choice with evidence."},{"id":"C07","q":"Say what is the same and what is different about two things.","correct":"Compare","wrongs":["Describe","Explain","Justify"],"why":"Compare needs both similarities and differences."},{"id":"C08","q":"Work out a value and show the method.","correct":"Calculate","wrongs":["Estimate","State","Describe"],"why":"Calculate: formula, substitution, answer with a unit."},{"id":"C09","q":"Put forward a sensible idea or solution based on what you know.","correct":"Suggest","wrongs":["Define","State","Calculate"],"why":"Suggest invites a reasoned idea, not a fact from memory."},{"id":"C10","q":"Evaluate the use of iterative design for a new drill. How must your answer end?","correct":"With a judgement, supported by reasons","wrongs":["With a list of the design stages","With a definition of iterative design"],"why":"An evaluate question is only complete with a supported judgement."}]};

function applyPrefs(){

  if (S.prefs.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.prefs.theme);
  r.style.setProperty("--scale", S.prefs.scale);
  if (S.prefs.motion==="reduce") r.setAttribute("data-motion","reduce"); else r.removeAttribute("data-motion");
}

/* ---------- transport: Microsoft Forms (main route), Google Apps Script (optional), or this phone only ---------- */
var Net = {
  mode: function(){
    if (window.google && google.script && google.script.run) return "gas";
    if (HUB_CONFIG.endpoint) return "remote";
    if (FORM_PREFILL) return "forms";
    return "local";
  },
  call: function(action, payload){
    var m = this.mode();
    return new Promise(function(resolve, reject){
      if (m === "gas") {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload || {});
      } else if (m === "remote") {
        var ctrl = ("AbortController" in window) ? new AbortController() : null;
        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
        fetch(HUB_CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify(Object.assign({action:action}, payload||{})), signal: ctrl ? ctrl.signal : undefined})
          .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(timer); resolve(j); })
          .catch(function(e){ clearTimeout(timer); reject(e); });
      } else reject(new Error("no_server"));
    });
  }
};
/* Only used by the Google route: results queue on the phone until they send. */
var Sync = {
  q: Store.get("queue", []), busy:false,
  add: function(ev){ this.q.push(ev); Store.set("queue", this.q); this.flush(); },
  flush: function(){
    var self = this, m = Net.mode();
    if (self.busy || !self.q.length || (m!=="gas" && m!=="remote")) return;
    if (navigator.onLine === false) return;
    self.busy = true;
    var batch = self.q.slice(0, 25);
    Net.call("log", {events: batch}).then(function(res){
      if (res && res.ok) {
        var sent = {}; batch.forEach(function(e){ sent[e.id]=1; });
        self.q = self.q.filter(function(e){ return !sent[e.id]; }); Store.set("queue", self.q); S.server.state = "ok";
      } else if (res && res.error === "unknown_code") {
        var bad = S.me ? S.me.code : ""; self.q = self.q.filter(function(e){ return e.code !== bad; }); Store.set("queue", self.q);
        toast("Your code was not recognised. Please sign in again."); signOut(true);
      } else { S.server.state = "error"; }
    }).catch(function(){ S.server.state = "offline"; }).then(function(){
      self.busy = false; updateSyncLine();
      if (self.q.length && S.server.state==="ok") setTimeout(function(){ self.flush(); }, 400);
    });
  }
};
window.addEventListener("online", function(){ Sync.flush(); });
setInterval(function(){ Sync.flush(); }, 30000);
function logEvent(type, game, data){
  data = data || {};
  var m = Net.mode(); if (m!=="gas" && m!=="remote") return null;
  var ev = { id: uid(), t: new Date().toISOString(), code: S.me ? S.me.code : "", name: "", dev: S.device, type: type, game: game ? sentName(game) : "",
    score: data.score == null ? "" : data.score, max: data.max == null ? "" : data.max, secs: data.secs == null ? "" : data.secs,
    items: data.items || [], extra: data.extra ? JSON.stringify(data.extra) : "", v: VERSION };
  Sync.add(ev); return ev;
}
function syncText(){
  var m = Net.mode();
  if (m==="forms") return "Your results reach your tutor when you press Send my result.";
  if (m==="local") return "Your tutor has not linked this hub to a form yet. Copy your result instead.";
  if (Sync.q.length) return Sync.q.length + " result" + (Sync.q.length>1?"s":"") + " waiting to send. They go as soon as you are online.";
  return "All results sent to your tutor.";
}
function updateSyncLine(){ $$("[data-sync]").forEach(function(el){ el.textContent = syncText(); }); }

/* ---------- verification code: short, and it changes if the code, game or score is edited ----------
   The tracker works out the same number in Excel, so an edited score shows up there.   */
/* The game name the tracker sees: unit prefix, a space, then the title, e.g. 1.1 Family Finder.
   Every unit hub sends to the same form, so the prefix keeps the units apart.            */
function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : "1.1 " + title; }
function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;
  for (var k=0;k<s.length;k++) h += s.charCodeAt(k)*(k+1)*7;
  h += 11*Number(score) + 13*Number(max);
  return String(h % 9973).padStart(4,"0");
}
function formsLink(game, score, max, detail){
  var u = FORM_PREFILL;
  function rep(tok, val){ u = u.split(tok).join(encodeURIComponent(val)); }
  rep("LEARNERHERE", S.me ? S.me.code : "");
  rep("GAMEHERE", sentName(game)); rep("SCOREHERE", String(score)); rep("MAXHERE", String(max));
  rep("CHECKHERE", checkCode(S.me ? S.me.code : "", game, score, max));
  rep("DETAILHERE", String(detail||"").slice(0, 900));
  return u;
}
function resultLine(game, score, max, when){
  var code = S.me ? S.me.code : "";
  return code + " | " + sentName(game) + " | " + score + " of " + max + " | check " + checkCode(code, game, score, max) + " | " + niceDate(when);
}
function copyText(text, done){
  function fallback(){
    var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select(); var ok=false; try { ok = document.execCommand("copy"); } catch(e) {} t.remove(); done(ok);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback); else fallback();
}

  opts = opts || {};

    if (inGame && !confirm("Leave this game? This round will not be saved.")) return;

/* ---------- sign in ---------- */
function signIn(msg){
  var list = CLASS.length > 0;
  screen(fullHeader() + '<div class="wrap stack">' +
    '<div class="card stack"><h2 style="margin:0">Sign in</h2>' +
    (list ? '<p class="muted" style="margin:0">Tap your name.</p><div class="names">' + CLASS.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.name)+'</button>'; }).join("") + '</div><p class="muted small" style="margin:6px 0 0">Name not there? Type your code instead.</p>' : '') +
    '<label for="code"><b>Your hub code</b><br><span class="small muted">Four letters and numbers, on the slip from your tutor.</span></label>' +
    '<input id="code" class="textin codebox" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="err">' +
    '<button class="btn amber block" id="go">Start</button>' +
    '<p id="err" class="small" role="alert" style="color:var(--red);margin:0">' + esc(msg||"") + '</p></div>' +
    '<div class="panel amber"><h3>Nothing here is marked</h3><p>These games are for practice. Your scores stay on this phone until you choose to send them to your tutor.</p></div>' +
    '<p class="foot">Your tutor sees your code, your scores, what you write in the exit ticket and when you played, so they know what to go over again. Nothing else is collected.</p></div>', {out:true});
  var inp = $("#code"), go = $("#go");
  inp.addEventListener("input", function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go.click(); });
  function finish(code, name){
    S.me = {code:code, name:name || code}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} loadProg(); logEvent("open","hub"); home();
  }
  function tryCode(code, name){
    if (!/^[A-Z0-9]{4}$/.test(code)) { $("#err").textContent = "Your code has four letters and numbers."; return; }
    var m = Net.mode();
    if (m === "gas" || m === "remote") {
      go.disabled = true; go.textContent = "Checking";
      Net.call("hello", {code:code}).then(function(r){
        if (r && r.ok) finish(code, name || r.first);
        else { go.disabled=false; go.textContent="Start"; $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; }
      }).catch(function(){ go.disabled=false; go.textContent="Start"; $("#err").textContent = "Cannot reach the hub right now. Check your wifi or data and try again."; });
      return;
    }
    if (CLASS.length && !name) {
      var hit = CLASS.filter(function(c){ return c.code === code; })[0];
      if (!hit) { $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; return; }
      name = hit.name;
    }
    finish(code, name);
  }
  go.onclick = function(){ tryCode(inp.value.trim()); };
  $$(".names button").forEach(function(b){ b.onclick = function(){ var c = CLASS[+b.dataset.i]; tryCode(c.code, c.name); }; });
  if (!list) setTimeout(function(){ try { inp.focus(); } catch(e){} }, 60);
}
function signOut(silent){
  if (!silent && !confirm("Sign out on this phone? Your record stays here for next time.")) return;
  S.me = null; Store.del("me"); try { localStorage.removeItem("tlhub.me"); } catch(e) {} loadProg(); signIn();
}

/* ---------- home ---------- */
async function loadServer(){
  var m = Net.mode(); if (m !== "gas" && m !== "remote") return;
  try {
    var r = await Net.call("stats", {});

  } catch(e) { S.server.state = "offline"; }
}
function home(){
  if (!S.me) return signIn();

  var checked = Object.keys(p.stamps).length, played = Object.keys(p.plays).reduce(function(a,k){ return a + p.plays[k]; }, 0);

  }
  var order = GAMES.slice().sort(function(a,b){ return (focus.indexOf(b.key)>=0) - (focus.indexOf(a.key)>=0); });
  var cls = (S.server.week != null && S.server.target) ?
    '<div class="card"><div class="row" style="justify-content:space-between;align-items:baseline"><b style="color:var(--head)">Class total this week</b><span class="muted small">'+S.server.week+' of '+S.server.target+'</span></div>' +
    '<div class="meter"><i style="width:'+Math.min(100, Math.round(100*S.server.week/S.server.target))+'%"></i></div><p class="small muted" style="margin:8px 0 0">Every game anyone in the group finishes counts towards this.</p></div>' : '';
  function row(act, ic, title, sub, pill){
    return '<button class="rowbtn" data-go="'+act+'"><span class="ic">'+icon(ic)+'</span><span class="tx"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+(pill||'<span aria-hidden="true" class="muted">'+icon("chev")+'</span>')+'</button>';
  }
