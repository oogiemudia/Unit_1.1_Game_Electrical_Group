  return '<div class="microw" id="mr-'+id+'"><button class="btn ghost small mic" type="button" data-mic="'+id+'">'+icon("mic")+'<span>Say it</span></button>' +
    '<button class="link" type="button" data-edit="'+id+'">Edit</button></div>' +
    '<p class="small muted micnote" id="mn-'+id+'">'+(S.prefs.micSeen ? 'Tap Say it, speak, then check the words before you press Check.' :
      'Tap Say it when you are ready, then speak. The hub does not record, keep or send your voice: your browser turns it into words, and only the words appear in the box.')+'</p>';
}
function micUnavailable(id, msg){ var row = $("#mr-"+id), note = $("#mn-"+id); if (row) row.remove(); if (note) note.textContent = msg || "Speaking is not available on this device. Type your answer instead."; }
function stopListening(){ if (Speech.live) { var r = Speech.live; Speech.live = null; try { r.abort(); } catch(e){} } }
function hideMic(id){ var row = $("#mr-"+id), note = $("#mn-"+id); if (row) row.style.display = "none"; if (note) note.style.display = "none"; }
function wireMics(onFirst){
  $$("[data-mic]").forEach(function(b){ b.onclick = function(){ if (onFirst) onFirst(); listen(b, $("#"+b.dataset.mic)); }; });
  $$("[data-edit]").forEach(function(b){ b.onclick = function(){ var t = $("#"+b.dataset.edit); if (t) { t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch(e){} } }; });
}
function listen(btn, box){
  if (!box || box.disabled) return;
  if (Speech.live) { var was = Speech.live; try { was.stop(); } catch(e){} return; }
  var rec; try { rec = new SR(); } catch(e) { micUnavailable(btn.dataset.mic); return; }
  rec.lang = "en-GB"; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  var base = box.value.trim() ? box.value.replace(/\s+$/, "") + " " : "", fin = "";
  Speech.live = rec; if (!S.prefs.micSeen) { S.prefs.micSeen = true; Store.set("prefs", S.prefs); }
  var lbl = $("span", btn); btn.classList.add("on"); if (lbl) lbl.textContent = "Listening. Tap to stop";
  rec.onresult = function(e){ var interim = ""; for (var i = e.resultIndex; i < e.results.length; i++){ var t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else interim += t; }
    box.value = base + fin + interim; };
  rec.onerror = function(e){ var er = e.error;
    if (er === "not-allowed" || er === "service-not-allowed") { Speech.denied = true; micUnavailable(btn.dataset.mic); }
    else if (er === "audio-capture") micUnavailable(btn.dataset.mic, "No microphone was found. Type your answer instead.");
    else if (er === "network") micUnavailable(btn.dataset.mic, "Speaking needs an internet connection on this phone. Type your answer instead.");
    else if (er === "no-speech") toast("I did not catch that. Tap Say it again, or type it.");
  };
  rec.onend = function(){ if (Speech.live === rec) Speech.live = null; btn.classList.remove("on");
    if (lbl) lbl.textContent = box.value.trim() ? "Say it again" : "Say it";
    if (fin.trim()) { box.dataset.spoken = "1"; say("Heard: " + box.value); } };
  try { rec.start(); } catch(e) { Speech.live = null; micUnavailable(btn.dataset.mic); }
}

/* ---------- one engine for every retrieval game: typed, spoken, explain, and picked at cue level 1 ----------
   opts: conf (Sure or Not? before marking), master (a miss returns two questions later), hideTags (Last lesson),
         label, finishKey                                                                                  */
function runRetrieval(key, items, opts){
  opts = opts || {};
  var idsSeen = {}; items = items.map(function(it, k){ if (idsSeen[it.id]) it = Object.assign({}, it, {id: it.id + "~" + k}); idsSeen[it.id] = 1; return it; });
  var queue = items.slice(), total = items.length, score = 0, log = [], review = [], started = Date.now(), seen = {}, answered = 0, added = 0;
  var conf = {sr:0, sw:0, gr:0, gw:0}, cnt = {typed:0, spoken:0, self:0};
  function show(){
    var it = queue[0], again = !!seen[it.id], n = answered + queue.length, isMcq = it.k === "mcq";
    var tags = (it.a && !opts.hideTags ? '<span class="tag sl">Lesson slide '+it.a+'</span>' : '') + (it.levelName ? '<span class="tag">'+esc(it.levelName)+'</span>' : '');
    screen(gameHeader(TITLE[key], answered, n) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+(again ? "Back again" : (opts.label || "Question")+' '+(Object.keys(seen).length+1))+'</div>' +
      (tags ? '<div class="tags">'+tags+'</div>' : '') +
      (it.lead ? '<p class="qprompt" style="margin:4px 0 0">'+esc(it.lead)+'</p>' : '') +
      '<p class="qtext">'+esc(it.q)+'</p>' + (it.art ? '<div class="qart">'+it.art+'</div>' : '') +
      (it.cue ? cueHtml(it.cue) : '') +
      (isMcq ? '<div class="opts">'+optButtons(it.options)+'</div>' : answerBox(it.k, placeholderFor(it)) + '<button class="link" id="idk">I do not know yet</button>') +
      '<div id="confbox"></div><div id="fb" role="status"></div></div><div class="dock" id="dock">' +
      (isMcq ? '' : '<button class="btn amber block" id="chk">Check</button>') + '</div></div>', {game:true});
    if (isMcq) {
      $$(".opt").forEach(function(b){ b.onclick = function(){ var k = +b.dataset.k;
        if (!opts.conf) return pickMcq(it, k, null);
        $$(".opt").forEach(function(x){ x.classList.toggle("picked", x === b); });
        askConf(function(c){ pickMcq(it, k, c); }); }; });
      return;
    }
    var inp = $("#ans"); wireMics();
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter" && it.k !== "explain") { e.preventDefault(); var b = $("#chk") || $("#next"); if (b) b.click(); } });
    $("#idk").onclick = function(){ commit(it, true, null); };
    $("#chk").onclick = function(){
      if (!norm(inp.value)) { var f = $("#fb"); f.className = "fb info"; f.innerHTML = "<strong>Type or say your answer first.</strong>Not sure? Tap I do not know yet and the answer will show."; return; }
      if (opts.conf) { stopListening(); inp.disabled = true; hideMic("ans"); $("#chk").disabled = true; askConf(function(c){ commit(it, false, c); }); }
      else commit(it, false, null);
    };
    setTimeout(function(){ try { inp.focus({preventScroll:true}); } catch(e) {} }, 60);
  }
  function askConf(done){
    $("#confbox").innerHTML = '<p class="qprompt" style="margin:14px 0 8px"><b style="color:var(--head)">How sure are you?</b></p>' +
      '<div class="rag conf"><button class="g" data-c="sure">Sure</button><button class="a" data-c="think">Think so</button><button class="r" data-c="guess">Guessing</button></div>';
    $$("[data-c]").forEach(function(c){ c.onclick = function(){ $$("[data-c]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === c)); }); done(c.dataset.c); }; });
    try { $("#confbox").scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
  }
  function pickMcq(it, k, c){
    var ok = markOpts(it.correct, k), chosenFb = (!ok && it.wf) ? it.wf[it.options[k]] : "";
    record(it, ok, c, false, false);
    var fb = $("#fb"); fb.className = "fb" + (ok ? "" : " bad");
    fb.innerHTML = '<strong>'+(ok ? pick(["Right.","Yes, that is it.","Correct."]) : "Not this time.")+'</strong>' + (ok ? "" : "The answer is: "+esc(answerText(it))+". ") +
      (chosenFb ? '<span class="whyno"><b>About your answer:</b> '+esc(chosenFb)+'</span>' : '') + esc(it.why||"") + anchorNote(it);
    nextBtn(ok);
  }
  function anchorNote(it){ return it.a ? '<span class="small muted" style="display:block;margin-top:6px">From lesson slide '+it.a+'.</span>' : ''; }
  function commit(it, idk, c){
    stopListening(); var inp = $("#ans"), spoken = inp.dataset.spoken === "1"; inp.disabled = true; hideMic("ans");
    var b0 = $("#chk"); if (b0) b0.remove(); var ik = $("#idk"); if (ik) ik.remove();
    var fb = $("#fb");
    if (it.k === "explain") {
      if (idk || !norm(inp.value)) { record(it, false, c, spoken, false);
        fb.className = "fb bad"; fb.innerHTML = '<strong>Here is what a full answer says.</strong>' + ideasHtml(it, it.ideas.map(function(){ return false; })) + anchorNote(it); return nextBtn(false); }
      var found = ideasFound(inp.value, it.ideas), nf = found.filter(Boolean).length, sug = nf >= (it.need || it.ideas.length) ? "got" : (nf ? "part" : "miss");
      fb.className = "fb info"; fb.innerHTML = '<strong>You mentioned '+nf+' of the '+it.ideas.length+' key ideas the hub looks for.</strong>' + ideasHtml(it, found) + anchorNote(it) + selfMarkHtml(sug, true);
      $$("[data-sm]").forEach(function(b){ b.onclick = function(){ var ok = b.dataset.sm === "got"; $$("[data-sm]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === b)); });
        record(it, ok, c, spoken, true); fb.className = "fb" + (ok ? "" : " bad"); nextBtn(ok); }; });
      try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
      return;
    }
    var r = idk ? {res:"blank"} : markAny(it, inp.value);
    if (r.res === "check") {
      fb.className = "fb info"; fb.innerHTML = '<strong>Check it yourself.</strong>The hub cannot be sure about that wording. The answer is: <b>'+esc(answerText(it))+'</b>. '+esc(it.why||"") + anchorNote(it) + selfMarkHtml("", false);
      $$("[data-sm]").forEach(function(b){ b.onclick = function(){ var ok = b.dataset.sm === "got"; $$("[data-sm]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === b)); });
        record(it, ok, c, spoken, true); fb.className = "fb" + (ok ? "" : " bad"); nextBtn(ok); }; });
      return;
    }
    var ok = r.res === "right" || r.res === "near" || r.res === "nounit" || r.res === "noratio", right = answerText(it), extra = "";
    if (r.res === "near") extra = "Nearly: check your spelling. It is " + cap1(r.fix) + ". ";
    if (r.res === "nounit") extra = "Add the unit next time: " + right + ". ";
    if (r.res === "noratio") extra = "Write it as a ratio next time: " + right + ". ";
    if (r.res === "unit") extra = r.none ? "Right number, but this one has no units. " : "You have the right number but the wrong unit. ";
    if (r.res === "upside") extra = "That is upside down. Gear ratio = teeth on the driven gear ÷ teeth on the driver gear. ";
    if (r.rival) extra = "That is a different key word. ";
    if (r.res === "blank") extra = idk ? "No problem. Knowing what you do not know yet is useful. " : "";
    record(it, ok, c, spoken, false);
    fb.className = "fb" + (ok ? "" : " bad");
    fb.innerHTML = '<strong>'+(ok ? (r.res === "right" ? pick(["Right.","Yes, that is it.","Correct."]) : "Counted as right.") : "Not this time.")+'</strong>' +
      (ok ? "" : "The answer is: <b>"+esc(right)+"</b>. ") + esc(extra) + esc(it.why||"") + anchorNote(it);
    nextBtn(ok);
  }
  function record(it, ok, c, spoken, self){
    var first = !seen[it.id]; seen[it.id] = (seen[it.id]||0) + 1; answered++;
    if (first) {
      if (ok) { score++; if (self) cnt.self++; else if (spoken) cnt.spoken++; else cnt.typed++; }
      else review.push({q:it.q, right:answerText(it), why:it.k === "explain" ? it.model : it.why});
      log.push({i:it.id, ok:ok?1:0, l:String(it.label || it.q).slice(0, 90)});
      if (c) { var sure = c === "sure"; conf[(sure ? "s" : "g") + (ok ? "r" : "w")]++; }
      if (it.rid && srsMark(it.rid, ok, !!it.a)) added++;
      if (it.ladder) { var L = it.lvl || (it.k === "mcq" ? 1 : 3); S.prog.lvl[it.id] = ok ? Math.min(L + 1, 3) : Math.max(L - 1, 1); }
    }
    queue.shift();
    if (opts.master && !ok && seen[it.id] < 3) {
      var back = it.kw ? termItem(it.kw, Math.max((it.lvl||2) - 1, 1)) : it;
      queue.splice(Math.min(2, queue.length), 0, Object.assign({}, back, {id:it.id, kw:it.kw}));
    }
  }
  function nextBtn(ok){
    var last = queue.length === 0;
    $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(last ? "See my score" : (opts.master && !ok ? "Next (this one will come back)" : "Next"))+'</button>';
    $("#next").onclick = function(){
      if (!last) return show();
      saveProg();
      var det = "Typed right " + cnt.typed + ", spoken right " + cnt.spoken + ", self-marked " + cnt.self;
      finishGame(key, score, total, log, started, review, {conf:opts.conf ? conf : null, added:added, det:det});
    };
    say(ok ? "Right." : "Not this time.");
    try { $("#fb").scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
  }
  show();
}

/* ---------- Sort It: tap a card, tap its group, then check the whole sort ---------- */
function runSort(key, sets){
  var i = 0, score = 0, max = 0, log = [], review = [], started = Date.now();
  sets.forEach(function(s){ max += s.cards.length; });
  function show(){
    var it = sets[i], order = shuffle(it.cards.map(function(_, k){ return k; })), place = {}, sel = null, checked = false;
    function draw(keep){
      var pool = order.filter(function(k){ return place[k] == null; });
      screen(gameHeader(TITLE[key], i, sets.length) + '<div class="wrap"><div class="card">' +
        '<div class="qno">Set '+(i+1)+' of '+sets.length+'</div>' + tagSlide(it.a) + '<p class="qtext">'+esc(it.title)+'</p>' +
        (checked ? '' : '<p class="qprompt">Tap a card, then tap the group it belongs in. Tap a placed card to send it back.</p>') +
        '<div class="pool">' + (pool.length ? pool.map(function(k){ return '<button class="chip2'+(sel === k ? ' sel' : '')+'" data-card="'+k+'" aria-pressed="'+(sel === k)+'">'+esc(it.cards[k][0])+'</button>'; }).join("") : (checked ? '' : '<span class="small muted">All placed. Check your sort.</span>')) + '</div>' +
        '<div class="bins'+(it.grid ? ' grid2' : '')+'">' + it.bins.map(function(b, bi){
          var inb = order.filter(function(k){ return place[k] === bi; });
          return '<div class="bin"><button class="binhead" data-b="'+bi+'"'+(checked ? ' disabled' : '')+' aria-label="Group: '+esc(b)+(sel != null ? '. Put the card here' : '')+'">'+esc(b)+'</button>' +
            inb.map(function(k){ var ok = fits(it.cards[k], b);
              return '<button class="placed'+(checked ? (ok ? ' ok' : ' no') : '')+'" data-p="'+k+'"'+(checked ? ' disabled' : '')+'>'+esc(it.cards[k][0]) +
                (checked && !ok ? '<span class="small" style="display:block">Belongs in: '+esc(groupsOf(it.cards[k]))+'</span>' : '')+'</button>'; }).join("") + '</div>'; }).join("") + '</div>' +
        '<div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true, keep:!!keep});
      $$("[data-card]").forEach(function(b){ b.onclick = function(){ var k = +b.dataset.card; sel = sel === k ? null : k; draw(true); var x = $('[data-card="'+k+'"]'); if (x) x.focus({preventScroll:true}); }; });
      $$("[data-b]").forEach(function(b){ b.onclick = function(){ if (sel == null) { toast("Tap a card first, then its group."); return; } place[sel] = +b.dataset.b; sel = null; draw(true); }; });
      $$("[data-p]").forEach(function(b){ b.onclick = function(){ place[+b.dataset.p] = null; draw(true); }; });
      var full = order.every(function(k){ return place[k] != null; });
      if (checked) {
        var got = order.filter(function(k){ return fits(it.cards[k], it.bins[place[k]]); }).length, fb = $("#fb");
        fb.className = "fb" + (got === order.length ? "" : " bad");
        fb.innerHTML = '<strong>'+got+' of '+order.length+' in the right group.</strong>' + esc(it.why || "") +
          (it.tricky ? Object.keys(it.tricky).map(function(c){ return '<span class="whyno">'+esc(it.tricky[c])+'</span>'; }).join("") : '');
        var last = i === sets.length - 1;
        $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(last ? "See my score" : "Next set")+'</button>';
        $("#next").onclick = function(){ if (last) finishGame(key, score, max, log, started, review); else { i++; show(); } };
        try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
      } else {
        $("#dock").innerHTML = '<button class="btn amber block" id="chk" '+(full ? "" : "disabled")+'>'+(full ? "Check my sort" : "Place every card first")+'</button>';
        $("#chk").onclick = function(){
          checked = true;
          order.forEach(function(k){ var ok = fits(it.cards[k], it.bins[place[k]]); if (ok) score++; else review.push({q:it.title + ": " + it.cards[k][0], right:groupsOf(it.cards[k]), why:""});
            log.push({i:it.id+"-"+k, ok:ok?1:0, l:(it.cards[k][0] + ": " + groupsOf(it.cards[k])).slice(0, 90)}); });
          draw(true);
        };
      }
    }
    draw(false);
  }
  show();
}
/* a card can belong in more than one group (a gear train changes speed and direction) */

function groupsOf(card){ return Array.isArray(card[1]) ? card[1].join(" or ") : card[1]; }

      $$(".chip2").forEach(function(b){ b.onclick = function(){ if (checked) return; var free = -1; for (var k=0;k<n;k++){ if (placed[k] == null) { free = k; break; } }

    hint:"Steps per turn = 360° ÷ step angle.", work:["Steps per turn = 360° ÷ step angle.", "360 ÷ "+a+" = "+sig(n, 4)+" steps."]}; }

  do { a = pick(ANG); ang = pick([30,45,60,90,120,180,270]); } while (Math.abs(ang/a - Math.round(ang/a)) > 1e-9 && g++ < 60);
  return {id:"P2", a:64, q:"How many pulses turn a "+a+"° stepper motor through "+ang+"°?", art:stepperArt(a, a+"°"), v:ang/a, unit:"pulses",
    hint:"Pulses = angle ÷ step angle. One pulse, one step.", work:["One pulse moves one step of "+a+"°.", "Pulses = "+ang+" ÷ "+a+" = "+sig(ang/a, 4)+" pulses."]}; }

    hint:"Find the steps per turn, then turns per second, then multiply by 60.", work:["Steps per turn = 360 ÷ "+a+" = "+sig(n, 4)+".", "Turns per second = "+pps+" ÷ "+sig(n, 4)+" = "+sig(rpm/60, 4)+" rev/s.", "Speed = "+sig(rpm/60, 4)+" × 60 = "+rpm+" rpm."]}; }

  do { a = pick([1.8,3.6,7.5,15]); n = 360/a; rpm = pick([30,60,90,120,150,180,240]); pps = rpm*n/60; } while (pps % 1 && g++ < 60);

  return {id:"P5", a:64, q:"A "+a+"° stepper turns a lead screw that moves "+p+" mm per turn. How far does it move for one step?", art:stepperArt(a, a+"°"), v:mm, unit:"mm", tol:0.01,
    hint:"Distance per step = distance per turn ÷ steps per turn.", work:["Steps per turn = 360 ÷ "+a+" = "+sig(n, 4)+".", "Distance per step = "+p+" ÷ "+sig(n, 4)+" = "+sig(mm, 3)+" mm."]}; }
function sServoA(){ var p = pick([1.1,1.2,1.25,1.4,1.6,1.75,1.8,1.9]), ang = Math.round((p - 1)*180*10)/10;

/* ---------- Calculation Ladder: nine rungs, fading support ---------- */
function rung(kind){
  var r = {}, p, d, n, k, s, o, g = 0;
  if (kind === "ratio") { p = gearPair(); d = p[0]; n = p[1]; k = n/d;
    r = {lvl:"Low", a:13, q:"A "+d+"-tooth driver gear drives a "+n+"-tooth gear. What is the gear ratio?", ratio:true, v:k, hint:"Driven ÷ driver, written as a ratio.",
      work:["Gear ratio = teeth on driven ÷ teeth on driver.", n+" ÷ "+d+" = "+sig(k, 3)+", so "+fmtRatio(k)+"."]}; }
  else if (kind === "speed") { p = gearPair(); d = p[0]; n = p[1]; k = n/d; s = niceSpeed(k); o = s/k;
    r = {lvl:"Low", a:14, q:"A "+d+"-tooth driver at "+s+" rpm drives a "+n+"-tooth gear. What is the output speed?", v:o, unit:"rpm", hint:"Ratio first (driven ÷ driver), then output = input ÷ ratio.",
      work:["Ratio = "+n+" ÷ "+d+" = "+fmtRatio(k)+".", "Output speed = "+s+" ÷ "+sig(k, 3)+" = "+fRpm(o)+"."]}; }
  else if (kind === "teeth") { d = pick([10,12,15,20,24]); k = pick([2,3,4,5,6]);
    do { s = pick([600,900,1200,1500,1800,2400,3000]); } while ((s/k) % 1 && g++ < 60); o = s/k;
    r = {lvl:"Low", a:17, q:"A motor turns a "+d+"-tooth driver at "+s+" rpm. The output must turn at "+o+" rpm. How many teeth does the driven gear need?", v:d*k, unit:"teeth",
      hint:"Ratio needed = input speed ÷ output speed. Driven teeth = driver teeth × ratio.", work:["Ratio needed = "+s+" ÷ "+o+" = "+k+":1.", "Driven teeth = "+d+" × "+k+" = "+(d*k)+" teeth."]}; }
  else if (kind === "compound") { var A = pick([10,12,15,20]), m1 = pick([2,3,4]), C = pick([10,12,15]), m2 = pick([2,3,4]), tot = m1*m2;
    do { s = pick([1200,1800,2400,3000,3600,4800]); } while (Math.abs((s/tot)*10 - Math.round((s/tot)*10)) > 1e-6 && g++ < 60);
    r = {lvl:"Moderate", a:16, q:"Gear A ("+A+" teeth) drives B ("+(A*m1)+" teeth). C ("+C+" teeth) is on B's shaft and drives D ("+(C*m2)+" teeth). A turns at "+s+" rpm. How fast does D turn?", v:s/tot, unit:"rpm",
      hint:"Find each stage ratio, multiply them, then divide the input speed by the total.", work:["Stage 1 = "+(A*m1)+" ÷ "+A+" = "+m1+":1. Stage 2 = "+(C*m2)+" ÷ "+C+" = "+m2+":1.", "Total = "+m1+" × "+m2+" = "+tot+":1.", "D = "+s+" ÷ "+tot+" = "+fRpm(s/tot)+"."]}; }
  else if (kind === "lever") { var L = pick([300,400,500,600,800,900,1200]), dl = pick([0.2,0.25,0.3,0.4,0.5]), de = pick([1,1.2,1.5,2]), E = L*dl/de;
    r = {lvl:"Moderate", a:27, q:"A wheelbarrow carries a "+L+" N load "+dl+" m from the wheel. The handles are "+de+" m from the wheel. What effort lifts it?", v:Math.round(E*100)/100, unit:"N", tol:0.01,
      hint:"Moments balance about the fulcrum: effort × effort distance = load × load distance.", work:["Load moment = "+L+" × "+dl+" = "+sig(L*dl, 4)+" N m.", "Effort = "+sig(L*dl, 4)+" ÷ "+de+" = "+sig(E, 4)+" N."]}; }
  else if (kind === "ma") { var Ld = pick([600,800,900,1000,1200,1500]), Ef = pick([200,250,300,400,500]), MA = Ld/Ef;
    r = {lvl:"Moderate", a:30, q:"A pulley system lifts a "+Ld+" N load with an effort of "+Ef+" N. What is its mechanical advantage?", v:Math.round(MA*100)/100, unit:"", tol:0.01,
      hint:"MA = load ÷ effort. It has no units.", work:["MA = load ÷ effort.", Ld+" ÷ "+Ef+" = "+sig(MA, 3)+" (no units)."]}; }
  else if (kind === "eff") { var vr = pick([2,3,4,5,6]), lo = pick([400,600,800,900,1200]), ef, ma, e2;
    do { e2 = pick([0.7,0.75,0.8,0.85,0.9]); ma = vr*e2; ef = lo/ma; } while (Math.abs(ef*10 - Math.round(ef*10)) > 1e-6 && g++ < 80);
    r = {lvl:"Advanced", a:30, q:"A block and tackle has "+vr+" rope sections holding a "+lo+" N load. The effort needed is "+sig(ef, 4)+" N. What is its efficiency?", v:Math.round(e2*1000)/10, unit:"%", tol:0.01,
      hint:"MA = load ÷ effort. VR = the number of supporting ropes. Efficiency = MA ÷ VR × 100%.", work:["MA = "+lo+" ÷ "+sig(ef, 4)+" = "+sig(ma, 3)+".", "VR = "+vr+" (rope sections holding the load).", "Efficiency = "+sig(ma, 3)+" ÷ "+vr+" × 100% = "+sig(e2*100, 3)+"%."]}; }
  else if (kind === "steprpm") { var it = sRpm(); r = {lvl:"Advanced", a:64, q:it.q, v:it.v, unit:"rpm", hint:it.hint, work:it.work}; }
  else if (kind === "ma420") { var m = aMa(false); r = {lvl:"Advanced", a:96, q:m.q, v:m.v, unit:m.unit, hint:m.hint, work:m.work}; }
  r.kind = kind; return r;
}
var RUNGS = ["ratio","speed","teeth","compound","lever","ma","eff","steprpm","ma420"];
function runLadder(){
  var rungs = RUNGS.map(function(k, idx){ var r = rung(k); r.id = "L"+(idx+1); r.ex = rung(k); var g = 0; while (r.ex.q === r.q && g++ < 10) r.ex = rung(k); return r; });
  runCalc("ladder", rungs, {fade:true});
}

    if (!S.me || S.me.code !== qc) {
      var hit = CLASS.filter(function(c){ return c.code === qc; })[0];
      S.me = {code:qc, name: hit ? hit.name : qc}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} logEvent("open","hub");
    }
  }
  if (S.me) { loadProg(); home(); loadServer().then(function(){ if (!inGame && S.tab === "games" && S.me) home(); }); Sync.flush(); }
  else { loadServer().then(function(){ signIn(); }); signIn(); }
})();

</script>
