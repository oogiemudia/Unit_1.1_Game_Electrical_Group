<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="9.1 and 10.2 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Components, sensors and actuators games</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}


/* activating hard thinking layer (from the criterion 8.1 (continued) and 10.1 reference hub) */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.badges:empty{display:none}
.badge{margin-bottom:0}
.badge.next{background:var(--green);color:#fff}
.step{align-self:flex-start;background:var(--tint);color:var(--head);font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.part{margin-top:6px}
.part .sec{align-items:center}
.part .sec h2{font-size:1.05em}
details.goals{margin:-4px 2px 10px}
details.goals summary{cursor:pointer;color:var(--head);font-weight:700;font-size:.88em;min-height:44px;display:flex;align-items:center}
details.goals ul{margin:0 0 4px;padding-left:1.2em;font-size:.9em}
.modebox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.goal .btn.small{flex:1 1 120px}
.pill.red{background:var(--badbg);color:var(--red)}
.opt.picked{border-color:var(--amber);background:var(--ambbg)}
.rag.conf button{min-height:50px}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.whyno{display:block;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--red)}
.nextstep{margin-top:12px;border-left:5px solid var(--green)}
.calgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calgrid div{background:var(--tint);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.calgrid div.warn{background:var(--badbg)}
.calgrid b{font-size:1.5em;color:var(--head);line-height:1.1}
.calgrid div.warn b{color:var(--red)}
.calgrid span{font-size:.84em;color:var(--muted)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:56px;padding:8px 10px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left;line-height:1.3;font-size:.92em}
.pb.r{font-weight:400;color:var(--ink);border-color:var(--line)}
.pb.sel{border-color:var(--amber);background:var(--ambbg)}
.pb.ok{border-color:var(--green);background:var(--goodbg);color:var(--green);cursor:default}
.pb.no{border-color:var(--red);background:var(--badbg)}
.ftable td{text-align:left}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}
/* retrieval layer and the criterion 9.1 and 10.2 games */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.tag{font-size:.72em;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--head);border:1px solid var(--line);line-height:1.5}
.tag.sl{background:var(--ambbg);border-color:transparent;color:var(--amb)}
.tile .tags{margin:4px 0 0}
.flabel{font-size:.8em;color:var(--muted);font-weight:700;margin:10px 2px 4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.filters button{min-height:44px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--head);font-weight:700;font-size:.84em}
.filters button[aria-pressed="true"]{border-color:var(--head);background:var(--tint)}
.microw{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mic.on{background:var(--ambbg);border-color:var(--amber);color:var(--head)}
.micnote{margin:6px 0 0}
.cue{font-size:1.15em;font-weight:700;color:var(--amb);margin:2px 0 10px;line-height:1.7}
.cue .cw{display:inline-block;white-space:nowrap;margin-right:.8em}
.ideas{margin:8px 0 0;padding:0;list-style:none}
.ideas li{display:flex;gap:8px;align-items:flex-start;margin:6px 0;line-height:1.35}
.ideas li b{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85em;color:#fff;margin-top:1px}
.ideas li b svg.i{width:16px;height:16px;stroke-width:3}
.ideas li.y b{background:var(--green)} .ideas li.n b{background:var(--amb)}
.model{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.selfmark{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.selfmark.two{grid-template-columns:1fr 1fr}
.selfmark button{min-height:54px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.92em;color:var(--head);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.selfmark button .small{font-weight:400;color:var(--muted);font-size:.75em}
.selfmark button.sug{border-style:dashed;border-color:var(--amber)}
.selfmark button[aria-pressed="true"].got{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.selfmark button[aria-pressed="true"].part{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.selfmark button[aria-pressed="true"].miss{background:var(--badbg);border-color:var(--red);color:var(--red)}
.bins{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
@media (min-width:560px){.bins{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.bins.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,8em),1fr))}
.bin{border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:80px;min-width:0}
.binhead{overflow-wrap:break-word;min-height:46px;border:0;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;text-align:left;padding:6px 10px;line-height:1.25}
.binhead:not(:disabled):hover{outline:2px solid var(--amber)}
.placed{min-height:44px;border-radius:8px;border:2px solid var(--head);background:var(--card);color:var(--ink);text-align:left;padding:6px 10px;font-size:.9em;line-height:1.3;overflow-wrap:anywhere}
.placed.ok{border-color:var(--green);background:var(--goodbg)} .placed.no{border-color:var(--red);background:var(--badbg)}
.chip2{overflow-wrap:anywhere}
.chip2.sel{border-color:var(--amber);background:var(--ambbg)}
.timer{display:inline-block;margin:2px 0 10px;padding:4px 12px;border-radius:999px;background:var(--tint);color:var(--head);font-size:.9em}
.timer b{font-size:1.15em}
.timer.up{background:var(--ambbg);color:var(--amb)}
.ban{display:inline-block;margin:2px 2px;padding:1px 8px;border-radius:6px;background:var(--badbg);color:var(--red)}
.fambtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fambtns .btn{min-height:50px}
.fambtns .btn.rightans{border-color:var(--green);background:var(--goodbg);color:var(--green);opacity:1}
.fambtns .btn.wrongans{border-color:var(--red);background:var(--badbg);color:var(--red);opacity:1}
.flip[disabled]{cursor:default}
.flip[disabled] .face.front{border-style:dashed}
.scard span{font-size:1em}

</style>

var CONTENT = {"parts":[{"id":"p0","title":"Warm up","sub":"Wake up what you need from criterion 8.1 and earlier units.","goals":["Recall the electrical ideas, signals and science today's devices depend on","Answer last lesson's questions from memory","Write down everything you can remember about a part"],"games":["recall","last","dump"]},{"id":"p1","title":"Part 1: Mechatronics and mechanical components","sub":"Criterion 9.1. Core Paper 1. Week 15.","goals":["Explain what mechatronics is","Describe what gears, cams, linkages, levers and pulleys do","Calculate gear ratios, output speeds and mechanical advantage"],"games":["gears","mechsort"]},{"id":"p2","title":"Part 2: Electrical and electronic components","sub":"Criterion 9.1. Core Paper 1. Week 16.","goals":["Describe sensors, transducers and actuators","Compare microprocessors and microcontrollers","Name every device in a mechatronic system and its family"],"games":["nameparts","swipe"]},{"id":"p3","title":"Part 3: Drive devices","sub":"Criterion 9.1. Core Paper 1. Week 17.","goals":["Explain how standard, servo and stepper motors are controlled","Choose the right motor for a job and justify it","Work out steps, pulses and speeds"],"games":["motor","stepper"]},{"id":"p4","title":"Part 4: Types and applications of sensors and actuators","sub":"Criterion 10.2. Core Paper 2. Week 18.","goals":["Classify sensors as analogue or digital, active or passive","Choose switches, proximity, laser and vision sensors for a job","Choose a power source and a hard-wired or wireless connection"],"games":["sensorsort","whichsensor"]},{"id":"p5","title":"Part 5: Sensors and actuators in automation","sub":"Criterion 10.2. Core Paper 2. Week 19.","goals":["Explain position and volume, lifting and moving, and measurement in automation","Read an analogue sensor, including a 4 to 20 mA signal","Name what senses and what acts at each station"],"games":["analogue","line"]},{"id":"mix","title":"Pull it together","sub":"Every part mixed. These make you think hardest.","goals":["Explain why, not just what","Answer from memory in the words that earn the marks"],"games":["ladder","term","taboo","why","errors","examiner","boss"]}],"goals":[{"t":"Explain what mechatronics is and how the parts of a system work together","games":["nameparts","line","taboo"]},{"t":"Describe what gears, cams, linkages, levers and pulleys do","games":["mechsort","why","errors"]},{"t":"Calculate gear ratios, output speeds and mechanical advantage","games":["gears","ladder","errors"]},{"t":"Describe sensors, transducers and actuators, with examples","games":["swipe","nameparts","term"]},{"t":"Compare microprocessors and microcontrollers, and say what a PIC is","games":["nameparts","why","term"]},{"t":"Explain how standard, servo and stepper motors work, and choose one for a job","games":["motor","stepper","why"]},{"t":"Classify sensors and actuators and choose one for an application","games":["sensorsort","whichsensor","examiner"]},{"t":"Explain how sensors and actuators automate a process, including analogue readings","games":["line","analogue","boss"]}],"recall":[{"id":"R01","q":"A current flows through a coil of wire. What does it create?","opts":["A magnetic field","A voltage across the coil only","Heat and nothing else","A static charge"],"why":"Current in a coil makes a magnetic field. Motors and solenoids both depend on it (criterion 8.1, week 3).","fb":{"A static charge":"Static charge is charge that stays put. A current is charge moving, and moving charge makes a magnetic field."},"t":{"k":"short","acc":["magnetic field","a magnetic field","magnetism","an electromagnet","electromagnetic field","magnetic"]}},{"id":"R02","q":"The current through a coil is increased. What happens to its magnetic field?","opts":["It gets stronger","It gets weaker","It reverses","It stays the same"],"why":"More current, stronger field. More turns or an iron core also make it stronger.","fb":{"It reverses":"Reversing the current reverses the field. Increasing it makes it stronger."}},{"id":"R03","q":"12 V is across a 240 Ω resistor. What current flows?","opts":["0.05 A","20 A","2880 A","0.5 A"],"why":"I = V ÷ R = 12 ÷ 240 = 0.05 A (Ohm's law, criterion 8.1, week 4).","fb":{"20 A":"That is R ÷ V, upside down. I = V ÷ R.","2880 A":"You multiplied. I = V ÷ R."},"t":{"k":"num","v":0.05,"unit":"A","tol":0.01}},{"id":"R04","q":"A 24 V DC motor draws 1.5 A. What is its electrical input power?","opts":["36 W","16 W","25.5 W","0.0625 W"],"why":"P = V × I = 24 × 1.5 = 36 W (criterion 8.1, week 2).","fb":{"16 W":"That is V ÷ I. Power is V × I.","25.5 W":"You added. Power is V × I."},"t":{"k":"num","v":36,"unit":"W","tol":0.01}},{"id":"R05","q":"A potential divider has R1 = 10 kΩ and R2 = 10 kΩ across 5 V. What is Vout across R2?","opts":["2.5 V","5 V","10 V","0.5 V"],"why":"Vout = Vin × R2 ÷ (R1 + R2) = 5 × 10 ÷ 20 = 2.5 V. Equal resistors split the supply equally (week 7).","fb":{"5 V":"That is the whole supply. The two resistors share it."}},{"id":"R06","q":"An LDR is R1 in a potential divider. It gets darker, so the LDR's resistance rises. What happens to Vout across R2?","opts":["It falls","It rises","It stays the same","It becomes the supply voltage"],"why":"R1 takes a bigger share of the supply, so less is left across R2. That is how an LDR tells a controller it is dark.","fb":{"It rises":"The voltage across the LDR rises. Vout is across the other resistor, so it falls."}},{"id":"R07","q":"Which describes an analogue signal?","opts":["It varies continuously over a range","It has only two levels, high and low","It is always a square wave","It only exists in computers"],"why":"Analogue varies continuously. Digital has set levels, usually 1 and 0 (week 13).","fb":{"It has only two levels, high and low":"That is a digital signal."},"t":{"k":"short","acc":["varies continuously","continuously variable","continuous","it varies continuously","any value in a range","continuously varying"]}},{"id":"R08","q":"Which describes a digital signal?","opts":["It has set levels, usually high (1) or low (0)","It varies smoothly over a range","It is always a sine wave","It cannot be sent along a wire"],"why":"Digital has only set levels. A limit switch gives a digital signal: on or off.","fb":{"It varies smoothly over a range":"That is analogue."}},{"id":"R09","q":"A microcontroller pin cannot supply enough current for a motor. What is used as a switch between them?","opts":["A transistor","A diode","A capacitor","A fuse"],"why":"A transistor switches the bigger motor current when the small control signal turns it on (week 12). Motor driver chips are built from transistors.","fb":{"A diode":"A diode lets current through one way only. It does not switch on and off from a control signal.","A fuse":"A fuse protects a circuit. It does not switch a motor."},"t":{"k":"short","acc":["transistor","a transistor","mosfet","motor driver","relay"]}},{"id":"R10","q":"A raw thermocouple signal is tiny and noisy. What does signal conditioning do to it?","opts":["Amplifies it and filters out the noise","Turns it into heat","Makes it smaller still","Changes it into a sound"],"why":"Conditioning amplifies the small signal and filters noise so the controller can read it (week 14).","fb":{"Makes it smaller still":"The signal is already too small. It needs amplifying."}},{"id":"R11","q":"What is a moment?","opts":["The turning effect of a force: force × perpendicular distance from the pivot","Force ÷ distance","Mass × acceleration","A very short time"],"why":"Moment = force × perpendicular distance from the pivot, in N m. Levers depend on it.","fb":{"Force ÷ distance":"Moments multiply force and distance."}},{"id":"R12","q":"What is the useful energy change in an electric motor?","opts":["Electrical to kinetic (rotational)","Kinetic to electrical","Electrical to light","Chemical to electrical"],"why":"A motor turns electrical energy into movement. A generator does the opposite, when its shaft is driven.","fb":{"Kinetic to electrical":"That is a generator."},"t":{"k":"short","acc":["electrical to kinetic","electrical to kinetic energy","electrical energy to kinetic energy","electrical to movement","electrical to mechanical","electrical to rotational"]}},{"id":"R13","q":"What does a block diagram show?","opts":["The main parts of a system as boxes, joined by arrows showing the signal flow","Every wire and component value","The exact sizes of a part","Only the power supply"],"why":"Block diagrams leave out detail and show how the parts connect (criterion 3.1, week 13). Input, process, output is a block diagram.","fb":{"Every wire and component value":"That is a circuit diagram."}},{"id":"R14","q":"Which emerging trend from criterion 2.3 depends most on sensors and actuators?","opts":["Autonomous vehicles","Cloud storage pricing","Distributed energy tariffs","The circular economy"],"why":"Autonomous vehicles sense the road (cameras, laser, ultrasonic) and act on it (motors, brakes, steering).","fb":{"The circular economy":"That is about how products are made and reused, not about sensing and acting."}},{"id":"R15","q":"An NTC thermistor gets hotter. What happens to its resistance?","opts":["It falls","It rises","It stays the same","It becomes zero"],"why":"NTC means negative temperature coefficient: hotter, lower resistance.","fb":{"It rises":"That is a PTC thermistor. NTC falls as it gets hotter."},"t":{"k":"short","acc":["falls","it falls","goes down","decreases","it decreases","drops","reduces","lower"]}},{"id":"R16","q":"A diode is forward biased. What does it do?","opts":["Conducts, letting current through","Blocks all current","Stores charge","Amplifies the signal"],"why":"Forward biased, a diode conducts; reverse biased, it blocks (criterion 8.1, week 11).","fb":{"Blocks all current":"That is reverse bias."}}],"keywords":[{"id":"K101","term":"Mechatronics","acc":["mechatronics","mechatronic","mechatronic system","mechatronics system"],"part":1,"slide":7,"def":"The integration of mechanical and electronic systems to produce a functioning system."},{"id":"K102","term":"Gear train","acc":["gear train","geartrain","gear trains","gear system","gearbox"],"part":1,"slide":12,"def":"Two or more gears linked together to transmit drive."},{"id":"K103","term":"Gear ratio","acc":["gear ratio","ratio","velocity ratio"],"part":1,"slide":13,"def":"Teeth on the driven gear ÷ teeth on the driver gear, written as a ratio such as 3:1."},{"id":"K104","term":"Driver gear","acc":["driver","driver gear","driving gear","input gear"],"part":1,"slide":12,"def":"The gear turned by the motor. It turns the driven gear."},{"id":"K105","term":"Driven gear","acc":["driven","driven gear","output gear"],"part":1,"slide":12,"def":"The gear that is turned by the driver. It gives the output."},{"id":"K106","term":"Idler gear","acc":["idler","idler gear","idle gear","idler wheel"],"part":1,"slide":15,"def":"A gear between driver and driven that changes the direction of rotation but not the ratio."},{"id":"K107","term":"Compound gear train","acc":["compound gear train","compound train","compound gears","compound gear","compound gearing"],"part":1,"slide":16,"def":"A train with two gears fixed on the same shaft, so the ratio is made in stages and the stage ratios multiply."},{"id":"K108","term":"Torque","acc":["torque","turning force","turning effect"],"part":1,"slide":12,"def":"How hard a shaft twists. A gear train that slows the output increases it."},{"id":"K109","term":"Cam","acc":["cam","cam mechanism","cam and follower"],"part":1,"slide":19,"def":"A shaped part that turns rotary motion into reciprocating or linear motion of a follower."},{"id":"K110","term":"Follower","acc":["follower","cam follower"],"part":1,"slide":19,"def":"The part that rests on a cam and moves up and down as the cam turns."},{"id":"K111","term":"Lift","acc":["lift","the lift","rise","stroke"],"part":1,"slide":19,"def":"The distance a cam follower travels from its lowest to its highest point."},{"id":"K112","term":"Dwell","acc":["dwell","dwelling","rest period"],"part":1,"slide":20,"def":"Part of a cam's turn when the follower stays still, as with a pear cam."},{"id":"K113","term":"Linkage","acc":["linkage","linkages","link","links"],"part":1,"slide":23,"def":"Links joined by pivots that change the type or direction of motion, or the size of a force."},{"id":"K114","term":"Bell crank","acc":["bell crank","bellcrank","bell crank lever"],"part":1,"slide":24,"def":"A linkage that changes the direction of motion through 90°, as in bike brakes."},{"id":"K115","term":"Crank and slider","acc":["crank and slider","slider crank","crank slider","slider and crank","crank and slider mechanism"],"part":1,"slide":24,"def":"A linkage that turns rotary motion into reciprocating motion, or back again, as in an engine piston."},{"id":"K116","term":"Reverse motion linkage","acc":["reverse motion linkage","reverse motion","reverse linkage","reverse motion lever"],"part":1,"slide":24,"def":"A linkage where the input and output move in opposite directions: it turns a push into a pull."},{"id":"K117","term":"Fulcrum","acc":["fulcrum","pivot"],"part":1,"slide":25,"def":"The pivot a lever turns about."},{"id":"K118","term":"Mechanical advantage","acc":["mechanical advantage","ma"],"part":1,"slide":25,"def":"Load ÷ effort. A ratio of two forces, so it has no units."},{"id":"K119","term":"Velocity ratio","acc":["velocity ratio","vr","movement ratio","distance ratio"],"part":1,"slide":30,"def":"Distance moved by the effort ÷ distance moved by the load. For pulleys it equals the number of supporting rope sections."},{"id":"K120","term":"Reciprocating motion","acc":["reciprocating","reciprocating motion","reciprocation"],"part":1,"slide":11,"def":"Back and forth in a straight line, like a piston."},{"id":"K121","term":"Oscillating motion","acc":["oscillating","oscillating motion","oscillation","oscillate"],"part":1,"slide":11,"def":"Swinging back and forth along an arc, like a pendulum."},{"id":"K201","term":"Sensor","acc":["sensor","sensors","input sensor"],"part":2,"slide":40,"def":"Detects a change in the environment and turns it into an electrical signal. An input device."},{"id":"K202","term":"Transducer","acc":["transducer","transducers"],"part":2,"slide":42,"def":"Converts one form of energy into another. Can be an input or an output device."},{"id":"K203","term":"Actuator","acc":["actuator","actuators"],"part":2,"slide":44,"def":"Converts an electrical, electronic or mechanical signal into physical movement."},{"id":"K204","term":"Solenoid","acc":["solenoid","solenoids","solenoid actuator"],"part":2,"slide":44,"def":"An actuator: a coil that pulls an iron plunger in when current flows, giving a push or pull."},{"id":"K205","term":"Microprocessor","acc":["microprocessor","cpu","central processing unit","processor"],"part":2,"slide":48,"def":"Used in computers: one chip that does the processing, with its memory and inputs and outputs on separate chips."},{"id":"K206","term":"Microcontroller","acc":["microcontroller","micro controller","mcu"],"part":2,"slide":49,"def":"A small computer on one chip that responds to inputs and controls outputs."},{"id":"K207","term":"PIC","acc":["pic","peripheral interface controller","pic microcontroller","pic chip"],"part":2,"slide":51,"def":"A popular family of in-circuit programmable microcontrollers, made in sizes from 8 to 40 pins."},{"id":"K208","term":"Analogue to digital converter","acc":["analogue to digital converter","analog to digital converter","adc","a to d converter","a d converter"],"part":2,"slide":49,"def":"Turns an analogue sensor signal into numbers a chip can process."},{"id":"K209","term":"Light dependent resistor","acc":["ldr","light dependent resistor","photoresistor","light sensor"],"part":2,"slide":40,"def":"A sensor whose resistance falls as the light gets brighter."},{"id":"K210","term":"Thermistor","acc":["thermistor","ntc thermistor"],"part":2,"slide":40,"def":"A sensor whose resistance changes with temperature. The NTC type's resistance falls as it gets hotter."},{"id":"K211","term":"In-circuit programmable","acc":["in circuit programmable","in circuit programming","icsp","in circuit"],"part":2,"slide":51,"def":"Can be reprogrammed without taking the chip out of the circuit."},{"id":"K212","term":"Integrated circuit","acc":["integrated circuit","ic","chip","microchip"],"part":2,"slide":47,"def":"A whole circuit made on a single piece of silicon. Microprocessors and microcontrollers are made this way."},{"id":"K301","term":"Drive device","acc":["drive device","drive devices","drive"],"part":3,"slide":59,"def":"Turns an electrical or electronic signal into a mechanical signal in the form of movement."},{"id":"K302","term":"Standard motor","acc":["standard motor","dc motor","standard dc motor","standard electric motor"],"part":3,"slide":60,"def":"Gives continuous rotation. Speed is set by voltage and direction by the direction of the current."},{"id":"K303","term":"Servo motor","acc":["servo","servo motor","servomotor","servos"],"part":3,"slide":61,"def":"Turns to a precise angle set by the width of a control pulse, and holds it using a position sensor."},{"id":"K304","term":"Stepper motor","acc":["stepper","stepper motor","stepping motor","steppers"],"part":3,"slide":63,"def":"Turns in equal steps, one step for each pulse from the controller."},{"id":"K305","term":"Step angle","acc":["step angle","angle per step"],"part":3,"slide":64,"def":"The angle a stepper shaft turns for one pulse. 360° ÷ this angle = steps per turn."},{"id":"K306","term":"Closed loop","acc":["closed loop","closed loop control","closed loop system","feedback control"],"part":3,"slide":61,"def":"The output is measured and fed back, so the system can correct itself. A servo works this way."},{"id":"K307","term":"Open loop","acc":["open loop","open loop control","open loop system"],"part":3,"slide":63,"def":"No feedback: the controller assumes the output did what it was told. A stepper counts pulses this way."},{"id":"K308","term":"Pulse width","acc":["pulse width","width of the pulse","pulse length","length of the pulse","pulse duration"],"part":3,"slide":61,"def":"How long each control pulse lasts. It sets the angle a servo turns to."},{"id":"K309","term":"Motor driver","acc":["motor driver","driver circuit","motor driver circuit","driver","motor controller"],"part":3,"slide":63,"def":"The circuit between a controller and a motor that switches the bigger motor current."},{"id":"K401","term":"Analogue sensor","acc":["analogue sensor","analog sensor","analogue"],"part":4,"slide":74,"def":"Gives a continuous output that follows the quantity measured."},{"id":"K402","term":"Digital sensor","acc":["digital sensor","digital"],"part":4,"slide":74,"def":"Gives only discrete outputs: high (1) or low (0)."},{"id":"K403","term":"Active sensor","acc":["active sensor","active"],"part":4,"slide":75,"def":"Sends a signal into the environment and measures what comes back."},{"id":"K404","term":"Passive sensor","acc":["passive sensor","passive"],"part":4,"slide":75,"def":"Only monitors changes around it; it sends nothing out."},{"id":"K405","term":"Active actuator","acc":["active actuator","active"],"part":4,"slide":76,"def":"Introduces new energy or needs an external energy supply to move."},{"id":"K406","term":"Passive actuator","acc":["passive actuator","passive"],"part":4,"slide":76,"def":"Needs no external supply, such as a bimetallic strip or a wax element."},{"id":"K407","term":"Limit switch","acc":["limit switch","limit switches","end stop","end of travel switch"],"part":4,"slide":78,"def":"Detects the end of travel of a moving part."},{"id":"K408","term":"Guard interlock switch","acc":["guard interlock","interlock","interlock switch","guard interlock switch","guard switch"],"part":4,"slide":78,"def":"Stops a machine when its guard is opened."},{"id":"K409","term":"Inductive proximity sensor","acc":["inductive proximity sensor","inductive sensor","inductive","inductive proximity"],"part":4,"slide":79,"def":"Detects metal objects without contact, using a magnetic field. Short range."},{"id":"K410","term":"Capacitive proximity sensor","acc":["capacitive proximity sensor","capacitive sensor","capacitive","capacitive proximity"],"part":4,"slide":79,"def":"Senses any material that changes its electric field, even through a tank wall."},{"id":"K411","term":"Photoelectric sensor","acc":["photoelectric sensor","photoelectric","beam sensor","light beam sensor","through beam sensor"],"part":4,"slide":79,"def":"A light beam is broken or reflected by the object. Long range, used for counting."},{"id":"K412","term":"Ultrasonic sensor","acc":["ultrasonic sensor","ultrasonic","ultrasound sensor"],"part":4,"slide":79,"def":"Sends sound pulses and times the echo to measure distance. Works on clear objects."},{"id":"K413","term":"Vision system","acc":["vision system","machine vision","camera system","vision"],"part":4,"slide":83,"def":"A camera, lighting and software that inspect items against a standard."},{"id":"K414","term":"Hard-wired","acc":["hard wired","hardwired","wired","cabled"],"part":4,"slide":86,"def":"Connected by wires and cables rather than by radio."},{"id":"K415","term":"Loop powered","acc":["loop powered","loop power","loop powered sensor"],"part":4,"slide":85,"def":"A sensor powered through the same two wires that carry its 4 to 20 mA signal."},{"id":"K501","term":"Automation","acc":["automation","automated","automating"],"part":5,"slide":92,"def":"Using technology to reduce the need for human involvement in a process."},{"id":"K502","term":"Volume of objects","acc":["volume of objects","volume","counting","count"],"part":5,"slide":93,"def":"How many objects pass, for example counted by a beam sensor."},{"id":"K503","term":"Mechanised lifting","acc":["mechanised lifting","mechanized lifting","mechanical lifting","mechanised lifting and moving"],"part":5,"slide":94,"def":"Motors or cylinders, with gears or pulleys, lifting and moving loads."},{"id":"K504","term":"Load cell","acc":["load cell","loadcell","force sensor","strain gauge"],"part":5,"slide":95,"def":"A sensor that measures force or weight: a mechanical measurement."},{"id":"K505","term":"Live zero","acc":["live zero","live 0"],"part":5,"slide":101,"def":"The 4 mA at the bottom of a 4 to 20 mA signal, so a broken wire (0 mA) shows up."},{"id":"K506","term":"Reject station","acc":["reject station","reject","rejection station"],"part":5,"slide":97,"def":"Where a faulty item is removed, usually by a pneumatic pusher."},{"id":"K507","term":"Programmable logic controller","acc":["plc","programmable logic controller","programmable controller"],"part":5,"slide":97,"def":"An industrial controller that reads every sensor and drives every actuator on a line (criterion 9.2 next)."},{"id":"K508","term":"Thermocouple","acc":["thermocouple","thermo couple"],"part":5,"slide":95,"def":"A temperature sensor used in furnaces: a thermal measurement."}],"formulas":[["Gear ratio","teeth on driven gear ÷ teeth on driver gear (write as a ratio, e.g. 3:1)"],["Output speed","input speed ÷ gear ratio"],["Compound gear train","total ratio = ratio of stage 1 × ratio of stage 2 × ..."],["Idler gear","changes direction only; does not change the ratio"],["Moments (levers)","effort × effort distance = load × load distance (about the fulcrum)"],["Mechanical advantage","MA = load ÷ effort (no units)"],["Velocity ratio (pulleys)","VR = distance moved by effort ÷ distance moved by load = number of supporting rope sections"],["Efficiency","MA ÷ VR × 100%"],["Stepper motor","steps per turn = 360° ÷ step angle; pulses = angle ÷ step angle"],["Stepper speed","rev/s = pulses per second ÷ steps per turn; rpm = rev/s × 60"],["Servo (0° at 1 ms, 180° at 2 ms)","angle = (pulse − 1 ms) ÷ 1 ms × 180°"],["Analogue scaling","value = (reading − lowest signal) ÷ signal span × range"],["4 to 20 mA","subtract the 4 mA live zero first; the span is 16  and wireless connections."]},"p5":{"title":"Part 5 check-in: sensors and actuators in automation","lines":["Define automation and give the reasons companies automate.","Explain how a line counts objects and knows a part is in position.","Explain how a mechanised lift knows when to stop.","Name the eight kinds of automated measurement.","Read an analogue sensor, including a 4 to 20 mA signal with a live zero.","Name what senses and what acts at each station of an automated line."]}},"exit":{"q1":{"q":"Using an example, explain how a sensor, a microcontroller and an actuator work together in a mechatronic system.","ideas":[["The sensor detects a change (input)",["sensor","detect","input","sense"]],["The microcontroller decides what to do (process)",["microcontroller","decide","process","controller","program"]],["The actuator makes the movement (output)",["actuator","motor","solenoid","move","output"]],["A real example",["door","washing","robot","lock","printer","lift","conveyor","brake","cnc","camera","fan","heating","car"]]],"model":"In an automatic door, a motion sensor detects a person (input). The microcontroller reads the signal and decides to open the door (process). It switches on the motor (actuator), which drives the door open through gears and a belt (output).","need":3},"q2":{"q":"A 12-tooth driver at 1000 rpm drives a 48-tooth gear. What is the output speed?","opts":["4000 rpm","250 rpm","48 rpm","1000 rpm"],"ans":1},"q2b":{"q":"Tick the three active sensors.","opts":["Ultrasonic distance sensor","Laser distance sensor","Inductive proximity sensor","LDR","PIR motion sensor","NTC thermistor"],"ans":[0,1,2]},"q3":{"q":"Which drive device uses a feedback sensor to hold its position?","opts":["Standard motor","Stepper motor","Servo motor","Solar motor"],"ans":2},"q4":{"id":"XQ4","k":"num","q":"A 0 to 10 V sensor covers 0 to 100 °C. It reads 6.5 V. What is the temperature? Type the number and the unit.","v":65,"unit":"°C","tol":0.01,"p":5,"a":96,"why":"6.5 ÷ 10 = 0.65 of the range, and 0.65 × 100 = 65 °C."},"q5":{"id":"XQ5","k":"term","q":"Type the name of the part that turns rotary motion into reciprocating motion of a follower.","acc":["cam","a cam","cam and follower","cam mechanism"],"p":1,"a":19,"why":"A cam.","rivals":["follower","linkage","crank","lever","gear"]}},"sortMech":[{"id":"S1","title":"What kind of motion is it?","a":11,"bins":["Rotary","Linear","Reciprocating","Oscillating"],"cards":[["A wheel turning","Rotary"],["A motor shaft","Rotary"],["A conveyor belt carrying a box","Linear"],["A lift going up","Linear"],["A piston in an engine","Reciprocating"],["A sewing machine needle","Reciprocating"],["A pendulum","Oscillating"],["A windscreen wiper blade","Oscillating"]],"why":"Rotary goes round in a circle. Linear goes one way in a straight line. Reciprocating goes back and forth in a straight line. Oscillating swings back and forth along an arc."},{"id":"S2","title":"What does each mechanism change?","a":31,"bins":["Type of motion","Direction","Size of force or speed"],"cards":[["Cam and follower","Type of motion"],["Crank and slider","Type of motion"],["Reverse motion linkage","Direction"],["Bell crank","Direction"],["Fixed pulley","Direction"],["Gear train",["Size of force or speed","Direction"]],["Class 2 lever","Size of force or speed"],["Block and tackle","Size of force or speed"]],"why":"Cams and crank and sliders turn rotary motion into reciprocating. Reverse motion linkages, bell cranks and fixed pulleys change direction. Gears, levers and a block and tackle change the speed or the size of the force. A gear train also reverses direction, so it fits two columns."},{"id":"S3","title":"Which class of lever?","a":26,"bins":["Class 1","Class 2","Class 3"],"cards":[["Seesaw","Class 1"],["Scissors","Class 1"],["Crowbar","Class 1"],["Wheelbarrow","Class 2"],["Car door","Class 2"],["Nutcracker","Class 2"],["Broom","Class 3"],["Fishing rod","Class 3"],["Tweezers","Class 3"]],"why":"Class 1 has the fulcrum in rt the sensors","a":77,"grid":true,"bins":["Analogue and active","Analogue and passive","Digital and active","Digital and passive"],"cards":[["Ultrasonic distance sensor","Analogue and active"],["Laser distance sensor","Analogue and active"],["LDR","Analogue and passive"],["Thermistor","Analogue and passive"],["Inductive proximity sensor","Digital and active"],["Photoelectric beam sensor","Digital and active"],["Limit switch","Digital and passive"],["PIR motion sensor","Digital and passive"]],"why":"Two questions for each card: does it send anything out (active), and does its output have only two states (digital)? The awkward ones: an inductive proximity sensor is active because it sends out a magnetic field, and a PIR sensor is passive because it only receives heat.","tricky":{"Inductive proximity sensor":"Inductive proximity: active, because it sends out a magnetic field.","PIR motion sensor":"PIR motion sensor: passive, because it only receives heat."}},{"id":"T2","title":"Analogue or digital actuator?","a":76,"bins":["Analogue","Digital"],"cards":[["A proportional valve that opens part way","Analogue"],["A DC motor whose speed follows the voltage","Analogue"],["A solenoid valve: open or shut","Digital"],["A stepper motor: one step per pulse","Digital"],["A motor that can only be fully on or fully off","Digital"]],"why":"An analogue actuator responds to a continuous signal, so its output can be anywhere in a range. A digital actuator responds to on or off, or one step per pulse."},{"id":"T3","title":"Active or passive actuator?","a":76,"bins":["Active","Passive"],"cards":[["Electric motor","Active"],["Solenoid","Active"],["Pneumatic cylinder","Active"],["Hydraulic cylinder","Active"],["Bimetallic strip in a thermostat","Passive"],["Wax element that opens a car's cooling valve","Passive"]],"why":"Active actuators bring in new energy or need an external supply. Passive actuators need no supply: the bimetallic strip and the wax element are moved by the heat itself." . It cannot tell the printer where the head is.","Servo motor":"A servo would work but costs more. Counting stepper pulses is enough here."}},{"id":"MO3","s":"A robot arm joint on a car production line","ans":"Servo motor","a":68,"ideas":[["Turns to a precise angle and holds it",["angle","precise","precision","accurate","exact","position","holds","hold"]],["Feedback from a position sensor corrects it (closed loop)",["feedback","closed loop","position sensor","sensor","corrects","correct itself","potentiometer","measures its position","measures the angle"]],["Keeps its position when the load changes",["load","weight","weights","heavier","changes","even when","different weights"]]],"need":2,"model":"A servo motor: it turns to a precise angle and a position sensor feeds back, so it corrects itself and holds the angle even when the arm picks up parts of different weights.","fb":{"Stepper motor":"A heavy or changing load can make a stepper miss steps, and it has no sensor to notice.","Standard motor":"A standard motor has no way to stop at a set angle."}},{"id":"MO4","s":"An extractor fan in a paint shop","ans":"Standard motor","a":68,"ideas":[["Continuous rotation",["continuous","continuously","keeps turning","keep turning","round and round","turns all the time","spins","nonstop","non stop","constant"]],["Low cost, or no position control needed",["cheap","low cost","cost","inexpensive","no position","doesnt need position","does not need position","no need for position","not need precise","precision not needed","no precision","simple"]]],"need":2,"model":"A standard motor: a fan needs continuous rotation, cheaply, with no position control.","fb":{"Servo motor":"A fan never needs to stop at an exact angle.","Stepper motor":"A fan needs smooth continuous rotation, not steps."}},{"id":"MO5","s":"Moving the cutting tool on a CNC machine to an exact position under load","ans":"Servo motor","a":59,"ideas":[["Turns to a precise angle and holds it",["angle","precise","precision" eels must turn to 30° left and stay there","ans":"Servo motor","a":61,"ideas":[["Turns to a precise angle and holds it",["angle","precise","precision","accurate","exact","position","holds","hold"]],["The angle is set by the width of the control pulse",["pulse width","width","pulse","pulses","signal"]],["Feedback from a position sensor corrects it (closed loop)",["feedback","closed loop","position sensor","sensor","corrects","correct itself","potentiometer","measures its position","measures the angle"]]],"need":2,"model":"A servo motor: the width of the control pulse sets the angle, and its position sensor holds the wheels there.","fb":{"Standard motor":"A standard motor would just keep turning.","Stepper motor":"A stepper could turn the wheels, but a bump could knock it out of position with no sensor to notice. A servo holds the angle."}},{"id":"MO9","s":"A pump that circulates coolant round a machine","ans":"Standard motor","a":67,"ideas":[["Continuous rotation",["continuous","continuously","keeps turning","keep turning","round and round","turns all the time","spins","nonstop","non stop","constant"]],["Low cost, or no position control needed",["cheap","low cost","cost","inexpensive","no position","doesnt need position","does not need position","no need for position","not need precise","precision not needed","no precision","simple"]]],"need":2,"model":"A standard motor: a pump needs continuous rotation, low cost and no position control.","fb":{"Stepper motor":"A pump needs continuous rotation, not exact steps.","Servo motor":"A pump never needs to stop at a set angle."}},{"id":"MO10","s":"A lead screw that must move a table 0.04 mm at a time","ans":"Stepper motor","a":64,"ideas":[["Moves in precise, equal steps",["step","steps","precise","precision","accurate","exact"]],["Position known by counting pulses, so no sensor (open loop)",["count","counting","pulses","pulse","open loop","no sensor","no feedback","without a sensor","without feedback"]]],"need":2,"model":"A
