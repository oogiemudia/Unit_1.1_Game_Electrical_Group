var CONTENT = {"parts":[{"id":"p0","title":"Warm up","sub":"Wake up what you need from earlier units, and from last lesson.","goals":["Recall the earlier learning this criterion builds on","Answer last lesson's questions from memory","Write down everything you can remember about a part"],"games":["recall","last","dump"]},{"id":"p1","title":"Part 1: Key terms and stakeholders","sub":"Lesson slides 8 to 29. Companies, business words and everyone with a stake.","goals":["Use company, goods, services, employer and employee correctly","Explain what a stakeholder is","Sort stakeholders into internal and external, and say what each group wants"],"games":["stakesort","swipe"]},{"id":"p2","title":"Part 2: Commercial priorities, customers and markets","sub":"Lesson slides 31 to 66. Turnover, costs, profit, and who buys.","goals":["Keep turnover, costs and profit apart, and tell direct from indirect costs","Calculate profit, profit margin and the effect of a cost rise","Name the uses of profit","Compare local, national and international customers"],"games":["profit","moneysort","market"]},{"id":"p3","title":"Part 3: Quality, efficiency, value added and research and development","sub":"Lesson slides 68 to 122. Getting the most from the least.","goals":["Explain the quality, cost and time trade off","Name the eight wastes and spot them on the shop floor","Calculate yield, material utilisation, OEE and value added","Explain research and development and the three kinds of innovation"],"games":["waste","factory","valuesort"]},{"id":"p4","title":"Part 4: Competition, supply and demand","sub":"Lesson slides 124 to 146. The market the company works in.","goals":["Explain competition, monopoly and the ways to compete","Read a supply and demand graph","Explain what happens when supply and demand fall out of balance"],"games":["graph","chain"]},{"id":"mix","title":"Pull it together","sub":"Lesson slides 147 to 155. Every part, mixed.","goals":["Work through calculations with less and less help","Define every key word from memory","Explain, compare and mark exam answers"],"games":["ladder","term","taboo","why","errors","examiner","boss"]}],"goals":[{"t":"Explain the goals of a commercial operation and how a company works towards them","games":["profit","why","boss"]},{"t":"Use business and finance terms accurately, such as profit, turnover, costs and value added","games":["term","moneysort","taboo"]},{"t":"Explain who the stakeholders in an engineering company are and what each one wants","games":["stakesort","swipe","taboo"]},{"t":"Describe how a company meets the needs of local, national and international customers","games":["market","moneysort","examiner"]},{"t":"Explain how organisations judge their activities against quality, cost and time","games":["valuesort","why","boss"]},{"t":"Name the eight wastes and explain what efficiency means in a business","games":["waste","factory","errors"]},{"t":"Tell value added from non-value added activity, and calculate value added","games":["valuesort","factory","ladder"]},{"t":"Explain competition, supply and demand, and what happens when they fall out of balance","games":["graph","chain","why"]},{"t":"Explain how research, development and innovation answer changing customer needs","games":["valuesort","chain","term"]}],"recall":[{"id":"R01","q":"Which scale of production makes thousands of identical items at the lowest cost per item?","opts":["Mass production","One-off production","Batch production","Prototype production"],"why":"Mass production: standardised goods in large numbers at the lowest cost per item (criterion 1.3). Lower cost per unit feeds straight into profit.","fb":{"Batch production":"Batch makes groups of identical items, then changes over. The cost per item is higher than in mass production.","One-off production":"One-off makes a single item to order, which gives the highest cost per item."},"t":{"k":"short","acc":["mass production","mass","mass produced","mass manufacture","flow production"]}},{"id":"R02","q":"A bakery makes 50 white loaves, then 100 croissants, cleaning the equipment between runs. Which scale of production is this?","opts":["Batch production","Mass production","Continuous production","One-off production"],"why":"Groups of identical products, one group after another, with a changeover between them: batch production (criterion 1.3).","fb":{"Continuous production":"Continuous production never stops to change over. This bakery stops and cleans between runs."},"t":{"k":"short","acc":["batch production","batch","batch manufacture"]}},{"id":"R03","q":"A bridge or a made-to-measure suit is made once, to the customer's order. Which scale of production is this?","opts":["One-off production","Batch production","Mass production","Continuous production"],"why":"One-off, also called job production (criterion 1.3). It needs high skill and gives the highest cost per item.","t":{"k":"short","acc":["one off","one off production","job production","jobbing","bespoke","one-off production","job"]}},{"id":"R04","q":"Machining a shaft from bar stock cuts material away. Which type of manufacturing process is that?","opts":["Wasting","Forming","Joining","Additive"],"why":"Wasting processes remove material (criterion 1.1). The swarf is why material utilisation is never 100% (lesson slide 85).","fb":{"Forming":"Forming changes the shape without removing material, for example bending or pressing.","Additive":"Additive builds a part up layer by layer. Machining takes material away."},"t":{"k":"short","acc":["wasting","a wasting process","wasting process","subtractive","material removal","machining"]}},{"id":"R05","q":"Which document lists the measurable requirements a product must meet?","opts":["Specification","Design brief","Invoice","Work order"],"why":"The specification lists measurable requirements (criterion 1.1). The design brief states the problem and the need.","fb":{"Design brief":"The design brief states the problem to be solved. The specification turns it into measurable requirements."},"t":{"k":"short","acc":["specification","a specification","spec","product specification","design specification"]}},{"id":"R06","q":"BMW and Nissan design and build cars. Which engineering sector are they in?","opts":["Automotive","Aerospace","Marine","Rail"],"why":"Cars sit in the automotive sector (criterion 2.1). Both companies helped create this T Level (lesson slide 10).","t":{"k":"short","acc":["automotive","the automotive sector","automotive sector","motor industry","car industry","motor vehicle"]}},{"id":"R07","q":"What is 15% of £2,400?","opts":["£360","£36","£3,600","£160"],"why":"15 ÷ 100 × 2,400 = 360, so £360. Percentages of money run all through Part 2 of this lesson.","fb":{"£36":"That is 1.5%. Divide by 100, not 1,000.","£3,600":"That is 150%. Check where the decimal point goes."},"t":{"k":"num","v":360,"unit":"","tol":0.002,"money":true}},{"id":"R08","q":"A price rises from £20.00 to £23.00. What is the percentage increase?","opts":["15%","13%","3%","23%"],"why":"The rise is £3.00. £3.00 ÷ £20.00 × 100 = 15%. Always divide by the original amount.","fb":{"13%":"You divided by the new price. Divide the rise by the original price.","3%":"£3 is the rise in pounds, not the percentage."},"t":{"k":"num","v":15,"unit":"%","tol":0.002}},{"id":"R09","q":"Write 0.86 as a percentage.","opts":["86%","8.6%","0.86%","860%"],"why":"Multiply by 100: 0.86 × 100 = 86%. OEE is worked in decimals, then turned into a percentage at the end.","t":{"k":"num","v":86,"unit":"%","tol":0.002}},{"id":"R10","q":"What is 456 out of 480 as a percentage?","opts":["95%","24%","105%","5%"],"why":"456 ÷ 480 × 100 = 95%. This is the yield worked example on lesson slide 84.","fb":{"5%":"That is the share scrapped (24 of 480). The question asks for the share that is good.","105%":"You divided the wrong way round. Part ÷ whole, then × 100."},"t":{"k":"num","v":95,"unit":"%","tol":0.002}},{"id":"R11","q":"Making a product non-stop, 24 hours a day, every day, is which scale of production?","opts":["Continuous production","Batch production","One-off production","Prototype production"],"why":"Continuous production runs without stopping (criterion 1.3), for example paper or chemicals.","t":{"k":"short","acc":["continuous","continuous production","continuous flow","continuous flow production","flow production"]}},{"id":"R12","q":"Building a part up layer by layer from a digital model is which type of manufacturing process?","opts":["Additive","Casting","Forming","Wasting"],"why":"Additive manufacturing, often called 3D printing (criterion 1.1). It wastes very little material.","t":{"k":"short","acc":["additive","additive manufacturing","3d printing","3d print","three d printing","layer manufacturing"]}},{"id":"R13","q":"Which of the 6Rs means using a product again, for the same or a different job?","opts":["Reuse","Recycle","Reduce","Refuse"],"why":"Reuse (criterion 1.1). Using resources well is one of the environmental benefits of efficiency (lesson slide 90).","fb":{"Recycle":"Recycling breaks the product down into its material to make something new. Reuse keeps the product as it is."},"t":{"k":"short","acc":["reuse","re use","reusing","reused"]}},{"id":"R14","q":"Designing a product so it is easy and cheap to make is called what?","opts":["Design for manufacture","Inclusive design","Iterative design","Linear design"],"why":"Design for manufacture (criterion 1.1). It keeps the cost corner of the quality, cost and time triangle down.","t":{"k":"short","acc":["design for manufacture","dfm","design for manufacturing","designing for manufacture"]}},{"id":"R15","q":"Which scale of production usually needs the most highly skilled workers?","opts":["One-off production","Mass production","Continuous production","Batch production"],"why":"One-off work uses general purpose tools and very little automation, so it depends on skill (criterion 1.3).","fb":{"Mass production":"Mass production uses specialist tools and automation, so the skill sits in the machines, not the operators."},"t":{"k":"short","acc":["one off","one off production","job production","one-off production","jobbing","bespoke"]}},{"id":"R16","q":"The short statement of the problem a client wants solved is called the design what?","opts":["Brief","Specification","Tolerance","Schedule"],"why":"The design brief (criterion 1.1). Market research (lesson slide 50) is often what tells a company the brief.","t":{"k":"short","acc":["brief","design brief","a design brief","the brief"]}}],"keywords":[{"id":"K101","term":"Company","acc":["company","a company","business","firm","organisation"],"part":1,"slide":13,"def":"An organisation that provides goods or services in return for payment."},{"id":"K102","term":"Goods","acc":["goods","good","physical goods","products"],"part":1,"slide":13,"def":"Physical products that can be made or processed."},{"id":"K103","term":"Services","acc":["services","service"],"part":1,"slide":13,"def":"Products that are not physical, for example logistics, advice or support."},{"id":"K104","term":"Employer","acc":["employer","the employer"],"part":1,"slide":13,"def":"The organisation or person that takes people on and pays them to work."},{"id":"K105","term":"Employee","acc":["employee","the employee","worker","member of staff","staff"],"part":1,"slide":13,"def":"The person who works for an organisation in return for pay."},{"id":"K106","term":"Stakeholder","acc":["stakeholder","stakeholders","a stakeholder"],"part":1,"slide":19,"def":"Anyone with an interest in a company who is affected by its successes and failures."},{"id":"K107","term":"Internal stakeholder","acc":["internal stakeholder","internal stakeholders","internal"],"part":1,"slide":22,"def":"Someone affected by the company from inside it, such as its owners, managers or staff."},{"id":"K108","term":"External stakeholder","acc":["external stakeholder","external stakeholders","external"],"part":1,"slide":22,"def":"Someone affected by the company from outside it, such as its customers or the local community."},{"id":"K110","term":"Creditor","acc":["creditor","creditors"],"part":1,"slide":21,"def":"A person or organisation the company owes money to, such as a bank that lent it money."},{"id":"K201","term":"Turnover","acc":["turnover","revenue","sales revenue","takings"],"part":2,"slide":35,"def":"All the money received from sales over a period, before anything is taken off."},{"id":"K202","term":"Costs","acc":["costs","cost","total costs"],"part":2,"slide":36,"def":"All the money needed to make, store, sell or market a product."},{"id":"K203","term":"Profit","acc":["profit","net profit","the profit"],"part":2,"slide":36,"def":"What is left when everything spent is subtracted from income."},{"id":"K204","term":"Direct cost","acc":["direct cost","direct costs","direct"],"part":2,"slide":38,"def":"A cost that goes straight into making the product, such as its raw materials."},{"id":"K205","term":"Indirect cost","acc":["indirect cost","indirect costs","indirect","overheads","overhead"],"part":2,"slide":38,"def":"A cost shared across the whole company, such as office staff, insurance or IT."},{"id":"K206","term":"Profit margin","acc":["profit margin","margin","profit margins"],"part":2,"slide":43,"def":"Profit as a percentage of turnover: (profit ÷ turnover) × 100."},{"id":"K218","term":"Shareholder","acc":["shareholder","shareholders","share holder"],"part":2,"slide":47,"def":"Someone who owns part of a company and took a risk with their money, hoping for a return."},{"id":"K207","term":"Dividend","acc":["dividend","dividends"],"part":2,"slide":47,"def":"A share of the profit paid out to the people who own shares."},{"id":"K208","term":"Capital","acc":["capital","retained profit","reserves"],"part":2,"slide":47,"def":"Money held back in case the company needs it in future: the company savings account."},{"id":"K209","term":"Bonus","acc":["bonus","bonuses"],"part":2,"slide":48,"def":"Extra money paid to employees from the profit, over and above their wages or salary."},{"id":"K210","term":"Investment","acc":["investment","investing","reinvestment"],"part":2,"slide":48,"def":"Spending on upgrading tools, machinery and premises."},{"id":"K211","term":"Market","acc":["market","the market","target market"],"part":2,"slide":50,"def":"The group of people who want or need a product or service."},{"id":"K212","term":"Market research","acc":["market research","researching the market"],"part":2,"slide":50,"def":"Collecting information about what customers want and need, then acting on it."},{"id":"K213","term":"Customer loyalty","acc":["customer loyalty","loyalty","loyal customers","repeat customers"],"part":2,"slide":51,"def":"Keeping the customers you already have coming back."},{"id":"K214","term":"Customer","acc":["customer","customers","client","buyer"],"part":2,"slide":53,"def":"Anyone who exchanges money for goods or services, a person or another company."},{"id":"K215","term":"Local customer","acc":["local customer","local customers","local","local market"],"part":2,"slide":55,"def":"A buyer within the geographical area of the business, usually within a few miles."},{"id":"K216","term":"National customer","acc":["national customer","national customers","national","national market"],"part":2,"slide":56,"def":"A buyer anywhere within the borders of the company's own country."},{"id":"K217","term":"International customer","acc":["international customer","international customers","international","overseas customer","global customer"],"part":2,"slide":57,"def":"A buyer anywhere in the world, across national borders."},{"id":"K301","term":"Efficiency","acc":["efficiency","efficient","being efficient"],"part":3,"slide":73,"def":"The least input for the most output, at the quality needed."},{"id":"K302","term":"TIMWOODS","acc":["timwoods","timwood","the eight wastes","8 wastes","eight wastes","the 8 wastes"],"part":3,"slide":81,"def":"Transport, inventory, motion, waiting, over-production, over-processing, defects, skills."},{"id":"K303","term":"Lean manufacturing","acc":["lean manufacturing","lean","lean production","lean manufacture"],"part":3,"slide":91,"def":"Methods, techniques and practices designed to minimise waste."},{"id":"K304","term":"Over-production","acc":["over production","overproduction","excess production"],"part":3,"slide":81,"def":"The waste of making more than is needed right now."},{"id":"K305","term":"Over-processing","acc":["over processing","overprocessing"],"part":3,"slide":81,"def":"The waste of doing more to a product than the customer asked for."},{"id":"K306","term":"Inventory","acc":["inventory","stock","excess inventory","excess stock"],"part":3,"slide":81,"def":"The waste of holding stock that is not needed right now."},{"id":"K307","term":"Yield","acc":["yield","first pass yield"],"part":3,"slide":84,"def":"Good parts as a percentage of everything made: (good parts ÷ total made) × 100."},{"id":"K308","term":"Material utilisation","acc":["material utilisation","utilisation","material utilization","utilization"],"part":3,"slide":86,"def":"How much of the starting material ends up in the finished part, as a percentage."},{"id":"K309","term":"OEE","acc":["oee","overall equipment effectiveness","overall equipment efficiency"],"part":3,"slide":87,"def":"Availability × performance × quality: one figure for how well a machine is used."},{"id":"K310","term":"Value added","acc":["value added","added value","value adding"],"part":3,"slide":93,"def":"The increase in value of a product through the work done on it."},{"id":"K311","term":"Non-value added","acc":["non value added","non value adding","nonvalue added","non value added activity","not value added"],"part":3,"slide":97,"def":"Activity that does not change the product in a way the customer values."},{"id":"K312","term":"Contribution","acc":["contribution","contribution to profit"],"part":3,"slide":105,"def":"Value added minus labour and overhead: what each unit puts towards profit."},{"id":"K313","term":"Research and development","acc":["research and development","r and d","r&d","rd","research & development"],"part":3,"slide":111,"def":"The department that plans the future direction of the product range."},{"id":"K314","term":"Innovation","acc":["innovation","innovating"],"part":3,"slide":114,"def":"A new product, a new way of doing something, or a new way of thinking."},{"id":"K315","term":"Technological innovation","acc":["technological innovation","technological","technology innovation"],"part":3,"slide":114,"def":"A genuinely new capability, such as touchscreens or batteries strong enough to run a car."},{"id":"K316","term":"Business model innovation","acc":["business model innovation","business model","business model change"],"part":3,"slide":115,"def":"A new way of charging for something, such as a monthly subscription instead of buying outright."},{"id":"K317","term":"Process innovation","acc":["process innovation","process","manufacturing process innovation"],"part":3,"slide":115,"def":"A new way of making something, such as the moving assembly line."},{"id":"K318","term":"Patent","acc":["patent","a patent","patents"],"part":3,"slide":118,"def":"A legal document that grants an owner exclusive rights over an invention."},{"id":"K319","term":"Copyright","acc":["copyright","copy right"],"part":3,"slide":117,"def":"A right to be named as the creator of a creative work and to control copies of it, with no need to register."},{"id":"K401","term":"Competition","acc":["competition","competitors","the competition","rivals"],"part":4,"slide":125,"def":"Other companies providing the same goods or services to the same customers."},{"id":"K402","term":"Monopoly","acc":["monopoly","a monopoly"],"part":4,"slide":126,"def":"When only one company provides a product or service in a market."},{"id":"K403","term":"Competitive advantage","acc":["competitive advantage","competitive advantages","unique selling point","usp"],"part":4,"slide":128,"def":"A difference customers value, such as features, price, service, convenience or customisation."},{"id":"K404","term":"Supply","acc":["supply","the supply"],"part":4,"slide":132,"def":"A company's ability to produce goods or services for sale."},{"id":"K405","term":"Demand","acc":["demand","the demand","consumer demand"],"part":4,"slide":133,"def":"Consumer desire to purchase goods or services."},{"id":"K406","term":"Equilibrium","acc":["equilibrium","market equilibrium","balance","equilibrium point"],"part":4,"slide":135,"def":"The point where the amount offered for sale matches the amount people want to buy."},{"id":"K407","term":"Surplus","acc":["surplus","a surplus","excess supply","oversupply"],"part":4,"slide":137,"def":"More is made than customers want, so stock piles up."},{"id":"K408","term":"Shortage","acc":["shortage","a shortage","excess demand","undersupply"],"part":4,"slide":137,"def":"Customers want more than is available, so orders cannot be filled."},{"id":"K409","term":"Loss of confidence","acc":["loss of confidence","lost confidence","losing confidence"],"part":4,"slide":137,"def":"Customers who could not get a product go elsewhere and may not come back."},{"id":"K410","term":"Saturated market","acc":["saturated market","saturated","market saturation","saturation"],"part":4,"slide":136,"def":"A market where everyone who wants the product has already bought one."}],"formulas":[["Turnover","number sold × selling price"],["Total costs","direct costs + indirect costs"],["Profit","turnover − total costs"],["Profit margin","(profit ÷ turnover) × 100"],["Cost rise per item","old cost × rise as a decimal"],["Price rise needed","extra cost ÷ number sold"],["Yield","(good parts ÷ total made) × 100"],["Material utilisation","(finished mass ÷ starting mass) × 100"],["Availability","operating time ÷ planned time"],["Performance","(ideal cycle time × parts made) ÷ operating time"],["Quality (in OEE)","good parts ÷ parts made"],["OEE","availability × performance × quality, each as a decimal"],["Value added","selling price − cost of bought in materials"],["Value added (%)","(value added ÷ selling price) × 100"],["Contribution","value added − labour and overhead"]],"checkin":{"p1":{"title":"Part 1 check-in: key terms and stakeholders","lines":["Define company, goods and services, with an example of each.","Tell an employer from an employee.","Explain what a stakeholder is, and that it is not only people who gain money.","Sort stakeholders into internal and external.","Say what each stakeholder group wants, and spot two groups whose wants clash."]},"p2":{"title":"Part 2 check-in: commercial priorities, customers and markets","lines":["Keep turnover, costs and profit apart.","Tell direct costs from indirect costs.","Calculate turnover, profit and profit margin.","Work out the effect of a cost rise and the price needed to recover it.","Name the five uses of profit.","Explain how a company finds out what customers want.","Compare local, national and international customers."]},"p3":{"title":"Part 3 check-in: quality, efficiency, value added and R and D","lines":["Explain the quality, cost and time trade off.","Explain efficiency as the most output for the least input.","Name all eight wastes in TIMWOODS.","Calculate yield, material utilisation and OEE.","Tell value added from non-value added work, and calculate value added.","Explain why products get redesigned, and the three kinds of innovation."]},"p4":{"title":"Part 4 check-in: competition, supply and demand","lines":["Explain competition and monopoly.","Name the five ways a company can compete.","Define supply, demand and equilibrium.","Read a supply and demand graph.","Explain what goes wrong with a surplus and with a shortage.","Explain why demand is hard to predict."]}},"checkinRecall":{"p1":[{"id":"CK11","k":"term","q":"Anyone with an interest in a company who is affected by its successes and failures.","acc":["stakeholder","stakeholders","a stakeholder"],"p":1,"a":19,"why":"A stakeholder."},{"id":"CK12","k":"short","q":"Customers, suppliers and creditors are all which kind of stakeholder?","acc":["external","external stakeholders","external stakeholder","outside","outside the company"],"rivals":["internal"],"p":1,"a":22,"why":"External: outside the company but still affected by it."}],"p2":[{"id":"CK21","k":"num","q":"Turnover is £72,000 and total costs are £63,000. What is the profit?","v":9000,"unit":"","tol":0.002,"p":2,"a":36,"why":"£72,000 − £63,000 = £9,000.","money":true},{"id":"CK22","k":"term","q":"A share of the profit paid out to the people who own shares.","acc":["dividend","dividends"],"p":2,"a":47,"why":"A dividend."}],"p3":[{"id":"CK31","k":"num","q":"500 parts are made and 15 are scrapped. What is the yield?","v":97,"unit":"%","tol":0.002,"p":3,"a":84,"why":"Good parts 485. (485 ÷ 500) × 100 = 97%."},{"id":"CK32","k":"term","q":"Methods, techniques and practices designed to minimise waste.","acc":["lean manufacturing","lean","lean production"],"p":3,"a":91,"why":"Lean manufacturing."}],"p4":[{"id":"CK41","k":"term","q":"When only one company provides a product or service in a market.","acc":["monopoly","a monopoly"],"p":4,"a":126,"why":"A monopoly."},{"id":"CK42","k":"short","q":"Demand is greater than supply. Which way does the market price tend to move?","acc":["up","it rises","rise","rises","increase","increases","goes up","higher","it goes up","upwards"],"p":4,"a":137,"why":"Up. Customers compete for the few items there are, so the price tends to rise."}]},"exit":{"q1":{"q":"Explain the difference between turnover and profit. Use an example if you can.","ideas":[["Turnover is all the money from sales, before costs",["sales","sold","takings","received","comes in","income","revenue","till","before"]],["Profit is what is left after the costs are paid",["left","after","minus","take away","takeaway","subtract","less","remain"]],["A big turnover can still mean little profit, or a loss",["loss","no profit","little profit","still","even if","higher than","more than","bigger than"]]],"need":2,"model":"Turnover is all the money a company takes from sales before anything is paid out, like the till total at the end of the day. Profit is what is left once every cost, direct and indirect, has been paid. So a company with a large turnover can still make little profit, or a loss, if its costs are higher."},"q2":{"q":"A company has a turnover of £80,000 and total costs of £68,000. What is its profit margin?","opts":["17.6%","£12,000","15%","85%"],"ans":2},"q2b":{"q":"Tick the three that are wastes in TIMWOODS.","opts":["Turnover","Waiting","Dividends","Over-production","Competition","Defects"],"ans":[1,3,5]},"q3":{"q":"Supply is greater than demand for a product. What tends to happen?","opts":["The price rises because customers compete for stock","Surplus stock builds up and prices are cut to shift it","Nothing changes: the market is in equilibrium","The company gains a monopoly"],"ans":1},"q4":{"q":"Bought in materials cost £14.50 and the finished product sells for £52.00. What is the value added? Type the amount.","v":37.5,"unit":"","tol":0.002},"q5":{"q":"Which kind of innovation is a new way of charging for something, such as a monthly subscription?","acc":["business model innovation","business model","business models","business model innovations"],"rivals":["technological","technological innovation","process","process innovation","technology"]}},"sortStake":[{"id":"S1","title":"Inside or outside the company?","a":24,"bins":["Internal","External","Could be both"],"cards":[["Owners","Internal"],["Managers","Internal"],["Employees","Internal"],["Customers","External"],["Suppliers","External"],["A bank that lent it money","External"],["The local community","External"],["Government","External"],["A neighbour who works there","Could be both"],["An employee who buys its products","Could be both"]],"why":"Inside the organisation: owners, managers and employees. Outside it but still affected: customers, suppliers, creditors, the community and government (lesson slide 22). One person can sit in two groups.","tricky":{"A neighbour who works there":"A neighbour who works there is an employee (internal) and part of the local community (external), so both."}},{"id":"S2","title":"What does each group want?","a":22,"bins":["Owners","Employees","Customers","Suppliers","Community and government"],"cards":[["A return on the money they risked","Owners"],["Dividends paid from the profit","Owners"],["Fair pay and safe work","Employees"],["Job security","Employees"],["Quality at a fair price","Customers"],["Reliable supply","Customers"],["Repeat orders","Suppliers"],["Prompt payment","Suppliers"],["Local jobs and tax paid","Community and government"],["Safe sites with little noise","Community and government"]],"why":"Lesson slide 22. When these pull against each other, for example owners wanting profit and employees wanting higher pay, the company has to balance them."},{"id":"S3","title":"Which stakeholder group is it?","a":21,"bins":["Owners","Creditors","Suppliers","Government"],"cards":[["Shareholders","Owners"],["The person who started the firm","Owners"],["The bank that lent money for a new machine","Creditors"],["A supplier still waiting to be paid",["Creditors","Suppliers"]],["The firm that sells it steel bar","Suppliers"],["A company that does its laser cutting","Suppliers"],["The tax office (HMRC)","Government"],["The local council","Government"]],"why":"Creditors are owed money by the company. Suppliers sell it goods or services. Government collects tax and sets the rules (lesson slide 21).","tricky":{"A supplier still waiting to be paid":"A supplier waiting to be paid is also a creditor, because the company owes it money. Either group is accepted."}}],"sortMoney":[{"id":"M1","title":"Direct or indirect cost?","a":38,"bins":["Direct cost","Indirect cost"],"cards":[["Raw materials for the product","Direct cost"],["Wages of the people who make it","Direct cost"],["Energy used in making it","Direct cost"],["Tools needed to make it","Direct cost"],["Rent, if the site makes only this product","Direct cost"],["Office, HR and cleaning wages","Indirect cost"],["Rent for a building shared by several products","Indirect cost"],["Insurance, IT and IT support","Indirect cost"],["Maintenance","Indirect cost"]],"why":"Direct costs go straight into making one product. Indirect costs are shared across the whole company, and they are the ones companies forget when pricing a job (lesson slides 38 and 39).","tricky":{"rent":"Rent is the tricky card: it is direct only when the site makes nothing but this product."}},{"id":"M2","title":"Turnover, costs or profit?","a":35,"bins":["Turnover","Costs","Profit"],"cards":[["All the money taken from sales this month","Turnover"],["The till total at the end of the day","Turnover"],["250 brackets sold at £18 each: £4,500","Turnover"],["Steel bought for the job","Costs"],["Wages for the machinists","Costs"],["The electricity bill","Costs"],["What is left after every bill is paid","Profit"],["£4,500 − £3,150 = £1,350","Profit"],["The money that pays dividends and bonuses","Profit"]],"why":"Turnover is the till total. Costs are everything spent to make, store, sell or market the product. Profit is what is left in the till after the stock, wages and bills are paid (lesson slide 35)."},{"id":"M3","title":"What is the profit used for?","a":49,"bins":["Dividend","Capital","Bonuses","Innovation","Investment"],"cards":[["Paid out to shareholders","Dividend"],["A return for the owners' risk","Dividend"],["Saved in case of a hard year","Capital"],["The company savings account","Capital"],["Extra pay for staff on top of wages","Bonuses"],["Research into a new product","Innovation"],["Developing a new way of making it","Innovation"],["A new CNC machine","Investment"],["Upgrading the factory building","Investment"]],"why":"Five uses of profit (lesson slide 49). A company that spends every penny of profit today has nothing left to invest in tomorrow."},{"id":"M4","title":"Local, national or international?","a":58,"bins":["Local","National","International"],"cards":[["Customers within a few miles","Local"],["Word of mouth and local radio","Local"],["Problems sorted out face to face","Local"],["Goods moved by road or rail across the country","National"],["Advertised on national TV and at UK trade events","National"],["One legal system and one currency",["National","Local"]],["Goods moved by air or sea across borders","International"],["Manuals printed in several languages","International"],["Different standards, regulations and paperwork","International"]],"why":"Reach grows from local to national to international, and so does the cost and complexity of serving the customer (lesson slide 58).","tricky":{"One legal system and one currency":"Slide 58 lists one legal system and one currency under national. It is true of local customers too, so either is accepted."}}],"sortValue":[{"id":"V1","title":"Value added or non-value added?","a":97,"bins":["Value added","Non-value added"],"cards":[["Machining a shaft to size","Value added"],["Welding a bracket to a frame","Value added"],["Painting the finished product","Value added"],["Testing it meets the specification","Value added"],["Assembling parts into a working pump","Value added"],["Moving parts from stores to a machine","Non-value added"],["Waiting for a drawing to be signed off","Non-value added"],["Recounting stock in the stores","Non-value added"],["Reworking a wrongly drilled part","Non-value added"]],"why":"Value added changes the product in a way the customer wants and would pay for. Non-value added does not, and the customer would object to paying for it (lesson slide 97).","tricky":{"testing":"Testing counts as value added when it proves the product meets its specification (lesson slide 99)."}},{"id":"V2","title":"Which kind of innovation?","a":116,"bins":["Technological","Business model","Process"],"cards":[["Touchscreen phones","Technological"],["Batteries strong enough to run a family car","Technological"],["Music by monthly subscription instead of buying discs","Business model"],["Design software rented monthly instead of bought outright","Business model"],["Ford's moving assembly line","Process"],["Toyota's lean manufacturing","Process"],["Robots taking over welding on a car line","Process"]],"why":"Technological: a new capability. Business model: a new way of charging for the same thing. Process: a new way of making the same thing (lesson slide 116)."},{"id":"V3","title":"Quality, cost or time measure?","a":71,"bins":["Quality","Cost","Time"],"cards":[["Defect rate","Quality"],["Scrap and rework","Quality"],["Right first time","Quality"],["Cost per unit","Cost"],["Total job cost against budget","Cost"],["Material utilisation","Cost"],["Lead time from order to delivery","Time"],["Cycle time per unit","Time"],["Machine uptime","Time"],["Was the promised date met?","Time"]],"why":"A company puts numbers against each corner of the triangle and measures all three together (lesson slides 71 and 72).","tricky":{"utilisation":"Material utilisation sits under cost on lesson slide 72: wasted material is money lost."}},{"id":"V4","title":"Which benefit of being efficient?","a":90,"bins":["Cost","Environmental","Social"],"cards":[["Less fuel on needless journeys","Cost"],["Lower storage costs","Cost"],["Lower energy bills","Cost"],["Fewer raw materials used","Environmental"],["Smaller carbon footprint","Environmental"],["Less surplus sent to landfill","Environmental"],["Can promote itself as socially responsible","Social"],["A reputation customers value","Social"],["More secure jobs in the long run","Social"]],"why":"Three kinds of benefit, and companies increasingly talk about all three (lesson slide 90)."}],"swipeDecks":{"gs":{"q":"Goods or a service?","L":"Goods","R":"Service"},"ie":{"q":"Inside or outside the company?","L":"Internal","R":"External"}},"swipe":[{"id":"W01","d":"gs","s":"A gearbox","ans":"Goods","a":13,"why":"A physical product that has been made."},{"id":"W02","d":"gs","s":"Delivering parts to a factory","ans":"Service","a":13,"why":"Logistics is a service: something done for the customer, not handed over."},{"id":"W03","d":"gs","s":"Advice from an engineering consultant","ans":"Service","a":13,"why":"Advice is a professional service, like a doctor or a lawyer."},{"id":"W04","d":"gs","s":"A box of M8 bolts","ans":"Goods","a":13,"why":"Physical products that can be made or processed."},{"id":"W05","d":"gs","s":"Fitting a replacement windscreen","ans":"Service","a":13,"why":"Tricky: the windscreen is goods, but fitting it is work done for the customer, which is a service."},{"id":"W06","d":"gs","s":"A replacement windscreen","ans":"Goods","a":13,"why":"The glass itself is a physical product. Fitting it would be the service."},{"id":"W07","d":"gs","s":"Designing a bracket in CAD for a client","ans":"Service","a":13,"why":"Tricky: a drawing comes out of it, but what the client pays for is the design work, a service."},{"id":"W08","d":"gs","s":"A 3D printed prototype bracket","ans":"Goods","a":13,"why":"A physical product, even if only one is made."},{"id":"W09","d":"gs","s":"Training staff to use a lathe","ans":"Service","a":13,"why":"Training is support given to the customer, so it is a service."},{"id":"W10","d":"gs","s":"A coil of copper cable","ans":"Goods","a":13,"why":"A physical product that has been processed."},{"id":"W11","d":"gs","s":"Repairing a pump under warranty","ans":"Service","a":13,"why":"Repair work is a service, even when the customer does not pay for it on the day."},{"id":"W12","d":"ie","s":"The production manager","ans":"Internal","a":22,"why":"Managers are inside the organisation."},{"id":"W13","d":"ie","s":"Shareholders who own the company","ans":"Internal","a":22,"why":"Owners are internal stakeholders on lesson slide 22: they want a return on the money they risked."},{"id":"W14","d":"ie","s":"A machine operator","ans":"Internal","a":22,"why":"Employees are inside the organisation."},{"id":"W15","d":"ie","s":"The managing director","ans":"Internal","a":22,"why":"The managing director runs the company from inside it."},{"id":"W16","d":"ie","s":"A customer buying 500 brackets","ans":"External","a":22,"why":"Customers are outside the company but affected by its quality, price and supply."},{"id":"W17","d":"ie","s":"The firm that supplies steel","ans":"External","a":22,"why":"Suppliers are outside the company and want repeat orders and prompt payment."},{"id":"W18","d":"ie","s":"The bank that lent money for a new machine","ans":"External","a":21,"why":"A creditor: outside the company, but it needs the company to do well enough to repay."},{"id":"W19","d":"ie","s":"The local council","ans":"External","a":22,"why":"Government and the council are outside the company and want jobs, safe sites and tax paid."},{"id":"W20","d":"ie","s":"Families living next to the factory","ans":"External","a":20,"why":"The wider community is affected by noise, traffic and jobs, from outside the company."},{"id":"W21","d":"ie","s":"A cleaning firm contracted to clean the offices","ans":"External","a":22,"why":"Tricky: its staff work on the site, but the cleaning firm is a supplier of a service, so it is external."},{"id":"W22","d":"ie","s":"The tax office (HMRC)","ans":"External","a":21,"why":"Government is an external stakeholder."}],"waste":[{"id":"H01","q":"Parts cross the whole site twice because the stores are at the far end.","opts":["Transport","Motion","Waiting","Inventory"],"why":"Moving goods further than they need to go is transport (lesson slide 82).","fb":{"Motion":"Motion is people moving about. Here it is the parts being carried: transport."},"a":82,"p":3,"t":{"k":"short","acc":["transport","transportation","transporting"]}},{"id":"H02","q":"Six months of steel bar sits in the stores.","opts":["Inventory","Over-production","Waiting","Transport"],"why":"Holding stock that is not needed right now is inventory.","fb":{"Over-production":"Over-production is making more than needed. This is bought in stock sitting idle: inventory.","Waiting":"Waiting is people or machines standing idle. Here it is material standing idle, which is inventory."},"a":82,"p":3,"t":{"k":"short","acc":["inventory","stock","excess inventory","excess stock","work in progress"]}},{"id":"H03","q":"An operator walks to the far end of the workshop for a gauge every hour.","opts":["Motion","Transport","Waiting","Skills"],"why":"Unnecessary movement of people is motion. City and Guilds call it movement.","fb":{"Transport":"Transport is moving the product or materials. A person walking for a tool is motion."},"a":82,"p":3,"t":{"k":"short","acc":["motion","movement","unnecessary motion","unnecessary movement"]}},{"id":"H04","q":"A machine stands idle until the paint shop catches up.","opts":["Waiting","Inventory","Defects","Over-processing"],"why":"People or machines standing idle is waiting.","fb":{"Inventory":"The parts may pile up, but the waste named here is the idle machine: waiting."},"a":82,"p":3,"t":{"k":"short","acc":["waiting","wait","idle time"]}},{"id":"H05","q":"500 brackets are made for an order of 300.","opts":["Over-production","Inventory","Over-processing","Defects"],"why":"Making more than is needed right now is over-production.","fb":{"Inventory":"The extra 200 will sit as stock, but the waste happened when they were made: over-production.","Over-processing":"Over-processing is doing too much to each part. Here too many parts were made."},"a":82,"p":3,"t":{"k":"short","acc":["over production","overproduction","excess production","making too much"]}},{"id":"H06","q":"A face nobody will ever see is polished to a mirror finish.","opts":["Over-processing","Defects","Over-production","Motion"],"why":"Doing more than the customer asked for is over-processing.","fb":{"Defects":"Nothing is faulty. The part has had more work than it needs."},"a":82,"p":3,"t":{"k":"short","acc":["over processing","overprocessing","extra processing"]}},{"id":"H07","q":"A batch is scrapped because a hole was drilled in the wrong place.","opts":["Defects","Over-processing","Waiting","Inventory"],"why":"Work that has to be scrapped or redone is defects.","fb":{"Over-processing":"Over-processing is extra work nobody asked for. A misplaced hole is a defect."},"a":82,"p":3,"t":{"k":"short","acc":["defects","defect","scrap","rework"]}},{"id":"H08","q":"A qualified CAD designer spends the day filing paperwork.","opts":["Skills","Waiting","Motion","Over-processing"],"why":"Not using what people know and can do is the skills waste. The Autumn 2023 mark scheme accepts unused talent (lesson slide 80).","fb":{"Waiting":"The designer is busy, not idle. The waste is their unused expertise: skills."},"a":80,"p":3,"t":{"k":"short","acc":["skills","skill","unused talent","talent","unused skills"]}},{"id":"H09","q":"A forklift carries pallets between two buildings because the press is in the wrong place.","opts":["Transport","Motion","Inventory","Waiting"],"why":"The materials travel further than they need to: transport.","fb":{"Motion":"The forklift is moving the product, not a person moving about the job: transport."},"a":81,"p":3,"t":{"k":"short","acc":["transport","transportation","transporting"]}},{"id":"H10","q":"Welders stand around for ten minutes at the only working welding set.","opts":["Waiting","Motion","Skills","Defects"],"why":"People standing idle is waiting.","fb":{"Skills":"Their skills are used once they get to weld. The idle time is waiting."},"a":81,"p":3,"t":{"k":"short","acc":["waiting","wait","idle time"]}},{"id":"H11","q":"A machine runs on through Friday making brackets nobody has ordered yet.","opts":["Over-production","Inventory","Waiting","Over-processing"],"why":"Making more than is needed right now is over-production.","fb":{"Inventory":"They will become stock, but making them unordered is over-production."},"a":81,"p":3,"t":{"k":"short","acc":["over production","overproduction","excess production","making too much"]}},{"id":"H12","q":"A fitter stretches across the bench for every part because the layout is poor.","opts":["Motion","Transport","Waiting","Over-processing"],"why":"Unnecessary movement of people is motion.","fb":{"Transport":"The parts are not being carried anywhere. The fitter's own movement is motion."},"a":81,"p":3,"t":{"k":"short","acc":["motion","movement","unnecessary motion","unnecessary movement"]}},{"id":"H13","q":"A routine order form is signed off by three managers when one signature would do.","opts":["Over-processing","Waiting","Defects","Skills"],"why":"Doing more than is needed is over-processing, in the office as well as on the shop floor (lesson slide 91: lean applies to every department).","fb":{"Waiting":"The order may wait, but the cause is the extra signing: over-processing."},"a":91,"p":3,"t":{"k":"short","acc":["over processing","overprocessing","extra processing"]}},{"id":"H14","q":"Fifty castings come back from the customer with cracks in them.","opts":["Defects","Over-production","Transport","Inventory"],"why":"Work that has to be scrapped or redone is defects.","fb":{"Transport":"They have travelled back, but the waste is the cracked castings: defects."},"a":81,"p":3,"t":{"k":"short","acc":["defects","defect","scrap","rework"]}},{"id":"H15","q":"An apprentice trained on CNC machines is kept on sweeping duty.","opts":["Skills","Waiting","Motion","Over-production"],"why":"Not using what people know and can do is the skills waste.","fb":{"Waiting":"The apprentice is busy, but not using the CNC training: skills."},"a":80,"p":3,"t":{"k":"short","acc":["skills","skill","unused talent","talent","unused skills"]}},{"id":"H16","q":"Two years' supply of packaging is bought because it was on offer.","opts":["Inventory","Over-production","Transport","Defects"],"why":"Holding stock that is not needed right now is inventory.","fb":{"Over-production":"Nothing has been made. Buying in far too much is inventory."},"a":81,"p":3,"t":{"k":"short","acc":["inventory","stock","excess inventory","excess stock","work in progress"]}}],"hintWaste":"Ask: is the product moving (transport) or a person (motion)? Is too much being made (over-production), or is stock just sitting (inventory)?","marketTypes":["Local","National","International"],"market":[{"id":"MK01","s":"A small bakery delivers bread rolls to cafés within five miles of its kitchen.","ans":"Local","a":55,"ideas":[["Customers are within a few miles",["few miles","close","nearby","near","local","same town","miles","within","area","next door"]],["Fast delivery and low transport cost",["fast","quick","cheap","low cost","transport","van","deliver"]],["Word of mouth, local adverts or face to face contact",["word of mouth","radio","advert","paper","social media","face to face","know","in person","recommend"]]],"need":2,"model":"Local: the cafés are within a few miles, so the bakery can deliver quickly by van at low cost, sort problems out face to face, and win trade by word of mouth.","fb":{"National":"National means customers anywhere in the country. These cafés are all within five miles."}},{"id":"MK02","s":"Bentley ships a car from Crewe to a buyer in Dubai.","ans":"International","a":59,"ideas":[["Goods cross national borders, by air or sea",["border","abroad","overseas","air","sea","ship","plane","customs","country","countries","export"]],["Different languages, standards, regulations and paperwork",["language","standard","regulation","rules","law","paperwork","left hand","culture","custom"]],["Extra costs: transport, VAT or currency",["cost","vat","currency","exchange","tax","expensive","transport","shipping"]]],"need":2,"model":"International: the car crosses borders by sea or air, and Bentley must meet that country's standards, such as left hand drive, emissions and safety rules, and handle shipping, currency and paperwork.","fb":{"National":"Dubai is outside the UK, so the car crosses a national border."}},{"id":"MK03","s":"A firm in Leeds supplies brake pads to garages all over England, Scotland and Wales.","ans":"National","a":56,"ideas":[["Anywhere inside the country, no border to cross",["country","uk","britain","england","nation","border","across the"]],["Moved by road or rail",["road","rail","lorry","lorries","truck","train","van","courier"]],["One legal system, one currency, one set of standards",["legal","law","currency","pound","standard","same rules","regulation","language"]]],"need":2,"model":"National: the customers are spread across the country but inside its borders, so the pads go by road or rail under one legal system, one currency and one set of standards.","fb":{"Local":"Local means within a few miles. Garages across three nations of Great Britain are national customers.","International":"England, Scotland and Wales are all in the UK, so no international border is crossed."}},{"id":"MK04","s":"A UK tool maker starts selling to a factory in Germany, where there is already a strong local tool-making sector.","ans":"International","a":65,"ideas":[["Goods cross national borders, by air or sea",["border","abroad","overseas","air","sea","ship","plane","customs","country","countries","export"]],["Different languages, standards, regulations and paperwork",["language","standard","regulation","rules","law","paperwork","left hand","culture","custom"]],["Extra costs: transport, VAT or currency",["cost","vat","currency","exchange","tax","expensive","transport","shipping"]]],"need":2,"model":"International: the tools cross a border, so transport costs and VAT can cut the margin, they must meet German standards, and against strong local competition they need a unique selling point.","fb":{"National":"Germany is another country, so this is international trade."}},{"id":"MK05","s":"A garage in Openshaw services cars for people who live in the surrounding streets.","ans":"Local","a":55,"ideas":[["Customers are within a few miles",["few miles","close","nearby","near","local","same town","miles","within","area","next door"]],["Fast delivery and low transport cost",["fast","quick","cheap","low cost","transport","van","deliver"]],["Word of mouth, local adverts or face to face contact",["word of mouth","radio","advert","paper","social media","face to face","know","in person","recommend"]]],"need":2,"model":"Local: the customers live within a few miles, so the garage wins work by word of mouth and local adverts and can sort problems out face to face.","fb":{"National":"The customers are in the surrounding streets, not across the country."}},{"id":"MK06","s":"A company sells replacement train parts to rail operators across Great Britain.","ans":"National","a":56,"ideas":[["Anywhere inside the country, no border to cross",["country","uk","britain","england","nation","border","across the"]],["Moved by road or rail",["road","rail","lorry","lorries","truck","train","van","courier"]],["One legal system, one currency, one set of standards",["legal","law","currency","pound","standard","same rules","regulation","language"]]],"need":2,"model":"National: the operators are all over the country but inside it, so parts go by road or rail, under one legal system and one set of standards.","fb":{"International":"Great Britain is one country for trade, so no national border is crossed."}},{"id":"MK07","s":"An online shop in Manchester sells 3D printer filament to buyers in the USA, Japan and Spain.","ans":"International","a":57,"ideas":[["Goods cross national borders, by air or sea",["border","abroad","overseas","air","sea","ship","plane","customs","country","countries","export"]],["Different languages, standards, regulations and paperwork",["language","standard","regulation","rules","law","paperwork","left hand","culture","custom"]],["Extra costs: transport, VAT or currency",["cost","vat","currency","exchange","tax","expensive","transport","shipping"]]],"need":2,"model":"International: digital selling makes it easy to reach buyers abroad, but the parcels still cross borders by air or sea, with customs paperwork, other currencies and different rules.","fb":{"National":"The buyers are in other countries, so this is international even though the shop is online.","Local":"Being online does not make it local. Where the customers are decides it."}},{"id":"MK08","s":"A fabrication workshop makes gates and railings for homes in its own town.","ans":"Local","a":55,"ideas":[["Customers are within a few miles",["few miles","close","nearby","near","local","same town","miles","within","area","next door"]],["Fast delivery and low transport cost",["fast","quick","cheap","low cost","transport","van","deliver"]],["Word of mouth, local adverts or face to face contact",["word of mouth","radio","advert","paper","social media","face to face","know","in person","recommend"]]],"need":2,"model":"Local: the homes are within a few miles, so the workshop can measure up and fit in person, deliver cheaply and grow through word of mouth.","fb":{"National":"The customers are in the workshop's own town, which is local."}},{"id":"MK09","s":"A UK firm makes wind turbine blades for a wind farm off the coast of Denmark.","ans":"International","a":57,"ideas":[["Goods cross national borders, by air or sea",["border","abroad","overseas","air","sea","ship","plane","customs","country","countries","export"]],["Different languages, standards, regulations and paperwork",["language","standard","regulation","rules","law","paperwork","left hand","culture","custom"]],["Extra costs: transport, VAT or currency",["cost","vat","currency","exchange","tax","expensive","transport","shipping"]]],"need":2,"model":"International: the blades cross a border by sea, and the firm must meet Danish standards and regulations and deal with currency and paperwork.","fb":{"National":"Denmark is another country, so this is international."}},{"id":"MK10","s":"A company makes school furniture and delivers it by lorry to schools all over the UK.","ans":"National","a":56,"ideas":[["Anywhere inside the country, no border to cross",["country","uk","britain","england","nation","border","across the"]],["Moved by road or rail",["road","rail","lorry","lorries","truck","train","van","courier"]],["One legal system, one currency, one set of standards",["legal","law","currency","pound","standard","same rules","regulation","language"]]],"need":2,"model":"National: schools anywhere in the UK, reached by road, with one currency, one legal system and the same standards throughout.","fb":{"Local":"The schools are all over the UK, not within a few miles."}},{"id":"MK11","s":"A precision engineering firm in Openshaw supplies parts to aircraft makers in France and the USA.","ans":"International","a":57,"ideas":[["Goods cross national borders, by air or sea",["border","abroad","overseas","air","sea","ship","plane","customs","country","countries","export"]],["Different languages, standards, regulations and paperwork",["language","standard","regulation","rules","law","paperwork","left hand","culture","custom"]],["Extra costs: transport, VAT or currency",["cost","vat","currency","exchange","tax","expensive","transport","shipping"]]],"need":2,"model":"International: the parts cross borders, so the firm must meet each country's aerospace standards and handle shipping, currency and paperwork.","fb":{"Local":"Being based in Openshaw does not make the customers local. They are in other countries."}}],"sequences":[{"id":"Q1","title":"The customer needs chain","a":131,"steps":["Identify and understand who the customers are","Market research uncovers their wants and needs","Research and development designs a product to meet them","Sales and marketing promote it to the target group"],"why":"Research finds the need, development meets it, marketing communicates it. Break any link and the product fails (lesson slide 130)."},{"id":"Q2","title":"From aluminium to a drinks can","a":96,"steps":["Raw aluminium stock: lowest value","Rolled, cut and formed","Printed, filled and sealed","Finished can on the shelf: highest value"],"why":"Value is not added in one jump. It builds at every stage of processing."},{"id":"Q3","title":"Finding out what customers want","a":50,"steps":["Choose a method: emails, questionnaires, website surveys or focus groups","Collect what customers say they want and need","Review the results","Act on them: research and development designs the product"],"why":"Gathering the information is the easy part. Reviewing it and acting on it is where companies succeed or fail (lesson slide 50)."},{"id":"Q4","title":"Working out OEE","a":88,"steps":["Planned time = shift − planned downtime","Operating time = planned time − breakdowns and changeovers","Find availability, performance and quality as decimals","OEE = availability × performance × quality"],"why":"Lesson slides 87 to 89: 480 − 30 = 450, 450 − 63 = 387, then 0.8600 × 0.8992 × 0.9644 = 74.58%."},{"id":"Q5","title":"A surplus, back to equilibrium","a":137,"steps":["The price is set above equilibrium","Supply is greater than demand, so surplus stock piles up","Prices are cut to shift the stock","The market settles back at equilibrium"],"why":"A surplus pushes the price down until the amount supplied matches the amount wanted again (lesson slides 137 and 140)."},{"id":"Q6","title":"Profit and margin, in order","a":43,"steps":["Turnover = number sold × selling price","Total costs = direct costs + indirect costs","Profit = turnover − total costs","Profit margin = (profit ÷ turnover) × 100"],"why":"Turnover first, then every cost, then profit, then margin (lesson slides 41 and 43)."},{"id":"Q7","title":"A shortage that lasts","a":137,"steps":["Demand is greater than supply","Orders cannot be filled on time","Customers drift to other suppliers","Confidence drops and some customers never come back"],"why":"Lesson slide 137: neither side of the balance is comfortable for long."},{"id":"Q8","title":"Keeping the product range alive","a":112,"steps":["A product sells well","Something changes: a rival's product, materials, regulations or what customers want","Research and development proposes a redesign or a new product","The new product reaches the market before the old one stops selling"],"why":"R and D is the company planning its next product before the current one stops selling (lesson slides 111 to 113)."}],"last":{"1":[{"id":"L101","k":"gap","q":"A ___ is anyone with an interest in a company who is affected by its successes and failures.","acc":["stakeholder","stakeholders"],"p":1,"a":19,"why":"Stakeholder: anyone with an interest in the company who is affected by how it does."},{"id":"L102","k":"term","q":"Products that are not physical, for example logistics, advice or support.","acc":["services","service"],"p":1,"a":13,"why":"Services. Goods are the physical products.","rivals":["goods"]},{"id":"L103","k":"explain","q":"Does a company have to make something to count as an engineering company? Say why.","ideas":[["No, making things is not the test",["no","not","doesnt","dont","even"]],["Designing, fixing, running or depending on engineering kit counts too",["design","fix","repair","run","depend","use","uses","service","kit","equipment","tool"]],["Size does not matter: even Amazon counts",["amazon","size","small","big","any size","large"]]],"need":2,"model":"No. If a business designs, makes, fixes or runs engineering kit, or depends on it to work, it counts. Size does not matter: even Amazon counts.","p":1,"a":8},{"id":"L104","k":"explain","q":"Name an internal stakeholder and say what that group wants from the company.","ideas":[["An internal group: owners, managers or employees",["owner","manager","employee","staff","worker","shareholder"]],["What they want: pay, safety, job security, a return or targets met",["pay","wage","safe","security","job","return","profit","target","dividend","money"]]],"need":2,"model":"Employees are internal stakeholders. They want fair pay, safe work and job security. Owners want a return on the money they risked.","p":1,"a":22},{"id":"L105","k":"short","q":"Is a bank that lent the company money an internal or an external stakeholder?","acc":["external","external stakeholder","creditor","a creditor","external creditor"],"p":1,"a":21,"why":"External. The bank is a creditor: outside the company, but affected if it cannot repay.","rivals":["internal"]},{"id":"L106","k":"term","q":"The organisation or person that takes people on and pays them to work.","acc":["employer","the employer"],"p":1,"a":13,"why":"Employer. The employee is the person employed.","rivals":["employee"]},{"id":"L107","k":"explain","q":"Who is affected when a big factory opens or closes? Name three different groups.","ideas":[["Workers and their families",["worker","employee","staff","famil","job"]],["Owners",["owner","shareholder","investor"]],["Suppliers",["supplier"]],["Customers",["customer","buyer"]],["Local shops and the community",["shop","community","local","neighbour","resident","town","people who live"]],["The council or government",["council","government","tax"]]],"need":3,"model":"The workers and their families, the owners, suppliers, customers, local shops and the wider community, and the council and government.","p":1,"a":19},{"id":"L108","k":"gap","q":"Owners, managers and employees are all ___ stakeholders.","acc":["internal"],"p":1,"a":22,"why":"Internal: inside the organisation.","rivals":["external"]}],"2":[{"id":"L201","k":"gap","q":"Profit = turnover − total ___.","acc":["costs","cost","total costs"],"p":2,"a":41,"why":"Profit = turnover − total costs."},{"id":"L202","k":"num","q":"250 steel brackets are sold at £18.00 each. What is the turnover?","v":4500,"unit":"","tol":0.002,"p":2,"a":41,"why":"250 × £18.00 = £4,500.","money":true},{"id":"L203","k":"term","q":"A cost shared across the whole company, such as office staff, insurance or IT.","acc":["indirect cost","indirect costs","indirect","overheads","overhead"],"p":2,"a":38,"why":"An indirect cost.","rivals":["direct cost","direct","direct costs"]},{"id":"L204","k":"explain","q":"Which costs do companies forget when they price a job, and what happens if they do?","ideas":[["Indirect costs, such as rent, office wages and insurance",["indirect","overhead","rent","office","insurance","shared","electric","energy"]],["A job that looked profitable turns out not to be",["loss","not profitable","no profit","less profit","lose money","losing money","profit"]]],"need":2,"model":"Indirect costs, such as rent, office wages and insurance. Leave them out and a job that looked profitable turns out not to be.","p":2,"a":39},{"id":"L205","k":"explain","q":"Name the five things a company can do with its profit.","ideas":[["Dividends",["dividend"]],["Capital",["capital","save","saving","reserve","kept","held back"]],["Bonuses",["bonus"]],["Innovation",["innovat","research","r and d","r&d","new product"]],["Investment",["invest","machine","equipment","premises","upgrad"]]],"need":4,"model":"Dividends to shareholders, capital held back for the future, bonuses for employees, innovation through research and development, and investment in tools, machinery and premises.","p":2,"a":49},{"id":"L206","k":"explain","q":"Give two things Bentley must think about when it sells cars abroad that are engineering decisions, not sales decisions.","ideas":[["Left hand drive as well as right hand drive",["left hand","right hand","steering","drive","side of the road"]],["Seat and pedal positions for different average heights",["seat","pedal","height","tall","short"]],["Emissions, lighting and safety rules in each market",["emission","light","safety","regulation","standard","rules","law"]],["Interior trim, such as leather, for cultural reasons",["leather","trim","religio","cultur"]]],"need":2,"model":"Bentley builds left hand drive cars as well as right hand drive, adjusts seat and pedal positions for different average heights, and meets each market's rules on emissions, lighting and safety.","p":2,"a":60},{"id":"L207","k":"explain","q":"Can a company be a customer? Explain.","ideas":[["Yes",["yes","can","it can"]],["A customer is anyone who exchanges money for goods or services, including a business",["exchang","pay","buy","money","business","company","manufacturer","motorbike","component","supplier"]]],"need":2,"model":"Yes. A customer is anyone who exchanges money for goods or services. A motorbike maker buying components from its suppliers is their customer.","p":2,"a":53},{"id":"L208","k":"num","q":"Turnover is £286,000 and profit is £54,800. What is the profit margin, to 2 decimal places?","v":19.16,"unit":"%","tol":0.002,"p":2,"a":43,"why":"(54,800 ÷ 286,000) × 100 = 19.16%."}],"3":[{"id":"L301","k":"gap","q":"Quality, cost and ___ are the three corners of the triangle organisations balance.","acc":["time"],"p":3,"a":69,"why":"Quality, cost and time."},{"id":"L302","k":"explain","q":"Pick any two of quality, cost and time. What does the third one lose?","ideas":[["Fast and cheap: quality slips",["quality","worse","drops","lower standard","poor"]],["Good and fast: it costs more",["cost","expensive","more money","dearer","price"]],["Good and cheap: it takes longer",["longer","slow","time","takes"]]],"need":2,"model":"Fast and cheap: quality slips. Good and fast: it costs more. Good and cheap: it takes longer.","p":3,"a":70},{"id":"L303","k":"num","q":"480 parts are made in a shift and 24 are scrapped. What is the yield?","v":95,"unit":"%","tol":0.002,"p":3,"a":84,"why":"Good parts 456. (456 ÷ 480) × 100 = 95%."},{"id":"L304","k":"short","q":"A skilled engineer spends the day filing. Which of the eight wastes is that?","acc":["skills","skill","unused talent","talent","unused skills","wasted skills"],"p":3,"a":80,"why":"Skills, the eighth waste. The Autumn 2023 mark scheme accepts unused talent."},{"id":"L305","k":"explain","q":"Is every non-value added job pure waste? Explain.","ideas":[["No",["no","not"]],["Some is necessary, such as safety checks or required inspection",["safety","inspection","legal","law","necessary","required","needed","check"]],["The aim is to reduce it, not pretend it can go",["reduce","cut down","minimi","less"]]],"need":2,"model":"No. Some is necessary anyway, such as safety checks and legally required inspection. Lean calls this necessary non-value added: the aim is to reduce it, not pretend it can be removed.","p":3,"a":98},{"id":"L306","k":"num","q":"A sheet of aluminium costs £2.40. The pressed panel made from it sells for £11.00. What is the value added?","v":8.6,"unit":"","tol":0.002,"p":3,"a":101,"why":"£11.00 − £2.40 = £8.60.","money":true},{"id":"L307","k":"explain","q":"Name the three kinds of innovation.","ideas":[["Technological",["technolog"]],["Business model",["business model","subscription","charging"]],["Process",["process","assembly line","lean","making"]]],"need":3,"model":"Technological (a new capability, such as touchscreens), business model (a new way of charging, such as subscriptions) and process (a new way of making, such as the assembly line).","p":3,"a":116},{"id":"L308","k":"short","q":"Which government body grants patents and registers trade marks and designs?","acc":["intellectual property office","the intellectual property office","ipo","the ipo"],"p":3,"a":118,"why":"The Intellectual Property Office."}],"4":[{"id":"L401","k":"term","q":"When only one company provides a product or service in a market.","acc":["monopoly","a monopoly"],"p":4,"a":126,"why":"A monopoly."},{"id":"L402","k":"explain","q":"Name three ways to beat a rival without cutting your price.","ideas":[["Product features",["feature","better product","quality","design","does more"]],["Service: warranty, support or spare parts",["service","warrant","support","spare","after sales","aftercare"]],["Convenience: easier or faster to get",["conven","easier","faster","quick","deliver","availab"]],["Customisation: built to order",["custom","bespoke","tailor","personal","to order"]]],"need":3,"model":"Better product features, better service such as a warranty, support and spare parts, convenience, and customisation built to the customer's order.","p":4,"a":128},{"id":"L403","k":"gap","q":"Where the supply and demand lines cross is called ___.","acc":["equilibrium","the equilibrium","equilibrium point","the equilibrium point","market equilibrium"],"p":4,"a":135,"why":"Equilibrium: the amount supplied matches the amount wanted."},{"id":"L404","k":"explain","q":"What goes wrong if a company makes far more than customers want?","ideas":[["Surplus stock piles up and storage costs money",["surplus","stock","storage","store","pile","space","warehouse"]],["Goods pass their sell by date",["date","out of date","expire","old"]],["Prices are cut to shift it",["price","cut","cheaper","discount","sale"]],["Sales have to work harder to widen the market",["sales","market","advert","harder","new customers"]]],"need":2,"model":"Surplus goods pile up in storage, which costs money and takes space. Some pass their sell by date, prices are cut to shift the stock, and sales have to work harder to widen the market.","p":4,"a":137},{"id":"L405","k":"short","q":"In the customer needs chain, what comes straight after identifying who the customers are?","acc":["market research","research","market research uncovers their wants and needs","finding out what they want","doing market research","researching the market"],"p":4,"a":131,"why":"Market research uncovers their wants and needs. Then R and D designs, then sales and marketing promote.","rivals":["research and development","sales and marketing","marketing","r and d"]},{"id":"L406","k":"explain","q":"Why is demand so hard to predict?","ideas":[["Many things affect it: fashion, seasons, the economy, world events",["fashion","season","economy","event","factor","pandemic","world","weather","trend","environment"]],["Fads and crazes come and go",["fad","craze","sudden","viral","popular","hype"]]],"need":2,"model":"So many factors in the business environme le but putting some buyers off.","p":4,"a":146},{"id":"B403","k":"short","q":"At a price above equilibrium, is there a surplus or a shortage?","acc":["surplus","a surplus","there is a surplus"],"p":4,"a":140,"why":"A surplus: supply is greater than demand at that price.","rivals":["shortage"]},{"id":"B404","k":"explain","q":"Name one thing that can make supply fall, and one thing that can make demand fall.","ideas":[["Supply: scarce or dearer materials, a complex process, low productivity or breakdowns",["material","component","scarce","cost","complex","productiv","breakdown","machine","staff","shortage of"]],["Demand: out of fashion, out of season, or a saturated market",["fashion","season","saturat","already bought","trend","craze","economy","popular"]]],"need":2,"model":"Supply falls if materials become scarce or dearer, or productivity drops. Demand falls if the product goes out of fashion or out of season, or the market is saturated.","p":4,"a":136},{"id":"B405","k":"term","q":"A company's ability to produce goods or services for sale.","acc":["supply","the supply"],"p":4,"a":132,"why":"Supply.","rivals":["demand"]},{"id":"B406","k":"explain","q":"Why would a luxury car buyer want different things from a city car buyer?","ideas":[["They are different customers with different needs",["different","customer","need","want","use","type"]],["Luxury: comfort, performance, finish. City car: low price, small size, low running costs",["comfort","performance","luxury","finish","price","cheap","small","size","running","parking","econom"]]],"need":2,"model":"They are different customers with different uses. The luxury buyer wants comfort, performance and finish; the city car buyer wants a low price, a small car and low running costs.","p":4,"a":129},{"id":"B407","k":"gap","q":"If only one company provides a service in a market, it has a ___.","acc":["monopoly"],"p":4,"a":126,"why":"A monopoly, such as a nationalised railway."}]},"taboo":[{"id":"TB01","term":"Profit","ban":[ y of charging",["product","making","process","charg","business model","technolog","first","never"]],["An example: touchscreens, subscriptions, the assembly line",["touch","subscription","assembly","battery","stream","lean"]]],"model":"Doing something that has never been done before: a fresh product, a better way of making it, or a different way of charging for it, like music streaming."}],"why":[{"id":"Y01","q":"A company has a very large turnover. Does that mean it makes a big profit?","a":36,"steps":[{"label":"Pick the answer","correct":"Not necessarily","wrongs":["Yes, always","Yes, as long as it sells abroad","No, a big turnover always means a loss"]},{"label":"Pick the reason","correct":"Profit is what is left after costs, and the costs can be as big as the turnover","wrongs":["Turnover and profit are the same thing","Turnover only counts goods, not services","Profit is worked out before costs are taken off"]}]},{"id":"Y02","q":"A quote covers the materials and the machinist's wages only. Will the job make the profit expected?","a":39,"steps":[{"label":"Pick the answer","correct":"Probably not","wrongs":["Yes, those are the only costs","Yes, as long as it sells","It will make more profit than expected"]},{"label":"Pick the reason","correct":"Indirect costs such as rent, insurance and office wages still have to be paid from the price","wrongs":["Materials always cost less than quoted","Machinists' wages are an indirect cost","Profit is taken off before costs"]}]},{"id":"Y03","q":"Comparing a small firm with a large one: which tells you more, the profit or the profit margin?","a":43,"steps":[{"label":"Pick the answer","correct":"The profit margin","wrongs":["The profit","The turnover","The total costs"]},{"label":"Pick the reason","correct":"It shows profit as a share of turnover, so the size of the firm does not distort the comparison","wrongs":["It is always the bigger number","It includes the dividends paid","It leaves the costs out"]}]},{"id":"Y04","q":"Should a company that plans to be here in ten years pay out all its profit as dividends?","a":47,"steps":[{"label":"Pick the answer","correct":"No","wrongs":["Yes","Yes, the law says it must","Only if it has a monopoly"]},{"label":"Pick the reason","correct":"It needs capital and investment to survive and grow, such as new machines and research and development","wrongs":["Shareholders never want dividends","Dividends are a direct cost","Profit cannot be saved"]}]},{"id":"Y05","q":"Is selling to international customers simpler or harder than selling locally?","a":57,"steps":[{"label":"Pick the answer","correct":"Harder","wrongs":["Simpler","Exactly the same","Simpler, because there are more customers"]},{"label":"Pick the reason","correct":"Different languages, standards, regulations and paperwork, and long journeys across borders","wrongs":["International customers always pay less","Local customers need more paperwork","Goods cannot be sent abroad by sea"]}]},{"id":"Y06","q":"A customer wants a top quality job, done fast. What usually happens to the cost?","a":70,"steps":[{"label":"Pick the answer","correct":"It goes up","wrongs":["It goes down","It stays the same","Quality drops instead"]},{"label":"Pick the reason","correct":"Two corners are fixed, so the third one moves: overtime, extra staff or faster machines cost money","wrongs":["Fast jobs always use less material","Quality has no effect on cost","Customers pay less for speed"]}]},{"id":"Y07","q":"500 brackets are made for an order of 300. Which waste is this?","a":82,"steps":[{"label":"Pick the answer","correct":"Over-production","wrongs":["Inventory","Defects","Over-processing"]},{"label":"Pick the reason","correct":"More has been made than is needed right now, tying up material, machine time and storage","wrongs":["The brackets have faults","The brackets were polished more than needed","The brackets were carried round the site"]}]},{"id":"Y08","q":"Is testing that proves a product meets its specification value r than price, such as service or customisation","wrongs":["Cut its price below cost for good","Copy the rival's product exactly","Stop doing market research"]},{"label":"Pick the reason","correct":"Customers value differences such as a warranty, support, speed or a product built to order","wrongs":["Customers only ever look at price","Big firms cannot cut their prices","Customisation always costs less to make"]}]}],"errors":[{"id":"E01","a":36,"chunks":["A company with a large turnover","always makes a large profit,","because profit is what is left after costs."],"wrong":1,"fix":"A large turnover does not guarantee a profit. If the costs are larger, the company makes a loss (lesson slide 36)."},{"id":"E02","a":43,"chunks":["Profit margin = (profit ÷ total costs) × 100,","so a profit of £54,800","on a turnover of £286,000 is a margin of 19.16%."],"wrong":0,"fix":"Margin is profit ÷ turnover, not costs: (54,800 ÷ 286,000) × 100 = 19.16%."},{"id":"E03","a":38,"chunks":["Office cleaning wages","are a direct cost,","because the cleaner does not make the product."],"wrong":1,"fix":"They are an indirect cost: shared across the company, not part of making the product."},{"id":"E04","a":41,"chunks":["250 brackets at £18.00 each","give a turnover of £4,500,","so the profit is £4,500."],"wrong":2,"fix":"Profit = turnover − total costs = £4,500 − £3,150 = £1,350. £4,500 is the turnover."},{"id":"E05","a":46,"chunks":["Material at £19.50 rises by 12%,","so the new cost is £19.50 + £0.12 = £19.62","per gear."],"wrong":1,"fix":"12% of £19.50 is £2.34, so the new cost is £19.50 × 1.12 = £21.84. Adding 12p treats a percentage as pence."},{"id":"E06","a":81,"chunks":["TIMWOODS lists eight wastes:","transport, inventory, motion, waiting,","over-production, overtime, defects and skills."],"wrong":2,"fix":"The second O is over-processing, not overtime."},{"id":"E07","a":84,"chunks":["480 parts are made and 24 are scrapped.","Yield is the share of good parts,","so yield = (24 ÷ 480) × 100 = 5%."],"wrong":2,"fix":"Yield uses the good parts: (456 ÷ 480) × 100 = 95%. 5% is the scrap rate."},{"id":"E08","a":89,"chunks":["Availability 0.86, performance 0.90 and quality 0.96","are added together for OEE,","and the result is turned into a percentage."],"wrong":1,"fix":"They are multiplied: 0.86 × 0.90 × 0.96 = 0.743, so the OEE is 74.3%."},{"id":"E09","a":101,"chunks":["A sheet costs £2.40","and the finished panel sells for £11.00,","so the value added is £13.40."],"wrong":2,"fix":"Value added = selling price − bought in materials = £11.00 − £2.40 = £8.60."},{"id":"E10","a":97,"chunks":["Moving parts from the stores to a machine","is value added,","because it gets the parts where they need to be."],"wrong":1,"fix":"Moving parts does not change the product, so it is non-value added (lesson slide 97)."},{"id":"E11","a":116,"chunks":["Music streaming subscriptions","are an example of process innovation,","because they change how people pay."],"wrong":1,"fix":"A new way of charging is business model innovation. Process innovation is a new way of making something."},{"id":"E12","a":126,"chunks":["When only one company provides a service in a market,","it is called a competitive advantage,","for example a nationalised railway."],"wrong":1,"fix":"That is a monopoly. A competitive advantage is a difference customers value over a rival's product."},{"id":"E13","a":137,"chunks":["When supply is greater than demand,","surplus stock piles up in storage,","so the price in the market tends to rise."],"wrong":2,"fix":"A surplus pushes the price down: stock is cut in price to shift it. Prices rise when demand is greater than supply."},{"id":"E14","a":55,"chunks":["Local customers are usually within a few miles,","so delivery is fast and transport costs are low,","but every sale needs customs paperwork."],"wrong":2,"fix":"Customs paperwork comes with international customers, not local ones (lesson slide 57)."},{"id":"E15","a":22,"chunks":["Owners, managers and employees",
