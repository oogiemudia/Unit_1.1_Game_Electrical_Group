<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unit 8 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Unit 8 games hub</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}

/* added for the Unit 2 and Unit 8 engines */
.chunks.lines{flex-direction:column}
.chunks.lines .chunk{width:100%;font-variant-numeric:tabular-nums}
.taboo{margin:14px 0 4px;padding:18px 16px;border-radius:16px;border:2px solid var(--head);background:var(--card);text-align:center}
.taboo .sector{font-size:1.8em;font-weight:700;color:var(--head);line-height:1.15}
.taboo .dont{margin:10px 0 6px;color:var(--red);font-weight:700;font-size:.82em;text-transform:uppercase;letter-spacing:.08em}
.taboo .banned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.taboo .banned span{padding:6px 12px;border-radius:999px;background:var(--badbg);color:var(--red);font-weight:700;text-decoration:line-through}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
@media (min-width:560px){.wgrid{grid-template-columns:repeat(4,1fr)}}
.wtile{min-height:64px;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--head);font-weight:700;line-height:1.25;font-size:.9em}
.wtile:not(:disabled):hover{border-color:var(--amber)}
.wtile[aria-pressed="true"]{border-color:var(--amber);background:var(--ambbg)}
.wsolved{border-radius:10px;padding:8px 12px;margin-top:8px;border-left:5px solid var(--green);background:var(--goodbg)}
.wsolved b{display:block;color:var(--head)} .wsolved span{font-size:.88em}
.wsolved.w1{border-left-color:var(--amber);background:var(--ambbg)}
.wsolved.w2{border-left-color:var(--head);background:var(--tint)}
.wsolved.w3{border-left-color:var(--muted);background:var(--tint)}
.ftable td{text-align:left!important}

k the arithmetic with P = V squared divided by R.", "wrongs": ["Continuity or resistance range across the fuse, supply isolated. A healthy fuse reads close to 0 ohm.", "DC voltage across the cell terminals under load, not off load. The off load reading is the trap.", "Resistance range with the supply isolated and the winding disconnected at one end, compared against the rating plate."]}]}, {"q": "A circuit blows its fuse the instant it is switched on. With the supply isolated, the resistance across the supply terminals reads 0.3 ohm where 100 ohm is expected.", "steps": [{"label": "Name the cause", "correct": "Short circuit across the supply", "wrongs": ["Blown fuse, so the circuit is open", "Flat cell", "Short circuited turns in the winding"]}, {"label": "Pick the confirming test", "correct": "Resistance across the supply terminals with the load disconnected in stages, to find which branch holds the short.", "wrongs": ["Continuity or resistance range across the fuse, supply isolated. A healthy fuse reads close to 0 ohm.", "DC voltage across the cell terminals under load, not off load. The off load reading is the trap.", "Resistance range with the supply isolated and the winding disconnected at one end, compared against the rating plate."]}]}]}, "G7": {"id": "G7", "title": "Read the waveform", "engine": "quiz", "what": "Eight traces drawn on the screen. Read them properly.", "items": [{"draw": ["wave", 2.0, 4.0], "q": "Read the waveform below.", "prompt": "What is the amplitude?", "correct": "2 V", "wrongs": ["4 V", "1 V", "0.25 V"], "why": "Amplitude is measured from zero to the peak, not peak to peak."}, {"draw": ["wave", 2.0, 4.0], "q": "The same waveform.", "prompt": "What is the peak to peak value?", "correct": "4 V", "wrongs": ["2 V", "8 V", "1 V"], "why": "Peak to peak is twice the amplitude."}, {"draw": ["wave", 3.0, 2.0], "q": "One complete cycle takes 8 ms.", "prompt": "What is the frequency?", "correct": "125 Hz", "wrongs": ["8 Hz", "800 Hz", "0.008 Hz"], "why": "f = 1 divided by T. Convert the milliseconds first."}, {"draw": ["wave", 1.0, 2.0], "q": "UK mains runs at 50 Hz.", "prompt": "What is the period?", "correct": "20 ms", "wrongs": ["50 ms", "0.5 s", "2 ms"], "why": "T = 1 divided by 50 = 0.02 s, which is 20 ms."}, {"draw": ["dc"], "q": "This trace was taken on an oscilloscope.", "prompt": "What is it?", "correct": "Direct current", "wrongs": ["Alternating current", "A square wave", "A sawtooth wave"], "why": "Constant value, one direction only. A battery gives this."}, {"draw": ["square"], "q": "Name this waveform shape.", "prompt": "What is it called?", "correct": "Square", "wrongs": ["Sinusoidal", "Triangular", "Sawtooth"], "why": "Named in the range: sinusoidal, square, rectangular, triangular and sawtooth."}, {"draw": ["saw"], "q": "Name this waveform shape.", "prompt": "What is it called?", "correct": "Sawtooth", "wrongs": ["Triangular", "Square", "Rectangular"], "why": "It rises slowly and falls almost instantly. A triangle rises and falls evenly."}, {"draw": ["tri"], "q": "Name this waveform shape.", "prompt": "What is it called?", "correct": "Triangular", "wrongs": ["Sawtooth", "Sinusoidal", "Square"], "why": "Equal rise and fall. The sawtooth is the one with the vertical edge."}]}, "G8": {"id": "G8", "title": "Meter connection", "engine": "quiz", "what": "Six benches. Series, parallel, or power off first.", "items": [{"draw": ["meter", "V"], "q": "You need to measure the voltage across the resistor.", "prompt": "How does the meter go in?", "correct": "In parallel, across the component", "wrongs": ["In series, with the circuit broken", "In parallel, across the supply", "In series, with the supply off"], "why": "Voltage is always measured across, never through."}, {"draw": ["meter", "A"], "q": "You need to measure the current through the lamp.", "prompt": "How does the meter go in?", "correct": "In series, with the circuit broken", "wrongs": ["In parallel, across the lamp", "In parallel, across the supply", "Across the supply with the power off"], "why": "All the current has to pass through the meter, so the loop is broken to take it."}, {"draw": ["meter", "R"], "q": "You need to measure the resistance of the component.", "prompt": "What has to happen first?", "correct": "Switch the supply off and isolate it", "wrongs": ["Turn the supply up to full", "Move the red lead to the 10 A socket", "Nothing, the meter protects itself"], "why": "Then lift the component out, or anything in parallel gives a lower reading."}, {"draw": ["meter", "short"], "q": "An ammeter has been connected straight across the supply.", "prompt": "What is this?", "correct": "A short circuit, and a hazard", "wrongs": ["A normal current reading", "A voltage reading", "Fine, as long as the range is high enough"], "why": "An ammeter has almost no resistance. This is a hazard, not simply an error."}, {"draw": ["meter", "V"], "q": "The red lead is still in the 10 A socket from the last reading.", "prompt": "You now select volts and touch the probes across the supply. What happens?", "correct": "The supply is short circuited through the meter", "wrongs": ["Nothing, the dial overrides the socket", "The meter reads volts as normal", "The meter reads amps instead"], "why": "Dial first, then the lead into the matching input, then the circuit. Every time."}, {"draw": ["meter", "R"], "q": "A resistor is measured while it is still soldered into a board.", "prompt": "What is wrong with the reading?", "correct": "Anything in parallel with it reads lower", "wrongs": ["It reads higher than it should", "It reads correctly", "It reads zero every time"], "why": "Lift one end out of circuit. In circuit readings are almost always wrong."}]}, "G9": {"id": "G9", "title": "Field and direction", "engine": "quiz", "what": "Eight field diagrams. Cross, dot, poles and rules.", "items": [{"draw": ["cross"], "q": "Current is flowing in this conductor, seen end on.", "prompt": "Which way is the current going?", "correct": "Into the screen", "wrongs": ["Out of the screen", "Left to right", "There is no current"], "why": "Think of an arrow: you see the flights going away from you."}, {"draw": ["dot"], "q": "Current is flowing in this conductor, seen end on.", "prompt": "Which way is the current going?", "correct": "Out of the screen", "wrongs": ["Into the screen", "Right to left", "There is no current"], "why": "The point of the arrow is coming towards you."}, {"draw": ["magnet"], "q": "A bar magnet and its field.", "prompt": "Which way do the arrows run outside the magnet?", "correct": "North to south", "wrongs": ["South to north", "Both ways at once", "They do not have a direction"], "why": "Outside the magnet, north to south. Inside, the other way."}, {"draw": ["magnet"], "q": "Two lines of flux appear to be about to cross.", "prompt": "What does that tell you?", "correct": "The drawing is wrong, flux lines never cross", "wrongs": ["The field is strongest there", "The field reverses there", "There are two magnets"], "why": "They take the shortest route between opposite poles and never cross."}, {"draw": ["coil"], "q": "Current flows round this coil in the direction shown.", "prompt": "Which rule tells you which end is north?", "correct": "The right hand grip rule", "wrongs": ["Fleming's left hand rule", "Fleming's right hand rule", "Lenz's law"], "why": "Wrap the fingers of your right hand along the current. The thumb points to north."}, {"draw": ["coil"], "q": "The current through the coil is reversed.", "prompt": "What happens to the poles?", "correct": "They swap over", "wrongs": ["Nothing changes", "The field disappears", "The coil saturates"], "why": "Reverse the current and the field reverses with it."}, {"draw": ["force"], "q": "A conductor carries current into the screen, in a field running upwards.", "prompt": "Which rule gives the direction of the force?", "correct": "Fleming's left hand rule", "wrongs": ["Fleming's right hand rule", "The right hand grip rule", "Faraday's first law"], "why": "Left hand for a motor: current in, movement out."}, {"draw": ["force"], "q": "A conductor is pushed through a field and a current appears in it.", "prompt": "Which rule gives the direction of that current?", "correct": "Fleming's right hand rule", "wrongs": ["Fleming's left hand rule", "The right hand grip rule", "Ohm's law"], "why": "Right hand for a generator: movement in, current out."}]}, "G10": {"id": "G10", "title": "Symbol sprint", "engine": "quiz", "what": "Ten circuit symbols, drawn on the screen. Name them.", "items": [{"draw": ["sym", "resistor"], "q": "Name this component.", "prompt": "What is it?", "correct": "Resistor", "wrongs": ["Capacitor", "Inductor", "Diode"], "why": "You would measure resistance, in ohm, Ω."}, {"draw": ["sym", "capacitor"], "q": "Name this component.", "prompt": "What is it?", "correct": "Capacitor", "wrongs": ["Resistor", "Inductor", "Diode"], "why": "You would measure capacitance, in farad, F."}, {"draw": ["sym", "inductor"], "q": "Name this component.", "prompt": "What is it?", "correct": "Inductor", "wrongs": ["Resistor", "Capacitor", "Diode"], "why": "You would measure inductance, in henry, H."}, {"draw": ["sym", "diode"], "q": "Name this component.", "prompt": "What is it?", "correct": "Diode", "wrongs": ["Resistor", "Capacitor", "Inductor"], "why": "You would measure forward volt drop on the diode range, in volt, V."}, {"draw": ["sym", "led"], "q": "Name this component.", "prompt": "What is it?", "correct": "LED", "wrongs": ["Resistor", "Capacitor", "Inductor"], "why": "You would measure forward volt drop on the diode range, in volt, V."}, {"draw": ["sym", "transistor"], "q": "Name this component.", "prompt": "What is it?", "correct": "Transistor", "wrongs": ["Resistor", "Capacitor", "Inductor"], "why": "You would measure forward volt drop across each junction, in volt, V."}, {"draw": ["sym", "fuse"], "q": "Name this component.", "prompt": "What is it?", "correct": "Fuse", "wrongs": ["Resistor", "Capacitor", "Inductor"], "why": "You would measure continuity, so resistance, in ohm, Ω."}, {"draw": ["sym", "cell"], "q": "Name this component.", "prompt": "What is it?", "correct": "Cell or battery", "wrongs": ["Resistor", "Capacitor", "Inductor"], "why": "You would measure voltage, off load then under load, in volt, V."}, {"draw": ["sym", "fuse"], "q": "This symbol is a rectangle in a line, like a resistor.", "prompt": "How do you tell a fuse from a resistor?", "correct": "By what the component is for, not what it looks like", "wrongs": ["The fuse box is always wider", "The fuse has no leads", "The resistor symbol is a zigzag"], "why": "This is the one that causes the argument. A fuse protects, a resistor limits."}, {"draw": ["sym", "capacitor"], "q": "A capacitor is marked 100n on a circuit board.", "prompt": "What does that mean?", "correct": "100 nanofarad", "wrongs": ["100 nanoamp", "100 ohm", "Just the number 100"], "why": "Marking conventions on small components leave the F off."}]}, "G11": {"id": "G11", "title": "Say it carefully", "engine": "quiz", "what": "Twelve pairs. One wording is precise, the other is the one that loses marks.", "items": [{"q": "Resistance and what it does to the electrons.", "prompt": "Which wording would you write in an exam?", "correct": "It reduces how many electrons pass a point each second", "wrongs": ["It slows the electrons down", "It uses the electrons up", "It stops some electrons and lets others through"], "why": "Rate, not speed. Resistance changes how many pass per second."}, {"q": "What happens along a series circuit.", "prompt": "Which wording would you write in an exam?", "correct": "The current is the same everywhere and the voltage is shared out", "wrongs": ["The current is used up by each resistor in turn", "The voltage is the same everywhere and the current is shared out", "Both the current and the voltage are shared out"], "why": "Current is the same at every point. What gets divided is the voltage."}, {"q": "How B and H are related.", "prompt": "Which wording would you write in an exam?", "correct": "H is what you apply and B is what results, and the link depends on the material", "wrongs": ["They are the same quantity in different units", "B is what you apply and H is what results", "They are always in the same proportion"], "why": "That dependence on the material is the whole point of the B against H graph."}, {"q": "Flux and flux density.", "prompt": "Which wording would you write in an exam?", "correct": "Flux is the total through an area, flux density is the amount per unit area", "wrongs": ["They are the same thing said two ways", "Flux density is the total and flux is the amount per unit area", "Flux is measured in tesla and flux density in webers"], "why": "They differ by an area. Webers for one, tesla for the other."}, {"q": "What the supply provides to a circuit.", "prompt": "Which wording would you write in an exam?", "correct": "The push. The electrons are already in the wire", "wrongs": ["The electrons, which are then used up", "The electrons, which travel from the switch to the lamp", "The resistance that the circuit needs"], "why": "Electricity is not stored in the wire and used up."}, {"q": "A capacitor next to a battery.", "prompt": "Which wording would you write in an exam?", "correct": "A capacitor holds only what you put in, and its voltage falls as it discharges", "wrongs": ["A capacitor is a small battery", "A capacitor makes charge from a chemical reaction", "A capacitor holds its voltage the way a battery does"], "why": "A battery makes charge chemically and holds its voltage. A capacitor does neither."}, {"q": "What semiconductor means.", "prompt": "Which wording would you write in an exam?", "correct": "Its conduction can be controlled", "wrongs": ["It only half works", "It conducts at half the rate of copper", "It conducts in one direction only"], "why": "Controlled conduction is the entire point of a transistor."}, {"q": "Why a transformer will not work on DC.", "prompt": "Which wording would you write in an exam?", "correct": "A transformer needs a changing flux, and DC does not give one", "wrongs": ["DC is not powerful enough", "DC saturates the core straight away", "The primary would need more turns on DC"], "why": "No change means nothing induced in the secondary."}, {"q": "What induces an emf in a coil.", "prompt": "Which wording would you write in an exam?", "correct": "A change in the flux linking the circuit", "wrongs": ["A strong magnet held inside the coil", "A strong magnet anywhere near the coil", "Any magnet, as long as the coil has enough turns"], "why": "Strength is not the point. Change is."}, {"q": "An atom that has lost an electron.", "prompt": "Which wording would you write in an exam?", "correct": "Something negative has left, so the atom is now positively charged", "wrongs": ["The atom has gained a positive charge from the supply", "A proton has been added to the nucleus", "The atom has gained a neutron"], "why": "Nothing is added. Something negative has left."}, {"q": "How potential difference is measured.", "prompt": "Which wording would you write in an exam?", "correct": "Across a component, between two points either side of it", "wrongs": ["Through a component, in series with it", "Across the supply only", "Either across or through, it makes no difference"], "why": "Across, never through. It is a difference between two points."}, {"q": "A meter reading of 0.047 written in your book.", "prompt": "Which wording would you write in an exam?", "correct": "It means nothing until you write the unit with it", "wrongs": ["It is a complete reading as it stands", "It means 47 milli of whatever you measured", "The unit can be added later from memory"], "why": "0.047 could be volts, amperes or farads. Three different situations."}]}, "G12": {"id": "G12", "title": "Command words", "engine": "quiz", "what": "Twelve questions on what each instruction is actually asking you to do.", "items": [{"q": "Give the meaning of a term, precisely.", "prompt": "Which command word, or which answer?", "correct": "Define", "wrongs": ["Describe", "State", "Explain"], "why": "Define asks for the meaning. Describe asks what it is or what happens."}, {"q": "Say how or why, with a causal link in it.", "prompt": "Which command word, or which answer?", "correct": "Explain", "wrongs": ["Describe", "State", "Identify"], "why": "An explanation needs because or so in it. Without one it is a description."}, {"q": "Work out a value, showing the formula, the substitution and the unit.", "prompt": "Which command word, or which answer?", "correct": "Calculate", "wrongs": ["State", "Evaluate", "Justify"], "why": "A bare number scores nothing, however right it is."}, {"q": "Give the similarities and the differences between two things.", "prompt": "Which command word, or which answer?", "correct": "Compare", "wrongs": ["Describe", "Discuss", "Identify"], "why": "Both halves are needed. Differences alone is not a comparison."}, {"q": "Give reasons that support a choice you have already made.", "prompt": "Which command word, or which answer?", "correct": "Justify", "wrongs": ["Explain", "Evaluate", "Describe"], "why": "Justify defends a decision. Explain accounts for how something works."}, {"q": "Weigh more than one side and reach a judgement.", "prompt": "Which command word, or which answer?", "correct": "Discuss or evaluate", "wrongs": ["Compare", "Explain", "Describe"], "why": "A judgement is required. Laying out both sides and stopping does not answer it."}, {"q": "A short factual answer, with no explanation needed.", "prompt": "Which command word, or which answer?", "correct": "State", "wrongs": ["Explain", "Describe", "Justify"], "why": "State wants the fact. Writing a paragraph wastes time you need elsewhere."}, {"q": "Name the thing being asked for.", "prompt": "Which command word, or which answer?", "correct": "Identify", "wrongs": ["Define", "Describe", "Explain"], "why": "Identify asks which one. Define asks what it means."}, {"q": "Say what something is or what happens, in more detail than state.", "prompt": "Which command word, or which answer?", "correct": "Describe", "wrongs": ["Explain", "Define", "Evaluate"], "why": "Describe says what. Explain says how or why."}, {"q": "A question says: explain why an ammeter is connected in series.", "prompt": "Which command word, or which answer?", "correct": "Your answer needs the word because or so in it", "wrongs": ["A one word answer is enough", "You should give both sides and judge between them", "You should show a formula and a substitution"], "why": "Explain means a causal link. Without one you have described, not explained."}, {"q": "A question says: state the unit of magnetic field strength.", "prompt": "Which command word, or which answer?", "correct": "Amperes per metre, and nothing else", "wrongs": ["Amperes per metre, and why", "A full sentence explaining field strength", "The formula H = (I x N) divided by l"], "why": "State wants the fact. Extra writing earns nothing here."}, {"q": "A question says: calculate the charge moved. You write 80 C with no working.", "prompt": "Which command word, or which answer?", "correct": "You lose the formula and substitution marks", "wrongs": ["You get full marks, the answer is right", "You lose everything, including the answer mark", "Working is only needed if the question says show your working"], "why": "The mark scheme rewards the formula and the substitution as well as the number."}]}, "G13": {"id": "G13", "title": "Flashcards", "engine": "flash", "what": "Thirty five glossary terms. Look, think, flip, then say whether you knew it.", "items": [{"term": "Alternating current, AC", "meaning": "A current that changes direction periodically. UK mains is AC at 230 V, 50 Hz."}, {"term": "Ampere, A", "meaning": "The unit of current, and one of the seven SI base units."}, {"term": "Amplitude", "meaning": "The size of the peak of a waveform, measured from zero."}, {"term": "Capacitance, C", "meaning": "The ratio of the charge stored on a capacitor's plates to the voltage across them. Unit the farad, F."}, {"term": "Charge, Q", "meaning": "The quantity of electricity that has passed a point. Unit the coulomb, C. Q = I x t."}, {"term": "Conductor", "meaning": "A material with many free electrons, so current flows easily through it."}, {"term": "Conventional current", "meaning": "Current drawn from positive to negative on a circuit diagram. It predates the discovery of the electron."}, {"term": "Dielectric", "meaning": "The insulating layer between the plates of a capacitor."}, {"term": "Direct current, DC", "meaning": "A current that is constant in value and flows in one direction only."}, {"term": "Domain", "meaning": "A group of atoms in a ferrous material whose magnetic fields are lined up together."}, {"term": "Electromagnetic induction", "meaning": "The production of an emf in a conductor moving through a magnetic field."}, {"term": "Electromotive force, emf", "meaning": "The voltage produced by a source such as a generator or a cell."}, {"term": "Farad, F", "meaning": "The unit of capacitance. A very large unit, so microfarads, nanofarads and picofarads are used in practice."}, {"term": "Fleming's left hand rule", "meaning": "Gives the direction of the force on a current carrying conductor in a field. Left hand for a motor."}, {"term": "Fleming's right hand rule", "meaning": "Gives the direction of the induced current in a conductor moved through a field. Right hand for a generator."}, {"term": "Flux", "meaning": "The total magnetic field passing through an area. Unit the weber, Wb."}, {"term": "Flux density, B", "meaning": "The flux passing through a given area. Unit the tesla, T, which is webers per square metre."}, {"term": "Free electron", "meaning": "An outer electron that can break away from its atom and move to a neighbouring one."}, {"term": "Frequency, f", "meaning": "The number of complete cycles per second. Unit the hertz, Hz. f = 1 divided by T."}, {"term": "Henry, H", "meaning": "The unit of inductance. The quantity itself is L."}, {"term": "Inductance, L", "meaning": "The property of a coil that opposes a change in the current through it."}, {"term": "Insulator", "meaning": "A material whose electrons cannot break away, so current does not flow through it."}, {"term": "Joule, J", "meaning": "The unit of energy and work. One joule is the work done when 1 C passes through 1 ohm."}, {"term": "Magnetic field strength, H", "meaning": "The magnetising force produced by the current in a coil. Unit amperes per metre."}, {"term": "Ohm's law", "meaning": "The potential difference across a circuit is proportional to the current through it. V = I x R."}, {"term": "Period, T", "meaning": "The time taken for one complete cycle of a waveform, in seconds."}, {"term": "Potential difference", "meaning": "The voltage drop across a component, measured between two points either side of it."}, {"term": "Power, P", "meaning": "The rate at which energy is transferred. Unit the watt, W, which is one joule per second."}, {"term": "Prime mover", "meaning": "The external machine that drives a generator, such as a steam, gas or wind turbine, or a diesel engine."}, {"term": "Saturation", "meaning": "The point on a B against H curve where almost all the domains are aligned, so more field strength produces almost no more flux density."}, {"term": "Semiconductor", "meaning": "A material between a conductor and an insulator, whose conduction can be controlled."}, {"term": "Solenoid", "meaning": "A coil of wire that produces a magnetic field when a current flows through it."}, {"term": "Tesla, T", "meaning": "The unit of magnetic flux density, equal to one weber per square metre."}, {"term": "Transformer", "meaning": "Two coils on a common core, which changes the level of an alternating voltage. It does not work on DC."}, {"term": "Weber, Wb", "meaning": "The unit of magnetic flux."}]}, "G14": {"id": "G14", "title": "Safety on the bench", "engine": "quiz", "what": "Ten decisions from the practical work. One of them is a hazard, not an error.", "items": [{"q": "You are about to measure the resistance of a component on a live board.", "prompt": "What do you do?", "correct": "Isolate the supply, prove it dead, then lift the component out", "wrongs": ["Measure it as it is, the meter protects itself", "Turn the supply down and measure it", "Use the 10 A socket instead"], "why": "Resistance is measured with the supply off. In circuit readings are wrong anyway."}, {"q": "What does prove, test, prove mean?", "prompt": "What do you do?", "correct": "Prove the meter on a known live source, test the circuit, then prove the meter again", "wrongs": ["Test three times and take the average", "Prove the circuit dead, test it, then prove it dead again", "Test with two different meters"], "why": "A meter that failed during the job would have told you the circuit was dead."}, {"q": "An ammeter is connected in parallel across the supply.", "prompt": "What do you do?", "correct": "That is a short circuit and a hazard, not simply a wrong reading", "wrongs": ["It reads the supply current", "It reads zero and does no harm", "It is fine if the range is set high enough"], "why": "An ammeter has almost no resistance. Address this before anyone reaches a bench."}, {"q": "A fuse keeps blowing, and a higher rated one is the same physical size.", "prompt": "What do you do?", "correct": "Find the fault. The rating is a protection decision", "wrongs": ["Fit the higher rating, it is the same size", "Fit two of the original in parallel", "Bypass the fuse for testing only"], "why": "Never replace a fuse with a higher rating."}, {"q": "A power supply has been switched off, but it has large capacitors in it.", "prompt": "What do you do?", "correct": "Discharge them before touching anything", "wrongs": ["It is safe the moment the supply is off", "Wait ten seconds and it will be fine", "Short the output with a screwdriver"], "why": "A large capacitor holds its charge after the supply is removed."}, {"q": "A motor is about to be run on the bench for a test.", "prompt": "What do you do?", "correct": "Clamp it down before it is energised", "wrongs": ["Hold it steady while it runs", "Run it at low voltage and it will stay put", "Stand clear and switch on"], "why": "An unsecured motor will walk off the bench when it starts."}, {"q": "One of the probe leads has a small crack in the insulation.", "prompt": "What do you do?", "correct": "Take it out of service. It is a shock risk", "wrongs": ["Wrap it in tape and carry on", "Use it for low voltage work only", "Use it, but hold it above the crack"], "why": "Check both leads for damage before every use."}, {"q": "The job could be done live, or the circuit could be isolated first.", "prompt": "What do you do?", "correct": "Isolate. Live working has to be justified, not chosen for convenience", "wrongs": ["Work live, it is quicker", "Work live if you are wearing gloves", "It makes no difference either way"], "why": "Under the Electricity at Work Regulations, work on or near live conductors must be justified."}, {"q": "The red lead is in the 10 A socket and you now need to read a voltage.", "prompt": "What do you do?", "correct": "Move the lead first, then select volts, then touch the circuit", "wrongs": ["Select volts, the dial overrides the socket", "Read it, then move the lead", "It makes no difference on a modern meter"], "why": "Dial, then lead, then circuit. Leaving it in the 10 A socket shorts the supply."}, {"q": "Iron filings are being used to map a field.", "prompt": "What do you do?", "correct": "Keep them in the tray and under the sheet, away from eyes", "wrongs": ["Sprinkle them by hand for a finer pattern", "Blow the surplus off the paper", "Tip them back into the jar by hand"], "why": "Filings must not be handled near the eyes."}]}, "G15": {"id": "G15", "title": "Read the meter", "engine": "quiz", "what": "Eight meter faces drawn on the screen. Read them, with the unit.", "items": [{"q": "The dial is on volts.", "prompt": "How do you write this reading?", "correct": "0.047 V", "wrongs": ["0.047", "47 V", "0.047 A"], "why": "A number with no unit is not a reading.", "draw": ["face", "0.047", "V"]}, {"q": "The dial is on the kilohm range.", "prompt": "What is the resistance in ohms?", "correct": "1500 ohm", "wrongs": ["1.5 ohm", "150 ohm", "1500000 ohm"], "why": "kilo means one thousand times.", "draw": ["face", "1.500", "k ohm"]}, {"q": "The dial is on milliamps.", "prompt": "What is this in amperes?", "correct": "0.25 A", "wrongs": ["250 A", "2.5 A", "0.025 A"], "why": "Milli means one thousandth, so the answer must be smaller than an amp.", "draw": ["face", "250", "mA"]}, {"q": "The dial is on ohms and the leads are across a fuse.", "prompt": "What does OL tell you?", "correct": "The fuse is open circuit, so it has blown", "wrongs": ["The fuse is healthy", "The meter is on the wrong range", "The resistance is zero"], "why": "A healthy fuse reads close to 0 ohm. OL means the circuit is open.", "draw": ["face", "OL", "ohm"]}, {"q": "The dial is on the diode range, leads one way round.", "prompt": "What does this tell you?", "correct": "The diode is forward biased and healthy", "wrongs": ["The diode is reversed", "The diode has failed short circuit", "The meter is measuring resistance"], "why": "0.5 to 0.8 forward, OL when reversed. Anything else and it has failed.", "draw": ["face", "0.6", "diode"]}, {"q": "A cell reads this with nothing connected, and 0.6 V under load.", "prompt": "What does that tell you?", "correct": "The cell is flat", "wrongs": ["The cell is healthy", "The meter is faulty", "The load is short circuited"], "why": "A flat cell has high internal resistance and reads fine until you ask it for current.", "draw": ["face", "1.5", "V"]}, {"q": "The dial is on capacitance.", "prompt": "How is this written in farads?", "correct": "0.00000022 F", "wrongs": ["0.     var st = [];
    attrs = attrs.replace(/\s(fill|stroke)="([^"]+)"/g, function(a, k, v){

    if (tag === "svg") attrs += ' aria-label="Diagram for this question"';
    return "<"+tag+attrs+(st.length ? ' style="'+st.join(";")+'"' : "")+sl+">";
  });
}

<script>

    set: function(k, v){ var s = JSON.stringify(v); try{ if(ok) localStorage.setItem(P+k, s); else mem[k]=s; }catch(e){ mem[k]=s; } },
    del: function(k){ try{ if(ok) localStorage.removeItem(P+k); delete mem[k]; }catch(e){} },

    rawSet: function(k, v){ try{ if(ok){ if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } }catch(e){} },

/* ---------- transport: Microsoft Forms (main route), Google Apps Script (optional), or this phone only ---------- */
var Net = {
  mode: function(){

    return "local";
  },
  call: function(action, payload){
    var m = this.mode();

      if (m === "gas") {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload || {});
      } else if (m === "remote") {

        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);

          body: JSON.stringify(Object.assign({action:action}, payload||{})), signal: ctrl ? ctrl.signal : undefined})
          .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(timer); resolve(j); })
          .catch(function(e){ clearTimeout(timer); reject(e); });

  }
};
var Sync = {
  q: Store.get("queue", []), busy:false,

window.addEventListener("online", function(){ Sync.flush(); });
setInterval(function(){ Sync.flush(); }, 30000);

/* ---------- the game name the tracker sees: unit prefix, a space, then the title ---------- */
function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : HUB_CONFIG.prefix + " " + title; }

/* ---------- verification code: short, and it changes if the code, game or score is edited ----------
   The tracker works out the same number in Excel, so an edited score shows up there.   */
function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;
  for (var k=0;k<s.length;k++) h += s.charCodeAt(k)*(k+1)*7;

}

/* ---------- my record ---------- */
var RECORD_KEYS = GAMES.map(function(g){ return g.key; }).concat(["flash","exit","checkin1","checkin2"]);
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode(), tag = HUB_CONFIG.transfer + "-";
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });
  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="'+esc(tag)+'..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = tag + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(tag) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(tag.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done);
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code for this unit. Copy it again on the other phone."; }
  };
}

/* ---------- navigation ---------- */
function startGame(key){
  if (key === "quick") return runQuick();

document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var b = $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])")[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
    var n = $("#next"); if (n) { e.preventDefault(); n.click(); }
  }
});

/* ---------- results ---------- */
function resultMessage(pct){
  if (pct >= 90) return "Excellent. That is exam ready.";
  if (pct >= 70) return "Good work. Check the ones below, then go again.";
  if (pct >= 40) return "Getting there. Read the fixes, then play it again.";
  return "Early days. Read each fix below and try again. It gets easier every round.";
}
function sendPanel(title, score, max, detail){

}
function wireSend(title, score, max){
  var c = $("#copy1"); if (c) c.onclick = function(){ copyText(resultLine(title, score, max), function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the line and copy it."); }); };
  var s = $("#send"); if (s) s.addEventListener("click", function(){ toast("The form is opening. Press Submit on it."); });
}
function finishGame(key, score, max, items, started, review, extra){
  extra = extra || {};
  var p = S.prog, title = TITLE[key], pct = max ? Math.round(100*score/max) : 0, secs = Math.round((Date.now()-started)/1000);
  var prev = p.best[key], newBest = prev == null || pct > prev;
  if (newBest) { p.best[key] = pct; p.raw[key] = [score, max]; }
  p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  var gain = 20 + score*10 + (extra.bonus||0); p.xp += gain;
  var stamp = pct >= 80, firstStamp = stamp && !p.stamps[key]; if (stamp) p.stamps[key] = true;
  var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t);
  saveProg();
  logEvent("finish", title, {score:score, max:max, secs:secs, items:items});
  var missed = items.filter(function(x){ return !x.ok; }).map(function(x){ return x.l; });
  var detail = (extra.round ? extra.round + ". " : "") + (missed.length ? "To go over: " + missed.slice(0,6).join("; ") : "All correct");
  screen(gameHeader(title, 0, 0) + '<div class="wrap">' +
    '<div class="card result"><p class="muted" style="margin:0 0 4px">'+esc(title)+(extra.round ? ', '+esc(extra.round) : '')+'</p><div class="big">'+score+'<small> of '+max+'</small></div>' +
    '<p style="margin:10px 0 4px">'+resultMessage(pct)+'</p><p class="small muted" style="margin:0">+'+gain+' points'+(newBest && prev != null ? ', a new best' : '')+'</p>' +
    (stamp ? '<span class="seal'+(firstStamp?' pop':'')+'">'+icon("check")+'Checked</span>' : '') + '</div>' +
    sendPanel(title, score, max, detail) +
    (review.length ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">What to fix</h3><ol class="review">' +
      review.map(function(r){ return '<li><b>'+esc(r.q)+'</b><br>The answer: '+esc(r.right)+(r.why ? '. <span class="muted">'+esc(r.why)+'</span>' : '')+'</li>'; }).join("") + '</ol></div>'
      : '<div class="panel" style="margin-top:12px"><p>Nothing to fix this round.</p></div>') +
    '<div class="dock"><div class="row"><button class="btn amber" id="again">Play again</button><button class="btn ghost" id="hub">Back to the games</button></div></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#again").onclick = function(){ startGame(key); };
  $("#hub").onclick = function(){ home(); };
  say(score + " out of " + max + ". " + resultMessage(pct));
}

/* ---------- one engine for every multiple choice game ---------- */
function optButtons(opts){ return opts.map(function(o,k){ return '<button class="opt" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span class="l">'+esc(o)+'</span><span class="s"></span></button>'; }).join(""); }
function markOpts(correct, chosen){
  var ok = correct.indexOf(chosen) >= 0;
  $$(".opt").forEach(function(b){
    var j = +b.dataset.k; b.disabled = true;
    if (correct.indexOf(j) >= 0) { b.classList.add("correct"); $(".s", b).textContent = (j === chosen || !ok) ? "Right answer" : "Also right"; }
    else if (j === chosen) { b.classList.add("wrong"); $(".s", b).textContent = "Not this one"; }
    else b.classList.add("dim");
  });
  return ok;
}
function showFeedback(ok, rightText, why, nextLabel, onNext){
  var fb = $("#fb");
  fb.className = "fb" + (ok ? "" : " bad");
  fb.innerHTML = '<strong>' + (ok ? pick(["Right.","Yes, that is it.","Correct."]) : "Not this time.") + '</strong>' +
    (ok ? "" : "The answer is: " + esc(rightText) + ". ") + esc(why || "");
  $("#dock").innerHTML = '<button class="btn amber block" id="next">'+nextLabel+'</button>';
  $("#next").onclick = onNext;
  say(ok ? "Right." : "Not this time. The answer is " + rightText);
  try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
}
function runMCQ(key, items, opts){
  opts = opts || {};
  var i = 0, score = 0, bonus = 0, log = [], review = [], started = Date.now(), shownAt = 0;
  function show(){
    var it = items[i];
    screen(gameHeader(TITLE[key], i, items.length) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+(opts.label || "Question")+' '+(i+1)+'</div>' +
      (it.lead ? '<p class="qprompt" style="margin:4px 0 0">'+esc(it.lead)+'</p>' : '') +
      '<p class="qtext">'+esc(it.prompt)+'</p>' +
      (it.art ? '<div class="qart">'+it.art+'</div>' : '') +
      (it.sub ? '<p class="qprompt">'+esc(it.sub)+'</p>' : '') +
      '<div class="opts'+((opts.cols === 2 || it.cols === 2) ? ' two' : '')+'">' + optButtons(it.options) + '</div>' +
      '<div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true});
    shownAt = Date.now();
    $$(".opt").forEach(function(b){ b.onclick = function(){ answer(+b.dataset.k); }; });
  }
  function answer(k){
    var it = items[i], ok = markOpts(it.correct, k), right = it.correct.map(function(c){ return it.options[c]; }).join(" or ");
    if (ok) { score++; if (opts.speed && Date.now() - shownAt < 6000) bonus += 5; }
    else review.push({q:it.label || it.prompt, right:right, why:it.why});
    log.push({i:it.id, ok:ok?1:0, l:String(it.label || it.prompt).slice(0,90)});
    var last = i === items.length - 1;
    showFeedback(ok, right, it.why, last ? "See my score" : "Next", function(){ if (last) finishGame(key, score, items.length, log, started, review, {bonus:bonus}); else { i++; show(); } });
  }
  show();
}
function mix(correct, wrongs){ var o = shuffle([correct].concat(wrongs)); return {options:o, correct:[o.indexOf(correct)]}; }
function runQuick(){
  var pool = [];
  GAMES.forEach(function(g){ if (g.mcq) pool = pool.concat(g.mcq().map(function(x){ return Object.assign({}, x, {label: x.label || x.prompt}); })); });
  runMCQ("quick", shuffle(pool).slice(0,10), {speed:true});
}

/* ---------- step by step: a case, then two or three picks in order ---------- */
function runSteps(key, cases, opts){
  opts = opts || {};
  var items = cases, i = 0, s = 0, score = 0, max = 0, log = [], review = [], started = Date.now();
  items.forEach(function(c){ max += c.steps.length; });
  var done = 0;
  function show(){
    var it = items[i], st = it.steps[s], m = mix(st.correct, st.wrongs), n = it.steps.length;
    screen(gameHeader(TITLE[key], done, max) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+(opts.label || "Case")+' '+(i+1)+' of '+items.length+'. Step '+(s+1)+' of '+n+'</div>' +
      '<p class="qtext">'+esc(it.q)+'</p>' +
      it.steps.slice(0, s).map(function(p){ return '<div class="stepnote"><b>'+esc(p.label)+':</b> '+esc(p.correct)+'</div>'; }).join("") +
      '<p class="qprompt"><b style="color:var(--head)">'+esc(st.label)+'</b></p>' +
      '<div class="opts">'+optButtons(m.options)+'</div><div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true});
    $$(".opt").forEach(function(b){ b.onclick = function(){
      var ok = markOpts(m.correct, +b.dataset.k);
      if (ok) score++; else review.push({q:it.q + " (" + st.label.toLowerCase() + ")", right:st.correct, why:""});
      log.push({i:(it.id||("C"+(i+1)))+"-"+(s+1), ok:ok?1:0, l:(st.label+": "+it.q).slice(0,90)});
      done++;
      var lastStep = s === n-1, last = i === items.length-1 && lastStep;
      showFeedback(ok, st.correct, "", !lastStep ? "Next step" : (last ? "See my score" : "Next "+(opts.label || "case").toLowerCase()), function(){
        if (last) return finishGame(key, score, max, log, started, review);
        if (!lastStep) s++; else { s = 0; i++; } show();
      });
    }; });
  }
  show();
}

/* ---------- put it in order: tap the steps in order, one mark per step in the right place ----------
   A set is {id, title, lead, steps:[{t, tag, note}], why}. Tags (dates, 1st, 2nd) show only after checking. */
function runOrder(key, set, opts){
  opts = opts || {};
  var it = set, n = it.steps.length, score = 0, log = [], review = [], started = Date.now();
  var pool = shuffle(it.steps.map(function(_,k){ return k; })), placed = [], checked = false;
  if (n > 2) { var guard = 0; while (pool.every(function(v,k){ return v === k; }) && guard++ < 9) pool = shuffle(pool); }
  function draw(keepScroll){
    var left = pool.filter(function(k){ return placed.indexOf(k) < 0; });
    screen(gameHeader(TITLE[key], 0, 0) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+esc(opts.round || "Sequence")+'</div><p class="qtext">'+esc(it.title)+'</p>' +
      '<p class="qprompt">'+esc(it.lead ? it.lead + " " : "")+'Tap the items in order. Tap a numbered one to send it back.</p>' +
      '<div class="pool">' + (left.length ? left.map(function(k){ return '<button class="chip2" data-step="'+k+'">'+esc(it.steps[k].t)+'</button>'; }).join("") : '<span class="small muted">All placed.</span>') + '</div>' +
      '<div class="slots">' + it.steps.map(function(_,k){ var v = placed[k];
        var cls = v == null ? "" : (checked ? (v === k ? " filled ok" : " filled no") : " filled");
        return '<button class="slot'+cls+'" data-slot="'+k+'" '+((v == null || checked) ? "disabled" : "")+' aria-label="Place '+(k+1)+(v == null ? ", empty" : ": "+esc(it.steps[v].t))+'"><b>'+(k+1)+'</b><span>'+(v == null ? '<span class="muted small">empty</span>' : esc(it.steps[v].t))+'</span></button>'; }).join("") + '</div>' +
      '<div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true, keep:!!keepScroll});
    $$(".chip2").forEach(function(b){ b.onclick = function(){ if (checked) return; var free = -1; for (var k=0;k<n;k++){ if (placed[k] == null) { free = k; break; } }
      if (free >= 0) { placed[free] = +b.dataset.step; draw(true); } }; });
    $$(".slot").forEach(function(b){ b.onclick = function(){ if (checked) return; placed[+b.dataset.slot] = null; draw(true); }; });
    var full = placed.filter(function(v){ return v != null; }).length === n;
    if (checked) {
      var fb = $("#fb"); fb.className = "fb" + (score === n ? "" : " bad");
      fb.innerHTML = '<strong>'+score+' of '+n+' in the right place.</strong>The order: <ol>'+it.steps.map(function(s){ return '<li>'+(s.tag ? '<b>'+esc(s.tag)+'</b> ' : '')+esc(s.t)+(s.note ? '. <span class="muted">'+esc(s.note)+'</span>' : '')+'</li>'; }).join("")+'</ol>'+esc(it.why||"");
      $("#dock").innerHTML = '<button class="btn amber block" id="next">See my score</button>';
      $("#next").onclick = function(){ finishGame(key, score, n, log, started, review, {round:opts.round}); };
    } else {
      $("#dock").innerHTML = '<button class="btn amber block" id="chk" '+(full ? "" : "disabled")+'>'+(full ? "Check my order" : "Place every item first")+'</button>';
      $("#chk").onclick = function(){
        checked = true;
        for (var k=0;k<n;k++){ var ok = placed[k] === k; if (ok) score++; log.push({i:it.id+"-"+(k+1), ok:ok?1:0, l:(it.title+": place "+(k+1)+", "+it.steps[k].t).slice(0,90)}); }
        if (score < n) review.push({q:it.title, right:it.steps.map(function(s){ return (s.tag ? s.tag+" " : "")+s.t; }).join(", "), why:it.why||""});
        draw(true);
      };
    }
  }
  draw(false);
}

/* ---------- key word cards: look, think, flip, be honest ---------- */
function runFlash(cards){

      '<span class="face back"><span>'+esc(c.def)+'</span></span></span></button>' +

    $("#yes").onclick = function(){ if (c.n === 0) { firstGo++; log.push({i:c.id, ok:1, l:c.term}); } queue.shift(); show(); };

/* ---------- calculation clinic: type the number, pick the unit, a second go with the formula ---------- */
function parseNum(s){
  var t = String(s).replace(/[,£\s]/g, "").replace(/per cent|%/gi, "");
  if (!t || isNaN(Number(t))) return null;
  return Number(t);
}
function fmtNum(v, dp){ return Number(v).toLocaleString("en-GB", {minimumFractionDigits:dp, maximumFractionDigits:dp}); }
function runCalc(key, round){
  var items = round.items, i = 0, score = 0, log = [], review = [], started = Date.now();
  function show(){
    if (i >= items.length) return finishGame(key, score, items.length, log, started, review, {round:round.title});
    var it = items[i], tries = 0, unit = null;
    screen(gameHeader(TITLE[key], i, items.length) + '<div class="wrap"><div class="card">' +
      '<div class="rungs" aria-hidden="true">' + items.map(function(_,k){ return '<i class="'+(k<i ? (log[k] && log[k].ok ? "done" : "miss") : (k===i ? "now" : ""))+'"></i>'; }).join("") + '</div>' +
      '<div class="qno">Question '+(i+1)+'</div><p class="qtext">'+esc(it.q)+'</p>' +
      '<div class="worked" style="margin:0 0 12px"><b>Formula:</b> '+esc(it.formula)+'</div>' +
      '<div class="numrow"><label class="sr" for="ans">Your answer as a number</label>' +
      '<input id="ans" class="textin" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Your answer"></div>' +
      '<p class="qprompt" style="margin:12px 0 4px"><b style="color:var(--head)">Pick the unit</b></p>' +
      '<div class="seg" role="group" aria-label="Pick the unit" style="grid-template-columns:repeat(2,1fr)">' +
      it.units.map(function(u,k){ return '<button data-u="'+k+'" aria-pressed="false">'+esc(u)+'</button>'; }).join("") + '</div>' +
      '<p class="small muted" style="margin:0">'+esc(round.rule || "Money to the nearest penny. Everything else to two decimal places unless the question says otherwise.")+'</p>' +
      '<div id="fb" role="status"></div></div>' +
      '<div class="dock" id="dock"><button class="btn amber block" id="chk">Check</button></div></div>', {game:true});
    var inp = $("#ans");
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); var b = $("#chk") || $("#next"); if (b) b.click(); } });
    $$("[data-u]").forEach(function(b){ b.onclick = function(){ if (b.disabled) return; unit = +b.dataset.u; $$("[data-u]").forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); }; });
    var answerText = fmtNum(it.answer, it.dp) + " " + it.units[it.unit];
    function done(ok){
      if (ok) score++;
      log.push({i:it.id, ok:ok?1:0, l:it.q.slice(0,90)});
      if (!ok) review.push({q:it.q, right:answerText, why:it.worked.join(" ")});
      inp.disabled = true; $$("[data-u]").forEach(function(x){ x.disabled = true; });
      var fb = $("#fb"); fb.className = "fb" + (ok ? "" : " bad");
      fb.innerHTML = '<strong>'+(ok ? (tries === 1 ? "Correct first time." : "Correct on the second go.") : "The answer is "+esc(answerText)+".")+'</strong>' +
        '<ol>'+it.worked.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'</ol>';
      $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(i+1 < items.length ? "Next question" : "See my score")+'</button>';
      $("#next").onclick = function(){ i++; show(); };
      say(ok ? "Correct." : "The answer is " + answerText);
    }
    $("#chk").onclick = function(){
      var v = parseNum(inp.value), f = $("#fb");
      if (v === null) { f.className = "fb info"; f.innerHTML = "<strong>Type a number first.</strong>"; return; }
      if (unit === null) { f.className = "fb info"; f.innerHTML = "<strong>Pick a unit as well.</strong>"; return; }
      tries++;
      var numOk = Math.abs(v - it.raw) <= Math.max(it.tol, Math.abs(it.answer - it.raw) + 0.001), unitOk = unit === it.unit;
      if (numOk && unitOk) return done(true);
      if (tries === 1) {
        f.className = "fb info";
        f.innerHTML = "<strong>" + (!numOk && !unitOk ? "Not right, and the unit is wrong too." : !numOk ? "The number is not right." : "The number is right, but the unit is not.") + "</strong>Have one more go. Check your conversions first.";
        if (!numOk) inp.select(); say("Not quite. Have one more go.");
      } else done(false);
    };
    setTimeout(function(){ try { inp.focus(); } catch(e) {} }, 60);
  }
  show();
}

/* ---------- connecting wall: sixteen tiles, four groups of four, three wrong guesses allowed ---------- */
function runWall(key, wall){
  var tiles = shuffle([].concat.apply([], wall.groups.map(function(gr, gi){ return gr.tiles.map(function(t){ return {t:t, g:gi}; }); })));
  var sel = [], solved = [], lives = 3, hints = 0, found = 0, started = Date.now(), log = [], msg = "", over = false, first = true;
  function draw(){
    var grid = solved.map(function(gi, k){ var gr = wall.groups[gi];
      return '<div class="wsolved w'+k+'"><b>'+esc(gr.link)+'</b><span>'+esc(gr.tiles.join(", "))+'</span></div>'; }).join("") +
      '<div class="wgrid">' + tiles.map(function(t, k){ return '<button class="wtile" data-w="'+k+'" aria-pressed="'+(sel.indexOf(k) >= 0)+'"'+(over?' disabled':'')+'>'+esc(t.t)+'</button>'; }).join("") + '</div>';
    screen(gameHeader(TITLE[key], solved.length, 4) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+esc(wall.title)+'</div><p class="qtext">Find four groups of four</p>' +
      '<p class="qprompt">Pick four tiles that share a link. The wall checks them when you pick the fourth. Wrong guesses left: <b style="color:var(--head)">'+lives+'</b></p>' +
      grid + '<div id="fb" role="status">'+msg+'</div></div><div class="dock" id="dock"></div></div>', {game:true, keep:!first});
    first = false;
    $$(".wtile").forEach(function(b){ b.onclick = function(){ tap(+b.dataset.w); }; });
    var dock = $("#dock");
    if (over || solved.length === 4) {
      dock.innerHTML = '<button class="btn amber block" id="next">See my score</button>';
      $("#next").onclick = function(){
        var review = wall.groups.map(function(gr, gi){ return gr; }).filter(function(gr, gi){ return !log.some(function(l){ return l.g === gi && l.ok; }); })
          .map(function(gr){ return {q:gr.tiles.join(", "), right:gr.link, why:""}; });
        finishGame(key, found, 4, wall.groups.map(function(gr, gi){ var hit = log.some(function(l){ return l.g === gi && l.ok; }); return {i:"W"+(gi+1), ok:hit?1:0, l:gr.link}; }),
          started, review, {round:wall.title + (hints ? ", " + hints + " hint" + (hints > 1 ? "s" : "") + " used" : "")});
      };
    } else {
      dock.innerHTML = '<div class="row"><button class="btn ghost" id="clr">Clear my picks</button><button class="btn ghost" id="hint">Give me a hint</button></div>';
      $("#clr").onclick = function(){ sel = []; msg = ""; draw(); };
      $("#hint").onclick = function(){
        var open = wall.groups.map(function(_, gi){ return gi; }).filter(function(gi){ return solved.indexOf(gi) < 0; });
        hints++; msg = '<div class="fb info"><strong>Hint</strong>One link is: '+esc(wall.groups[open[0]].link.toLowerCase())+'.</div>'; draw();
      };
    }
  }
  function tap(k){
    if (over) return;
    var at = sel.indexOf(k); if (at >= 0) sel.splice(at, 1); else if (sel.length < 4) sel.push(k);
    msg = "";
    if (sel.length === 4) {
      var gi = tiles[sel[0]].g, same = sel.every(function(x){ return tiles[x].g === gi; });
      if (same) {
        solved.push(gi); found++; log.push({g:gi, ok:1});
        tiles = tiles.filter(function(t){ return t.g !== gi; });
        msg = '<div class="fb"><strong>Group found.</strong>'+esc(wall.groups[gi].link)+'.</div>';
        if (solved.length === 3) { var lastG = tiles[0].g; solved.push(lastG); found++; log.push({g:lastG, ok:1}); tiles = [];
          msg = '<div class="fb"><strong>Wall complete.</strong>The last four made their own group: '+esc(wall.groups[lastG].link)+'.</div>'; }
        say("Group found.");
      } else {
        lives--;
        if (lives <= 0) {
          over = true;
          wall.groups.forEach(function(_, g){ if (solved.indexOf(g) < 0) solved.push(g); }); tiles = [];
          msg = '<div class="fb bad"><strong>No wrong guesses left.</strong>The groups you did not find are shown above.</div>';
        } else msg = '<div class="fb bad"><strong>Not a group.</strong>Those four do not share one link. '+lives+' wrong guess'+(lives>1?"es":"")+' left.</div>';
        say(over ? "No wrong guesses left." : "Not a group.");
      }
      sel = [];
    }
    draw();
  }
  draw();
}

    var weak = C.lines.filter(function(_,k){ return rag[k] !== "G"; });
    var body = '<p style="margin:0">You rated '+g+' of '+C.lines.length+' lines as got it.</p>' +
      (weak.length ? '<p style="margin:0">Go over these next:</p><ul class="review">'+weak.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join("")+'</ul>' : '<p style="margin:0">Everything rated got it. Try the games to prove it.</p>');
    doneScreen(key, C.title, g, C.lines.length, "Sent", body, "Lines: " + rag);
  };
}

/* ---------- start ---------- */
(function init(){
  applyPrefs();
  var labels = {games:["games","Games"], record:["record","My record"], help:["help","Help"]};
  $$("#tabs button").forEach(function(b){ var l = labels[b.dataset.tab]; b.innerHTML = icon(l[0]) + '<span>'+l[1]+'</span>';
    b.onclick = function(){ if (b.dataset.tab === "games") home(); else if (b.dataset.tab === "record") record(); else help(); }; });
  var qc = ""; try { qc = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase(); } catch(e) {}
  if (/^[A-Z0-9]{4}$/.test(qc)) {
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
    if (!S.me || S.me.code !== qc) {
      var hit = CLASS.filter(function(c){ return c.code === qc; })[0];
      S.me = {code:qc, name: hit ? hit.name : qc}; rememberMe(S.me); logEvent("open","hub");
    }
  }
  if (S.me) { loadProg(); home(); loadServer().then(function(){ if (!inGame && S.tab === "games" && S.me) home(); }); Sync.flush(); }
  else { loadServer().then(function(){ signIn(); }); signIn(); }
})();

</script>
