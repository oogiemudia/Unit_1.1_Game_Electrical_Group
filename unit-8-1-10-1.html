<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="8.1 and 10.1 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Semiconductors and signals games</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}


/* added for criterion 8.1 (continued) and 10.1: activating hard thinking */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.badges:empty{display:none}
.badge{margin-bottom:0}
.badge.next{background:var(--green);color:#fff}
.step{align-self:flex-start;background:var(--tint);color:var(--head);font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.part{margin-top:6px}
.part .sec{align-items:center}
.part .sec h2{font-size:1.05em}
details.goals{margin:-4px 2px 10px}
details.goals summary{cursor:pointer;color:var(--head);font-weight:700;font-size:.88em;min-height:44px;display:flex;align-items:center}
details.goals ul{margin:0 0 4px;padding-left:1.2em;font-size:.9em}
.modebox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.goal .btn.small{flex:1 1 120px}
.pill.red{background:var(--badbg);color:var(--red)}
.opt.picked{border-color:var(--amber);background:var(--ambbg)}
.rag.conf button{min-height:50px}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.whyno{display:block;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--red)}
.nextstep{margin-top:12px;border-left:5px solid var(--green)}
.calgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calgrid div{background:var(--tint);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.calgrid div.warn{background:var(--badbg)}
.calgrid b{font-size:1.5em;color:var(--head);line-height:1.1}
.calgrid div.warn b{color:var(--red)}
.calgrid span{font-size:.84em;color:var(--muted)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:56px;padding:8px 10px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left;line-height:1.3;font-size:.92em}
.pb.r{font-weight:400;color:var(--ink);border-color:var(--line)}
.pb.sel{border-color:var(--amber);background:var(--ambbg)}
.pb.ok{border-color:var(--green);background:var(--goodbg);color:var(--green);cursor:default}
.pb.no{border-color:var(--red);background:var(--badbg)}
.ftable td{text-align:left}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}

  {id:"E05", chunks:["A bridge rectifier","uses four diodes,","and on each half cycle","all four conduct together."], wrong:3, fix:"Two diodes conduct on each half cycle: D1 and D4, then D2 and D3."},
  {id:"E06", chunks:["To turn on an NPN transistor,","make the base about 0.7 V","more negative","than the emitter."], wrong:2, fix:"NPN needs the base about 0.7 V more positive than the emitter. PNP is the one that needs negative."},
  {id:"E07", chunks:["Current gain hFE","equals the collector current","multiplied by","the base current."], wrong:2, fix:"hFE = Ic ÷ Ib. It is a ratio, so divide."},
  {id:"E08", chunks:["A square wave","has a duty cycle of","25%,","with equal mark and space."], wrong:2, fix:"Equal mark and space means 50%. 25% would be a rectangular wave."},
  {id:"E09", chunks:["Digital signals","need less bandwidth than analogue","because they are only","1s and 0s."], wrong:1, fix:"The June 2025 mark scheme credits the opposite: digital needs a wider range of frequencies to transmit."},
  {id:"E10", chunks:["A sawtooth wave","ramps up steadily","and falls steadily","at the same rate."], wrong:2, fix:"A sawtooth drops suddenly. Equal rise and fall is a triangular wave."},
  {id:"E11", chunks:["The period of a wave","is the number of cycles","in one second,","measured in seconds."], wrong:1, fix:"Period is the time for one cycle. Cycles per second is frequency, in hertz."},
  {id:"E12", chunks:["In a 4 to 20 mA loop,","4 mA means","the top of the range","and 0 mA means a fault."], wrong:2, fix:"4 mA is the bottom of the range. 20 mA is the top."},
  {id:"E13", chunks:["Signal processing","gets a raw signal ready to be read","by amplifying and filtering it","before the ADC."], wrong:0, fix:"That is signal conditioning. Processing uses the signal to make a decision or produce information."},
  {id:"E14", chunks:["A 4-bit ADC","has","8","possible codes."], wrong:2, fix:"2 to the power 4 is 16 codes, from 0000 to 1111."},
  {id:"E15", chunks:["Fan in","is the number of gate inputs","that one output","can drive."], wrong:0, fix:"That is fan out. Fan in is the number of inputs a gate has."},
  {id:"E16", chunks:["The arrow on a transistor symbol","is on the base","and points the way","conventional current flows."], wrong:1, fix:"The arrow is always on the emitter."},
  {id:"E17", chunks:["A germanium diode","starts to conduct at about","0.7 V","in forward bias."], wrong:2, fix:"Germanium conducts from about 0.3 V. 0.7 V is silicon."},
  {id:"E18", chunks:["Peak inverse voltage","is the lowest reverse voltage","a diode can safely","withstand."], wrong:1, fix:"PIV is the highest reverse voltage before the diode breaks down."},
  {id:"E19", chunks:["A smoothing capacitor","charges near each peak","and makes the ripple","bigger."], wrong:3, fix:"It fills in the dips, so the ripple gets smaller."},
  {id:"E20", chunks:["Full wave ripple","on a 50 Hz supply","has a frequency of","50 Hz."], wrong:3, fix:"Two humps per cycle, so the ripple is at 100 Hz."}
],

  {id:"X04", q:"Explain one advantage and one disadvantage of digital signals compared to analogue signals.", max:4, a:"Digital is less affected by noise. A disadvantage is it needs more equipment.", got:2, why:"One mark for each point, but neither has a 'because', so the two explanation marks are lost.", model:"Less affected by noise [1] because the receiver only has to tell a 1 from a 0 [1]. Only a sampled version of the original [1], so some detail is lost when converting from analogue to digital [1].", src:"June 2025 Core Paper 2, Q8b"},
  {id:"X05", q:"Explain one advantage and one disadvantage of digital signals compared to analogue signals.", max:4, a:"Less affected by noise because the receiver only has to decide high or low. But it is only a sampled version, so some detail is lost in the conversion.", got:4, why:"Two points, each with a linked explanation.", model:"As written. Point, then because, twice.", src:"June 2025 Core Paper 2, Q8b"},
  {id:"X06", q:"Explain one advantage and one disadvantage of digital signals compared to analogue signals.", max:4, a:"Digital is better and faster. Analogue is worse.", got:0, why:"'Better', 'faster' and 'worse' are too vague to credit. Name a real advantage.", model:"Less affected by noise [1] because... Needs a wider range of frequencies [1] because...", src:"June 2025 Core Paper 2, Q8b"},
  {id:"X07", q:"State one advantage of a digital signal compared to an analogue signal.", max:1, a:"Less susceptible to interference.", got:1, why:"On the mark scheme: less susceptible to noise or interference.", model:"Less susceptible to noise / interference. [1]", src:"Summer 2026 Core Paper 2, Q3a"},

/* ---------- Quick bank, used by Sure or not?, Master it and Review ---------- */
quick: [
  {id:"K01", q:"What is doping?", opts:["Adding a small amount of another element to silicon","Heating silicon until it melts","Coating silicon with metal","Cooling silicon to stop current"], why:"Doping changes how well silicon conducts."},
  {id:"K02", q:"Which element makes N-type silicon?", opts:["Phosphorus (five outer electrons)","Boron (three outer electrons)","Carbon","Copper"], why:"Five outer electrons leave one spare to move.", fb:{"Boron (three outer electrons)":"Boron leaves a hole, which makes P-type."}},
  {id:"K03", q:"What are the majority carriers in P-type silicon?", opts:["Holes","Electrons","Protons","Neutrons"], why:"P-type has missing electrons, called holes."},
  {id:"K04", q:"What is the depletion layer?", opts:["A region at the junction with no free carriers","A metal layer on the diode","The band printed on the cathode","A layer of extra electrons"], why:"Electrons and holes cancel out there, leaving no free carriers."},
  {id:"K05", q:"About how much voltage does a silicon diode need before it conducts well?", opts:["0.7 V","0.3 V","7 V","0.07 V"], why:"0.7 V for silicon, 0.3 V for germanium.", fb:{"0.3 V":"0.3 V is germanium."}},
  {id:"K06", q:"In forward bias, the positive terminal connects to...", opts:["the anode (P side)","the cathode (N side)","the depletion layer","the band"], why:"Positive to P, negative to N."},
  {id:"K07", q:"What does the band on a diode mark?", opts:["The cathode","The anode","The P side","The maximum voltage"], why:"The band matches the bar on the symbol: the cathode."},
  {id:"K08", q:"What does PIV stand for?", opts:["Peak inverse voltage","Positive input voltage","Power in volts","Peak internal value"], why:"The highest reverse voltage a diode can take."},
  {id:"K09", q:"A rectifier converts...", opts:["AC into DC","DC into AC","low voltage into high voltage","analogue into digital"], why:"Diodes let only one direction through."},
  {id:"K10", q:"Average output of a half wave rectifier:", opts:["0.318 × Vpk","0.637 × Vpk","0.707 × Vpk","1.414 × Vpk"], why:"Vpk ÷ π = 0.318 Vpk.", fb:{"0.637 × Vpk":"That is full wave.","0.707 × Vpk":"That is the rms of a full sine wave, not rectified average."}},
  {id:"K11", q:"How many diodes in a bridge rectifier?", opts:["Four","One","Two","Three"], why:"Two conduct on each half cycle."},
  {id:"K12", q:"Full wave ripple on a 50 Hz supply is at...", opts:["100 Hz","50 Hz","25 Hz","200 Hz"], why:"Two humps per cycle."},
  {id:"K13", q:"The three terminals of a bipolar transistor are...", opts:["base, collector, emitter","anode, cathode, gate","positive, negative, earth","input, output, ground"], why:"b, c and e."},
  {id:"K14", q:"The arrow on a transistor symbol is on the...", opts:["emitter","base","collector","case"], why:"Always the emitter. Out for NPN, in for PNP."},
  {id:"K15", q:"hFE = 100 and Ib = 50 µA. What is Ic?", opts:["5 mA","0.5 mA","50 mA","5000 mA"], why:"100 × 50 µA = 5000 µA = 5 mA."},
  {id:"K16", q:"Ie equals...", opts:["Ib + Ic","Ic − Ib","Ib × Ic","Ic ÷ Ib"], why:"All current leaves through the emitter."},
  {id:"K17", q:"Why can transistors switch millions of times a second without wearing out?", opts:["They have no moving parts","They are water cooled","They use AC","They are made of copper"], why:"Solid state: nothing moves, so nothing wears."},
  {id:"K18", q:"Hierarchical design splits a circuit into...", opts:["blocks and sub-blocks by function","layers of copper","separate power supplies","analogue and digital parts only"], why:"Each block has a clear job and inputs and outputs."},
  {id:"K19", q:"An analogue signal is...", opts:["continuous","discrete","always a square wave","only 0 or 1"], why:"It can take any value in its range."},
  {id:"K20", q:"A digital signal is...", opts:["discrete","continuous","always a sine wave","always analogue"], why:"Only set values, usually two."},
  {id:"K21", q:"Which waveform is used as an oscilloscope timebase?", opts:["Sawtooth","Square","Sinusoidal","Triangular"], why:"A steady ramp sweeps the trace across, then it snaps back."},
  {id:"K22", q:"Which waveform rises and falls at the same steady rate?", opts:["Triangular","Sawtooth","Square","Sinusoidal"], why:"Sawtooth rises steadily but drops suddenly."},
  {id:"K23", q:"A square wave's duty cycle is...", opts:["50%","25%","100%","any value"], why:"Equal mark and space."},
  {id:"K24", q:"Frequency is...", opts:["cycles per second, in hertz","the time for one cycle","the height of the wave","the number of levels"], why:"f = 1 ÷ T."},
  {id:"K25", q:"A signal has a period of 4 ms. Its frequency is...", opts:["250 Hz","4 Hz","25 Hz","2500 Hz"], why:"1 ÷ 0.004 = 250 Hz.", fb:{"25 Hz":"Check the units: 4 ms is 0.004 s."}},
  {id:"K26", q:"The most commonly credited advantage of digital signals:", opts:["Less affected by noise","Show every detail","Need no conversion","Use less bandwidth"], why:"The receiver only decides high or low.", fb:{"Use less bandwidth":"The June 2025 mark scheme gives the opposite as a disadvantage."}},
  {id:"K27", q:"A disadvantage of digital signals:", opts:["Only a sampled version, so detail is lost","Badly affected by noise","Cannot be stored","Cannot be encrypted"], why:"Rounding to the nearest step loses detail."},
  {id:"K28", q:"Signal conditioning...", opts:["gets a raw signal ready to be read","decides what the actuator does","stores data","generates the signal"], why:"Amplify, filter, scale, isolate, convert."},
  {id:"K29", q:"Signal processing...", opts:["uses the signal to make a decision or produce information","amplifies a raw signal","removes noise before the ADC","isolates the sensor"], why:"Comparing, calculating, logging, alarms."},
  {id:"K30", q:"Why is 4 to 20 mA preferred to 0 to 20 mA?", opts:["0 mA can only mean a fault (live zero)","It gives a bigger range","It uses less power","It is digital"], why:"A broken wire reads 0 mA, which is outside the range."},
  {id:"K31", q:"A 4-bit ADC has how many codes?", opts:["16","8","4","32"], why:"2⁴ = 16."},
  {id:"K32", q:"What does a DAC do?", opts:["Turns a binary code back into an analogue signal","Turns analogue into binary","Removes noise","Measures temperature"], why:"Digital to analogue converter."},
  {id:"K33", q:"Fan in is...", opts:["the number of inputs a gate has","the number of inputs one output can drive","the speed of a gate","the gate's supply voltage"], why:"Fan out is the other one."},
  {id:"K34", q:"A typical TTL gate has a fan out of...", opts:["10","2","100","1"], why:"Standard TTL: 10 unit loads."},
  {id:"K35", q:"An AND gate outputs 1 when...", opts:["all inputs are 1","any input is 1","all inputs are 0","the input is 0"], why:"Guard shut AND start pressed."},
  {id:"K36", q:"About how much does a type K thermocouple give per °C?", opts:["41 µV","41 mV","4.1 V","0.7 V"], why:"Microvolts, which is why it needs amplifying.", fb:{"41 mV":"Millivolts per degree would give 12 V at 300 °C. It is far smaller."}},
  {id:"K37", q:"Why is a current signal good over long cables?", opts:["Cable resistance does not change the current in a series loop","Current travels faster","Current cannot pick up noise at all","Cables only carry current"], why:"The same current flows all round the loop."},
  {id:"K38", q:"A 4 to 20 mA loop read across a 250 Ω resistor gives...", opts:["1 to 5 V","4 to 20 V","0 to 10 V","0.25 to 5 V"], why:"0.004 × 250 = 1 V; 0.020 × 250 = 5 V."},
  {id:"K39", q:"A Zener diode is mostly used as...", opts:["a simple voltage regulator","a light source","a rectifier","a switch"], why:"It holds a steady voltage in reverse breakdown."},
  {id:"K40", q:"Why do power semiconductors need heat sinks?", opts:["Their voltage drop times the current is lost as heat","They store charge","They run on AC","They are magnetic"], why:"P = V × I in the device itself."}

/* ---------- key word cards ---------- */
flash: [
  {id:"F01", term:"Semiconductor", def:"A material between a conductor and an insulator, whose conduction can be controlled by doping."},
  {id:"F02", term:"Doping", def:"Adding a tiny, controlled amount of another element to pure silicon."},
  {id:"F03", term:"N-type", def:"Silicon doped with phosphorus. Electrons are the majority carriers. Still neutral overall."},
  {id:"F04", term:"P-type", def:"Silicon doped with boron. Holes are the majority carriers. Still neutral overall."},
  {id:"F05", term:"Hole", def:"A missing electron in a bond, which behaves like a positive carrier."},
  {id:"F06", term:"Depletion layer", def:"The region at a P-N junction with no free charge carriers."},
  {id:"F07", term:"Forward bias", def:"Positive to the anode (P), negative to the cathode (N). Conducts above about 0.7 V in silicon."},
  {id:"F08", term:"Reverse bias", def:"Positive to the cathode (N). The depletion layer widens and almost no current flows."},
  {id:"F09", term:"Peak inverse voltage (PIV)", def:"The highest reverse voltage a diode can take before it breaks down."},
  {id:"F10", term:"Rectifier", def:"A circuit that converts AC into DC using diodes."},
  {id:"F11", term:"Ripple", def:"The small rise and fall left on a rectified, smoothed DC output."},
  {id:"F12", term:"Current gain (hFE)", def:"Collector current divided by base current."},
  {id:"F13", term:"Hierarchical design", def:"Splitting a circuit into blocks and sub-blocks by function, each with clear inputs and outputs."},
  {id:"F14", term:"Signal", def:"A voltage or current that changes to carry information."},
  {id:"F15", term:"Analogue signal", def:"A continuous signal that can take any value in its range."},
  {id:"F16", term:"Digital signal", def:"A discrete signal with set values, usually high (1) and low (0)."},
  {id:"F17", term:"Period", def:"The time for one complete cycle, in seconds."},
  {id:"F18", term:"Frequency", def:"Cycles per second, in hertz. f = 1 ÷ T."},
  {id:"F19", term:"Duty cycle", def:"Mark divided by period, as a percentage. A square wave is 50%."},
  {id:"F20", term:"Sawtooth wave", def:"Ramps up steadily then drops suddenly. Used for timebase sweeps."},
  {id:"F21", term:"Noise", def:"Unwanted electrical interference added to a signal."},
  {id:"F22", term:"Signal conditioning", def:"Getting a raw signal ready to be read: amplify, filter, scale, isolate, linearise, convert."},
  {id:"F23", term:"Signal processing", def:"Using a signal to make a decision or produce information."},
  {id:"F24", term:"Live zero", def:"Starting a current loop at 4 mA so that 0 mA can only mean a fault."},
  {id:"F25", term:"ADC", def:"Analogue to digital converter. Samples a signal and gives each sample a binary code."},
  {id:"F26", term:"Fan in", def:"The number of inputs a logic gate has, or can safely handle."},
  {id:"F27", term:"Fan out", def:"The number of gate inputs one gate output can drive reliably."}
],

var Net = {
  mode: function(){
    if (window.google && google.script && google.script.run) return "gas";
    if (HUB_CONFIG.endpoint) return "remote";
    if (FORM_PREFILL) return "forms";
    return "local";
  },
  call: function(action, payload){
    var m = this.mode();
    return new Promise(function(resolve, reject){
      if (m === "gas") {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload || {});
      } else if (m === "remote") {
        var ctrl = ("AbortController" in window) ? new AbortController() : null;
        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
        fetch(HUB_CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify(Object.assign({action:action}, payload||{})), signal: ctrl ? ctrl.signal : undefined})
          .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(timer); resolve(j); })
          .catch(function(e){ clearTimeout(timer); reject(e); });

var Sync = {

  flush: function(){
    var self = this, m = Net.mode();
    if (self.busy || !self.q.length || (m!=="gas" && m!=="remote")) return;
    if (navigator.onLine === false) return;
    self.busy = true;
    var batch = self.q.slice(0, 25);
    Net.call("log", {events: batch}).then(function(res){
      if (res && res.ok) {
        var sent = {}; batch.forEach(function(e){ sent[e.id]=1; });
        self.q = self.q.filter(function(e){ return !sent[e.id]; }); Store.set("queue", self.q); S.server.state = "ok";

        var bad = S.me ? S.me.code : ""; self.q = self.q.filter(function(e){ return e.code !== bad; }); Store.set("queue", self.q);

};

/* The game name the tracker sees: unit prefix, a space, then the title, e.g. 8.1/10.1 Circuit Reader.

function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : "8.1/10.1 " + title; }
function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;

}

      '<text x="'+(x+60)+'" y="96" text-anchor="middle" style="font:700 12px Arial,sans-serif;fill:var(--muted)">Red lead on</text>'+
      '<text x="'+(x+60)+'" y="114" text-anchor="middle" style="font:700 13px Arial,sans-serif;fill:var(--amb)">'+esc(label)+'</text>';
  }
  return svgWrap("0 0 300 150", m(20, "anode", a) + m(160, "cathode (band)", c), "Meter reads "+a+" with the red lead on the anode and "+c+" with it on the cathode");
}

</script>
<script>
"use strict";
/* ---------- the games, grouped by part (Structuring: a clear sequence and stages of progress) ---------- */
var GAMES = [
  {key:"recall",   title:"Remember when",     what:"Wake up the Ohm's law and AC ideas you need today."},
  {key:"circuit",  title:"Circuit Reader",    what:"Read the circuit. Does current flow? Is the transistor on?"},
  {key:"doctor",   title:"Diode Doctor",      what:"Read the meter. Is the diode good, open or shorted?"},
  {key:"waves",    title:"Wave Spotter",      what:"Read the waveform: its name, frequency, duty cycle or peak."},
  {key:"anadig",   title:"Analogue or Digital?", what:"Swipe each signal. Examples and non-examples."},
  {key:"stages",   title:"Stage Selector",    what:"A signal problem. Which conditioning stage fixes it?"},
  {key:"chain",    title:"Sequence It",       what:"Put signal chains, power supplies and processes in order."},
  {key:"ladder",   title:"Calculation Ladder",what:"Nine rungs. Worked examples at the bottom, on your own at the top."},
  {key:"why",      title:"Why? Because",      what:"Pick the answer, then the reason. Explain, don't just recall."},
  {key:"errors",   title:"Spot the Error",    what:"One part of each statement is wrong. Tap it."},
  {key:"examiner", title:"Examiner's Eye",    what:"Mark real style answers. How many marks, and why?"},
  {key:"pairs",    title:"Pair Up",           what:"Match each term to its meaning or use."},
  {key:"sure",     title:"Sure or Not?",      what:"Say how sure you are before you see the answer."},
  {key:"master",   title:"Master It",         what:"Anything you miss comes back until you get it right."}
];
var TITLE = {flash:"Key word cards", exit:"Exit ticket", review:"Review"};
GAMES.forEach(function(g){ TITLE[g.key] = g.title; });
if (CONTENT) { TITLE.checkin1 = CONTENT.checkin.p1.title; TITLE.checkin2 = CONTENT.checkin.p2.title; TITLE.checkin3 = CONTENT.checkin.p3.title; }
var LEVELS = [{name:"Apprentice",at:0},{name:"Engineering Technician",at:400},{name:"Incorporated Engineer",at:1000},{name:"Chartered Engineer",at:2000}];
function levelOf(xp){ var i=0; while (i<LEVELS.length-1 && xp>=LEVELS[i+1].at) i++; return {i:i, name:LEVELS[i].name, next:LEVELS[i+1]||null, from:LEVELS[i].at}; }
function streak(){
  var d = S.prog.days.slice().sort(), n = 0, day = new Date();
  if (d.indexOf(todayKey(day)) < 0) day.setDate(day.getDate()-1);
  while (d.indexOf(todayKey(day)) >= 0) { n++; day.setDate(day.getDate()-1); }
  return n;
}
function firstName(){ if (!S.me) return ""; var n = S.me.name || S.me.code; return n.split(" ")[0]; }
function initials(){ var n = (S.me && (S.me.name || S.me.code)) || "?"; var p = n.trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1]||""))).toUpperCase(); }
function guided(){ return S.prefs.mode !== "independent"; }

/* ---------- spaced review (Embedding: revisit once-learnt material to stop it being forgotten) ----------
   Each question in the review bank sits in a box. Wrong: back to box 0, due tomorrow.
   Right: up one box, due after 1, 3, 7 then 14 days.                                                */
var GAPS = [1, 3, 7, 14];
function addDays(n){ var d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }
function srsMark(id, ok){
  if (!id) return false;
  var box = S.prog.srs[id], was = box ? box.b : -1;
  if (!ok) { S.prog.srs[id] = {b:0, due:addDays(1)}; return true; }
  if (box) { var b = Math.min(box.b + 1, GAPS.length - 1); S.prog.srs[id] = {b:b, due:addDays(GAPS[b])}; }
  return false;
}
function dueIds(){ var t = todayKey(); return Object.keys(S.prog.srs).filter(function(id){ return S.prog.srs[id].due <= t && REG[id]; }); }
var REG = {};
function mcqFrom(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));
  return {id:x.id, rid:x.id, lead:lead||"", prompt:x.q, options:m.options, correct:m.correct, why:x.why, wf:x.fb||null}; }
function buildReg(){
  CONTENT.recall.forEach(function(x){ REG[x.id] = function(){ return mcqFrom(x, "From earlier in 8.1"); }; });
  CONTENT.quick.forEach(function(x){ REG[x.id] = function(){ return mcqFrom(x); }; });
  CONTENT.stages.forEach(function(x){ REG[x.id] = function(){ return stageItem(x); }; });
}

/* ---------- screen frame ---------- */
function fullHeader(){
  return '<header class="hdr"><div class="kick">'+esc(HUB_CONFIG.kicker)+'</div><h1>'+esc(HUB_CONFIG.hubName)+'</h1><div class="sub">'+esc(HUB_CONFIG.unitLabel)+'</div></header><div class="rule"></div>';
}
function gameHeader(title, i, n){

  return '<header class="hdr compact"><button class="iconbtn" data-act="back" aria-label="Back to the games">'+icon("back")+'</button>'+

    '<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>';

var inGame = false;
function screen(html, opts){
  opts = opts || {};

/* ---------- sign in ---------- */
function signIn(msg){
  var list = CLASS.length > 0;
  screen(fullHeader() + '<div class="wrap stack">' +
    '<div class="card stack"><h2 style="margin:0">Sign in</h2>' +
    (list ? '<p class="muted" style="margin:0">Tap your name.</p><div class="names">' + CLASS.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.name)+'</button>'; }).join("") + '</div><p class="muted small" style="margin:6px 0 0">Name not there? Type your code instead.</p>' : '') +
    '<label for="code"><b>Your hub code</b><br><span class="small muted">Four letters and numbers, on the slip from your tutor.</span></label>' +
    '<input id="code" class="textin codebox" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="err">' +
    '<button class="btn amber block" id="go">Start</button>' +
    '<p id="err" class="small" role="alert" style="color:var(--red);margin:0">' + esc(msg||"") + '</p></div>' +
    '<div class="panel amber"><h3>Nothing here is marked</h3><p>These games are for practice. Your scores stay on this phone until you choose to send them to your tutor.</p></div>' +
    '<p class="foot">Your tutor sees your code, your scores, what you write in the exit ticket and when you played, so they know what to go over again. Nothing else is collected.</p></div>', {out:true});
  var inp = $("#code"), go = $("#go");
  inp.addEventListener("input", function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go.click(); });
  function finish(code, name){
    S.me = {code:code, name:name || code}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} loadProg(); logEvent("open","hub"); home();
  }
  function tryCode(code, name){
    if (!/^[A-Z0-9]{4}$/.test(code)) { $("#err").textContent = "Your code has four letters and numbers."; return; }
    var m = Net.mode();
    if (m === "gas" || m === "remote") {
      go.disabled = true; go.textContent = "Checking";
      Net.call("hello", {code:code}).then(function(r){
        if (r && r.ok) finish(code, name || r.first);
        else { go.disabled=false; go.textContent="Start"; $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; }
      }).catch(function(){ go.disabled=false; go.textContent="Start"; $("#err").textContent = "Cannot reach the hub right now. Check your wifi or data and try again."; });
      return;
    }
    if (CLASS.length && !name) {
      var hit = CLASS.filter(function(c){ return c.code === code; })[0];
      if (!hit) { $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; return; }
      name = hit.name;
    }
    finish(code, name);
  }
  go.onclick = function(){ tryCode(inp.value.trim()); };
  $$(".names button").forEach(function(b){ b.onclick = function(){ var c = CLASS[+b.dataset.i]; tryCode(c.code, c.name); }; });
  if (!list) setTimeout(function(){ try { inp.focus(); } catch(e){} }, 60);
}
function signOut(silent){
  if (!silent && !confirm("Sign out on this phone? Your record stays here for next time.")) return;
  S.me = null; Store.del("me"); try { localStorage.removeItem("tlhub.me"); } catch(e) {} loadProg(); signIn();
}

/* ---------- home ---------- */
async function loadServer(){
  var m = Net.mode(); if (m !== "gas" && m !== "remote") return;
  try {
    var r = await Net.call("stats", {});
    if (r && r.ok) Object.assign(S.server, {state:"ok", focus:r.focus, target:r.target, week:r.week, message:r.message||"", nameOnly:!!r.nameOnly});
  } catch(e) { S.server.state = "offline"; }
}
function gameByKey(k){ return GAMES.filter(function(g){ return g.key === k; })[0]; }
function suggestNext(){
  /* first game in path order not yet checked */
  var order = []; CONTENT.parts.forEach(function(p){ order = order.concat(p.games); });
  for (var i=0;i<order.length;i++) if (!S.prog.stamps[order[i]]) return order[i];
  return "master";
}
function home(){
  if (!S.me) return signIn();
  S.tab = "games";
  var p = S.prog, lv = levelOf(p.xp), focus = S.server.focus || HUB_CONFIG.defaultFocus;
  var toNext = lv.next ? lv.next.at - p.xp : 0, span = lv.next ? lv.next.at - lv.from : 1, fill = lv.next ? Math.round(100*(p.xp-lv.from)/span) : 100;
  var checked = Object.keys(p.stamps).length, played = Object.keys(p.plays).reduce(function(a,k){ return a + p.plays[k]; }, 0);
  var due = dueIds().length, nxt = suggestNext();
  function tile(g, step){
    var best = p.best[g.key], n = p.plays[g.key]||0, isF = focus.indexOf(g.key) >= 0, good = best >= 80;

    return '<button class="tile" data-game="'+g.key+'" aria-label="'+esc((step?step+". ":"")+g.title+". "+g.what+" "+rec+(isF?". Set for this week":"")+(g.key===nxt?". Suggested next":""))+'">' +
      '<div class="art">'+tileArt(g.key)+'</div>' +
      (good ? '<span class="tick" aria-hidden="true">'+icon("check")+'</span>' : '') +
      '<div class="body"><span class="badges">' + (step ? '<span class="step">'+esc(step)+'</span>' : '') + (isF ? '<span class="badge">This week</span>' : '') + (g.key===nxt ? '<span class="badge next">Next</span>' : '') + '</span>' +
      '<span class="ttl">'+esc(g.title)+'</span><span class="what">'+esc(g.what)+'</span><span class="rec'+(good?' good':'')+'">'+rec+'</span></div></button>';
  }
  function row(act, ic, title, sub, pill){
    return '<button class="rowbtn" data-go="'+act+'"><span class="ic">'+icon(ic)+'</span><span class="tx"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+(pill||'<span aria-hidden="true" class="muted">'+icon("chev")+'</span>')+'</button>';
  }
  var goal = (p.goal != null) ? CONTENT.goals[p.goal] : null;
  var goalCard = goal ?
    '<div class="card goal"><div class="row" style="justify-content:space-between;align-items:baseline;flex-wrap:nowrap"><b style="color:var(--head)">My goal this week</b><button class="link" data-act="goal">Change</button></div>' +
    '<p style="margin:4px 0 8px">'+esc(goal.t)+'</p><div class="row">' + goal.games.map(function(k){ return '<button class="btn small ghost" data-game2="'+k+'">'+esc(TITLE[k])+'</button>'; }).join("") + '</div></div>' :
    '<button class="rowbtn" data-act="goal"><span class="ic">'+icon("flag")+'</span><span class="tx"><b>Set a goal for this week</b><span>Pick the thing you most want to get better at. The hub shows you where to practise it.</span></span><span aria-hidden="true" class="muted">'+icon("chev")+'</span></button>';
  var modeSeg = '<div class="modebox"><b style="color:var(--head)">How you play</b>' +
    '<div class="seg" role="group" aria-label="How you play" style="grid-template-columns:1fr 1fr;margin:6px 0 4px">' +
    '<button data-mode="guided" aria-pressed="'+guided()+'">Guided</button><button data-mode="independent" aria-pressed="'+(!guided())+'">Independent</button></div>' +
    '<p class="small muted" style="margin:0">'+(guided() ? "Hints and worked examples are on. When you score 80% or more, try Independent." : "No hints or worked examples. Every game earns 50% more points.")+'</p></div>';
  var path = CONTENT.parts.map(function(pt){

    var multi = pt.id !== "mix" && pt.id !== "p0";
    return '<section class="part"><div class="sec"><div><h2>'+esc(pt.title)+'</h2><div class="small muted">'+esc(pt.sub)+'</div></div>' +

      '<details class="goals"><summary>You will be able to</summary><ul>'+pt.goals.map(function(g){ return '<li>'+esc(g)+'</li>'; }).join("")+'</ul></details>' +
      '<div class="grid">' + gs.map(function(g,k){ return tile(g, multi ? "Step "+(k+1) : ""); }).join("") + '</div></section>';
  }).join("");
  var done = p.done;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="card"><div class="me"><span class="avatar" aria-hidden="true">'+esc(initials())+'</span><div><h2>Hello, '+esc(firstName())+'</h2>' +
    '<div class="lvl">'+esc(lv.name)+', '+p.xp+' points</div></div></div>' +
    '<div class="meter" aria-hidden="true"><i style="width:'+fill+'%"></i></div>' +
    '<div class="small muted" style="margin-top:6px">'+(lv.next ? toNext+' points to '+esc(lv.next.name) : 'Top level reached. Keep your scores sharp.')+'</div>' +
    '<div class="chips"><span class="chip">'+icon("flame")+streak()+' day streak</span><span class="chip">'+icon("check")+checked+' checked</span><span class="chip">'+icon("games")+played+' played</span></div>' +
    modeSeg + '</div>' +
    (S.server.message ? '<div class="panel amber" style="margin-top:12px"><p>'+esc(S.server.message)+'</p></div>' : '') +
    '<div class="rows" style="margin-top:12px">' +
      (due ? row("review", "cal", "Review: " + due + " question" + (due>1?"s":"") + " due today", "Questions you missed before, back when you are about to forget them.", '<span class="pill amber">Due</span>') :
             row("review", "cal", "Review", Object.keys(p.srs).length ? "Nothing due today. Missed questions come back after 1, 3, 7 and 14 days." : "Questions you miss in the games come back here on later days.", '<span class="pill">Nothing due</span>')) +
      goalCard + '</div>' +

    path +
    '<div class="sec"><h2>After the lesson</h2></div><div class="rows">' +
      row("exit", "exit", "Exit ticket", "Four questions and a check of all eight goals. Five minutes.", done.exit ? '<span class="pill">Handed in</span>' : '<span class="pill amber">To do</span>') +

}

/* ---------- my record ---------- */
var RECORD_KEYS = GAMES.map(function(g){ return g.key; }).concat(["review","flash","exit","checkin1","checkin2","checkin3"]);
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode();
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });
  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");

  screen(fullHeader() + '<div class="wrap">' +

      (cal.sw ? 'Sure but wrong is the one to shrink: those are the mistakes you would not spot in the exam.' : 'No confident mistakes so far. Good.')+'</p></div>' : '') +

    '<div class="sec"><h2>Copy all my results</h2></div>' +

    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +

    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +

  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){

  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf("U8S-") !== 0) throw 0;

      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });

/* ---------- navigation ---------- */

document.addEventListener("keydown", function(e){

    if (b) { e.preventDefault(); b.click(); }

</script>
<script>
"use strict";
/* ---------- results ---------- */
function resultMessage(pct){
  if (pct >= 90) return "Excellent. That is exam ready.";
  if (pct >= 70) return "Good work. Check the ones below, then go again.";
  if (pct >= 40) return "Getting there. Read the fixes, then play it again.";
  return "Early days. Read each fix below and try again. It gets easier every round.";
}
function sendPanel(title, score, max, detail){
  var m = Net.mode(), code = S.me ? S.me.code : "", chk = checkCode(code, title, score, max);
  if (m === "forms") return '<div class="panel amber stack" style="margin-top:12px"><h3>Send this to your tutor</h3>' +
    '<p>One tap opens the form with your code, the game and your score already filled in. Press Submit on the form.</p>' +
    '<p>Check code <span class="code">'+chk+'</span></p>' +
    '<div class="row"><a class="btn amber" id="send" target="_blank" rel="noopener" href="'+esc(formsLink(title, score, max, detail))+'">'+icon("send")+'Send my result</a>' +
    '<button class="btn ghost" id="copy1">'+icon("copy")+'Copy it instead</button></div></div>';
  if (m === "local") return '<div class="panel amber stack" style="margin-top:12px"><h3>Keep a copy</h3>' +
    '<p>This hub is not linked to your tutor&#39;s form yet. Copy this line and paste it where your tutor asks.</p>' +
    '<p class="small"><b>'+esc(resultLine(title, score, max))+'</b></p><button class="btn ghost" id="copy1">'+icon("copy")+'Copy it</button></div>';
  return '<p class="small muted" style="margin:12px 2px" data-sync>'+esc(syncText())+'</p>';
}
function wireSend(title, score, max){
  var c = $("#copy1"); if (c) c.onclick = function(){ copyText(resultLine(title, score, max), function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the line and copy it."); }); };
  var s = $("#send"); if (s) s.addEventListener("click", function(){ toast("The form is opening. Press Submit on it."); });
}
/* Interacting: turn the result into one clear, actionable next step */
function nextStep(key, pct, extra){
  var added = extra.added || 0, ind = !guided(), out = [];
  if (extra.conf && extra.conf.sw) out.push("You were sure but wrong on " + extra.conf.sw + (extra.conf.sw>1?" questions":" question") + ". Read those fixes twice: they are the mistakes you would not notice in the exam.");
  if (pct < 50) out.push(ind ? "Switch to Guided on the home page and play this again with hints on." : "Read the fixes below, open the key word cards, then play this again.");
  else if (pct < 80) out.push("Play it once more today. A score of 80% puts a tick on it.");
  else if (!ind) out.push("That is a tick. Try it in Independent mode next: no hints, and 50% more points.");
  else { var n = suggestNext(); if (n !== key) out.push("Move on to " + TITLE[n] + " next."); else out.push("Try Master It to keep this fluent."); }
  if (added) out.push(added + (added>1 ? " questions have" : " question has") + " gone on your review list for tomorrow.");
  return '<div class="card nextstep"><h3 style="margin:0 0 6px">Your next step</h3><ul class="review">' + out.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("") + '</ul></div>';
}
function finishGame(key, score, max, items, started, review, extra){
  extra = extra || {};
  var p = S.prog, title = TITLE[key], pct = max ? Math.round(100*score/max) : 0, secs = Math.round((Date.now()-started)/1000);
  var prev = p.best[key], newBest = prev == null || pct > prev;
  if (newBest) { p.best[key] = pct; p.raw[key] = [score, max]; }
  p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  var gain = 20 + score*10 + (extra.bonus||0); if (!guided()) gain = Math.round(gain * 1.5); p.xp += gain;
  var stamp = pct >= 80, firstStamp = stamp && !p.stamps[key]; if (stamp) p.stamps[key] = true;
  var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t);
  if (extra.conf) { p.cal = p.cal || {sr:0, sw:0, gr:0, gw:0}; ["sr","sw","gr","gw"].forEach(function(k){ p.cal[k] += extra.conf[k]||0; }); }
  saveProg();
  logEvent("finish", title, {score:score, max:max, secs:secs, items:items});
  var missed = items.filter(function(x){ return !x.ok; }).map(function(x){ return x.l; });
  var detail = (guided() ? "Guided" : "Independent") + ". " + (missed.length ? "To go over: " + missed.slice(0,6).join("; ") : "All correct") +
    (extra.conf ? ". Sure but wrong: " + (extra.conf.sw||0) : "");
  var calPanel = extra.conf ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Do you know what you know?</h3>' +
    '<div class="calgrid"><div><b>'+(extra.conf.sr||0)+'</b><span>Sure and right</span></div><div class="warn"><b>'+(extra.conf.sw||0)+'</b><span>Sure but wrong</span></div>' +
    '<div><b>'+(extra.conf.gr||0)+'</b><span>Guessed, but right</span></div><div><b>'+(extra.conf.gw||0)+'</b><span>Guessed and wrong</span></div></div>' +
    '<p class="small muted" style="margin:8px 0 0">Guessed but right is luck, not knowledge. Go back over those too.</p></div>' : '';
  screen(gameHeader(title, 0, 0) + '<div class="wrap">' +
    '<div class="card result"><p class="muted" style="margin:0 0 4px">'+esc(title)+(guided() ? '' : ', independent')+'</p><div class="big">'+score+'<small> of '+max+'</small></div>' +
    '<p style="margin:10px 0 4px">'+resultMessage(pct)+'</p><p class="small muted" style="margin:0">+'+gain+' points'+(newBest && prev != null ? ', a new best' : '')+'</p>' +
    (stamp ? '<span class="seal'+(firstStamp?' pop':'')+'">'+icon("check")+'Checked</span>' : '') + '</div>' +
    nextStep(key, pct, extra) + calPanel +
    sendPanel(title, score, max, detail) +
    (review.length ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">What to fix</h3><ol class="review">' +
      review.map(function(r){ return '<li><b>'+esc(r.q)+'</b><br>The answer: '+esc(r.right)+(r.why ? '. <span class="muted">'+esc(r.why)+'</span>' : '')+'</li>'; }).join("") + '</ol></div>'
      : '<div class="panel" style="margin-top:12px"><p>Nothing to fix this round.</p></div>') +
    '<div class="dock"><div class="row"><button class="btn amber" id="again">Play again</button><button class="btn ghost" id="hub">Back to the games</button></div></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#again").onclick = function(){ startGame(key); };
  $("#hub").onclick = function(){ home(); };
  say(score + " out of " + max + ". " + resultMessage(pct));
}

/* ---------- one engine for every multiple choice game ----------
   Adds, on top of the Unit 1.1 engine:
   wf     feedback written for a specific wrong answer (Interacting)
   hint   shown only in Guided mode (Structuring: scaffolds that come away)
   conf   rate how sure you are before the answer is shown (Activating)
   master a missed question returns two questions later until it is right (Embedding)
   rid    marks the question on the spaced review list (Embedding)                   */
function optButtons(opts){ return opts.map(function(o,k){ return '<button class="opt" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span class="l">'+esc(o)+'</span><span class="s"></span></button>'; }).join(""); }
function markOpts(correct, chosen){
  var ok = correct.indexOf(chosen) >= 0;
  $$(".opt").forEach(function(b){
    var j = +b.dataset.k; b.disabled = true; b.classList.remove("picked");
    if (correct.indexOf(j) >= 0) { b.classList.add("correct"); $(".s", b).textContent = (j === chosen || !ok) ? "Right answer" : "Also right"; }
    else if (j === chosen) { b.classList.add("wrong"); $(".s", b).textContent = "Not this one"; }
    else b.classList.add("dim");
  });
  return ok;
}
function showFeedback(ok, rightText, why, nextLabel, onNext, chosenFb){
  var fb = $("#fb");
  fb.className = "fb" + (ok ? "" : " bad");
  fb.innerHTML = '<strong>' + (ok ? pick(["Right.","Yes, that is it.","Correct."]) : "Not this time.") + '</strong>' +
    (ok ? "" : "The answer is: " + esc(rightText) + ". ") +
    (!ok && chosenFb ? '<span class="whyno"><b>About your answer:</b> ' + esc(chosenFb) + '</span>' : '') + esc(why || "");
  $("#dock").innerHTML = '<button class="btn amber block" id="next">'+nextLabel+'</button>';
  $("#next").onclick = onNext;
  say(ok ? "Right." : "Not this time. The answer is " + rightText);
  try { fb.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
}
function runMCQ(key, items, opts){
  opts = opts || {};
  /* every question in a round needs its own id: a repeated id would be treated as "Back again" and not scored */
  var idsSeen = {}; items = items.map(function(it, k){ if (idsSeen[it.id]) it = Object.assign({}, it, {id: it.id + "~" + k}); idsSeen[it.id] = 1; return it; });
  var queue = items.slice(), total = items.length, i = 0, score = 0, bonus = 0, log = [], review = [], started = Date.now(), shownAt = 0;
  var seen = {}, conf = {sr:0, sw:0, gr:0, gw:0}, added = 0, answered = 0;
  function show(){
    var it = queue[0], again = !!seen[it.id];
    var n = answered + queue.length;
    screen(gameHeader(TITLE[key], answered, n) + '<div class="wrap"><div class="card">' +
      '<div class="qno">'+(again ? "Back again" : (opts.label || "Question")+' '+(Object.keys(seen).length+1))+'</div>' +
      (it.lead ? '<p class="qprompt" style="margin:4px 0 0">'+esc(it.lead)+'</p>' : '') +
      '<p class="qtext">'+esc(it.prompt)+'</p>' +
      (it.art ? '<div class="qart">'+it.art+'</div>' : '') +
      (it.sub ? '<p class="qprompt">'+esc(it.sub)+'</p>' : '') +
      (it.hint && guided() ? '<div id="hintbox"><button class="link" id="hint">Show a hint</button></div>' : '') +
      '<div class="opts'+(opts.cols === 2 ? ' two' : '')+'">' + optButtons(it.options) + '</div>' +
      (opts.conf ? '<div id="confbox"></div>' : '') +
      '<div id="fb" role="status"></div></div><div class="dock" id="dock"></div></div>', {game:true});
    shownAt = Date.now();
    var h = $("#hint"); if (h) h.onclick = function(){ $("#hintbox").innerHTML = '<div class="worked">'+esc(it.hint)+'</div>'; it.usedHint = true; };
    $$(".opt").forEach(function(b){ b.onclick = function(){
      var k = +b.dataset.k;
      if (!opts.conf) return answer(k, null);
      $$(".opt").forEach(function(x){ x.classList.toggle("picked", x === b); });
      $("#confbox").innerHTML = '<p class="qprompt" style="margin:14px 0 8px"><b style="color:var(--head)">How sure are you?</b></p>' +
        '<div class="rag conf"><button class="g" data-c="sure">Sure</button><button class="a" data-c="think">Think so</button><button class="r" data-c="guess">Guessing</button></div>';
      $$("[data-c]").forEach(function(c){ c.onclick = function(){ $$("[data-c]").forEach(function(x){ x.disabled = true; x.setAttribute("aria-pressed", String(x === c)); }); answer(k, c.dataset.c); }; });
      try { $("#confbox").scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e) {}
    }; });
  }
  function answer(k, c){
    var it = queue[0], ok = markOpts(it.correct, k), right = it.correct.map(function(x){ return it.options[x]; }).join(" or ");
    var first = !seen[it.id]; seen[it.id] = (seen[it.id]||0) + 1; answered++;
    if (first) {
      if (ok) { score++; if (opts.speed && Date.now() - shownAt < 6000) bonus += 5; }
      else review.push({q:it.prompt, right:right, why:it.why});
      log.push({i:it.id, ok:ok?1:0, l:String(it.label || it.prompt).slice(0,90)});
      if (c) { var sure = c === "sure"; conf[(sure ? "s" : "g") + (ok ? "r" : "w")]++; }
      if (it.rid && srsMark(it.rid, ok)) added++;
    }
    var chosenFb = (!ok && it.wf) ? it.wf[it.options[k]] : "";
    queue.shift();
    if (opts.master && !ok && seen[it.id] < 3) queue.splice(Math.min(2, queue.length), 0, reshuffle(it));
    var last = queue.length === 0;
    showFeedback(ok, right, it.why, last ? "See my score" : (opts.master && !ok ? "Next (this one will come back)" : "Next"), function(){
      if (last) { saveProg(); finishGame(key, score, total, log, started, review, {bonus:bonus, conf:opts.conf ? conf : null, added:added}); }
      else show();
    }, chosenFb);
  }
  show();
}
function reshuffle(it){ var right = it.correct.map(function(x){ return it.options[x]; }), o = shuffle(it.options);
  return Object.assign({}, it, {options:o, correct:right.map(function(r){ return o.indexOf(r); })}); }
function mix(correct, wrongs){ var o = shuffle([correct].concat(wrongs)); return {options:o, correct:[o.indexOf(correct)]}; }

/* ---------- Remember when ---------- */
function runRecall(){ runMCQ("recall", shuffle(CONTENT.recall).slice(0,8).map(function(x){ return mcqFrom(x, "From earlier in 8.1"); }), {speed:true}); }

/* ---------- Circuit Reader: generated circuits ---------- */
function circuitItems(){
  var out = [];
  var LIT = "Yes: forward biased and above the knee voltage", REV = "No: the diode is reverse biased", LOW = "No: forward biased, but below the knee voltage", RC = "Yes: reverse biased diodes conduct too";
  for (var n = 0; n < 4; n++) {
    var mat = Math.random() < 0.7 ? "Si" : "Ge", knee = mat === "Si" ? 0.7 : 0.3;
    var volts = pick(mat === "Si" ? ["6 V","9 V","0.5 V","0.4 V","12 V"] : ["1.5 V","0.5 V","0.2 V","6 V"]), v = parseFloat(volts);
    var posTop = Math.random() < 0.5, right = Math.random() < 0.5, fwd = posTop === right, on = fwd && v > knee;
    var ans = on ? LIT : (!fwd ? REV : LOW), m = mix(ans, [LIT, REV, LOW, RC].filter(function(x){ return x !== ans; }));
    var wf = {};
    wf[LIT] = !fwd ? "Follow conventional current out of the + terminal. It reaches the bar (cathode) first, so the diode is reverse biased." : "It is forward biased, but "+volts+" is below the "+knee+" V a "+(mat==="Si"?"silicon":"germanium")+" diode needs.";
    wf[REV] = "Follow conventional current out of the + terminal. It reaches the triangle (anode) first, so the diode is forward biased.";
    wf[LOW] = !fwd ? "The voltage is not the problem here. The diode is the wrong way round, so it is reverse biased." : volts+" is above the "+knee+" V knee for "+(mat==="Si"?"silicon":"germanium")+", so current flows.";
    wf[RC] = "A reverse biased diode only conducts at breakdown, which is far above this supply.";
    out.push({id:"C-"+mat+"-"+volts+"-"+(fwd?"F":"R"), label:"Diode circuit, "+(mat==="Si"?"silicon":"germanium")+", "+volts,
      prompt:"Does current flow round this circuit?", art:diodeCircuitArt({posTop:posTop, right:right, mat:mat, volts:volts}),
      options:m.options, correct:m.correct, wf:wf,
