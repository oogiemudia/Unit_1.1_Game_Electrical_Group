 the job, so it can grow, but it costs more."},{"id":"TB05","term":"Signal conditioning","ban":["signal","sensor","PLC"],"p":2,"a":30,"ideas":[["Changes the measurement so the controller can use it",["chang","modif","convert","adjust","alter","fix","turn"]],["Because it is too small, too big, noisy or in the wrong form",["small","big","large","noise","noisy","form","type"]]],"model":"Changing what comes out of a measuring device so the controller can use it: making it bigger or smaller, taking out the noise, or turning it into numbers."},{"id":"TB06","term":"Live zero","ban":["4 mA","zero","fault"],"p":2,"a":32,"ideas":[["The lowest reading is sent as a small current, not nothing",["lowest","bottom","small current","not nothing","minimum","start"]],["So no current at all means a broken wire",["broken","wire","wrong","nothing","no current","dead"]]],"model":"The bottom of the range is sent as a small current rather than nothing, so if the current ever drops to nothing, the controller knows a wire is broken."},{"id":"TB07","term":"Amplification","ban":["gain","bigger","signal"],"p":2,"a":31,"ideas":[["Makes a measurement larger",["larger","increase","boost","grow","more","raise","louder"]],["Such as millivolts from a strain gauge up to volts",["millivolt","mv","strain","volts","small","tiny"]]],"model":"Boosting a tiny reading so it is large enough to use, such as a few millivolts from a strain gauge raised to several volts."},{"id":"TB08","term":"Ladder logic","ban":["rung","rail","relay"],"p":2,"a":39,"ideas":[["A picture-style language for programming the controller",["picture","drawing","diagram","graphic","language","program"]],["Contacts on the left, coils on the right, read left to right",["contact","coil","left","right"]]],"model":"A way of programming the controller by drawing pictures instead of typing code: switches (contacts) on the left, outputs (coils) on the right, read left to right and top to bottom."},{"id":"TB09","term":"Latch","ban":["seal","start","stop"],"p":2,"a":43,"ideas":[["The output's own contact keeps its line powered",["own contact","its contact","itself","keeps","stays","remain","holds"]],["So it stays on after the button is let go, until it is reset",["let go","released","button","until","reset","off button"]]],"model":"When you press the go button, the output switches on, and a contact from that same output keeps its line powered. So it stays on after you let go, until the off button breaks the line."},{"id":"TB10","term":"Motor driver IC","ban":["current","motor","chip"],"p":3,"a":58,"ideas":[["The controller's output is too weak to run the load on its own",["weak","small","too little","not enough","20"]],["It boosts the power from its own supply",["boost","more","bigger","supply","power","amplif","extra"]]],"model":"A controller's output is far too weak to spin a load like a fan or wheel. This part takes the small control signal and boosts it from its own supply."},{"id":"TB11","term":"H-bridge","ban":["switch","reverse","four"],"p":3,"a":60,"ideas":[["Lets the flow go through the load in either direction",["direction","either way","both ways","other way","backwards","forwards","flip"]],["So a DC motor can turn both ways",["turn","spin","both ways","motor"]]],"model":"A circuit that can send the flow through a DC motor one way or the other way, so the motor can spin forwards or backwards."},{"id":"TB12","term":"Opto-isolator","ban":["light","LED","isolat"],"p":3,"a":65,"ideas":[["The message crosses a gap with no wire",["gap","no wire","no connection","not connected","across","beam"]],["So spikes or high voltages cannot reach the processor",["spike","high voltage","cpu","processor","protect","safe"]]],"model":"A tiny chip where the message jumps a gap as a beam, with no wire joining the two sides. So a spike on the factory wiring cannot reach the processor."},{"id":"TB13","term":"SCADA","ban":["supervis","monitor","control"],"p":3,"a":70,"ideas":[["Software in a central room for a whole plant or many sites",["software","room","computer","plant","whole","site"]],["Collects data, shows screens and logs alarms",["data","screen","alarm","log","trend","graph","collect"]]],"model":"Software in a central room that watches over a whole plant or hundreds of sites: it collects data, shows it on screens, logs alarms and lets operators change set points."},{"id":"TB14","term":"Dedicated IC","ban":["chip","one","fixed"],"p":3,"a":76,"ideas":[["Built into a product to do just a single job",["single","only","just","product","job"]],["Cheap when millions are made, but hard to change",["cheap","millions","mass","cost","hard to change","cannot change","cant change","redesign"]]],"model":"A custom part built into a product to do just a single job, like the timer in a toothbrush. Very cheap when millions are made, but almost impossible to change afterwards."}],"why":[{"id":"Y01","q":"A machine's job changes every few weeks. Should it be run by a PLC or a hard-wired relay panel?","a":8,"steps":[{"label":"Pick the answer","correct":"A PLC","wrongs":["A relay panel","Either: they are changed the same way","Neither can be changed"]},{"label":"Pick the reason","correct":"A new job is a program change on a PLC, but a relay panel has to be rewired, which takes days and is easy to get wrong","wrongs":["PLCs have no moving parts at all","Relays only work with AC","A PLC does not need a power supply"]}]},{"id":"Y02","q":"A 6 mm label passes a sensor at 1.5 m/s. The scan time is 10 ms. Will the PLC always see it?","a":16,"steps":[{"label":"Pick the answer","correct":"No: it could miss it","wrongs":["Yes, every time","Yes, in about 10 scans","No: PLCs cannot read labels"]},{"label":"Pick the reason","correct":"The label blocks the sensor for 4 ms, less than one scan, so it can pass between two input reads","wrongs":["The sensor is too far from the label","Labels give analogue signals","The program runs before the inputs are read"]}]},{"id":"Y03","q":"Which type of PLC suits a water treatment works where faults must be fixed in minutes?","a":21,"steps":[{"label":"Pick the answer","correct":"Modular","wrongs":["Unitary","Unitary with modular features","A dedicated IC"]},{"label":"Pick the reason","correct":"It handles hundreds of I/O, and a faulty card can be swapped on its own","wrongs":["It is the cheapest type","It is the smallest type","It has a fixed number of I/O"]}]},{"id":"Y04","q":"Why do many sensors send 4 to 20 mA rather than 0 to 20 mA?","a":32,"steps":[{"label":"Pick the answer","correct":"So a broken wire can be spotted","wrongs":["So the PLC uses less power","Because 4 mA is easier to measure","So the signal can go negative"]},{"label":"Pick the reason","correct":"A working sensor never sends less than 4 mA, so 0 mA can only mean a fault: a live zero","wrongs":["0 mA would damage the PLC input","A wire cannot carry 0 mA","The PLC cannot count below 4"]}]},{"id":"Y05","q":"A load cell gives 0 to 20 mV, but the PLC input reads 0 to 10 V. What is needed?","a":33,"steps":[{"label":"Pick the answer","correct":"Amplification with a gain of 500","wrongs":["Attenuation with a gain of 500","Amplification with a gain of 0.5","Filtering only"]},{"label":"Pick the reason","correct":"The signal must be made 500 times bigger: 10 V ÷ 0.020 V = 500","wrongs":["10 ÷ 20 = 0.5, so it must be halved","Filtering makes small signals bigger","The ADC does the amplifying"]}]},{"id":"Y06","q":"A 12-bit ADC and an 8-bit ADC both cover 0 to 10 V. Which sees smaller changes?","a":34,"steps":[{"label":"Pick the answer","correct":"The 12-bit ADC","wrongs":["The 8-bit ADC","Both the same","Neither: ADCs see every change"]},{"label":"Pick the reason","correct":"12 bits give 4096 steps against 256, so each step is smaller","wrongs":["Fewer bits mean less noise","A 12-bit ADC covers a bigger voltage range","8 bits give more values than 12"]}]},{"id":"Y07","q":"A motor must stop when either of two STOP buttons is pressed. How are the two STOP contacts drawn?","a":41,"steps":[{"label":"Pick the answer","correct":"Two normally closed contacts in series","wrongs":["Two normally closed contacts in parallel","Two normally open contacts in series","Two normally open contacts in parallel"]},{"label":"Pick the reason","correct":"In series, opening either one breaks the rung; normally closed means each passes power until it is pressed","wrongs":["In parallel, opening either one breaks the rung","Normally open contacts pass power until they are pressed","Series means any one branch can pass power"]}]},{"id":"Y08","q":"The press must only run when the guard is closed and both hand buttons are held. How is the rung drawn?","a":42,"steps":[{"label":"Pick the answer","correct":"Three normally open contacts in series","wrongs":["Three contacts in parallel","Two contacts in series and one in parallel","One normally closed contact"]},{"label":"Pick the reason","correct":"Series is AND: power reaches the coil only if every contact passes it","wrongs":["Parallel is AND","Series is OR","Normally open contacts always pass power"]}]},{"id":"Y09","q":"Pressing STOP does nothing once M1 is running. What is wrong?","a":48,"steps":[{"label":"Pick the answer","correct":"The seal-in bypasses STOP","wrongs":["STOP is normally closed","There is no seal-in contact","START is normally open"]},{"label":"Pick the reason","correct":"STOP sits inside the parallel branch, so power flows round it through the seal-in; STOP must be in series after the branch","wrongs":["Normally closed contacts never open","The coil needs a second rung","START must be normally closed"]}]},{"id":"Y10","q":"Why can't a controller's output pin run a small DC motor on its own?","a":58,"steps":[{"label":"Pick the answer","correct":"The pin cannot supply enough current","wrongs":["The pin gives too much voltage","Motors need AC","Controllers have no outputs"]},{"label":"Pick the reason","correct":"A pin gives about 20 mA, but the motor draws a few hundred mA, so a driver IC supplies it from its own supply","wrongs":["The motor would run too fast","The pin is an input only","Current flows the wrong way in a pin"]}]},{"id":"Y11","q":"A robot buggy's two motors must go forwards and backwards. ULN2803 or L293D?","a":63,"steps":[{"label":"Pick the answer","correct":"L293D","wrongs":["ULN2803","Either: they do the same job","Neither can drive motors"]},{"label":"Pick the reason","correct":"Its two H-bridges let current flow through each motor either way","wrongs":["It has eight channels","It can switch up to 50 V","Its built-in diodes reverse the current"]}]},{"id":"Y12","q":"Most PLC input modules use opto-isolators. Why?","a":65,"steps":[{"label":"Pick the answer","correct":"To protect the CPU from spikes on the factory wiring","wrongs":["To make the input faster","To amplify the sensor signal","To turn analogue into digital"]},{"label":"Pick the reason","correct":"The signal crosses a gap as light, so no wire joins the field side to the CPU","wrongs":["Light travels faster than electricity","The LED stores the signal","The opto-isolator turns AC into DC"]}]},{"id":"Y13","q":"On a conveyor, should a PLC or a computer-based system do the direct control?","a":85,"steps":[{"label":"Pick the answer","correct":"The PLC","wrongs":["The computer","Neither","A dedicated IC"]},{"label":"Pick the reason","correct":"It is rugged and its timing is fast and predictable, so the belt stops at the same point every time","wrongs":["It has more memory and storage","It runs Python and C#","It draws better graphs"]}]},{"id":"Y14","q":"A water company wants trend graphs and alarm logs for 300 pumping stations. What does that job?","a":70,"steps":[{"label":"Pick the answer","correct":"A computer running SCADA software","wrongs":["A unitary PLC at each site, on its own","A dedicated IC","A ULN2803"]},{"label":"Pick the reason","correct":"Computers are excellent with data, graphs and screens; the PLCs and RTUs at the sites do the control","wrongs":["Computers are more rugged than PLCs","SCADA needs no network","PLCs cannot be connected to anything"]}]}],"errors":[{"id":"E01","a":15,"chunks":["Each scan, a PLC reads its inputs,","runs the program and updates the outputs,","then does housekeeping and repeats about once a minute."],"wrong":2,"fix":"The scan repeats every few milliseconds, not once a minute."},{"id":"E02","a":16,"chunks":["A PLC with a 20 ms scan time","makes 1 ÷ 20 = 0.05 scans per second,","so a 5 ms pulse could be missed."],"wrong":1,"fix":"Change ms to s first: 1 ÷ 0.020 s = 50 scans per second. The 5 ms pulse is shorter than one scan, so it could be missed."},{"id":"E03","a":21,"chunks":["Rack-mounted PLCs","have the features of both unitary and modular PLCs,","and suit large plants."],"wrong":1,"fix":"Rack-mounted PLCs are the modular type. The type in between is unitary with modular features. (City and Guilds PowerPoint 5 has this slip.)"},{"id":"E04","a":19,"chunks":["A unitary PLC is small and cheap,","but if it needs more inputs","you clip on extra modules."],"wrong":2,"fix":"A unitary PLC has a fixed number of I/O and cannot be expanded. Clip-on modules are what unitary with modular features allows."},{"id":"E05","a":32,"chunks":["A 0 to 100 °C transmitter sends 12 mA.","To find the temperature, divide 12 by the 20 mA top of the range","and multiply by 100."],"wrong":1,"fix":"Take off the 4 mA live zero first: (12 − 4) ÷ 16 × 100 = 50 °C."},{"id":"E06","a":33,"chunks":["The input reads 0 to 10 V and the load cell gives 0 to 20 mV.","Gain = output ÷ input,","so the gain is 10 ÷ 20 = 0.5."],"wrong":2,"fix":"Use the same units: 20 mV = 0.020 V, so gain = 10 ÷ 0.020 = 500."},{"id":"E07","a":34,"chunks":["A 12-bit ADC gives 2¹² = 4096 values.","Across 0 to 10 V each step is 10 ÷ 4096 = 2.44 mV,","so more bits give bigger steps."],"wrong":2,"fix":"More bits give smaller steps and a finer picture."},{"id":"E08","a":41,"chunks":["Contacts in series make AND.","Contacts in parallel make OR.","A normally open contact makes NOT."],"wrong":2,"fix":"NOT is a normally closed contact: it passes power only while its input is off."},{"id":"E09","a":48,"chunks":["In a start and stop latch,","STOP is drawn as a normally open contact","in series after the START and seal-in branch."],"wrong":1,"fix":"STOP must be normally closed. Drawn normally open, it blocks power until pressed, so M1 will not start (Fault 3)."},{"id":"E10","a":59,"chunks":["The ULN2803 has eight Darlington channels,","each switching up to 500 mA,","so it can drive a motor forwards and backwards."],"wrong":2,"fix":"Current flows one way only through a ULN2803, so it cannot reverse a motor. The L293D's H-bridges can."},{"id":"E11","a":60,"chunks":["The L293D has two H-bridges,","so it can drive two motors both ways,","at up to 3 A per motor."],"wrong":2,"fix":"It gives up to 600 mA per motor. A 3 A motor needs reversing contactors or a motor drive."},{"id":"E12","a":60,"chunks":["To reverse a DC motor with an H-bridge,","close S1 and S4 for forward,","and S1 and S2 for reverse."],"wrong":2,"fix":"Reverse is S2 and S3 closed, so the current flows the other way through the motor."},{"id":"E13","a":70,"chunks":["SCADA supervises whole processes,","RTUs gather data at distant sites,","and the HMI is the chip that drives the motors."],"wrong":2,"fix":"The HMI is the screen operators use to see and change what the PLC is doing."},{"id":"E14","a":76,"chunks":["A dedicated IC is cheap per unit in large numbers,","easy to change after it is made,","and suits products such as smoke alarms."],"wrong":1,"fix":"A dedicated IC is hard or impossible to change once it is made."},{"id":"E15","a":77,"chunks":["Computer-based systems are excellent with data and graphs,","and their timing is guaranteed,","so they are often used to supervise PLCs."],"wrong":1,"fix":"Their timing is not guaranteed, because the processor is shared with other software. That is why PLCs do the fast control."},{"id":"E16","a":30,"chunks":["Signal conditioning changes the meaning of a sensor's signal","so that it meets the requirements","for processing by a PLC."],"wrong":0,"fix":"It changes the form of the signal, not its meaning, like an interpreter."}],"examiner":[{"id":"X01","src":"Lesson exam-style question, slide 26 (written for the lesson, not a past paper)","q":"Explain two differences between a unitary PLC and a modular PLC.","max":4,"a":"A unitary PLC has everything in one box. A modular PLC is bigger.","got":1,"why":"One mark for unitary: all parts in one housing. 'Bigger' is not the matched modular point (separate modules on a rack), and there is no second difference.","model":"Unitary: all parts in a single housing [1]; modular: separate modules connected on a rack [1]. Unitary: fixed number of I/O, cannot be expanded [1]; modular: modules can be added or removed to suit the job [1]. Also accept: unitary cheaper and smaller [1]; modular costs more but a faulty module can be replaced on its own [1].","sl":26},{"id":"X02","src":"Lesson exam-style question, slide 26 (written for the lesson, not a past paper)","q":"Explain two differences between a unitary PLC and a modular PLC.","max":4,"a":"A unitary PLC has the power supply, CPU and I/O in one housing, while a modular PLC is separate modules in a rack. A unitary PLC has a fixed number of inputs and outputs, but modules can be added to a modular one when the job grows.","got":4,"why":"Two matched pairs: the housing, and expanding the I/O. Full marks.","model":"Unitary: all parts in a single housing [1]; modular: separate modules connected on a rack [1]. Unitary: fixed number of I/O, cannot be expanded [1]; modular: modules can be added or removed to suit the job [1]. Also accept: unitary cheaper and smaller [1]; modular costs more but a faulty module can be replaced on its own [1].","sl":26},{"id":"X03","src":"Lesson exam-style question, slide 26 (written for the lesson, not a past paper)","q":"Explain two differences between a unitary PLC and a modular PLC.","max":4,"a":"Unitary PLCs are cheaper. Modular PLCs cost more, but a faulty module can be swapped on its own.","got":2,"why":"The mark scheme accepts cost and repair as a matched pair, one mark each. Only one difference is given, so 2 marks.","model":"Unitary: all parts in a single housing [1]; modular: separate modules connected on a rack [1]. Unitary: fixed number of I/O, cannot be expanded [1]; modular: modules can be added or removed to suit the job [1]. Also accept: unitary cheaper and smaller [1]; modular costs more but a faulty module can be replaced on its own [1].","sl":26},{"id":"X04","src":"Lesson exam-style question, slide 53 (written for the lesson, not a past paper)","q":"Describe two methods of sensor signal conditioning used before a signal is processed by a PLC.","max":4,"a":"Amplification makes the signal bigger. Filtering.","got":3,"why":"Amplification is named [1] and described [1]. Filtering is named [1] but not described: it removes unwanted parts such as noise.","model":"For each of two methods, one mark for naming it and one for describing it: analogue to digital conversion [1], changes a continuous analogue signal into a discrete digital signal [1]; amplification [1], increases the size or gain [1]; attenuation [1], reduces the strength [1]; filtering [1], removes unwanted features such as noise or certain frequencies [1].","sl":53},{"id":"X05","src":"Lesson exam-style question, slide 53 (written for the lesson, not a past paper)","q":"Describe two methods of sensor signal conditioning used before a signal is processed by a PLC.","max":4,"a":"Attenuation and analogue to digital conversion.","got":2,"why":"Two methods named, one mark each. Neither is described, so 2 of 4.","model":"For each of two methods, one mark for naming it and one for describing it: analogue to digital conversion [1], changes a continuous analogue signal into a discrete digital signal [1]; amplification [1], increases the size or gain [1]; attenuation [1], reduces the strength [1]; filtering [1], removes unwanted features such as noise or certain frequencies [1].","sl":53},{"id":"X06","src":"Practice question written for this hub, in the style of Core Paper 1 (not a past paper)","q":"Explain why a motor driver IC is needed between a controller and a DC motor.","max":2,"a":"The output pin can only give about 20 mA, which is not enough current for the motor.","got":1,"why":"First mark: the output cannot supply enough current. The second mark needs what the driver IC does: it gives the motor the larger current from its own supply.","model":"The controller's output cannot supply enough current to drive the motor [1]; the driver IC takes the small control signal and provides the larger current from its own supply [1].","sl":58},{"id":"X07","src":"Practice question written for this hub, in the style of Core Paper 1 (not a past paper)","q":"Describe how an opto-isolator protects a PLC's CPU.","max":2,"a":"The input signal lights an LED and a phototransistor picks up the light, so no wire joins the field wiring to the CPU and spikes cannot get through.","got":2,"why":"Both points: the signal crosses as light, and there is no electrical connection, so spikes cannot reach the CPU.","model":"The signal is passed as light from an LED to a phototransistor [1]; there is no wire across the gap, so high voltages or spikes on the field side cannot reach the CPU [1].","sl":65},{"id":"X08","src":"Practice question written for this hub, in the style of Core Paper 1 (not a past paper)","q":"Explain what the seal-in contact does in a start and stop latch.","max":2,"a":"It keeps the motor on.","got":1,"why":"It keeps the output on [1], but not how: a contact from the output, in parallel with START, keeps the rung powered after START is let go [1].","model":"It is a contact from the output coil wired in parallel with START [1], which keeps the rung powered so the output stays on after START is let go [1].","sl":43},{"id":"X09","src":"Practice question written for this hub, in the style of Core Paper 1 (not a past paper)","q":"A 4 to 20 mA level transmitter covers 0 to 800 mm. It sends 10 mA. Calculate the level.","max":2,"a":"10 ÷ 20 × 800 = 400 mm","got":0,"why":"The live zero was not taken off, so neither the method nor the answer earns credit.","model":"(10 − 4) ÷ 16 × 800 [1] = 300 mm [1].","sl":32},{"id":"X10","src":"Practice question written for this hub, in the style of Core Paper 1 (not a past paper)","q":"A 4 to 20 mA level transmitter covers 0 to 800 mm. It sends 10 mA. Calculate the level.","max":2,"a":"(10 − 4) ÷ 16 × 800 = 3 mm","got":1,"why":"The method is right [1], but 6 ÷ 16 × 800 is 300 mm, not 3 mm. Showing the method saved a mark.","model":"(10 − 4) ÷ 16 × 800 [1] = 300 mm [1].","sl":32},{"id":"X11","src":"8730-031 Summer 2026 Paper 1, question 19","q":"An engineering company is designing an automated conveyor. Discuss the advantages and limitations of using PLCs compared to computer-based systems in this application.","max":12,"bands":true,"a":"PLCs are good because they are reliable. Computers are good for data. I would use a PLC.","got":0,"why":"A few simple points with no development, little comparison and no real link to the conveyor: band 1 (1 to 3 marks).","model":"Band 4 (10 to 12): advantages and limitations of both, always applied to the conveyor; a wide range of factors (reliability, conditions, speed, data, flexibility, maintenance); balanced reasoning and a clear, justified conclusion: PLC for control, computer for supervision and data.","sl":84},{"id":"X12","src":"8730-031 Summer 2026 Paper 1, question 19","q":"An engineering company is designing an automated conveyor. Discuss the advantages and limitations of using PLCs compared to computer-based systems in this application.","max":12,"bands":true,"a":"A PLC is a controller used in factories and a computer is a PC. PLCs are rugged and reliable but have less memory. Computers have more processing power and storage but are less rugged and can crash.","got":1,"why":"Some advantages and limitations of both, but nothing is applied to the conveyor and there is no judgement: band 2 (4 to 6 marks).","model":"Band 4 (10 to 12): advantages and limitations of both, always applied to the conveyor; a wide range of factors (reliability, conditions, speed, data, flexibility, maintenance); balanced reasoning and a clear, justified conclusion: PLC for control, computer for supervision and data.","sl":84},{"id":"X13","src":"8730-031 Summer 2026 Paper 1, question 19","q":"An engineering company is designing an automated conveyor. Discuss the advantages and limitations of using PLCs compared to computer-based systems in this application.","max":12,"bands":true,"a":"A PLC suits the conveyor because it copes with dust and vibration on the line, while a computer is more sensitive and could crash and stop the belt. PLC timing is predictable, so the belt stops when a sensor is triggered. However, a computer is better at logging data and drawing graphs. On balance a PLC should control the conveyor, with a computer used to monitor it.","got":2,"why":"Both systems, clear links to the conveyor, reliability, timing, data and a judgement: band 3 (7 to 9). For band 4 it needs a wider range of factors (maintenance, flexibility, cost, cyber risk) developed in more depth, with the PLC's limitations too.","model":"Band 4 (10 to 12): advantages and limitations of both, always applied to the conveyor; a wide range of factors (reliability, conditions, speed, data, flexibility, maintenance); balanced reasoning and a clear, justified conclusion: PLC for control, computer for supervision and data.","sl":84}],"plctype":[{"id":"H01","q":"A small office car park barrier: 4 inputs, 2 outputs, and the system will never change.","opts":["Unitary","Unitary with modular features","Modular","A dedicated IC"],"why":"Unitary: small, cheap, and 6 I/O will never need to grow.","fb":{"Modular":"It would work, but it costs far more and takes more space than six I/O need."},"a":23,"t":{"k":"short","acc":["unitary","unitary plc","unitary type","a unitary plc"]},"p":1},{"id":"H02","q":"A bakery bagging machine: 30 I/O, with a label printer and a checkweigher added next year.","opts":["Unitary with modular features","Unitary","Modular","A dedicated IC"],"why":"Unitary with modular features: start compact and clip on modules when the new machines arrive.","fb":{"Unitary":"A unitary PLC has a fixed number of I/O, so the new machines could not be added.","Modular":"Defensible if the whole line keeps growing, but it costs more than this job needs."},"a":23,"t":{"k":"short","acc":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"]},"p":1},{"id":"H03","q":"A water treatment works: about 600 sensors, pumps and valves, running 24 hours a day. Faults must be fixed in minutes.","opts":["Modular","Unitary","Unitary with modular features","A dedicated IC"],"why":"Modular: a huge I/O count, easy to expand, and a faulty card can be swapped in minutes.","fb":{"Unitary":"A unitary PLC has fixed, usually few, I/O, and the whole unit is replaced if it fails."},"a":23,"t":{"k":"short","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},"p":1},{"id":"H04","q":"A single conveyor in a small workshop: 8 I/O, with no plans to change.","opts":["Unitary","Unitary with modular features","Modular","A dedicated IC"],"why":"Unitary: a few fixed I/O is all it needs, at the lowest cost.","a":19,"t":{"k":"short","acc":["unitary","unitary plc","unitary type","a unitary plc"]},"p":1},{"id":"H05","q":"A small pump set: two pumps, two level switches and a fault lamp.","opts":["Unitary","Unitary with modular features","Modular","A dedicated IC"],"why":"Unitary: a small pump set is one of the typical uses on slide 19.","a":19,"t":{"k":"short","acc":["unitary","unitary plc","unitary type","a unitary plc"]},"p":1},{"id":"H06","q":"A car body shop with hundreds of robots, sensors and safety devices.","opts":["Modular","Unitary","Unitary with modular features","A dedicated IC"],"why":"Modular: very large numbers of I/O, and a faulty card can be swapped quickly to cut downtime.","a":21,"t":{"k":"short","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},"p":1},{"id":"H07","q":"A packaging machine that may get a label printer later.","opts":["Unitary with modular features","Unitary","Modular","A dedicated IC"],"why":"Unitary with modular features: cheap to start with, and it can grow a little as the machine changes.","a":20,"t":{"k":"short","acc":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"]},"p":1},{"id":"H08","q":"Which type of PLC has the lowest cost?","opts":["Unitary","Unitary with modular features","Modular","A dedicated IC"],"why":"Unitary: lowest cost, but fixed I/O.","a":22,"t":{"k":"short","acc":["unitary","unitary plc","unitary type","a unitary plc"]},"p":1},{"id":"H09","q":"Which type is quickest to repair, because you swap the faulty card and carry on?","opts":["Modular","Unitary","Unitary with modular features","A dedicated IC"],"why":"Modular: swap the faulty module, so there is less downtime.","fb":{"Unitary":"On a unitary PLC the whole unit is usually replaced."},"a":22,"t":{"k":"short","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},"p":1},{"id":"H10","q":"Which type can grow a little, but only up to a limited number of add-on modules?","opts":["Unitary with modular features","Unitary","Modular","A dedicated IC"],"why":"Unitary with modular features: a base unit with room for a limited number of extra modules.","a":22,"t":{"k":"short","acc":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"]},"p":1},{"id":"H11","q":"If one part of this type of PLC fails, the whole unit is usually replaced.","opts":["Unitary","Unitary with modular features","Modular","A dedicated IC"],"why":"Unitary: everything is in one housing, so the whole unit is replaced.","a":19,"t":{"k":"short","acc":["unitary","unitary plc","unitary type","a unitary plc"]},"p":1},{"id":"H12","q":"Which type has separate modules plugged into a rack that share a backplane?","opts":["Modular","Unitary","Unitary with modular features","A dedicated IC"],"why":"Modular (rack-mounted): power supply, CPU, I/O and communications cards in a rack.","a":21,"t":{"k":"short","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},"p":1},{"id":"H13","q":"A food factory with 400 I/O that adds a new line every year.","opts":["Modular","Unitary","Unitary with modular features","A dedicated IC"],"why":"Modular: hundreds of I/O and easy to expand year after year.","a":21,"t":{"k":"short","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},"p":1},{"id":"H14","q":"A car wash with 20 I/O. The owner may add a wax spray unit later.","opts":["Unitary with modular features","Unitary","Modular","A dedicated IC"],"why":"Unitary with modular features: start compact and add a module for the wax unit.","a":20,"t":{"k":"short","acc":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"]},"p":1}],"scanfacts":[{"id":"SF1","q":"What does a PLC do first in every scan?","opts":["Reads every input into memory","Runs the program","Updates the outputs","Housekeeping"],"why":"First it reads every input into memory, then runs the program using those copies.","fb":{"Runs the program":"The program uses the copies of the inputs, so the inputs are read first."},"a":15,"t":{"k":"short","acc":["read inputs"," ices make sure information passes accurately between the PLC and its I/O devices, networks and people."},{"id":"A4","title":"Inside the process block","a":57,"bins":["Logic gates","Timers","Counters","Comparators","Latches"],"cards":[["Run the press only if the guard is closed and both buttons are held","Logic gates"],["Sound the horn if either emergency button is pressed","Logic gates"],["Hold the barrier up for 10 seconds","Timers"],["Open the fill valve for 3 seconds for each bottle","Timers"],["Count 12 bottles, then move the case on","Counters"],["Stop the line after 500 labels","Counters"],["Start the cooling fan above 60 °C","Comparators"],["Reject a pack that weighs less than 495 g","Comparators"],["Keep the alarm sounding until a supervisor resets it","Latches"],["Keep the pump running after START is let go","Latches"]],"why":"A PLC does all of these in software. Before PLCs, each one needed its own circuit or relay."},{"id":"A5","title":"Input, process or output? A car park barrier","a":56,"bins":["Input","Process","Output"],"cards":[["Ticket accepted","Input"],["Car on the loop sensor","Input"],["Barrier fully up switch","Input"],["PLC with its logic, timers and counters","Process"],["Timer holding the barrier up","Process"],["Barrier motor","Output"],["Green lamp","Output"],["Red lamp","Output"]],"why":"Inputs sense, the process decides, outputs act. The PLC and everything inside it is the process block."}],"swipeDecks":{"uln":{"q":"Can a ULN2803 do this on its own?","L":"Yes","R":"No"},"plc":{"q":"Is a PLC the usual choice here?","L":"PLC","R":"Not a PLC"}},"swipe":[{"id":"W01","d":"uln","s":"Switch a panel lamp on and off","ans":"Yes","why":"Lamps only need current one way, well under 500 mA.","a":59},{"id":"W02","d":"uln","s":"Run a small motor forwards and backwards","ans":"No","why":"Current flows one way only through a ULN2803. Reversing needs an H-bridge, such as the L293D.","a":59},{"id":"W03","d":"uln","s":"Switch a 300 mA fan that only spins on /* ---------- transport: Microsoft Forms (main route), Google Apps Script (optional), or this phone only ---------- */
var Net = {
  mode: function(){
    if (window.google && google.script && google.script.run) return "gas";
    if (HUB_CONFIG.endpoint) return "remote";
    if (FORM_PREFILL) return "forms";
    return "local";
  },
  call: function(action, payload){
    var m = this.mode();
    return new Promise(function(resolve, reject){
      if (m === "gas") {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload || {});
      } else if (m === "remote") {
        var ctrl = ("AbortController" in window) ? new AbortController() : null;
        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
        fetch(HUB_CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify(Object.assign({action:action}, payload||{})), signal: ctrl ? ctrl.signal : undefined})
          .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(timer); resolve(j); })
          .catch(function(e){ clearTimeout(timer); reject(e); });
      } else reject(new Error("no_server"));
    });
  }
};
/* Only used by the Google route: results queue on the phone until they send. */
var Sync = {
  q: Store.get("queue", []), busy:false,
  add: function(ev){ this.q.push(ev); Store.set("queue", this.q); this.flush(); },
  flush: function(){
    var self = this, m = Net.mode();
    if (self.busy || !self.q.length || (m!=="gas" && m!=="remote")) return;
    if (navigator.onLine === false) return;
    self.busy = true;
    var batch = self.q.slice(0, 25);
    Net.call("log", {events: batch}).then(function(res){
      if (res && res.ok) {
        var sent = {}; batch.forEach(function(e){ sent[e.id]=1; });
        self.q = self.q.filter(function(e){ return !sent[e.id]; }); Store.set("queue", self.q); S.server.state = "ok";
      } else if (res && res.error === "unknown_code") {
        var bad = S.me ? S.me.code : ""; self.q = self.q.filter(function(e){ return e.code !== bad; }); Store.set("queue", self.q);
        toast("Your code was not recognised. Please sign in again."); signOut(true);
      } else { S.server.state = "error"; }
    }).catch(function(){ S.server.state = "offline"; }).then(function(){
      self.busy = false; updateSyncLine();
      if (self.q.length && S.server.state==="ok") setTimeout(function(){ self.flush(); }, 400);
    });
  }
};

/* The game name the tracker sees: unit prefix, a space, then the title, e.g. 9.2 Scan Lab.

function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : "9.2 " + title; }
function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;
  for (var k=0;k<s.length;k++) h += s.charCodeAt(k)*(k+1)*7;
  h += 11*Number(score) + 13*Number(max);

}

  rep("GAMEHERE", sentName(game)); rep("SCOREHERE", String(score)); rep("MAXHERE", String(max));
  rep("CHECKHERE", checkCode(S.me ? S.me.code : "", game, score, max));
  rep("DETAILHERE", String(detail||"").slice(0, 900));

}
function resultLine(game, score, max, when){
  var code = S.me ? S.me.code : "";

}

}

/* ---------- Scan Lab: a timeline of input reads, and a conveyor ---------- */
function scanTimeline(T, pulse, span){
  span = span || 4*T; var x0 = 24, x1 = 316, sc = (x1 - x0)/span, s = '', t;
  s += lab(x0, 26, "Input read at the start of each scan", {a:"start", muted:true, size:11});
  s += '<path class="a-i" d="M'+x0+' 96H'+x1+'"/>';
  for (t = 0; t <= span + 1e-9; t += T) { var x = x0 + t*sc; s += '<line x1="'+x.toFixed(1)+'" y1="40" x2="'+x.toFixed(1)+'" y2="96" style="stroke:var(--amber);stroke-width:2.4"/><circle class="a-fa" cx="'+x.toFixed(1)+'" cy="40" r="4"/>'; }
  var xa = x0, xb = x0 + T*sc; s += '<path class="a-i" d="M'+xa+' 58H'+xb.toFixed(1)+'"/>' + arrowAt(xa+6, 58, -1, 0, "a-fi") + arrowAt(xb-6, 58, 1, 0, "a-fi") + lab((xa+xb)/2, 52, T+" ms", {size:12, w:700});
  if (pulse) { var pa = x0 + pulse.start*sc, pb = x0 + (pulse.start + pulse.len)*sc;
    s += '<path d="M'+x0+' 140H'+pa.toFixed(1)+'V116H'+pb.toFixed(1)+'V140H'+x1+'" style="fill:none;stroke:var(--art);stroke-width:2.6"/>' + lab(x0, 160, "Input signal: a pulse of "+sig(pulse.len, 3)+" ms", {a:"start", size:12});
  } else s += lab(170, 128, "One scan, then repeat", {muted:true, size:11});
  return svgWrap("0 0 340 "+(pulse ? 170 : 140), s, "A timeline of input reads every "+T+" milliseconds"+(pulse ? ", with an input pulse lasting "+sig(pulse.len, 3)+" milliseconds" : ""));
}
function conveyorArt(len, speed, small){
  var s = '<path class="a-i" d="M14 132H326"/><circle class="a-i" cx="26" cy="142" r="10"/><circle class="a-i" cx="314" cy="142" r="10"/>';
  var w = small ? 14 : 120, h = small ? 6 : 60, x = 150 - w/2;
  s += '<rect class="a-f" x="'+x+'" y="'+(132 - h)+'" width="'+w+'" height="'+h+'" rx="2"/>';
  s += '<rect class="a-f" x="134" y="12" width="32" height="16" rx="3"/>' + '<path class="a-d" d="M150 28V'+(132 - h)+'"/>' + lab(206, 24, "Sensor", {size:11, muted:true});
  s += '<path class="a-i" d="M'+x+' 160H'+(x + w)+'"/>' + lab(150, 178, len+" mm", {size:12, w:700, amb:true});

  return svgWrap("0 0 340 186", s, (small ? "A small label " : "A box ")+len+" millimetres long on a conveyor moving at "+speed+" metres per second, passing under a sensor");
}
/* ---------- analogue scale, as used for 4 to 20 mA ---------- */
function scaleArt(sLo, sHi, sU, qLo, qHi, qU, reading, qval){
  var ask = qval != null;
  var x0 = 34, x1 = 296, f = (reading - sLo)/(sHi - sLo), xr = x0 + f*(x1 - x0), s = "";
  s += lab(x0, 16, "Signal", {a:"start", muted:true}) + lab(x0, 124, "Quantity", {a:"start", muted:true});
  s += '<path class="a-i" d="M'+x0+' 58H'+x1+'M'+x0+' 104H'+x1+'M'+x0+' 50v16M'+x1+' 50v16M'+x0+' 96v16M'+x1+' 96v16"/>';

  s += lab(xr, 40, ask ? "? "+sU : reading+" "+sU, {amb:true, size:13, w:700}) + '<circle cx="'+xr.toFixed(1)+'" cy="104" r="6" style="fill:var(--card);stroke:var(--amber);stroke-width:2.4"/>' + lab(xr, 176, ask ? sig(qval, 4)+" "+qU : "?", {amb:true, size:ask ? 13 : 16, w:700});

}

function dividerArt(vin, r1, r2){

  s += lab(112, 16, "Vin = "+vin, {a:"end", size:12, w:700, amb:true}) + lab(112, 190, "0 V", {a:"end", size:12});

/* ---------- ladder rungs, drawn from the same description the answer is worked out from ----------
   A rung is a list of items in series: {c:"Name", nc:true} is a contact, {par:[[...],[...]]} is a
   parallel group of branches, and the last item is {coil:"Name"}. st maps an input name to true (on).  */
var LW = 70, LDY = 64;
function rungWidth(items){ return items.reduce(function(w, it){ return w + (it.par ? Math.max.apply(null, it.par.map(rungWidth)) : LW); }, 0); }
function contactSvg(cx, cy, it, st, showSt){
  var s = '<path class="a-i" d="M'+(cx-7)+' '+(cy-11)+'v22M'+(cx+7)+' '+(cy-11)+'v22"/>';
  if (it.nc) s += '<path class="a-i" d="M'+(cx-11)+' '+(cy+11)+'L'+(cx+11)+' '+(cy-11)+'"/>';
  s += lab(cx, cy-17, it.c, {size:12});
  if (showSt && st && (it.c in st)) s += lab(cx, cy+28, st[it.c] ? "on" : "off", {size:12, w:700, amb:!!st[it.c], muted:!st[it.c]});
  return s;
}
function coilSvg(cx, cy, name){ return '<path class="a-a" d="M'+(cx-5)+' '+(cy-12)+'q-9 12 0 24M'+(cx+5)+' '+(cy-12)+'q9 12 0 24"/>' + lab(cx, cy-18, name, {size:12, w:700}); }
function drawSeries(items, xa, xb, cy, st, showSt){
  var s = '', nat = rungWidth(items), extra = (xb - xa) - nat, gap = extra / (items.length + 1), x = xa;
  items.forEach(function(it){
    var w = it.par ? Math.max.apply(null, it.par.map(rungWidth)) : LW, x2 = x + gap;
    s += wire(x, cy, x2, cy);
    if (it.par) { var a = x2, b = x2 + w;
      it.par.forEach(function(br, k){ var y = cy + k*LDY; s += drawSeries(br, a, b, y, st, showSt); });
      s += wire(a, cy, a, cy + (it.par.length - 1)*LDY) + wire(b, cy, b, cy + (it.par.length - 1)*LDY);
    } else if (it.coil) { s += wire(x2, cy, x2 + LW/2 - 12, cy) + coilSvg(x2 + LW/2, cy, it.coil) + wire(x2 + LW/2 + 12, cy, x2 + w, cy); }
    else s += wire(x2, cy, x2 + LW/2 - 7, cy) + contactSvg(x2 + LW/2, cy, it, st, showSt) + wire(x2 + LW/2 + 7, cy, x2 + w, cy);
    x = x2 + w;
  });
  return s + wire(x, cy, xb, cy);
}
function rungDepth(items){ return items.reduce(function(d, it){ return Math.max(d, it.par ? it.par.length : 1); }, 1); }
function ladderArt(rungs, st, showSt, label){
  /* a short rung gets a narrower drawing, so it is shown larger on a phone */
  var W = Math.max(230, Math.min(340, Math.max.apply(null, rungs.map(rungWidth)) + 70)), y = 34, s = '', H = 0;
  rungs.forEach(function(r){ s += drawSeries(r, 14, W - 14, y, st, showSt); y += (rungDepth(r) - 1)*LDY + 56; });
  H = y - 10;
  s = '<path class="a-i" d="M14 8V'+(H-6)+'M'+(W-14)+' 8V'+(H-6)+'" style="stroke-width:3"/>' + s;
  return svgWrap("0 0 "+W+" "+H, s, label || "A ladder diagram");
}
/* power flow: a contact passes when a normally open input is on, or a normally closed input is off */
function passes(items, st){ return items.every(function(it){
  if (it.coil) return true;
  if (it.par) return it.par.some(function(br){ return passes(br, st); });
  return it.nc ? !st[it.c] : !!st[it.c]; }); }

var TITLE = {flash:"Key word cards", exit:"Exit ticket", review:"Review"};
GAMES.forEach(function(g){ TITLE[g.key] = g.title; });
PARTN.forEach(function(n){ TITLE["last"+n] = "Last lesson Part "+n; TITLE["dump"+n] = "Brain dump Part "+n; TITLE["boss"+n] = "Boss round Part "+n;
  TITLE["checkin"+n] = CONTENT.checkin["p"+n].title; });
var LEVELS = [{name:"Apprentice",at:0},{name:"Engineering Technician",at:400},{name:"Incorporated Engineer",at:1000},{name:"Chartered Engineer",at:2000}];
function levelOf(xp){ var i=0; while (i<LEVELS.length-1 && xp>=LEVELS[i+1].at) i++; return {i:i, name:LEVELS[i].name, next:LEVELS[i+1]||null, from:LEVELS[i].at}; }
function streak(){
  var d = S.prog.days.slice().sort(), n = 0, day = new Date();
  if (d.indexOf(todayKey(day)) < 0) day.setDate(day.getDate()-1);
  while (d.indexOf(todayKey(day)) >= 0) { n++; day.setDate(day.getDate()-1); }
  return n;
}
function firstName(){ if (!S.me) return ""; var n = S.me.name || S.me.code; return n.split(" ")[0]; }
function initials(){ var n = (S.me && (S.me.name || S.me.code)) || "?"; var p = n.trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1]||""))).toUpperCase(); }
function guided(){ return S.prefs.mode !== "independent"; }
function partTitle(n){ return CONTENT.parts[n].title; }

/* ---------- spaced review (Embedding: revisit once-learnt material to stop it being forgotten) ----------
   Each question in the review bank sits in a box. Wrong: back to box 0, due tomorrow.
   Right: up one box, due after 1, 3, 7 then 14 days. Lesson-anchored questions (section 1.6) also come back
   one day and one week after they were first answered right, because a right answer straight after the
   lesson shows little about what was remembered.                                                       */
var GAPS = [1, 3, 7, 14];
function addDays(n){ var d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }
function srsMark(id, ok, anchored){
  if (!id) return false;
  var box = S.prog.srs[id];
  if (!ok) { S.prog.srs[id] = {b:0, due:addDays(1)}; return true; }
  if (box) { var b = Math.min(box.b + 1, GAPS.length - 1); if (box.a && box.b === 1) b = 2; S.prog.srs[id] = {b:b, due:addDays(GAPS[b]), a:box.a}; }
  else if (anchored) S.prog.srs[id] = {b:1, due:addDays(1), a:1};
  return false;
}
function dueIds(){ var t = todayKey(); return Object.keys(S.prog.srs).filter(function(id){ return S.prog.srs[id].due <= t && REG[id]; }); }
var REG = {};

/* ---------- item builders shared by the games ---------- */
function cap1(s){ s = String(s||""); return s.charAt(0).toUpperCase() + s.slice(1); }
/* multiple choice for the classic engine (runMCQ) */
function mcqFrom(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));
  return {id:x.id, rid:x.id, lead:lead||"", prompt:x.q, options:m.options, correct:m.correct, why:x.why, wf:x.fb||null, a:x.a}; }
/* multiple choice for the retrieval engine (cue level 1: recognise) */
function mcqItem(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));
  return {id:x.id, rid:x.id, k:"mcq", lead:lead||"", q:x.q, options:m.options, correct:m.correct, why:x.why, wf:x.fb||null, a:x.a, ladder:!!x.t, levelName:x.t ? "Pick it" : ""}; }
/* the typed form of a multiple choice question (cue level 3: free recall) */
function typedFrom(x, lead){ var t = x.t;
  return {id:x.id, rid:x.id, k:t.k, lead:lead||"", q:x.q, acc:t.acc, v:t.v, unit:t.unit, tol:t.tol, why:x.why, a:x.a, ans:x.opts[0], rivals:x.opts.slice(1), ladder:true, lvl:2, levelName:"From memory"}; }
/* other key words and every form they accept: typing one of those is a different term, not a spelling slip */
function rivalsFor(kw){ var r = []; CONTENT.keywords.forEach(function(o){ if (o.id !== kw.id) r = r.concat([o.term], o.acc); }); return r; }
/* first-letter clue (cue level 2): each word stays on one line, so the clue never breaks mid-word */
function cueHtml(t){
  var words = t.split(" ");
  return '<p class="cue" aria-label="'+esc("First letters clue: " + words.map(function(w){ return w.charAt(0) + ", " + w.length + " letters"; }).join("; "))+'">' +
    words.map(function(w){ return '<span class="cw" aria-hidden="true">'+esc(w.split("").map(function(c, i){ return i === 0 || !/[a-z]/i.test(c) ? c : "_"; }).join("\u2009"))+'</span>'; }).join(" ") + '</p>'; }
/* a key word as a retrieval item at cue level L (1 pick it, 2 first letters, 3 from memory) */
function termItem(kw, L){
  L = L || S.prog.lvl[kw.id] || (guided() ? 2 : 3);
  var base = {id:kw.id, rid:kw.id, q:kw.def, acc:kw.acc, ans:kw.term, a:kw.slide, ladder:true, rivals:rivalsFor(kw), lvl:L, why:kw.term+": "+kw.def};
  if (L <= 1) {
    var same = shuffle(CONTENT.keywords.filter(function(o){ return o.part === kw.part && o.id !== kw.id && o.term !== kw.term; })).slice(0, 3).map(function(o){ return o.term; });
    var m = mix(kw.term, same);
    return Object.assign(base, {k:"mcq", options:m.options, correct:m.correct, levelName:"Pick it", prompt:kw.def});
  }
  if (L === 2) return Object.assign(base, {k:"term", cue:kw.term, levelName:"First letters"});
  return Object.assign(base, {k:"term", levelName:"From memory"});
}
function buildReg(){
  CONTENT.recall.concat(CONTENT.plctype, CONTENT.scanfacts).forEach(function(x){ REG[x.id] = function(){ return x.t ? typedFrom(x) : mcqItem(x); }; });
  CONTENT.keywords.forEach(function(k){ REG[k.id] = function(){ return termItem(k, Math.max(S.prog.lvl[k.id]||2, 2)); }; });
  PARTN.forEach(function(n){ CONTENT.last[n].concat(CONTENT.boss[n], CONTENT.checkinRecall["p"+n]).forEach(function(x){ REG[x.id] = function(){ return Object.assign({rid:x.id}, x); }; }); });
}

/* ---------- screen frame ---------- */
function fullHeader(){
  return '<header class="hdr"><div class="kick">'+esc(HUB_CONFIG.kicker)+'</div><h1>'+esc(HUB_CONFIG.hubName)+'</h1><div class="sub">'+esc(HUB_CONFIG.unitLabel)+'</div></header><div class="rule"></div>';
}
function gameHeader(title, i, n){
  var pct = n ? Math.round(100*i/n) : 100;
  return '<header class="hdr compact"><button class="iconbtn" data-act="back" aria-label="Back to the games">'+icon("back")+'</button>'+
    '<div class="t">'+esc(title)+'</div>'+(n ? '<div class="n">'+(Math.min(i+1, n))+' of '+n+'</div>' : '')+'</header>'+
    '<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>';
}
var inGame = false;
function screen(html, opts){
  opts = opts || {};
  stopListening(); stopTimers();
  inGame = !!opts.game && !opts.done;
  document.body.classList.toggle("playing", !!opts.game);
  document.body.classList.toggle("out", !!opts.out);
  var md = $(".modal"); if (md) md.remove();
  var app = $("#app"); app.innerHTML = html;
  if (!opts.keep) window.scrollTo(0, 0);
  $$("#tabs button").forEach(function(b){ if (b.dataset.tab === opts.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  var f = $(".qtext", app) || $("h1", app) || $("h2", app);
  if (f && !opts.keep) { f.setAttribute("tabindex","-1"); try { f.focus({preventScroll:true}); } catch(e){} }
  $$('[data-act="back"]', app).forEach(function(b){ b.onclick = function(){
    if (inGame && !confirm("Leave this game? This round will not be saved.")) return;
    home();
  }; });
  $$('[data-act="formula"]', app).forEach(function(b){ b.onclick = function(){ openFormulaCard(); }; });
}
var TIMERS = [];
function stopTimers(){ TIMERS.forEach(function(t){ clearInterval(t); }); TIMERS = []; }
function tagSlide(a, hidden){ return (a && !hidden) ? '<div class="tags"><span class="tag sl">Lesson slide '+a+'</span></div>' : ''; }

/* ---------- sign in ---------- */
function signIn(msg){
  var list = CLASS.length > 0;
  screen(fullHeader() + '<div class="wrap stack">' +
    '<div class="card stack"><h2 style="margin:0">Sign in</h2>' +
    (list ? '<p class="muted" style="margin:0">Tap your name.</p><div class="names">' + CLASS.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.name)+'</button>'; }).join("") + '</div><p class="muted small" style="margin:6px 0 0">Name not there? Type your code instead.</p>' : '') +
    '<label for="code"><b>Your hub code</b><br><span class="small muted">Four letters and numbers, on the slip from your tutor.</span></label>' +
    '<input id="code" class="textin codebox" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="err">' +
    '<button class="btn amber block" id="go">Start</button>' +
    '<p id="err" class="small" role="alert" style="color:var(--red);margin:0">' + esc(msg||"") + '</p></div>' +
    '<div class="panel amber"><h3>Nothing here is marked</h3><p>These games are for practice. Your scores stay on this phone until you choose to send them to your tutor.</p></div>' +
    '<p class="foot">Your tutor sees your code, your scores and when you played, so they know what to go over again. Anything you type or say in the games stays on this phone.</p></div>', {out:true});
  var inp = $("#code"), go = $("#go");
  inp.addEventListener("input", function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go.click(); });
  function finish(code, name){
    S.me = {code:code, name:name || code}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} loadProg(); logEvent("open","hub"); home();
  }
  function tryCode(code, name){
    if (!/^[A-Z0-9]{4}$/.test(code)) { $("#err").textContent = "Your code has four letters and numbers."; return; }
    var m = Net.mode();
    if (m === "gas" || m === "remote") {
      go.disabled = true; go.textContent = "Checking";
      Net.call("hello", {code:code}).then(function(r){
        if (r && r.ok) finish(code, name || r.first);
        else { go.disabled=false; go.textContent="Start"; $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; }
      }).catch(function(){ go.disabled=false; go.textContent="Start"; $("#err").textContent = "Cannot reach the hub right now. Check your wifi or data and try again."; });
      return;
    }
    if (CLASS.length && !name) {
      var hit = CLASS.filter(function(c){ return c.code === code; })[0];
      if (!hit) { $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; return; }
      name = hit.name;
    }
    finish(code, name);
  }
  go.onclick = function(){ tryCode(inp.value.trim()); };
  $$(".names button").forEach(function(b){ b.onclick = function(){ var c = CLASS[+b.dataset.i]; tryCode(c.code, c.name); }; });
  if (!list) setTimeout(function(){ try { inp.focus(); } catch(e){} }, 60);
}
function signOut(silent){
  if (!silent && !confirm("Sign out on this phone? Your record stays here for next time.")) return;
  S.me = null; Store.del("me"); try { localStorage.removeItem("tlhub.me"); } catch(e) {} loadProg(); signIn();
}

/* ---------- home ---------- */
async function loadServer(){
  var m = Net.mode(); if (m !== "gas" && m !== "remote") return;
  try {
    var r = await Net.call("stats", {});
    if (r && r.ok) Object.assign(S.server, {state:"ok", focus:r.focus, target:r.target, week:r.week, message:r.message||"", nameOnly:!!r.nameOnly});
  } catch(e) { S.server.state = "offline"; }
}
function gameByKey(k){ return GAMES.filter(function(g){ return g.key === k; })[0]; }
function stampOf(k){ var g = gameByKey(k); if (g && g.parts) return PARTN.some(function(n){ return S.prog.stamps[k+n]; }); return !!S.prog.stamps[k]; }
function bestOf(k){ var g = gameByKey(k), b = null; if (g && g.parts) { PARTN.forEach(function(n){ var v = S.prog.best[k+n]; if (v != null && (b == null || v > b)) b = v; }); return b; } return S.prog.best[k]; }
function playsOf(k){ var g = gameByKey(k); if (g && g.parts) return PARTN.reduce(function(a, n){ return a + (S.prog.plays[k+n]||0); }, 0); return S.prog.plays[k]||0; }
function suggestNext(){
  /* first game in path order not yet checked */
  var order = []; CONTENT.parts.forEach(function(p){ order = order.concat(p.games); });
  for (var i=0;i<order.length;i++) if (!stampOf(order[i])) return order[i];
  return "boss";
}
var STYLES = [["all","All"],["type","Type and Say it"],["pick","Pick"],["sort","Sort"],["work","Work it out"]];
function styleMatch(g, f){
  if (f === "all") return true;
  if (f === "type") return g.tags.indexOf("Type") >= 0 || g.tags.indexOf("Say it") >= 0;
  return g.tags.indexOf({pick:"Pick", sort:"Sort", work:"Work it out"}[f]) >= 0;
}
function home(){
  if (!S.me) return signIn();
  S.tab = "games";
  var p = S.prog, lv = levelOf(p.xp), focus = S.server.focus || HUB_CONFIG.defaultFocus;
  var toNext = lv.next ? lv.next.at - p.xp : 0, span = lv.next ? lv.next.at - lv.from : 1, fill = lv.next ? Math.round(100*(p.xp-lv.from)/span) : 100;
  var checked = GAMES.filter(function(g){ return stampOf(g.key); }).length, played = Object.keys(p.plays).reduce(function(a,k){ return a + p.plays[k]; }, 0);
  var due = dueIds().length, nxt = suggestNext(), fs = S.prefs.fStyle || "all", fp = S.prefs.fPart || "all";
  function tile(g, step){
    var best = bestOf(g.key), n = playsOf(g.key), isF = focus.indexOf(g.key) >= 0, good = stampOf(g.key);
    var rec = n ? (g.parts ? "Parts played " + PARTN.filter(function(k){ return p.plays[g.key+k]; }).length + " of " + PARTN.length + ", best " + best + "%" : "Best " + best + "%, played " + n + (n>1 ? " times" : " time")) : "Not played yet";
    return '<button class="tile" data-game="'+g.key+'" aria-label="'+esc((step?step+". ":"")+g.title+". "+g.what+" Question style: "+g.tags.join(" and ")+". "+rec+(isF?". Set for this week":"")+(g.key===nxt?". Suggested next":""))+'">' +
      '<div class="art">'+tileArt(g.key)+'</div>' +
      (good ? '<span class="tick" aria-hidden="true">'+icon("check")+'</span>' : '') +
      '<div class="body"><span class="badges">' + (step ? '<span class="step">'+esc(step)+'</span>' : '') + (isF ? '<span class="badge">This week</span>' : '') + (g.key===nxt ? '<span class="badge next">Next</span>' : '') + '</span>' +
      '<span class="ttl">'+esc(g.title)+'</span><span class="what">'+esc(g.what)+'</span>' +
      '<span class="tags" aria-hidden="true">'+g.tags.map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("")+'</span>' +
      '<span class="rec'+(good?' good':'')+'">'+rec+'</span></div></button>';
  }
  function row(act, ic, title, sub, pill){
    return '<button class="rowbtn" data-go="'+act+'"><span class="ic">'+icon(ic)+'</span><span class="tx"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+(pill||'<span aria-hidden="true" class="muted">'+icon("chev")+'</span>')+'</button>';
  }
  var goal = (p.goal != null) ? CONTENT.goals[p.goal] : null;
  var goalCard = goal ?
    '<div class="card goal"><div class="row" style="justify-content:space-between;align-items:baseline;flex-wrap:nowrap"><b style="color:var(--head)">My goal this week</b><button class="link" data-act="goal">Change</button></div>' +
    '<p style="margin:4px 0 8px">'+esc(goal.t)+'</p><div class="row">' + goal.games.map(function(k){ return '<button class="btn small ghost" data-game2="'+k+'">'+esc(TITLE[k])+'</button>'; }).join("") + '</div></div>' :
    '<button class="rowbtn" data-act="goal"><span class="ic">'+icon("flag")+'</span><span class="tx"><b>Set a goal for this week</b><span>Pick the thing you most want to get better at. The hub shows you where to practise it.</span></span><span aria-hidden="true" class="muted">'+icon("chev")+'</span></button>';
  var modeSeg = '<div class="modebox"><b style="color:var(--head)">How you play</b>' +
    '<div class="seg" role="group" aria-label="How you play" style="grid-template-columns:1fr 1fr;margin:6px 0 4px">' +
    '<button data-mode="guided" aria-pressed="'+guided()+'">Guided</button><button data-mode="independent" aria-pressed="'+(!guided())+'">Independent</button></div>' +
    '<p class="small muted" style="margin:0">'+(guided() ? "Hints, first-letter clues and worked examples are on. When you score 80% or more, try Independent." : "No hints, clues or worked examples. Every game earns 50% more points.")+'</p></div>';
  var shown = 0;
  var path = CONTENT.parts.map(function(pt){
    if (fp !== "all" && fp !== pt.id) return "";
    var gs = pt.games.map(gameByKey), vis = gs.filter(function(g){ return styleMatch(g, fs); }), done = pt.games.filter(function(k){ return stampOf(k); }).length;
    if (!vis.length) return "";
    shown += vis.length;
    var multi = pt.id !== "mix" && pt.id !== "p0";
    return '<section class="part"><div class="sec"><div><h2>'+esc(pt.title)+'</h2><div class="small muted">'+esc(pt.sub)+'</div></div>' +
      '<span class="pill'+(done === gs.length ? '' : ' amber')+'">'+done+' of '+gs.length+' checked</span></div>' +
      '<details class="goals"><summary>You will be able to</summary><ul>'+pt.goals.map(function(g){ return '<li>'+esc(g)+'</li>'; }).join("")+'</ul></details>' +
      '<div class="grid">' + gs.map(function(g,k){ return styleMatch(g, fs) ? tile(g, multi ? "Step "+(k+1) : "") : ""; }).join("") + '</div></section>';
  }).join("");
  var filters = '<p class="flabel" id="fl1">Question style</p><div class="filters" role="group" aria-labelledby="fl1">' + STYLES.map(function(s){ return '<button data-fs="'+s[0]+'" aria-pressed="'+(fs === s[0])+'">'+esc(s[1])+'</button>'; }).join("") + '</div>' +
    '<p class="flabel" id="fl2">Part</p><div class="filters" role="group" aria-labelledby="fl2">' + [["all","All parts"],["p0","Warm up"],["p1","Part 1"],["p2","Part 2"],["p3","Part 3"],["mix","Pull it together"]].map(function(s){ return '<button data-fp="'+s[0]+'" aria-pressed="'+(fp === s[0])+'">'+esc(s[1])+'</button>'; }).join("") + '</div>';
  var done = p.done;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="card"><div class="me"><span class="avatar" aria-hidden="true">'+esc(initials())+'</span><div><h2>Hello, '+esc(firstName())+'</h2>' +
    '<div class="lvl">'+esc(lv.name)+', '+p.xp+' points</div></div></div>' +
    '<div class="meter" aria-hidden="true"><i style="width:'+fill+'%"></i></div>' +
    '<div class="small muted" style="margin-top:6px">'+(lv.next ? toNext+' points to '+esc(lv.next.name) : 'Top level reached. Keep your scores sharp.')+'</div>' +
    '<div class="chips"><span class="chip">'+icon("flame")+streak()+' day streak</span><span class="chip">'+icon("check")+checked+' of '+GAMES.length+' checked</span><span class="chip">'+icon("games")+played+' played</span></div>' +
    modeSeg + '</div>' +
    (S.server.message ? '<div class="panel amber" style="margin-top:12px"><p>'+esc(S.server.message)+'</p></div>' : '') +
    '<div class="rows" style="margin-top:12px">' +
      (due ? row("review", "cal", "Review: " + due + " question" + (due>1?"s":"") + " due today", "Questions to bring back before you forget them, in a harder format.", '<span class="pill amber">Due</span>') :
             row("review", "cal", "Review", Object.keys(p.srs).length ? "Nothing due today. Missed questions come back after 1, 3, 7 and 14 days." : "Questions you miss in the games come back here on later days.", '<span class="pill">Nothing due</span>')) +
      goalCard + '</div>' +
    '<div class="sec"><h2>Your path</h2><button class="link" data-act="formula">Formula card</button></div>' +
    '<p class="small muted" style="margin:-4px 2px 4px">Work down the parts in order. A tick means you scored 80% or more.</p>' +
    filters + (shown ? path : '<div class="panel" style="margin-top:12px"><p>No games match. <button class="link" id="clearf">Show every game</button></p></div>') +
    '<div class="sec"><h2>After the lesson</h2></div><div class="rows">' +
      row("exit", "exit", "Exit ticket", "Six questions and a check of all nine goals. Five minutes.", done.exit ? '<span class="pill">Handed in</span>' : '<span class="pill amber">To do</span>') +
      PARTN.map(function(n){ return row("checkin"+n, "check", "Part "+n+" check-in", "Two quick questions, then rate yourself on "+lcFirst(CONTENT.parts[n].title.replace(/^Part \d: /, ""))+".", done["checkin"+n] ? '<span class="pill">Sent</span>' : ''); }).join("") +
      row("flash", "flash", "Key word cards", CONTENT.keywords.length + " key words. Say or type the meaning first, then turn the card over.") +
    '</div><p class="foot">This is formative. Nothing here is marked or graded. <span data-sync>'+esc(syncText())+'</span></p></div>', {tab:"games"});
  $$(".tile").forEach(function(t){ t.onclick = function(){ startGame(t.dataset.game); }; });
  $$("[data-game2]").forEach(function(t){ t.onclick = function(){ startGame(t.dataset.game2); }; });
  $$("[data-go]").forEach(function(b){ b.onclick = function(){ var g=b.dataset.go, m = /^checkin(\d)$/.exec(g);
    if (g==="exit") runExit(); else if (m) runCheckin("p"+m[1], g); else if (g==="review") runReview(); else startGame("flash"); }; });
  $$('[data-act="goal"]').forEach(function(b){ b.onclick = function(){ openGoalPicker(); }; });
  $$("[data-mode]").forEach(function(b){ b.onclick = function(){ S.prefs.mode = b.dataset.mode; Store.set("prefs", S.prefs); home(); var x = $('[data-mode="'+S.prefs.mode+'"]'); if (x) x.focus(); }; });
  $$("[data-fs]").forEach(function(b){ b.onclick = function(){ S.prefs.fStyle = b.dataset.fs; Store.set("prefs", S.prefs); var y = window.scrollY; home(); window.scrollTo(0, y); var x = $('[data-fs="'+S.prefs.fStyle+'"]'); if (x) x.focus({preventScroll:true}); }; });
  $$("[data-fp]").forEach(function(b){ b.onclick = function(){ S.prefs.fPart = b.dataset.fp; Store.set("prefs", S.prefs); var y = window.scrollY; home(); window.scrollTo(0, y); var x = $('[data-fp="'+S.prefs.fPart+'"]'); if (x) x.focus({preventScroll:true}); }; });
  var cf = $("#clearf"); if (cf) cf.onclick = function(){ S.prefs.fStyle = "all"; S.prefs.fPart = "all"; Store.set("prefs", S.prefs); home(); };
}

/* ---------- part picker for the games that run one part at a time ---------- */
function openPartPicker(key){

/* ---------- my record ---------- */
var TRANSFER = "U92-";   /* this hub's own transfer-code prefix */
var RECORD_KEYS = []; GAMES.forEach(function(g){ if (g.parts) PARTN.forEach(function(n){ RECORD_KEYS.push(g.key+n); }); else RECORD_KEYS.push(g.key); });
RECORD_KEYS = RECORD_KEYS.concat(["review","flash","exit"], PARTN.map(function(n){ return "checkin"+n; }));
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode();
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });
  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  var cal = p.cal || {sr:0, sw:0, gr:0, gw:0}, calN = cal.sr + cal.sw + cal.gr + cal.gw;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (calN ? '<div class="card" style="margin-bottom:12px"><b style="color:var(--head)">Do you know what you know?</b><p class="small" style="margin:6px 0 0">From Sure or Not?: sure and right '+cal.sr+', sure but wrong '+cal.sw+', guessed and right '+cal.gr+', guessed and wrong '+cal.gw+'. '+
      (cal.sw ? 'Sure but wrong is the one to shrink: those are the mistakes you would not spot in the exam.' : 'No confident mistakes so far. Good.')+'</p></div>' : '') +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="'+TRANSFER+'..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = TRANSFER + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(TRANSFER) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(TRANSFER.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done); Object.assign(cur.srs, inc.srs); Object.assign(cur.rag, inc.rag); Object.assign(cur.lvl, inc.lvl||{}); Object.assign(cur.flash, inc.flash||{});
      if (cur.goal == null) cur.goal = inc.goal;
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code. Copy it again on the other phone."; }
  };
}

/* ---------- navigation ---------- */
function startGame(key){
  var m = /^(last|dump|boss)([1-3])$/.exec(key);
  if (m) return ({last:runLast, dump:runDump, boss:runBoss})[m[1]](+m[2]);
  var g = gameByKey(key); if (g && g.parts) return openPartPicker(key);
  var run = {recall:runRecall, nameparts:runNameParts, scanlab:runScanLab, plctype:runPlcType, signallab:runSignalLab, sortit:runSortIt,
    ladderlab:runLadderLab, driver:runDriver, swipe:runSwipe, appsort:runAppSort, recommend:runRecommend, ladder:runLadder, term:runTerm,

  if (run) run();

document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var conf = $$(".conf button:not([disabled])");   /* Sure or Not?: once an answer is picked, the keys rate confidence */
    var b = (conf.length ? conf : $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])"))[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
    var n = $("#next"); if (n) { e.preventDefault(); n.click(); }
  }
});

</script>
<script>
"use strict";
/* ---------- results ---------- */
function resultMessage(pct){
  if (pct >= 90) return "Excellent. That is exam ready.";
  if (pct >= 70) return "Good work. Check the ones below, then go again.";
  if (pct >= 40) return "Getting there. Read the fixes, then play it again.";
  return "Early days. Read each fix below and try again. It gets easier every round.";
}
function sendPanel(title, score, max, detail){
  var m = Net.mode(), code = S.me ? S.me.code : "", chk = checkCode(code, title, score, max);
  if (m === "forms") return '<div class="panel amber stack" style="margin-top:12px"><h3>Send this to your tutor</h3>' +
    '<p>One tap opens the form with your code, the game and your score already filled in. Press Submit on the form.</p>' +
    '<p>Check code <span class="code">'+chk+'</span></p>' +
    '<div class="row"><a class="btn amber" id="send" target="_blank" rel="noopener" href="'+esc(formsLink(title, score, max, detail))+'">'+icon("send")+'Send my result</a>' +
    '<button class="btn ghost" id="copy1">'+icon("copy")+'Copy it instead</button></div></div>';
  if (m === "local") return '<div class="panel amber stack" style="margin-top:12px"><h3>Keep a copy</h3>' +
    '<p>This hub is not linked to your tutor&#39;s form yet. Copy this line and paste it where your tutor asks.</p>' +
    '<p class="small"><b>'+esc(resultLine(title, score, max))+'</b></p><button class="btn ghost" id="copy1">'+icon("copy")+'Copy it</button></div>';
  return '<p class="small muted" style="margin:12px 2px" data-sync>'+esc(syncText())+'</p>';
}
function wireSend(title, score, max){
  var c = $("#copy1"); if (c) c.onclick = function(){ copyText(resultLine(title, score, max), function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the line and copy it."); }); };
  var s = $("#send"); if (s) s.addEventListener("click", function(){ toast("The form is opening. Press Submit on it."); });
}
/* Interacting: turn the result into one clear, actionable next step */
function nextStep(key, pct, extra){
  var added = extra.added || 0, ind = !guided(), out = [];
  if (extra.conf && extra.conf.sw) out.push("You were sure but wrong on " + extra.conf.sw + (extra.conf.sw>1?" questions":" question") + ". Read those fixes twice: they are the mistakes you would not notice in the exam.");
  if (pct < 50) out.push(ind ? "Switch to Guided on the home page and play this again with hints on." : "Read the fixes below, open the key word cards, then play this again.");
  else if (pct < 80) out.push("Play it once more today. A score of 80% puts a tick on it.");
  else if (!ind) out.push("That is a tick. Try it in Independent mode next: no hints, and 50% more points.");
  else { var n = suggestNext(); if (n !== key) out.push("Move on to " + TITLE[n] + " next."); else out.push("Try the Boss round for this part to keep it fluent."); }
  if (added) out.push(added + (added>1 ? " questions have" : " question has") + " gone on your review list for tomorrow.");
  return '<div class="card nextstep"><h3 style="margin:0 0 6px">Your next step</h3><ul class="review">' + out.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("") + '</ul></div>';
}
function finishGame(key, score, max, items, started, review, extra){
  extra = extra || {};
  var p = S.prog, title = TITLE[key], pct = max ? Math.round(100*score/max) : 0, secs = Math.round((Date.now()-started)/1000);
  var prev = p.best[key], newBest = prev == null || pct > prev;
  if (newBest) { p.best[key] = pct; p.raw[key] = [score, max]; }
  p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  var gain = 20 + score*10 + (extra.bonus||0); if (!guided()) gain = Math.round(gain * 1.5); p.xp += gain;
  var stamp = pct >= 80, firstStamp = stamp && !p.stamps[key]; if (stamp) p.stamps[key] = true;
  var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t);
  if (extra.conf) { p.cal = p.cal || {sr:0, sw:0, gr:0, gw:0}; ["sr","sw","gr","gw"].forEach(function(k){ p.cal[k] += extra.conf[k]||0; }); }
  saveProg();
  logEvent("finish", title, {score:score, max:max, secs:secs, items:items});
  var missed = items.filter(function(x){ return !x.ok; }).map(function(x){ return x.l; });
  var detail = (guided() ? "Guided" : "Independent") + ". " + (missed.length ? "To go over: " + missed.slice(0,6).join("; ") : "All correct") +
    (extra.conf ? ". Sure but wrong: " + (extra.conf.sw||0) : "") + (extra.det ? ". " + extra.det : "");
  var calPanel = extra.conf ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Do you know what you know?</h3>' +
    '<div class="calgrid"><div><b>'+(extra.conf.sr||0)+'</b><span>Sure and right</span></div><div class="warn"><b>'+(extra.conf.sw||0)+'</b><span>Sure but wrong</span></div>' +
    '<div><b>'+(extra.conf.gr||0)+'</b><span>Guessed, but right</span></div><div><b>'+(extra.conf.gw||0)+'</b><span>Guessed and wrong</span></div></div>' +
    '<p class="small muted" style="margin:8px 0 0">Guessed but right is luck, not knowledge. Go back over those too.</p></div>' : '';
  screen(gameHeader(title, 0, 0) + '<div class="wrap">' +
    '<div class="card result"><p class="muted" style="margin:0 0 4px">'+esc(title)+(guided() ? '' : ', independent')+'</p><div class="big">'+score+'<small> of '+max+'</small></div>' +
    '<p style="margin:10px 0 4px">'+resultMessage(pct)+'</p><p class="small muted" style="margin:0">+'+gain+' points'+(newBest && prev != null ? ', a new best' : '')+'</p>' +
    (stamp ? '<span class="seal'+(firstStamp?' pop':'')+'">'+icon("check")+'Checked</span>' : '') + '</div>' +
    nextStep(key, pct, extra) + calPanel +
    sendPanel(title, score, max, detail) +
    (review.length ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">What to fix</h3><ol class="review">' +
      review.map(function(r){ return '<li><b>'+esc(r.q)+'</b><br>The answer: '+esc(r.right)+(r.why ? '. <span class="muted">'+esc(r.why)+'</span>' : '')+'</li>'; }).join("") + '</ol></div>'
      : '<div class="panel" style="margin-top:12px"><p>Nothing to fix this round.</p></div>') +
    '<div class="dock"><div class="row"><button class="btn amber" id="again">Play again</button><button class="btn ghost" id="hub">Back to the games</button></div></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#again").onclick = function(){ startGame(key); };
  $("#hub").onclick = function(){ home(); };
  say(score + " out of " + max + ". " + resultMessage(pct));
}

/* ---------- one engine for every multiple choice game ----------
   Adds, on top of the Unit 1.1 engine:
   wf     feedback written for a specific wrong answer (Interacting)
   hint   shown only in Guided mode (Structuring: scaffolds that come away)
   conf   rate how sure you are before the answer is shown (Activating)
   master a missed question returns two questions later until it is right (Embedding)
   rid    marks the question on the spaced review list (Embedding)                   */
function optButtons(opts){ return opts.map(function(o,k){ return '<button class="opt" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span class="l">'+esc(o)+'</span><span class="s"></span></button>'; }).join(""); }
function markOpts(correct, chosen){
  var ok = correct.indexOf(chosen) >= 0;
