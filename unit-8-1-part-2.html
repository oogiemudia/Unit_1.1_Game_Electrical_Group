<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="8.1 part 2 games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Circuit theory and DC networks games</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}


/* activating hard thinking layer (from the criterion 8.1 (continued) and 10.1 reference hub) */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.badges:empty{display:none}
.badge{margin-bottom:0}
.badge.next{background:var(--green);color:#fff}
.step{align-self:flex-start;background:var(--tint);color:var(--head);font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.part{margin-top:6px}
.part .sec{align-items:center}
.part .sec h2{font-size:1.05em}
details.goals{margin:-4px 2px 10px}
details.goals summary{cursor:pointer;color:var(--head);font-weight:700;font-size:.88em;min-height:44px;display:flex;align-items:center}
details.goals ul{margin:0 0 4px;padding-left:1.2em;font-size:.9em}
.modebox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.goal .btn.small{flex:1 1 120px}
.pill.red{background:var(--badbg);color:var(--red)}
.opt.picked{border-color:var(--amber);background:var(--ambbg)}
.rag.conf button{min-height:50px}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.whyno{display:block;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--red)}
.nextstep{margin-top:12px;border-left:5px solid var(--green)}
.calgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calgrid div{background:var(--tint);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.calgrid div.warn{background:var(--badbg)}
.calgrid b{font-size:1.5em;color:var(--head);line-height:1.1}
.calgrid div.warn b{color:var(--red)}
.calgrid span{font-size:.84em;color:var(--muted)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:56px;padding:8px 10px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left;line-height:1.3;font-size:.92em}
.pb.r{font-weight:400;color:var(--ink);border-color:var(--line)}
.pb.sel{border-color:var(--amber);background:var(--ambbg)}
.pb.ok{border-color:var(--green);background:var(--goodbg);color:var(--green);cursor:default}
.pb.no{border-color:var(--red);background:var(--badbg)}
.ftable td{text-align:left}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}

leadlag: [
  {id:"A01", s:"A pure capacitor across an AC supply", ans:"Leads", why:"Capacitor current depends on how fast the voltage is changing, so it peaks a quarter cycle early: leads by 90°."},
  {id:"A02", s:"A pure inductor across an AC supply", ans:"Lags", why:"The induced emf holds the current back, so it peaks a quarter cycle late: lags by 90°."},
  {id:"A03", s:"A resistor and inductor in series (RL)", ans:"Lags", why:"The inductor pulls the current behind the voltage, by less than 90° because of the resistor."},
  {id:"A04", s:"A resistor and capacitor in series (RC)", ans:"Leads", why:"The capacitor pulls the current ahead, by less than 90° because of the resistor."},
  {id:"A05", s:"A series RLC circuit with XL = 47 Ω and XC = 32 Ω", ans:"Lags", why:"XL is the bigger reactance, so the circuit is inductive and the current lags."},
  {id:"A06", s:"A series RLC circuit with XC = 31.8 Ω and XL = 15.7 Ω", ans:"Leads", why:"XC is the bigger reactance, so the circuit is capacitive and the current leads."},
  {id:"A07", s:"An induction motor running on the mains", ans:"Lags", why:"A motor's windings are coils, so the load is inductive and the current lags."},
  {id:"A08", s:"A capacitor bank fitted to improve a factory's power factor", ans:"Leads", why:"Capacitors draw a leading current, which cancels part of the lagging current taken by motors."},
  {id:"A09", s:"The phasor diagram shows I drawn 90° anticlockwise of V", ans:"Leads", why:"Phasors rotate anticlockwise, so a phasor anticlockwise of V is ahead of it."},
  {id:"A10", s:"The phasor diagram shows I drawn 90° clockwise of V", ans:"Lags", why:"Clockwise of V means behind it in time, because phasors rotate anticlockwise."},
  {id:"A11", s:"On the oscilloscope, the current peaks a quarter cycle before the voltage", ans:"Leads", why:"Peaking earlier means it is ahead: leading."},
  {id:"A12", s:"On the oscilloscope, the current peaks a quarter cycle after the voltage", ans:"Lags", why:"Peaking later means it is behind: lagging."},
  {id:"A13", s:"In this circuit the voltage lags the current by 90°", ans:"Leads", why:"If the voltage is behind the current, the current is ahead. Read which quantity the sentence is about."},
  {id:"A14", s:"In this circuit the voltage leads the current by 30°", ans:"Lags", why:"The voltage is ahead, so the current is behind by 30°. Turn the sentence round before you answer."},
  {id:"A15", s:"Raising the frequency makes XL bigger than XC in a series RLC circuit", ans:"Lags", why:"XL rises with frequency. Once it is the bigger reactance, the circuit is inductive and the current lags."},

  {id:"W05", q:"In an RC circuit the resistor is doubled.",

/* ---------- Spot the Error: misconceptions, including errors found in the source slides ---------- */
errors: [
  {id:"E01", chunks:["Two resistors in parallel,","100 Ω and 220 Ω,","have a total resistance of","320 Ω."], wrong:3, fix:"320 Ω is the series total. In parallel the total is less than the smallest resistor: 68.75 Ω."},
  {id:"E02", chunks:["Capacitors in parallel","combine reciprocally,","so two 47 µF capacitors","give 23.5 µF."], wrong:1, fix:"Capacitors in parallel add directly: 47 + 47 = 94 µF. They combine reciprocally in series."},
  {id:"E03", chunks:["Inductors combine","in the opposite pattern","to resistors,","so they add in parallel."], wrong:1, fix:"Inductors follow the same pattern as resistors: they add in series. It is capacitors that are the opposite."},
  {id:"E04", chunks:["Kirchhoff's current law","is about","the conservation of energy","at a node."], wrong:2, fix:"The current law is conservation of charge. The voltage law is conservation of energy."},
  {id:"E05", chunks:["Supply = V1 + V2,","with V1 = 6 V and V2 = 7 V,","gives a supply of","15 V."], wrong:3, fix:"6 + 7 = 13 V. The law was applied correctly; the arithmetic slipped."},
  {id:"E06", chunks:["τ = R × C,","so 4.7 kΩ and 100 µF","give a time constant of","470 s."], wrong:3, fix:"kΩ × µF gives milliseconds: 470 ms, which is 0.47 s."},
  {id:"E07", chunks:["After one time constant","a charging capacitor","has reached","36.8% of the supply voltage."], wrong:3, fix:"A charging capacitor reaches 63.2% after 1τ. 36.8% is what is left of a falling quantity."},
  {id:"E08", chunks:["The RL time constant","is τ = L × R,","measured","in seconds."], wrong:1, fix:"τ = L ÷ R. Henrys divided by ohms gives seconds."},
  {id:"E09", chunks:["A time of forty milliseconds","is written","40 mS","in an exam answer."], wrong:2, fix:"Capital S is the siemens, the unit of conductance. Milliseconds are a lower case ms: 40 ms. One source slide makes this slip."},
  {id:"E10", chunks:["The time to reach","half the supply voltage","is t = τ × ln 2,","where ln 2 = 0.69399."], wrong:3, fix:"ln 2 = 0.6931. A published mark scheme has this typing slip in its working, although its final answer is right."},
  {id:"E11", chunks:["UK mains is","230 V RMS,","so its peak voltage","is 163 V."], wrong:3, fix:"Peak is bigger than RMS: 230 × √2 = 325.3 V. 163 V comes from dividing by √2."},
  {id:"E12", chunks:["In a purely inductive circuit","the current","leads the voltage","by 90°."], wrong:2, fix:"In an inductor the current lags the voltage by 90°. It leads in a capacitor."},
  {id:"E13", chunks:["A larger inductance","makes the current","lag by more than 90°","in a pure inductor."], wrong:2, fix:"In a pure inductor the lag is always exactly 90°. A larger inductance makes the current smaller, not the angle bigger."},
  {id:"E14", chunks:["VR = 100 V, VL = 200 V and VC = 60 V,","so the supply voltage","is 100 + 200 + 60","= 360 V."], wrong:2, fix:"Phasors do not add like numbers. V = √(100² + (200 − 60)²) = 172 V."},
  {id:"E15", chunks:["Capacitive reactance","rises","as the frequency","rises."], wrong:1, fix:"XC = 1 ÷ (2πfC), so it falls as the frequency rises. It is XL that rises."},
  {id:"E16", chunks:["True power","is S = V × I,","measured","in watts."], wrong:1, fix:"V × I is apparent power, in volt amps. True power is V × I × cos θ, in watts."},
  {id:"E17", chunks:["An RCD","trips when","the circuit current is more than","its 30 mA rating."], wrong:2, fix:"An RCD trips on a difference of about 30 mA between live and neutral, not on the total current. A 13 A kettle does not trip it."},
  {id:"E18", chunks:["In time-graded protection,","the device furthest from the fault","trips first,","to protect the whole site."], wrong:1, fix:"The device closest to the fault trips first, so the smallest part of the network is cut off."},
  {id:"E19", chunks:["A distance relay","trips when the measured impedance","rises above","its set value."], wrong:2, fix:"In a fault V falls and I rises, so Z = V ÷ I falls. The relay trips when Z drops below its set value."},
  {id:"E20", chunks:["In the two-loop example,","7.1 × 6.2","= 44,","so the determinant is 28."], wrong:2, fix:"7.1 × 6.2 = 44.02, so the determinant is 28.02. One source slide rounds this without saying so; keep exact values in long questions."},
  {id:"E21", chunks:["An uncharged capacitor","has an infinite resistance","at the instant","the switch closes."], wrong:1, fix:"At that instant it has no voltage across it, so it behaves like a short circuit. A capacitor does not have a resistance that changes."},
  {id:"E22", chunks:["A lightning arrestor","stops the energy","of a strike","from reaching earth."], wrong:1, fix:"It does the opposite: it gives the surge a route to earth that does not pass through the equipment."}
],

  {id:"X03", q:"State Kirchhoff's law for voltage.", max:1, a:"The voltage is shared between the components.", got:0, why:"Too vague: shared how, and around what? The mark needs a loop and a sum.", model:"Around any closed loop the sum of the voltage drops equals the emf, or the voltages round a loop add to zero. [1]", src:"Summer 2023 Core Paper 1, Q1b"},
  {id:"X04", q:"State Kirchhoff's law for voltage.", max:1, a:"Around a closed loop, the sum of the voltage drops equals the supply emf.", got:1, why:"Loop and sum are both there.", model:"As written. [1]", src:"Summer 2023 Core Paper 1, Q1b"},
  {id:"X05", q:"Describe how a residual current device (RCD) in an electrical system reduces the risk of serious harm from electric shock.", max:2, a:"It trips when there is too much current.", got:0, why:"That describes a fuse or MCB. An RCD looks for an imbalance between the current going in and the current coming out.", model:"It detects an imbalance between ingoing and outgoing current (residual current) [1] and then breaks or isolates the circuit [1].", src:"Autumn 2023 Core Paper 1, Q3"},
  {id:"X06", q:"Describe how a residual current device (RCD) in an electrical system reduces the risk of serious harm from electric shock.", max:2, a:"It compares the current in the live and neutral. If they are different it cuts off the supply very quickly.", got:2, why:"What it detects and what it then does: both marks.", model:"As written.", src:"Autumn 2023 Core Paper 1, Q3"},
  {id:"X07", q:"Describe how a residual current device (RCD) in an electrical system reduces the risk of serious harm from electric shock.", max:2, a:"It detects when the live and neutral currents are not balanced.", got:1, why:"One mark for what it detects. The second mark needs what it then does: breaks the circuit.", model:"Detects the imbalance [1] and then breaks or isolates the circuit [1].", src:"Autumn 2023 Core Paper 1, Q3"},
  {id:"X08", q:"A 300 µF capacitor is in series with a 330 Ω resistor across 24 V DC. Calculate the circuit time constant.", max:2, a:"τ = 300 × 330 = 99 000 ms", got:1, why:"The formula is used correctly, so the method mark stands. µF were not converted, so the answer is wrong.", model:"τ = C × R [M1] = 300 µF × 330 Ω = 99 ms [A1].", src:"Summer 2026 Core Paper 1, Q14a"},
  {id:"X09", q:"The same circuit. Calculate the time taken for the capacitor to be considered fully charged.", max:2, a:"5τ = 5 × 99 ms = 495 ms", got:2, why:"Method and answer both right.", model:"5τ = 5 × 99 ms [M1] = 495 ms [A1].", src:"Summer 2026 Core Paper 1, Q14b"},
  {id:"X10", q:"Explain why the capacitor voltage in a series RLC circuit can be bigger than the supply voltage. (Practice question, 2 marks)", max:2, a:"Because the capacitor stores energy.", got:0, why:"True, but it does not explain the size. The answer needs the phase relationship.", model:"VL and VC are 180° apart [1], so they partly cancel and only their difference appears at the supply [1].", src:"Practice question"},
  {id:"X11", q:"A 47 µF and a 100 µF capacitor are connected in series. Calculate the total capacitance. (Practice question, 2 marks)", max:2, a:"47 + 100 = 147 µF", got:0, why:"That is the parallel rule. In series, capacitors combine reciprocally, so the method is wrong and no marks are earned.", model:"1/C = 1/47 + 1/100 [1]; C = 32.0 µF [1].", src:"Practice question"},
  {id:"X12", q:"Explain the purpose of time-graded overcurrent protection. (Practice question, 2 marks)", max:2, a:"So the device nearest the fault trips first, which means only the faulty section is disconnected and the rest of the network stays on.", got:2, why:"What it does, and why that matters: both marks.", model:"As written.", src:"Practice question"},

/* ---------- Quick bank, used by Sure or not?, Master it and Review ---------- */
quick: [
  {id:"K01", q:"Two 100 Ω resistors in parallel give a total of...", opts:["50 Ω","200 Ω","100 Ω","10 000 Ω"], why:"Equal resistors in parallel give half of one: 1/R = 1/100 + 1/100.", fb:{"200 Ω":"200 Ω is the series total."}},
  {id:"K02", q:"In a parallel circuit, what is the same across every branch?", opts:["The voltage","The current","The resistance","The power"], why:"Every branch is connected across the same two points.", fb:{"The current":"The current splits between the branches. It is the voltage that is common."}},
  {id:"K03", q:"A 2 A current flows through a 6 Ω resistor. The power is...", opts:["24 W","12 W","3 W","72 W"], why:"P = I² × R = 2² × 6 = 24 W.", fb:{"12 W":"That is I × R, the voltage. Square the current: 2² × 6."}},
  {id:"K04", q:"9 V across 470 Ω gives a current of about...", opts:["19.1 mA","4.23 A","52.2 mA","0.191 mA"], why:"I = V ÷ R = 9 ÷ 470 = 0.0191 A = 19.1 mA.", fb:{"4.23 A":"You multiplied. I = V ÷ R.","52.2 mA":"That is R ÷ V, upside down."}},
  {id:"K05", q:"12 V across R1 = 1 kΩ and R2 = 2 kΩ in series. What is the voltage across R2?", opts:["8 V","4 V","6 V","12 V"], why:"V2 = 12 × 2 ÷ (1 + 2) = 8 V. The bigger resistor takes the bigger share.", fb:{"4 V":"That is the voltage across R1.","6 V":"It only splits equally if the resistors are equal."}},
  {id:"K06", q:"Kirchhoff's current law is based on conservation of...", opts:["charge","energy","power","resistance"], why:"What flows into a node must flow out.", fb:{"energy":"Energy is the voltage law."}},
  {id:"K07", q:"Kirchhoff's voltage law is based on conservation of...", opts:["energy","charge","current","frequency"], why:"The emfs round a loop are all used up in the volt drops.", fb:{"charge":"Charge is the current law."}},
  {id:"K08", q:"2.5 A and 1.8 A flow into a node, and one current flows out. It is...", opts:["4.3 A","0.7 A","2.15 A","4.5 A"], why:"Current in = current out: 2.5 + 1.8 = 4.3 A.", fb:{"0.7 A":"Both currents flow in, so they add."}},
  {id:"K09", q:"A loop has a 20 V supply, V1 = 6.5 V and V2 = 8.0 V. V3 is...", opts:["5.5 V","14.5 V","34.5 V","1.5 V"], why:"20 − 6.5 − 8.0 = 5.5 V.", fb:{"14.5 V":"That is V1 + V2. Take both from the supply."}},
  {id:"K10", q:"In a two-loop circuit a current comes out at −2 A. This means...", opts:["2 A flowing the other way to your guess","the calculation is wrong","no current flows","the supply is reversed"], why:"The size is right; only the guessed direction was wrong."},
  {id:"K11", q:"Two 47 µF capacitors in parallel give...", opts:["94 µF","23.5 µF","47 µF","2209 µF"], why:"Capacitors in parallel add: 47 + 47 = 94 µF.", fb:{"23.5 µF":"That is the series total. Capacitors in parallel add."}},
  {id:"K12", q:"Capacitors in series give a total that is...", opts:["smaller than the smallest one","bigger than the biggest one","the average","the sum"], why:"In series the reciprocals add, so the total drops below the smallest."},
  {id:"K13", q:"Inductors combine in the same pattern as...", opts:["resistors","capacitors","neither","both, depending on frequency"], why:"Inductors add in series and combine reciprocally in parallel."},

  {id:"K15", q:"The time constant of an RC circuit is...", opts:["τ = R × C","τ = R ÷ C","τ = C ÷ R","τ = L ÷ R"], why:"Bigger R or bigger C means slower charging, so they multiply.", fb:{"τ = L ÷ R":"That is the RL circuit."}},
  {id:"K16", q:"R = 10 kΩ and C = 47 µF. τ is...", opts:["0.47 s","470 s","0.047 s","4.7 s"], why:"10 000 × 0.000047 = 0.47 s.", fb:{"470 s":"Convert the units: kΩ × µF gives milliseconds, so 470 ms."}},
  {id:"K17", q:"After 1τ a charging capacitor has reached...", opts:["63.2% of the supply","36.8% of the supply","50% of the supply","100% of the supply"], why:"63.2% after one time constant.", fb:{"36.8% of the supply":"36.8% is what is left of a falling quantity after 1τ."}},
  {id:"K18", q:"A capacitor is treated as fully charged after...", opts:["5τ","1τ","2τ","10τ"], why:"After 5τ it is within 1% of the final value."},
  {id:"K19", q:"L = 0.5 H and R = 25 Ω. τ is...", opts:["20 ms","12.5 s","50 s","2 ms"], why:"τ = L ÷ R = 0.5 ÷ 25 = 0.02 s = 20 ms.", fb:{"12.5 s":"That is L × R. The RL time constant is L ÷ R.","50 s":"That is R ÷ L, upside down."}},
  {id:"K20", q:"At the instant an RC circuit is switched on, the capacitor behaves like...", opts:["a short circuit","an open circuit","a resistor","a battery"], why:"It has no charge and so no voltage across it yet."},

  {id:"K22", q:"UK mains is 50 Hz. Its period is...", opts:["20 ms","50 ms","0.2 s","2 ms"], why:"T = 1 ÷ 50 = 0.02 s = 20 ms."},

  {id:"K24", q:"A waveform peaks at 12 V. Its peak to peak value is...", opts:["24 V","12 V","8.49 V","6 V"], why:"Peak to peak is twice the peak.", fb:{"8.49 V":"That is the RMS value."}},

  {id:"K26", q:"In a pure inductor the current...", opts:["lags the voltage by 90°","leads the voltage by 90°","is in phase with the voltage","lags by 180°"], why:"Inductor: current lags. Capacitor: current leads.", fb:{"leads the voltage by 90°":"That is a capacitor."}},
  {id:"K27", q:"In a pure capacitor the current...", opts:["leads the voltage by 90°","lags the voltage by 90°","is in phase with the voltage","leads by 45°"], why:"Capacitor current peaks when the voltage is changing fastest, a quarter cycle early.", fb:{"lags the voltage by 90°":"That is an inductor."}},

  {id:"K30", q:"XL for a 0.1 H inductor at 50 Hz is about...", opts:["31.4 Ω","5 Ω","0.0318 Ω","314 Ω"], why:"XL = 2πfL = 2 × π × 50 × 0.1 = 31.4 Ω.", fb:{"5 Ω":"You left out 2π."}},
  {id:"K31", q:"When the frequency rises, XC...", opts:["falls","rises","stays the same","becomes infinite"], why:"XC = 1 ÷ (2πfC): f is on the bottom.", fb:{"rises":"That is XL."}},
  {id:"K32", q:"R = 30 Ω and the net reactance is 40 Ω. Z is...", opts:["50 Ω","70 Ω","10 Ω","1200 Ω"], why:"Z = √(30² + 40²) = 50 Ω.", fb:{"70 Ω":"R and X are at right angles, so use Pythagoras, not addition."}},

flash: [
  {id:"F01", term:"Potential divider", def:"Two resistors in series that split the supply voltage to give a smaller output voltage."},
  {id:"F02", term:"Ohm's law", def:"V = I × R. Voltage equals current times resistance."},
  {id:"F03", term:"Power", def:"The rate energy is transferred, in watts. P = V × I = I² × R = V² ÷ R."},
  {id:"F04", term:"Series circuit", def:"One path. The same current flows through every component and the supply voltage is shared."},
  {id:"F05", term:"Parallel circuit", def:"Several branches. The same voltage is across every branch and the current splits."},
  {id:"F06", term:"Node", def:"A point where two or more branches of a circuit meet."},
  {id:"F07", term:"Loop", def:"Any closed path around a circuit."},
  {id:"F08", term:"emf", def:"Electromotive force: the voltage a source provides to drive current."},
  {id:"F09", term:"KCL", def:"Current in = current out at a node. Conservation of charge."},
  {id:"F10", term:"KVL", def:"Around a loop, the sum of the emfs = the sum of the volt drops. Conservation of energy."},
  {id:"F11", term:"Internal resistance", def:"The resistance inside a source, which takes some of its voltage."},
  {id:"F12", term:"Capacitance", def:"How much charge a capacitor stores per volt. Measured in farads (F)."},
  {id:"F13", term:"Inductance", def:"How strongly a coil opposes a change in current. Measured in henrys (H)."},
  {id:"F14", term:"Time constant τ", def:"RC circuit: τ = R × C. RL circuit: τ = L ÷ R. Measured in seconds."},
  {id:"F15", term:"63.2%", def:"How far a rising quantity has got after one time constant."},
  {id:"F16", term:"5τ", def:"The time after which the circuit is treated as fully charged or discharged."},

  {id:"F18", term:"Transient", def:"The changing behaviour of a circuit just after it is switched on or off."},
  {id:"F19", term:"Frequency", def:"Cycles per second, in hertz (Hz). f = 1 ÷ T."},
  {id:"F20", term:"Time period", def:"The time for one complete cycle, in seconds. T = 1 ÷ f."},

var Net = {
  mode: function(){
    if (window.google && google.script && google.script.run) return "gas";
    if (HUB_CONFIG.endpoint) return "remote";
    if (FORM_PREFILL) return "forms";
    return "local";
  },
  call: function(action, payload){
    var m = this.mode();
    return new Promise(function(resolve, reject){
      if (m === "gas") {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action, payload || {});
      } else if (m === "remote") {
        var ctrl = ("AbortController" in window) ? new AbortController() : null;
        var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 15000);
        fetch(HUB_CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify(Object.assign({action:action}, payload||{})), signal: ctrl ? ctrl.signal : undefined})
          .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(timer); resolve(j); })
          .catch(function(e){ clearTimeout(timer); reject(e); });
      } else reject(new Error("no_server"));
    });
  }
};
/* Only used by the Google route: results queue on the phone until they send. */
var Sync = {
  q: Store.get("queue", []), busy:false,
  add: function(ev){ this.q.push(ev); Store.set("queue", this.q); this.flush(); },
  flush: function(){
    var self = this, m = Net.mode();
    if (self.busy || !self.q.length || (m!=="gas" && m!=="remote")) return;
    if (navigator.onLine === false) return;
    self.busy = true;
    var batch = self.q.slice(0, 25);
    Net.call("log", {events: batch}).then(function(res){
      if (res && res.ok) {
        var sent = {}; batch.forEach(function(e){ sent[e.id]=1; });
        self.q = self.q.filter(function(e){ return !sent[e.id]; }); Store.set("queue", self.q); S.server.state = "ok";
      } else if (res && res.error === "unknown_code") {
        var bad = S.me ? S.me.code : ""; self.q = self.q.filter(function(e){ return e.code !== bad; }); Store.set("queue", self.q);
        toast("Your code was not recognised. Please sign in again."); signOut(true);
      } else { S.server.state = "error"; }
    }).catch(function(){ S.server.state = "offline"; }).then(function(){
      self.busy = false; updateSyncLine();
      if (self.q.length && S.server.state==="ok") setTimeout(function(){ self.flush(); }, 400);
    });
  }
};

/* ---------- verification code: short, and it changes if the code, game or score is edited ----------
   The tracker works out the same number in Excel, so an edited score shows up there.   */
/* The game name the tracker sees: unit prefix, a space, then the title, e.g. 8.1p2 Circuit Solver.
   Every unit hub sends to the same form, so the prefix keeps the units apart.            */
function sentName(title){ title = String(title||""); return /^\d/.test(title) ? title : "8.1p2 " + title; }
function checkCode(code, game, score, max){
  var s = String(code).toUpperCase()+"|"+sentName(game)+"|"+score+"|"+max, h = 0;
  for (var k=0;k<s.length;k++) h += s.charCodeAt(k)*(k+1)*7;
  h += 11*Number(score) + 13*Number(max);
  return String(h % 9973).padStart(4,"0");
}
function formsLink(game, score, max, detail){
  var u = FORM_PREFILL;
  function rep(tok, val){ u = u.split(tok).join(encodeURIComponent(val)); }
  rep("LEARNERHERE", S.me ? S.me.code : "");
  rep("GAMEHERE", sentName(game)); rep("SCOREHERE", String(score)); rep("MAXHERE", String(max));
  rep("CHECKHERE", checkCode(S.me ? S.me.code : "", game, score, max));
  rep("DETAILHERE", String(detail||"").slice(0, 900));
  return u;
}
function resultLine(game, score, max, when){
  var code = S.me ? S.me.code : "";
  return code + " | " + sentName(game) + " | " + score + " of " + max + " | check " + checkCode(code, game, score, max) + " | " + niceDate(when);
}
function copyText(text, done){
  function fallback(){
    var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly",""); t.style.position="fixed"; t.style.opacity="0";
    document.body.appendChild(t); t.select(); var ok=false; try { ok = document.execCommand("copy"); } catch(e) {} t.remove(); done(ok);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback); else fallback();
}

/* ---------- number formatting: significant figures, UK spacing for big numbers, and units ---------- */
function sig(n, s){
  s = s || 3; if (!isFinite(n)) return "?"; if (Math.abs(n) < 1e-12) return "0";
  var d = Math.floor(Math.log(Math.abs(n)) / Math.LN10 + 1e-9) + 1, p = Math.max(0, s - d);
  var str = (Math.round(n * Math.pow(10, p)) / Math.pow(10, p)).toFixed(p);
  if (str.indexOf(".") >= 0) str = str.replace(/0+$/, "").replace(/\.$/, "");
  var parts = str.split("."), ip = parts[0], neg = ip.charAt(0) === "-"; if (neg) ip = ip.slice(1);
  if (ip.length >= 5) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (neg ? "−" : "") + ip + (parts[1] ? "." + parts[1] : "");

/* options from one right answer and a list of [wrong answer, feedback on it]; duplicates are skipped */
function build(right, wrongs){
  var seen = {}, w = [], wf = {}; seen[right] = 1;
  wrongs.forEach(function(p){ if (!p || !p[0] || seen[p[0]] || w.length >= 3) return; seen[p[0]] = 1; w.push(p[0]); if (p[1]) wf[p[0]] = p[1]; });

}

function tileArt(key){ return svgWrap("0 0 160 80", TILE_ART[key] || TILE_ART.recall, ""); }

/* ---------- question drawings: circuits, nodes, loops, networks, curves, waves and phasors ----------
   Every drawing is built from the same numbers as the question, so the picture, the answer and the
   feedback can never disagree.                                                                       */
function lab(x, y, s, o){ o = o || {};
  return '<text class="a-t" x="'+x+'" y="'+y+'" text-anchor="'+(o.a||"middle")+'" style="font-size:'+(o.size||12)+'px'+(o.amb ? ';fill:var(--amb)' : '')+(o.muted ? ';fill:var(--muted)' : '')+'">'+esc(s)+'</text>'; }
function cellV(x, y, label){ /* a cell drawn on a vertical wire: long plate (positive) on top */
  return '<rect x="'+(x-24)+'" y="'+(y-14)+'" width="48" height="28" style="fill:var(--tint)"/>'+
    '<line class="a-i" x1="'+(x-20)+'" y1="'+(y-6)+'" x2="'+(x+20)+'" y2="'+(y-6)+'" style="stroke-width:3"/>'+
    '<line class="a-i" x1="'+(x-10)+'" y1="'+(y+6)+'" x2="'+(x+10)+'" y2="'+(y+6)+'" style="stroke-width:7;stroke-linecap:butt"/>'+
    lab(x+30, y-2, "+", {size:15}) + lab(x-28, y+5, label, {a:"end", size:13}); }
function resH(cx, y, name, val, below){
  return '<rect class="a-f" x="'+(cx-20)+'" y="'+(y-8)+'" width="40" height="16"/>' +
    (name ? lab(cx, below ? y+26 : y-14, name) : '') + (val ? lab(cx, below ? y-14 : y+26, val, {amb:true}) : ''); }
function resV(x, cy, name, val, left){
  var tx = left ? x-14 : x+14, a = left ? "end" : "start";
  return '<rect class="a-f" x="'+(x-8)+'" y="'+(cy-20)+'" width="16" height="40"/>' +
    (name ? lab(tx, cy-3, name, {a:a}) : '') + (val ? lab(tx, name ? cy+13 : cy+5, val, {a:a, amb:true}) : ''); }
function arrowAt(mx, my, dx, dy, cls){ var s = 7, w = 6;
  return '<path class="'+(cls||"a-fa")+'" d="M'+(mx+dx*s)+' '+(my+dy*s)+' L'+(mx-dx*s-dy*w)+' '+(my-dy*s+dx*w)+' L'+(mx-dx*s+dy*w)+' '+(my-dy*s-dx*w)+' Z"/>'; }

/* resistor circuits: R is a list of ohms, V the supply in volts */
function seriesArt(R, V){
  var xs = R.length === 2 ? [150, 230] : [140, 205, 270];
  var s = '<path class="a-i" d="M72 44H310V150H72Z"/>' + cellV(72, 97, V+" V");
  R.forEach(function(r, k){ s += resH(xs[k], 44, "R"+(k+1), fR(r)); });
  return svgWrap("0 0 330 180", s, R.length+" resistors in series across "+V+" V: "+R.map(fR).join(", "));
}
function parallelArt(R, V){
  var xs = R.length === 2 ? [170, 260] : [140, 205, 270], last = xs[xs.length-1];
  var s = '<path class="a-i" d="M72 40H'+last+'M72 150H'+last+'M72 40V150"/>';
  xs.forEach(function(x){ s += '<path class="a-i" d="M'+x+' 40V150"/>'; });
  s += cellV(72, 95, V+" V");
  R.forEach(function(r, k){ s += resV(xs[k], 95, "R"+(k+1), fR(r)); });
  return svgWrap("0 0 330 180", s, R.length+" resistors in parallel across "+V+" V: "+R.map(fR).join(", "));
}
function comboArt(R, V){ /* R1 in series with R2 parallel R3 */
  var s = '<path class="a-i" d="M72 40H270M72 150H270M72 40V150M205 40V150M270 40V150"/>' + cellV(72, 95, V+" V") +
    resH(135, 40, "R1", fR(R[0])) + resV(205, 95, "R2", fR(R[1])) + resV(270, 95, "R3", fR(R[2]));
  return svgWrap("0 0 330 180", s, "R1 of "+fR(R[0])+" in series with R2 of "+fR(R[1])+" and R3 of "+fR(R[2])+" in parallel, across "+V+" V");
}

/* Kirchhoff's current law: branches [{pos:"L"|"R"|"U"|"D", dir:"in"|"out", text, unk}] */
function kclArt(br){
  var cx = 165, cy = 90, P = {L:[60,90,-1,0], R:[270,90,1,0], U:[165,26,0,-1], D:[165,154,0,1]}, s = "";
  br.forEach(function(b){ var p = P[b.pos], mx = (cx+p[0])/2, my = (cy+p[1])/2, d = b.dir === "in" ? -1 : 1;
    s += '<line class="a-i" x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>' + arrowAt(mx, my, p[2]*d, p[3]*d, b.unk ? "a-fa" : "a-fi");
    var o = {size:14, amb:!!b.unk};
    if (b.pos === "L") s += lab(p[0]-8, p[1]+5, b.text, Object.assign({a:"end"}, o));
    else if (b.pos === "R") s += lab(p[0]+8, p[1]+5, b.text, Object.assign({a:"start"}, o));
    else if (b.pos === "U") s += lab(p[0], p[1]-8, b.text, o);
    else s += lab(p[0], p[1]+20, b.text, o);
  });
  s += '<circle class="a-fi" cx="'+cx+'" cy="'+cy+'" r="6"/>';
  return svgWrap("0 0 330 180", s, "A node with "+br.length+" currents: "+br.map(function(b){ return b.text+" "+(b.dir === "in" ? "in" : "out"); }).join(", "));
}
/* Kirchhoff's voltage law: a cell and two or three resistors, each labelled with its volt drop */
function kvlArt(eLabel, drops){
  var s = '<path class="a-i" d="M72 44H300V150H72Z"/>' + cellV(72, 97, eLabel);
  s += resH(186, 44, drops[0], "");
  s += resV(300, 97, "", drops[1], true);
  if (drops.length > 2) s += resH(186, 150, drops[2], "", true);
  return svgWrap("0 0 330 180", s, "A loop with an emf of "+eLabel+" and volt drops "+drops.join(", "));
}

/* capacitor and inductor networks between terminals A and B */
function compH(cx, y, type){
  if (type === "C") return '<rect x="'+(cx-7)+'" y="'+(y-3)+'" width="14" height="6" style="fill:var(--tint)"/>' +
    '<line class="a-i" x1="'+(cx-4)+'" y1="'+(y-13)+'" x2="'+(cx-4)+'" y2="'+(y+13)+'" style="stroke-width:3"/>' +
    '<line class="a-i" x1="'+(cx+4)+'" y1="'+(y-13)+'" x2="'+(cx+4)+'" y2="'+(y+13)+'" style="stroke-width:3"/>';
  return '<rect x="'+(cx-21)+'" y="'+(y-3)+'" width="42" height="6" style="fill:var(--tint)"/>' +
    '<path class="a-i" d="M'+(cx-20)+' '+y+'a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0a5 5 0 0 1 10 0"/>';
}
function compLab(cx, y, name, val, side){ /* side: "ab" above and below, "r" to the right */
  if (side === "r") { var lx = cx + (name.charAt(0) === "L" ? 26 : 14); return lab(lx, y-7, name, {a:"start"}) + lab(lx, y+17, val, {a:"start", amb:true}); }
  return lab(cx, y-20, name) + lab(cx, y+27, val, {amb:true});
}
function netArt(kind, vals, type){
  var u = type === "C" ? " µF" : " mH", n = function(k){ return type+(k+1); }, v = function(k){ return sig(vals[k],4)+u; }, s = "";
  var term = '<circle class="a-f" cx="20" cy="90" r="4"/><circle class="a-f" cx="310" cy="90" r="4"/>' + lab(20, 112, "A") + lab(310, 112, "B");
  if (kind === "s2") { s = '<path class="a-i" d="M24 90H306"/>' + compH(125, 90, type) + compH(205, 90, type) + compLab(125, 90, n(0), v(0)) + compLab(205, 90, n(1), v(1)); }
  else if (kind === "p2" || kind === "p3") {
    var ys = kind === "p2" ? [55, 125] : [35, 90, 145], top = ys[0], bot = ys[ys.length-1];
    s = '<path class="a-i" d="M24 90H90M90 '+top+'V'+bot+'M250 '+top+'V'+bot+'M250 90H306"/>';
    ys.forEach(function(y, k){ s += '<path class="a-i" d="M90 '+y+'H250"/>' + compH(150, y, type) + compLab(150, y, n(k), v(k), "r"); });
  }
  else if (kind === "c3") { /* type1 parallel type2, then in series with type3 */
    s = '<path class="a-i" d="M24 90H40M40 55V125M40 55H170M40 125H170M170 55V125M170 90H306"/>' +
      compH(75, 55, type) + compH(75, 125, type) + compLab(75, 55, n(0), v(0), "r") + compLab(75, 125, n(1), v(1), "r") +
      compH(235, 90, type) + compLab(235, 90, n(2), v(2));
  }
  var words = {s2:"in series", p2:"in parallel", p3:"in parallel", c3:"with the first two in parallel and the third in series with them"}[kind];
  return svgWrap("0 0 330 180", s + term, vals.length+" "+(type === "C" ? "capacitors" : "inductors")+" "+words+" between A and B: "+vals.map(function(x){ return sig(x,4)+u; }).join(", "));
}

/* RC charging or discharging curve with one marked point at k time constants */
function curveArt(mode, V, k){
  var x0 = 52, y0 = 158, wT = 50, hV = 112, s = "";
  for (var j = 1; j <= 5; j++) s += '<line x1="'+(x0+j*wT)+'" y1="'+(y0-hV-6)+'" x2="'+(x0+j*wT)+'" y2="'+y0+'" style="stroke:var(--line);stroke-width:1"/>' + lab(x0+j*wT, y0+16, j+"τ", {muted:true});
  s += '<line x1="'+x0+'" y1="'+(y0-hV)+'" x2="'+(x0+5*wT)+'" y2="'+(y0-hV)+'" style="stroke:var(--line);stroke-width:1;stroke-dasharray:5 4"/>';
  s += '<path class="a-i" d="M'+x0+' '+(y0-hV-14)+'V'+y0+'H'+(x0+5*wT+12)+'"/>' + lab(x0-6, y0+4, "0", {a:"end", muted:true}) + lab(x0-6, y0-hV+4, V+" V", {a:"end"}) + lab(x0+4, y0-hV-18, "vC", {a:"start"});
  var pts = [];
  for (var i = 0; i <= 100; i++){ var t = 5*i/100, f = mode === "charge" ? 1 - Math.exp(-t) : Math.exp(-t); pts.push((x0+t*wT).toFixed(1)+" "+(y0-hV*f).toFixed(1)); }
  s += '<path class="a-a" style="stroke-width:3" d="M'+pts.join(" L")+'"/>';
  var fk = mode === "charge" ? 1 - Math.exp(-k) : Math.exp(-k), mx = x0+k*wT, my = y0-hV*fk;
  s += '<line x1="'+mx+'" y1="'+y0+'" x2="'+mx+'" y2="'+my+'" class="a-d"/><circle class="a-fi" cx="'+mx+'" cy="'+my+'" r="6"/>' + lab(mx+12, my+(mode === "charge" ? 18 : -8), "?", {a:"start", size:16, amb:true});
  return svgWrap("0 0 330 186", s, "Capacitor voltage "+(mode === "charge" ? "charging up to " : "discharging from ")+V+" V, with a point marked at "+k+" time constants");
}

/* sine waves on a grid: o = {A, P, vd, td, phase} (phase in degrees for a second, dashed current wave) */
function sineArt(o){
  var x0 = 40, y0 = 18, cw = 26, rh = 16, cols = 10, rows = 8, mid = y0 + rows*rh/2, s = "";
  for (var i = 0; i <= cols; i++) s += '<line x1="'+(x0+i*cw)+'" y1="'+y0+'" x2="'+(x0+i*cw)+'" y2="'+(y0+rows*rh)+'" style="stroke:var(--line);stroke-width:1"/>';
  for (var j = 0; j <= rows; j++) s += '<line x1="'+x0+'" y1="'+(y0+j*rh)+'" x2="'+(x0+cols*cw)+'" y2="'+(y0+j*rh)+'" style="stroke:var(--line);stroke-width:1"/>';
  s += '<line class="a-i" x1="'+x0+'" y1="'+mid+'" x2="'+(x0+cols*cw)+'" y2="'+mid+'" style="stroke-width:1.2"/>';
  function wave(A, ph, cls, extra){ var pts = [];
    for (var k = 0; k <= 240; k++){ var t = k*cols/240; pts.push((x0+t*cw).toFixed(1)+" "+(mid - A*rh*Math.sin(2*Math.PI*t/o.P + ph*Math.PI/180)).toFixed(1)); }
    return '<path class="'+cls+'" style="stroke-width:3'+(extra||"")+'" d="M'+pts.join(" L")+'"/>'; }
  s += wave(o.A, 0, "a-a");
  if (o.phase != null) {
    s += wave(o.A2 || 2, o.phase, "a-i", ";stroke-dasharray:7 5");
    s += lab(165, 182, "Solid: voltage.   Dashed: current.", {muted:true});
  } else {
    s += lab(x0, 166, "1 square up = "+o.vd+" V", {a:"start", muted:true}) + lab(x0+cols*cw, 166, "1 square across = "+o.td+" ms", {a:"end", muted:true});
  }
  return svgWrap("0 0 330 188", s, o.phase != null ? "A voltage wave and a current wave of the same frequency" : "A sine wave on a grid. Each square is "+o.vd+" V up and "+o.td+" ms across");
}

/* phasor diagram: V as the reference, I at angle phi (degrees, anticlockwise positive) */
function phasorArt(phi){
  var ox = 100, oy = 112, lv = 160, li = 92, r = phi*Math.PI/180, ix = ox + li*Math.cos(r), iy = oy - li*Math.sin(r), s = "";
  s += '<line class="a-i" x1="'+ox+'" y1="'+oy+'" x2="'+(ox+lv)+'" y2="'+oy+'" style="stroke-width:3"/>' + arrowAt(ox+lv-6, oy, 1, 0, "a-fi") + lab(ox+lv+12, oy+5, "V", {a:"start", size:15});
  if (phi !== 0) { var ar = 34, ax = ox + ar*Math.cos(r), ay = oy - ar*Math.sin(r);
    s += '<path class="a-d" d="M'+(ox+ar)+' '+oy+' A'+ar+' '+ar+' 0 0 '+(phi > 0 ? 0 : 1)+' '+ax.toFixed(1)+' '+ay.toFixed(1)+'"/>';
    var mr = (phi/2)*Math.PI/180; s += lab((ox+(ar+20)*Math.cos(mr)).toFixed(1), (oy-(ar+20)*Math.sin(mr)+4).toFixed(1), Math.abs(phi)+"°", {size:12, muted:true});
  }
  var ux = Math.cos(r), uy = -Math.sin(r);
  s += '<line class="a-a" x1="'+ox+'" y1="'+(oy+(phi === 0 ? 0 : 0))+'" x2="'+(ix-ux*4).toFixed(1)+'" y2="'+(iy-uy*4).toFixed(1)+'" style="stroke-width:4"/>' + arrowAt(ix-ux*6, iy-uy*6, ux, uy, "a-fa");
  s += lab((ix+ux*14).toFixed(1), (iy+uy*14+(phi === 0 ? 20 : 5)).toFixed(1), "I", {size:15, amb:true});
  s += '<circle class="a-fi" cx="'+ox+'" cy="'+oy+'" r="4"/>' + lab(165, 210, "Phasors rotate anticlockwise", {muted:true});
  return svgWrap("0 0 330 216", s, "Phasor diagram: V is the reference and I is drawn at "+Math.abs(phi)+" degrees "+(phi > 0 ? "anticlockwise of V" : phi < 0 ? "clockwise of V" : "along V"));
}
/* series RLC voltage phasors, current as the reference */
function rlcArt(VR, VL, VC){
  /* lengths keep the order of the three voltages but never drop below 40 px, so short phasors and their labels stay clear;
     the values on the labels carry the numbers */
  var ox = 72, oy = 108, m = Math.max(VR, VL, VC), L = function(v){ return 40 + 50*v/m; }, s = "";
  var r = L(VR), u = L(VL), d = L(VC);
  s += '<line class="a-d" x1="'+ox+'" y1="'+oy+'" x2="300" y2="'+oy+'"/>' + lab(300, oy+20, "I (reference)", {a:"end", muted:true});
  s += '<line class="a-i" x1="'+ox+'" y1="'+oy+'" x2="'+(ox+r-6).toFixed(1)+'" y2="'+oy+'" style="stroke-width:3"/>' + arrowAt(ox+r-7, oy, 1, 0, "a-fi") + lab(ox+12, oy+18, "VR = "+VR+" V", {a:"start"});
  s += '<line class="a-a" x1="'+ox+'" y1="'+oy+'" x2="'+ox+'" y2="'+(oy-u+6).toFixed(1)+'" style="stroke-width:3"/>' + arrowAt(ox, oy-u+7, 0, -1, "a-fa") + lab(ox+12, oy-u+10, "VL = "+VL+" V", {a:"start", amb:true});
  s += '<line class="a-a" x1="'+ox+'" y1="'+oy+'" x2="'+ox+'" y2="'+(oy+d-6).toFixed(1)+'" style="stroke-width:3"/>' + arrowAt(ox, oy+d-7, 0, 1, "a-fa") + lab(ox+12, oy+d, "VC = "+VC+" V", {a:"start", amb:true});
  s += '<circle class="a-fi" cx="'+ox+'" cy="'+oy+'" r="4"/>';
  return svgWrap("0 0 330 210", s, "Series RLC phasors: VR "+VR+" V along the current, VL "+VL+" V up, VC "+VC+" V down. Not to scale.");
}

<script>

  {key:"phasor",   title:"Phasor Reader",       what:"Phasor diagrams, reactance, impedance and AC power."},
  {key:"leadlag",  title:"Lead or Lag?",        what:"Swipe each circuit. Does the current lead or lag?"},
  {key:"device",   title:"Device Selector",     what:"A fault. Which protection device deals with it?"},

var TITLE = {flash:"Key word cards", exit:"Exit ticket", review:"Review"};
GAMES.forEach(function(g){ TITLE[g.key] = g.title; });
if (CONTENT) { TITLE.checkin1 = CONTENT.checkin.p1.title; TITLE.checkin2 = CONTENT.checkin.p2.title; TITLE.checkin3 = CONTENT.checkin.p3.title; TITLE.checkin4 = CONTENT.checkin.p4.title; }
var LEVELS = [{name:"Apprentice",at:0},{name:"Engineering Technician",at:400},{name:"Incorporated Engineer",at:1000},{name:"Chartered Engineer",at:2000}];
function levelOf(xp){ var i=0; while (i<LEVELS.length-1 && xp>=LEVELS[i+1].at) i++; return {i:i, name:LEVELS[i].name, next:LEVELS[i+1]||null, from:LEVELS[i].at}; }
function streak(){
  var d = S.prog.days.slice().sort(), n = 0, day = new Date();
  if (d.indexOf(todayKey(day)) < 0) day.setDate(day.getDate()-1);
  while (d.indexOf(todayKey(day)) >= 0) { n++; day.setDate(day.getDate()-1); }
  return n;
}
function firstName(){ if (!S.me) return ""; var n = S.me.name || S.me.code; return n.split(" ")[0]; }
function initials(){ var n = (S.me && (S.me.name || S.me.code)) || "?"; var p = n.trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1]||""))).toUpperCase(); }
function guided(){ return S.prefs.mode !== "independent"; }

/* ---------- spaced review (Embedding: revisit once-learnt material to stop it being forgotten) ----------
   Each question in the review bank sits in a box. Wrong: back to box 0, due tomorrow.
   Right: up one box, due after 1, 3, 7 then 14 days.                                                */
var GAPS = [1, 3, 7, 14];
function addDays(n){ var d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }
function srsMark(id, ok){
  if (!id) return false;
  var box = S.prog.srs[id], was = box ? box.b : -1;
  if (!ok) { S.prog.srs[id] = {b:0, due:addDays(1)}; return true; }
  if (box) { var b = Math.min(box.b + 1, GAPS.length - 1); S.prog.srs[id] = {b:b, due:addDays(GAPS[b])}; }
  return false;
}
function dueIds(){ var t = todayKey(); return Object.keys(S.prog.srs).filter(function(id){ return S.prog.srs[id].due <= t && REG[id]; }); }
var REG = {};
function mcqFrom(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));
  return {id:x.id, rid:x.id, lead:lead||"", prompt:x.q, options:m.options, correct:m.correct, why:x.why, wf:x.fb||null}; }
function buildReg(){
  CONTENT.recall.forEach(function(x){ REG[x.id] = function(){ return mcqFrom(x, "From criterion 8.1 part 1"); }; });
  CONTENT.quick.forEach(function(x){ REG[x.id] = function(){ return mcqFrom(x); }; });
  CONTENT.kirchFacts.concat(CONTENT.combineFacts).forEach(function(x){ REG[x.id] = function(){ return mcqFrom(x); }; });
  CONTENT.devices.forEach(function(x){ REG[x.id] = function(){ return deviceItem(x); }; });
}

/* ---------- sign in ---------- */
function signIn(msg){
  var list = CLASS.length > 0;
  screen(fullHeader() + '<div class="wrap stack">' +
    '<div class="card stack"><h2 style="margin:0">Sign in</h2>' +
    (list ? '<p class="muted" style="margin:0">Tap your name.</p><div class="names">' + CLASS.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.name)+'</button>'; }).join("") + '</div><p class="muted small" style="margin:6px 0 0">Name not there? Type your code instead.</p>' : '') +
    '<label for="code"><b>Your hub code</b><br><span class="small muted">Four letters and numbers, on the slip from your tutor.</span></label>' +
    '<input id="code" class="textin codebox" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="err">' +
    '<button class="btn amber block" id="go">Start</button>' +
    '<p id="err" class="small" role="alert" style="color:var(--red);margin:0">' + esc(msg||"") + '</p></div>' +
    '<div class="panel amber"><h3>Nothing here is marked</h3><p>These games are for practice. Your scores stay on this phone until you choose to send them to your tutor.</p></div>' +
    '<p class="foot">Your tutor sees your code, your scores, what you write in the exit ticket and when you played, so they know what to go over again. Nothing else is collected.</p></div>', {out:true});
  var inp = $("#code"), go = $("#go");
  inp.addEventListener("input", function(){ inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go.click(); });
  function finish(code, name){
    S.me = {code:code, name:name || code}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} loadProg(); logEvent("open","hub"); home();
  }
  function tryCode(code, name){
    if (!/^[A-Z0-9]{4}$/.test(code)) { $("#err").textContent = "Your code has four letters and numbers."; return; }
    var m = Net.mode();
    if (m === "gas" || m === "remote") {
      go.disabled = true; go.textContent = "Checking";
      Net.call("hello", {code:code}).then(function(r){
        if (r && r.ok) finish(code, name || r.first);
        else { go.disabled=false; go.textContent="Start"; $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; }
      }).catch(function(){ go.disabled=false; go.textContent="Start"; $("#err").textContent = "Cannot reach the hub right now. Check your wifi or data and try again."; });
      return;
    }
    if (CLASS.length && !name) {
      var hit = CLASS.filter(function(c){ return c.code === code; })[0];
      if (!hit) { $("#err").textContent = "That code is not on the list. Check your slip, or ask your tutor."; return; }
      name = hit.name;
    }
    finish(code, name);
  }
  go.onclick = function(){ tryCode(inp.value.trim()); };
  $$(".names button").forEach(function(b){ b.onclick = function(){ var c = CLASS[+b.dataset.i]; tryCode(c.code, c.name); }; });
  if (!list) setTimeout(function(){ try { inp.focus(); } catch(e){} }, 60);
}
function signOut(silent){
  if (!silent && !confirm("Sign out on this phone? Your record stays here for next time.")) return;
  S.me = null; Store.del("me"); try { localStorage.removeItem("tlhub.me"); } catch(e) {} loadProg(); signIn();
}

/* ---------- home ---------- */
async function loadServer(){
  var m = Net.mode(); if (m !== "gas" && m !== "remote") return;
  try {
    var r = await Net.call("stats", {});
    if (r && r.ok) Object.assign(S.server, {state:"ok", focus:r.focus, target:r.target, week:r.week, message:r.message||"", nameOnly:!!r.nameOnly});
  } catch(e) { S.server.state = "offline"; }
}
function gameByKey(k){ return GAMES.filter(function(g){ return g.key === k; })[0]; }
function suggestNext(){
  /* first game in path order not yet checked */
  var order = []; CONTENT.parts.forEach(function(p){ order = order.concat(p.games); });
  for (var i=0;i<order.length;i++) if (!S.prog.stamps[order[i]]) return order[i];
  return "master";
}
function home(){
  if (!S.me) return signIn();

  var p = S.prog, lv = levelOf(p.xp), focus = S.server.focus || HUB_CONFIG.defaultFocus;
  var toNext = lv.next ? lv.next.at - p.xp : 0, span = lv.next ? lv.next.at - lv.from : 1, fill = lv.next ? Math.round(100*(p.xp-lv.from)/span) : 100;
  var checked = Object.keys(p.stamps).length, played = Object.keys(p.plays).reduce(function(a,k){ return a + p.plays[k]; }, 0);
  var due = dueIds().length, nxt = suggestNext();
  function tile(g, step){
    var best = p.best[g.key], n = p.plays[g.key]||0, isF = focus.indexOf(g.key) >= 0, good = best >= 80;

      '<div class="art">'+tileArt(g.key)+'</div>' +

      '<div class="body"><span class="badges">' + (step ? '<span class="step">'+esc(step)+'</span>' : '') + (isF ? '<span class="badge">This week</span>' : '') + (g.key===nxt ? '<span class="badge next">Next</span>' : '') + '</span>' +
      '<span class="ttl">'+esc(g.title)+'</span><span class="what">'+esc(g.what)+'</span><span class="rec'+(good?' good':'')+'">'+rec+'</span></div></button>';
  }
  function row(act, ic, title, sub, pill){
    return '<button class="rowbtn" data-go="'+act+'"><span class="ic">'+icon(ic)+'</span><span class="tx"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+(pill||'<span aria-hidden="true" class="muted">'+icon("chev")+'</span>')+'</button>';
  }
  var goal = (p.goal != null) ? CONTENT.goals[p.goal] : null;
  var goalCard = goal ?

    '<p style="margin:4px 0 8px">'+esc(goal.t)+'</p><div class="row">' + goal.games.map(function(k){ return '<button class="btn small ghost" data-game2="'+k+'">'+esc(TITLE[k])+'</button>'; }).join("") + '</div></div>' :
    '<button class="rowbtn" data-act="goal"><span class="ic">'+icon("flag")+'</span><span class="tx"><b>Set a goal for this week</b><span>Pick the thing you most want to get better at. The hub shows you where to practise it.</span></span><span aria-hidden="true" class="muted">'+icon("chev")+'</span></button>';

    '<button data-mode="guided" aria-pressed="'+guided()+'">Guided</button><button data-mode="independent" aria-pressed="'+(!guided())+'">Independent</button></div>' +
    '<p class="small muted" style="margin:0">'+(guided() ? "Hints and worked examples are on. When you score 80% or more, try Independent." : "No hints or worked examples. Every game earns 50% more points.")+'</p></div>';

    var multi = pt.id !== "mix" && pt.id !== "p0";

      '<details class="goals"><summary>You will be able to</summary><ul>'+pt.goals.map(function(g){ return '<li>'+esc(g)+'</li>'; }).join("")+'</ul></details>' +

  var done = p.done;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="card"><div class="me"><span class="avatar" aria-hidden="true">'+esc(initials())+'</span><div><h2>Hello, '+esc(firstName())+'</h2>' +

             row("review", "cal", "Review", Object.keys(p.srs).length ? "Nothing due today. Missed questions come back after 1, 3, 7 and 14 days." : "Questions you miss in the games come back here on later days.", '<span class="pill">Nothing due</span>')) +

      row("checkin2", "check", "Part 2 check-in", "Rate yourself on resistors, capacitors and inductors.", done.checkin2 ? '<span class="pill">Sent</span>' : '') +
      row("checkin3", "check", "Part 3 check-in", "Rate yourself on AC circuits and phasor diagrams.", done.checkin3 ? '<span class="pill">Sent</span>' : '') +
      row("checkin4", "check", "Part 4 check-in", "Rate yourself on protection systems.", done.checkin4 ? '<span class="pill">Sent</span>' : '') +
      row("flash", "flash", "Key word cards", CONTENT.flash.length + " flip cards. Keep going until you know them all.") +
    '</div><p class="foot">This is formative. Nothing here is marked or graded. <span data-sync>'+esc(syncText())+'</span></p></div>', {tab:"games"});
  $$(".tile").forEach(function(t){ t.onclick = function(){ startGame(t.dataset.game); }; });
  $$("[data-game2]").forEach(function(t){ t.onclick = function(){ startGame(t.dataset.game2); }; });
  $$("[data-go]").forEach(function(b){ b.onclick = function(){ var g=b.dataset.go;

  $$('[data-act="goal"]').forEach(function(b){ b.onclick = function(){ openGoalPicker(); }; });
  $$("[data-mode]").forEach(function(b){ b.onclick = function(){ S.prefs.mode = b.dataset.mode; Store.set("prefs", S.prefs); home(); var x = $('[data-mode="'+S.prefs.mode+'"]'); if (x) x.focus(); }; });

/* ---------- goal picker (Activating: plan your own learning) ---------- */

var RECORD_KEYS = GAMES.map(function(g){ return g.key; }).concat(["review","flash","exit","checkin1","checkin2","checkin3","checkin4"]);
function recordLines(){
  var p = S.prog;

function record(){
  S.tab = "record";

  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  var cal = p.cal || {sr:0, sw:0, gr:0, gw:0}, calN = cal.sr + cal.sw + cal.gr + cal.gw;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (calN ? '<div class="card" style="margin-bottom:12px"><b style="color:var(--head)">Do you know what you know?</b><p class="small" style="margin:6px 0 0">From Sure or Not?: sure and right '+cal.sr+', sure but wrong '+cal.sw+', guessed and right '+cal.gr+', guessed and wrong '+cal.gw+'. '+
      (cal.sw ? 'Sure but wrong is the one to shrink: those are the mistakes you would not spot in the exam.' : 'No confident mistakes so far. Good.')+'</p></div>' : '') +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="'+TRANSFER+'..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = TRANSFER + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(TRANSFER) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(TRANSFER.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done); Object.assign(cur.srs, inc.srs); Object.assign(cur.rag, inc.rag);
      if (cur.goal == null) cur.goal = inc.goal;
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code. Copy it again on the other phone."; }
  };
}

/* ---------- navigation ---------- */
function startGame(key){
  var run = {recall:runRecall, circuit:runCircuit, kirch:runKirch, combine:runCombine, curves:runCurves, waves:runWaves, phasor:runPhasor, leadlag:runLeadLag,
    device:runDevice, chain:runSequence, ladder:runLadder, why:runWhy, errors:runErrors, examiner:runExaminer, pairs:runPairs, sure:runSure, master:runMaster, flash:runFlash, review:runReview}[key];
