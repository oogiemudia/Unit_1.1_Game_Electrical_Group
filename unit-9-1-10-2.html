eds a control signal. A solar motor just runs from the panel.","Stepper motor":"A stepper needs a controller sending pulses. A solar motor just runs from the panel."}}],"which":[{"id":"H01","q":"Count steel food cans on a conveyor. Which sensor suits it best?","opts":["Inductive proximity sensor","Capacitive proximity sensor","PIR motion sensor","Thermistor"],"why":"Inductive sensors detect metal without contact and are very tough. The cans are steel.","fb":{"Capacitive proximity sensor":"It would work, but inductive is the natural choice for metal: tougher and ignores non-metal clutter.","PIR motion sensor":"PIR senses body heat. Cans are not warm."},"a":79,"t":{"k":"short","acc":["inductive","inductive proximity sensor","inductive sensor","inductive proximity"]},"p":4},{"id":"H02","q":"Count plastic bottles on a conveyor. Which sensor would not see them?","opts":["Inductive proximity sensor","Photoelectric beam sensor","Capacitive proximity sensor","Ultrasonic sensor"],"why":"An inductive sensor only detects metal. Plastic bottles pass straight by.","fb":{"Photoelectric beam sensor":"A bottle breaks the beam, so a photoelectric sensor does see it.","Capacitive proximity sensor":"Capacitive sensors detect plastic too."},"a":79,"p":4},{"id":"H03","q":"Check the level of liquid inside a plastic tank without a hole in the tank. Which sensor?","opts":["Capacitive proximity sensor","Inductive proximity sensor","Limit switch","Microswitch"],"why":"A capacitive sensor senses any material that changes its electric field, even through a tank wall.","fb":{"Inductive proximity sensor":"Inductive only detects metal.","Limit switch":"A limit switch needs something to press it."},"a":79,"t":{"k":"short","acc":["capacitive","capacitive proximity sensor","capacitive sensor","capacitive proximity"]},"p":4},{"id":"H04","q":"Measure the height of each box on a fast conveyor without touching it. Which sensor?","opts":["Laser distance sensor","Limit switch","Thermistor","Microswitch"],"why":"The laser reflects off the top of the box; the sensor compares that distance with the distance to the belt.","fb":{"Limit switch":"A limit switch only says on or off when it is pressed. It cannot measure a height."},"a":81,"t":{"k":"short","acc":["laser","laser sensor","laser distance sensor","laser displacement sensor","time of flight sensor","ultrasonic","ultrasonic sensor","infrared","infrared sensor","vision system","photoelectric sensor","photoelectronic sensor"]},"p":4},{"id":"H05","q":"Check that every label on a bottle line is on straight. Which system?","opts":["A vision system","An inductive proximity sensor","A load cell","A thermocouple"],"why":"A camera, lighting and software compare each image with a standard and pass or fail it.","fb":{"An inductive proximity sensor":"It can tell a metal cap is there, not whether a label is straight."},"a":83,"t":{"k":"short","acc":["vision system","vision","machine vision","camera","camera system"]},"p":4},{"id":"H06","q":"Stop a machine as soon as its guard is opened. Which switch?","opts":["Guard interlock switch","Microswitch on the motor","Tilt switch","Light switch"],"why":"A guard interlock switch stops the machine when its guard is opened.","fb":{"Tilt switch":"A tilt switch senses angle, not a guard opening."},"a":78,"t":{"k":"short","acc":["guard interlock","interlock","interlock switch","guard interlock switch","guard switch","safety interlock"]},"p":4},{"id":"H07","q":"Stop a carriage before it runs off the end of its track. Which device?","opts":["Limit switch","Thermistor","Microphone","Vision system"],"why":"A limit switch detects the end of travel of a moving part. The controller then stops the motor.","fb":{"Vision system":"A camera could see it, but a limit switch is the simple, reliable, cheap way to sense end of travel."},"a":78,"t":{"k":"short","acc":["limit switch","limit switches","end stop","microswitch"]},"p":4},{"id":"H08","q":"A sensor is fixed to a turning wind turbine blade. How is it best powered?","opts":["Batteries","Mains through a cable","An AC adapter plugged into a socket","Compressed air"],"why":"Something that moves, or is hard to reach, is easiest to power from batteries.","fb":{"Mains through a cable":"A cable to a turning blade would twist and break."},"a":85,"p":4},{"id":"H09","q":"Most factory sensors and controls run from which supply?","opts":["24 V DC made from the mains","230 V AC straight to the sensor","A 1.5 V battery","Compressed air"],"why":"Most factory sensors and controls run on 24 V DC, made from the mains by a power supply. Reliable and it never runs out.","fb":{"230 V AC straight to the sensor":"Mains is turned into 24 V DC first. 230 V is not fed to sensors."},"a":85,"t":{"k":"num","v":24,"unit":"V","tol":0.01},"p":4},{"id":"H10","q":"200 temperature sensors in an old building with thick walls. Which is the main risk of wireless?","opts":["Thick walls can block the signal","Cables are expensive to fit","Sensors cannot be moved later","Wireless sensors never need power"],"why":"Walls and interference can block a wireless signal. The other options are disadvantages of hard-wiring, or not true.","fb":{"Cables are expensive to fit":"That is a disadvantage of hard-wired systems, not wireless."},"a":86,"p":4},{"id":"H11","q":"Which is an advantage of a hard-wired connection?","opts":["Power can travel in the same cable","Quick to install","Easy to move","Reaches moving equipment"],"why":"Hard-wired is reliable and fast, needs no batteries, and power can go in the same cable. The others are wireless advantages.","fb":{"Quick to install":"That is a wireless advantage."},"a":86,"p":4},{"id":"H12","q":"A sensor takes its power through the same two wires that carry its 4 to 20 mA signal. What is this called?","opts":["Loop powered","Battery powered","Wireless","Fluid powered"],"why":"Loop powered sensors take their power from the 4 to 20 mA loop.","a":85,"t":{"k":"term","acc":["loop powered","loop power","loop powered sensor"]},"p":4},{"id":"H13","q":"Which actuator uses oil under pressure?","opts":["Hydraulic cylinder","Pneumatic cylinder","Solenoid","Stepper motor"],"why":"Hydraulic actuators use oil under pressure; pneumatic ones use compressed air (criterion 9.3).","fb":{"Pneumatic cylinder":"Pneumatic uses compressed air."},"a":85,"t":{"k":"short","acc":["hydraulic cylinder","hydraulic","hydraulic actuator","hydraulic ram","hydraulic piston"]},"p":4},{"id":"H14","q":"Detect a person walking up to an automatic door without sending anything out. Which sensor?","opts":["PIR motion sensor","Ultrasonic sensor","Laser distance sensor","Inductive proximity sensor"],"why":"A PIR sensor is passive: it picks up the heat a person gives off.","fb":{"Ultrasonic sensor":"Ultrasonic would work, but it sends sound out, so it is active.","Inductive proximity sensor":"Inductive only detects metal, at a few millimetres."},"a":75,"p":4},{"id":"H15","q":"A thermostat needs the exact temperature. Which kind of output does its sensor need?","opts":["Analogue","Digital","Wireless","Passive"],"why":"An exact temperature needs a continuous (analogue) output. Digital gives only on or off.","fb":{"Digital":"Digital is on or off. Good for a door alarm, not for an exact reading."},"a":74,"t":{"k":"short","acc":["analogue","analog","analogue output","continuous","an analogue output"]},"p":4},{"id":"H16","q":"A door alarm needs to know only whether a door is open or shut. Which kind of sensor?","opts":["Digital","Analogue","Laser","Load cell"],"why":"Open or shut has only two states, so a digital sensor (a door switch) is enough.","a":74,"p":4},{"id":"H17","q":"A sensor must work on clear glass bottles. Which proximity sensor is least likely to miss them?","opts":["Ultrasonic","Photoelectric beam","Inductive","PIR"],"why":"Ultrasonic sensors time a sound echo, so they work on clear objects that a light beam can pass through.","fb":{"Photoelectric beam":"A clear bottle can let the light through, so the beam may not be broken.","Inductive":"Glass is not metal."},"a":79,"p":4}],"sequences":[{"id":"Q1","title":"Follow one bottle down the line","a":97,"steps":["Fill: a level sensor watches, a solenoid valve opens and closes","Cap: a proximity sensor sees the bottle, a cylinder presses the cap on","Inspect: a vision system checks the label and the fill","Reject: a pneumatic pusher removes faulty bottles","Pack: a beam sensor counts, a robot arm packs the case"],"why":"Fill, cap, inspect, reject, pack. A PLC or microcontroller reads every sensor and drives every actuator."},{"id":"Q2","title":"Counting twelve bottles into a case","a":93,"steps":["A bottle breaks the light beam","The sensor sends a pulse","The controller adds one to the count","At 12 the controller stops the conveyor motor","A pusher moves the full case on"],"why":"Beam broken, pulse, count, stop at 12, move the case on."},{"id":"Q3","title":"Lifting a heavy part to a shelf","a":94,"steps":["Sensor S1 detects a part on the platform","The controller starts the motor","Gears and a drum wind the rope and lift the platform","Sensor S2 detects the platform at shelf height","The controller stops the motor","A pusher moves the part onto the shelf"],"why":"S1 starts it, S2 stops it. The motor works through gears and a drum."},{"id":"Q4","title":"An automatic door opening","a":9,"steps":["The sensor detects a person","The microcontroller decides to open","The motor starts turning","Gears, belt and pulleys move the door","A limit switch says the door is fully open","The controller stops the motor"],"why":"Input, process, output, mechanism, then feedback from the limit switch."},{"id":"Q5","title":"A vision system checking a label","a":83,"steps":["The camera and light capture an image","The software compares it with the standard","The system decides pass or fail","A pusher removes the reject"],"why":"Capture, compare, decide, act."},{"id":"Q6","title":"A laser sensor measuring a box","a":81,"steps":["The sensor sends a laser beam down","The beam reflects off the top of the box","The sensor works out the distance to the top","It compares this with the distance to the belt","Box height = distance to belt − distance to top"],"why":"Send, reflect, measure, compare, subtract."},{"id":"Q7","title":"A servo moving to an angle","a":61,"steps":["The controller sends a pulse of a set width","The motor and gears turn","The output shaft moves","The position sensor measures the angle","Feedback corrects any error"],"why":"That loop back through the position sensor is what makes a servo closed loop."}],"last":{"1":[{"id":"L101","k":"gap","q":"___ is the integration of mechanical and electronic systems to produce a functioning system.","acc":["mechatronics","mechatronic","mechatronic engineering"],"p":1,"a":7,"why":"Mechatronics: mechanical and electronic systems integrated to make a functioning system."},{"id":"L102","k":"gap","q":"Gear ratio = teeth on the ___ gear ÷ teeth on the driver gear.","acc":["driven","output","driven gear"],"p":1,"a":13,"why":"Driven ÷ driver, written as a ratio such as 3:1."},{"id":"L103","k":"explain","q":"What does an idler gear change, and what does it leave alone?","ideas":[["It changes the direction",["direction","same way","way it turns","rotation","reverse","clockwise","same direction"]],["It does not change the ratio",["same ratio","not change the ratio","doesnt change the ratio","ratio stays","ratio is the same","ratio does not change","ratio doesnt change","ratio unchanged","not the ratio","no effect on the ratio","same speed","not change the speed","doesnt change the speed","leaves the ratio","leave the ratio"]]],"need":2,"model":"It changes the direction of rotation, so the driven gear turns the same way as the driver. It does not change the gear ratio.","p":1,"a":15},{"id":"L104","k":"num","q":"In the worked example, a 20-tooth driver at 1200 rpm drove a 60-tooth gear. What was the output speed?","v":400,"unit":"rpm","tol":0.01,"p":1,"a":14,"why":"Ratio = 60 ÷ 20 = 3:1, so output = 1200 ÷ 3 = 400 rpm."},{"id":"L105","k":"explain","q":"What is the function of a cam?","ideas":[["Takes in rotary motion",["rotary","rotation","rotating","turning","spinning","round","rotational"]],["Gives reciprocating or linear motion",["reciprocat","linear","up and down","back and forth","straight line","in and out"]]],"need":2,"model":"A cam turns rotary motion into reciprocating or linear motion of a follower.","p":1,"a":19},{"id":"L106","k":"short","q":"Which class of lever is a wheelbarrow?","acc":["class 2","2","class two","second class","2nd class","second","class ii"],"p":1,"a":27,"why":"The load sits in the middle, between the wheel (fulcrum) and your hands (effort): class 2.","rivals":["class 1","class 3","first class","third class","class one","class three"]},{"id":"L107","k":"explain","q":"A pulley system lifts 600 N with 200 N of effort. A learner wrote 'MA = 3 N'. What is wrong?","ideas":[["MA has no units",["no unit","no units","unitless","without units","without a unit","shouldnt have","should not have","not have a unit","dimensionless","just 3","ratio","remove the n","no n","not newtons","isnt in newtons","is not in newtons"]]],"need":1,"model":"MA is a ratio of two forces, so the newtons cancel and it has no units. MA = 3.","p":1,"a":33},{"id":"L108","k":"num","q":"In the block and tackle example, a 900 N load needed 250 N of effort. What was the mechanical advantage?","v":3.6,"unit":"","tol":0.01,"p":1,"a":30,"why":"MA = load ÷ effort = 900 ÷ 250 = 3.6, with no units."}],"2":[{"id":"L201","k":"explain","q":"Define a sensor.","ideas":[["Detects a change in the environment",["detect","sense","senses","change","measure","environment","surroundings"]],["Turns it into an electrical signal",["electrical","signal","electric","voltage"]]],"need":2,"model":"A sensor detects a change in the environment and turns it into an electrical signal. It is an input device.","p":2,"a":40},{"id":"L202","k":"short","q":"Is an LDR's resistance high or low in bright light?","acc":["low","it is low","low resistance","lower","falls","decreases","goes down","very low"],"p":2,"a":41,"why":"Bright light, low resistance. More input, less resistance.","rivals":["high"]},{"id":"L203","k":"explain","q":"Define a transducer.","ideas":[["Converts or changes",["convert","change","changes","turns","transform"]],["One form of energy into another",["energy","form","another","one type"]]],"need":2,"model":"A transducer converts one form of energy into another. It can be an input or an output.","p":2,"a":42},{"id":"L204","k":"short","q":"What motion does a solenoid produce?","acc":["push or pull","push","pull","linear","linear motion","push pull","straight line","in and out","back and forth","push and pull","pushing or pulling","pulling"],"p":2,"a":44,"why":"A push or pull (linear) motion. The coil pulls the plunger in; a spring pushes it back.","rivals":["rotary","rotation","continuous","spins"]},{"id":"L205","k":"explain","q":"Give one difference between a microprocessor and a microcontroller.","ideas":[["A real difference: what is on the chip, extra chips, size, cost or power",["same chip","one chip","on the chip","single chip","separate","built in","memory","ports","inputs and outputs","cheap","cost","smaller","size","power","extra chips"]]],"need":1,"model":"A microcontroller has its memory and inputs and outputs on the same chip; a microprocessor needs them as separate chips. A microcontroller is also smaller, cheaper and uses less power.","p":2,"a":50},{"id":"L206","k":"explain","q":"What does 'in-circuit programmable' mean?","ideas":[["It can be reprogrammed",["reprogram","program","programmed","programmable","change the program","update","change the code","code"]],["Without taking it out of the circuit",["without","not removing","still in","in the circuit","left in","stays in","out of the circuit","in place","removing"]]],"need":2,"model":"The chip can be reprogrammed without taking it out of the circuit.","p":2,"a":51},{"id":"L207","k":"term","q":"What does PIC stand for?","acc":["peripheral interface controller","peripheral interface controllers","peripheral interface control"],"p":2,"a":51,"why":"Peripheral interface controller."},{"id":"L208","k":"explain","q":"A lamp is an output transducer. Why do we not usually call it an actuator?","ideas":[["Its job is light",["light","glow","shine"]],["Actuators make movement",["movement","move","motion","moving","physical"]]],"need":2,"model":"Its job is light, not movement. Actuators turn a signal into physical movement.","p":2,"a":43}],"3":[{"id":"L301","k":"explain","q":"How do you reverse the direction of a DC motor?","ideas":[["Reverse or swap",["reverse","swap","switch round","switch over","change round","opposite","flip","other way","change the direction"]],["The current or the supply connections",["current","polarity","supply","connection","wires","terminals","positive","negative","battery","leads"]]],"need":2,"model":"Reverse the direction of the current, by swapping the supply connections.","p":3,"a":60},{"id":"L302","k":"short","q":"What sets the angle a servo motor turns to?","acc":["pulse width","the width of the control pulses","width of the pulse","width of the pulses","pulse length","length of the pulse","pulse duration","the pulse width","width of the control pulse","pulse widths"],"p":3,"a":61,"why":"The width of the control pulses: 1 ms gives 0°, 1.5 ms gives 90° and 2 ms gives 180°.","rivals":["number of pulses","voltage","current","number of steps"]},{"id":"L303","k":"explain","q":"A 3D printer has no sensor on its print head. How does it know where the head is?","ideas":[["The controller counts the pulses",["count","counts","counting","pulses","pulse"]],["Each pulse moves one equal step",["one step","each pulse","per pulse","every pulse","step","steps","stepper"]]],"need":1,"model":"It uses a stepper motor. Each pulse moves the shaft one equal step, so the controller knows the position by counting pulses (open loop).","p":3,"a":63},{"id":"L304","k":"num","q":"A stepper takes 1.8° per step. How many steps make one full turn?","v":200,"unit":"steps","tol":0.01,"p":3,"a":64,"why":"360° ÷ 1.8° = 200 steps."},{"id":"L305","k":"short","q":"Which drive device uses feedback to hold its position?","acc":["servo","servo motor","servomotor","a servo","a servo motor","servos"],"p":3,"a":70,"why":"The servo motor: a built-in position sensor feeds back (closed loop).","rivals":["stepper","stepper motor","standard motor","dc motor"]},{"id":"L306","k":"num","q":"In the worked example, how many pulses turned the 1.8° stepper through 90°?","v":50,"unit":"pulses","tol":0.01,"p":3,"a":64,"why":"90° ÷ 1.8° = 50 pulses."},{"id":"L307","k":"short","q":"Give one use of a stepper motor.","acc":["3d printer","3d printers","cnc","cnc machine","printer","camera","moving camera","security camera","cnc axis","plotter","disc drive","disk drive","3d printing","printers","scanner"],"p":3,"a":70,"why":"3D printers, CNC machine axes, moving cameras and printers all use steppers.","rivals":["conveyor","fan","pump"]}],"4":[{"id":"L401","k":"explain","q":"What kind of output does an analogue sensor give?","ideas":[["A continuous output that follows the quantity",["continuous","varies","any value","range","smooth","follows","variable","changing"]]],"need":1,"model":"A continuous output that varies with the quantity measured.","p":4,"a":74},{"id":"L402","k":"explain","q":"What does an active sensor do that a passive sensor does not?","ideas":[["Sends a signal out",["send","emit","transmit","gives out","puts out","fires","outputs"]],["Measures what comes back",["back","return","echo","reflect","response","bounce"]]],"need":1,"model":"It sends a signal into the environment and measures the response.","p":4,"a":75},{"id":"L403","k":"short","q":"What can an inductive proximity sensor detect?","acc":["metal","metals","metal objects","metallic objects","steel","iron","metal only","only metal","metallic","ferrous me nd sensor (S2)",["s2","second sensor","sensor 2","another sensor","top sensor","upper sensor","sensor at the top","limit switch at the top"]],["It detects the platform at shelf height",["height","shelf","reached","top","level with"]]],"need":2,"model":"A second sensor (S2) detects that the platform has reached shelf height, and the controller stops the motor.","p":5,"a":94},{"id":"L503","k":"short","q":"Name a sensor for a chemical measurement.","acc":["ph probe","ph sensor","ph","gas sensor","gas detector","ph meter","gas","ph electrode"],"p":5,"a":95,"why":"A pH probe (water treatment) or a gas sensor.","rivals":["thermocouple","load cell","thermistor","ldr"]},{"id":"L504","k":"num","q":"A 0 to 10 V sensor covers 0 to 100 °C. It reads 3.2 V. What is the temperature?","v":32,"unit":"°C","tol":0.01,"p":5,"a":102,"why":"3.2 ÷ 10 = 0.32 of the range, and 0.32 × 100 = 32 °C."},{"id":"L505","k":"short","q":"Which actuator pushes a faulty bottle off the line?","acc":["pneumatic cylinder","pneumatic pusher","pneumatic ram","cylinder","pusher","pneumatic actuator","pneumatic piston","pneumatic","air cylinder","ram"],"p":5,"a":97,"why":"A pneumatic cylinder (pusher), worked by a solenoid valve.","rivals":["stepper","servo","solenoid valve","robot arm"]},{"id":"L506","k":"num","q":"In the stretch example, a 4 to 20 mA sensor covers 0 to 200 bar and reads 16 mA. What is the pressure?","v":150,"unit":"bar","tol":0.01,"p":5,"a":96,"why":"(16 − 4) ÷ 16 = 0.75, and 0.75 × 200 = 150 bar."},{"id":"L507","k":"gap","q":"The 4 mA at the bottom of a 4 to 20 mA signal is called the live ___.","acc":["zero","live zero","0"],"p":5,"a":101,"why":"The live zero. A broken wire gives 0 mA, so it shows up as a fault."}]},"dump":{"1":{"topic":"Mechatronics and mechanical components","slides":"6 to 36","ideas":[["Mechatronics joins mechanical and electronic systems",["mechatronic","electronic"]],["Four kinds of motion: rotary, linear, reciprocating, oscillating",["rotary","linear","reciprocat"," al signal into movement",["drive device","movement","signal"]],["Standard motor: continuous rotation",["standard","continuous","dc motor"]],["Speed set by the voltage; reverse the current to reverse it",["voltage","reverse","current"]],["Servo: angle set by the width of the control pulse",["servo","pulse width","width"]],["Servo has a position sensor: closed loop feedback",["feedback","closed loop","position sensor"]],["Stepper: equal steps, one per pulse",["stepper","step","pulse"]],["Stepper position known by counting pulses: open loop",["open loop","count"]],["Steps per turn = 360° ÷ step angle",["360","step angle"]],["Choose against precision, torque and cost",["precision","torque","cost","cheap"]],["Uses: conveyors, robot arms, 3D printers, CNC",["conveyor","robot","3d printer","cnc"]]]},"4":{"topic":"Types and applications of sensors and actuators","slides":"71 to 89","ideas":[["Analogue: continuous output; digital: high or low only",["analogue","digital","continuous"]],["Active sensors send a signal out; passive ones only monitor",["active","passive"]],["Actuators can be analogue, digital, active or passive",["actuator","bimetallic","proportional"]],["Switches: limit, micro, guard interlock, emergency stop",["limit switch","interlock","microswitch","emergency"]],["Proximity: inductive (metal), capacitive (any), photoelectric, ultrasonic",["inductive","capacitive","photoelectric","ultrasonic","proximity"]],["Laser sensor: height = distance to belt − distance measured",["laser"]],["Vision system: camera, lighting and software",["vision","camera"]],["Power: 24 V DC from the mains, batteries, adapters, fluid power",["24","mains","batter","adapter","power"]],["Hard-wired: reliable, power in the same cable",["hard wired","hardwired","cable"]],["Wireless: quick to fit, but batteries, walls and security",["wireless","wi fi","wifi","bluetooth"]]]},"5":{"topic":"Sensors and actuators in automation","slides":"90 to 102","ideas":[["Automation: technology reducing human involvement",["automation","human","technolog"]],["Why automate: quality, speed, safety, data",["quality","faster","safe","data","consistent"]],["Position and volume: a beam sensor counts and checks position",["count","position","volume","beam"]],["Lifting: S1 starts the motor, S2 stops it at height",["lift","s1","s2","platform"]],["Eight kinds of measurement, such as thermal and chemical",["measurement","thermal","chemical","electrical","optical","acoustic","biological","radiation","mechanical"]],["Load cell, thermocouple and pH probe as examples",["load cell","thermocouple","ph"]],["Analogue scaling: fraction of the signal range × the quantity range",["scal","fraction","range","0 to 10"]],["4 to 20 mA: take off the 4 mA live zero, span 16 mA",["4 to 20","live zero","20 ma","16"]],["The bottle line: fill, cap, inspect, reject, pack",["fill","cap","inspect","reject","pack"]],["A PLC or microcontroller reads every sensor and drives every actuator",["plc","programmable logic"]]]}},"boss":{"1":[{"id":"B101","k":"num","q":"A 12-tooth driver turns at 900 rpm and drives a 36-tooth gear. What is the output speed?","v":300,"unit":"rpm","tol":0.01,"p":1,"a":null,"why":"Ratio = 36 ÷ 12 = 3:1, so the output = 900 ÷ 3 = 300 rpm."},{"id":"B102","k":"ratio","q":"A 10-tooth driver drives a 50-tooth gear. Write the gear ratio.","v":5,"tol":0.01,"p":1,"a":null,"why":"50 ÷ 10 = 5, so 5:1."},{"id":"B103","k":"explain","q":"Explain why a cordless drill has a gearbox between the motor and the chuck.","ideas":[["It reduces the speed",["slow","reduce","lower speed","less speed","speed down","decrease"]],["It increases the torque",["torque","turning force","force","stronger","harder"]]],"need":2,"model":"The motor spins too fast with too little torque. The gearbox slows the chuck down and increases the torque, so the drill can turn a big bit or screw.","p":1,"a":13},{"id":"B104","k":"gap","q":"A cam turns ___ motion into reciprocating or linear motion.","acc":["rotary","rotating","rotational","rotation","turning","circular"],"p":1,"a":19,"why":"Rotary in, reciprocating or linear out."},{"id":"B105","k":"num","q":"A class 2 lever has a 500 N load 0.3 m from the fulcrum and the effort 1.5 m away. What effort is needed?","v":100,"unit":"N","tol":0.01,"p":1,"a":null,"why":"Effort × 1.5 = 500 × 0.3 = 150 N m, so effort = 150 ÷ 1.5 = 100 N."},{"id":"B106","k":"explain","q":"Three gears sit in a line and the driver turns clockwise. Which way does the last gear turn, and why?","ideas":[["Clockwise",["clockwise","same way","same direction"]],["The middle gear is an idler, so the direction reverses twice",["idler","twice","middle gear","two meshes","each mesh","reverses twice","reversed twice"]]],"need":2,"model":"Clockwise. The middle gear is an idler: each mesh reverses the direction, and two reversals bring it back to clockwise.","p":1,"a":17},{"id":"B107","k":"term","q":"A gear between the driver and the driven gear that changes the direction but not the ratio.","acc":["idler","idler gear","idle gear","idler wheel"],"p":1,"a":15,"why":"An idler gear.","rivals":["compound","driver","driven"]}],"2":[{"id":"B201","k":"explain","q":"Explain the difference between a sensor and an actuator.","ideas":[["A sensor is an input: it detects a change and gives a signal",["input","detect","sense","measure"]],["An actuator is an output: it turns a signal into movement",["output","movement","move","motion","physical"]]],"need":2,"model":"A sensor is an input device: it detects a change in the environment and turns it into an electrical signal. An actuator is an output device: it turns a signal into physical movement.","p":2,"a":43},{"id":"B202","k":"term","q":"Converts one form of energy into another. Can be an input or an output.","acc":["transducer","transducers"],"p":2,"a":42,"why":"A transducer.","rivals":["sensor","actuator"]},{"id":"B203","k":"explain","q":"Explain why a microcontroller, not a microprocessor, is used in a washing machine.","ideas":[["Everything is on one chip: memory, inputs and outputs",["one chip","single chip","same chip","on the chip","built in","memory","inputs","outputs","ports"]],["It is small, cheap and uses little power",["cheap","cost","small","power","less powerful","simple"]]],"need":2,"model":"A microcontroller has the CPU, memory, inputs and outputs and an ADC on one chip, so it is small, cheap and low power. A washing machine does not need a microprocessor's power or its extra chips.","p":2,"a":49},{"id":"B204","k":"short","q":"Which block on a microcontroller lets it read an analogue sensor directly?","acc":["analogue to digital converter","adc","analog to digital converter","a to d converter","a d converter","analogue to digital","a to d"],"p":2,"a":49,"why":"The analogue to digital converter (ADC).","rivals":["timer","timers","counter","counters","cpu","memory"]},{"id":"B205","k":"explain","q":"How does a solenoid make a push or pull?","ideas":[["Current in the coil makes a magnetic field",["current","coil","magnet","electromagnet"]],["It pulls the iron plunger in; a spring pushes it back",["plunger","iron","spring","pull","core","rod"]]],"need":2,"model":"When current flows the coil becomes a magnet and pulls the iron plunger in. When the current stops, a spring pushes it back out.","p":2,"a":44},{"id":"B206","k":"short","q":"An LDR is moved into the dark. What happens to its resistance?","acc":["rises","increases","goes up","higher","high","it rises","it increases","it goes up","gets higher","increase","rise","more"],"p":2,"a":41,"why":"Less light, more resistance. An LDR's resistance falls as the light gets brighter.","rivals":["falls","decreases","goes down","lower","low","drops"]},{"id":"B207","k":"term","q":"Can be reprogrammed without taking the chip out of the circuit.","acc":["in circuit programmable","in circuit programming","icsp","in circuit"],"p":2,"a":51,"why":"In-circuit programmable.","rivals":["microprocessor"]}],"3":[{"id":"B301","k":"num","q":"A stepper has a step angle of 7.5°. How many steps make one full turn?","v":48,"unit":"steps","tol":0.01,"p":3,"a":65,"why":"360 ÷ 7.5 = 48 steps."},{"id":"B302","k":"num","q":"That 7.5° stepper gets 96 pulses per second. What is its speed in rpm?","v":120,"unit":"rpm","tol":0.01,"p":3,"a":65,"why":"96 ÷ 48 = 2 rev/s, and 2 × 60 = 120 rpm."},{"id":"B303","k":"explain","q":"Explain why a servo motor is called closed loop.","ideas":[["A position sensor measures the output",["sensor","measure","position","potentiometer","angle"]],["It is fed back so the servo corrects itself",["feedback","fed back","feed back","correct","compare","adjust","loop"]]],"need":2,"model":"A position sensor measures the output angle and feeds it back to the controller, which corrects any error. The output is measured and fed back.","p":3,"a":61},{"id":"B304","k":"num","q":"A servo gives 0° at a 1 ms pulse and 180° at a 2 ms pulse. What angle does a 1.5 ms pulse give?","v":90,"unit":"°","tol":0.01,"p":3,"a":61,"why":"1.5 ms is halfway from 1 ms to 2 ms, so halfway round: 90°."},{"id":"B305","k":"explain","q":"A stepper is open loop. What does that mean, and what is the risk?","ideas":[["No feedback sensor: the position comes from counting pulses",["no feedback","no sensor","count","pulses","without feedback","without a sensor","not measured"]],["If it misses a step, nothing notices",["miss","skip","slip","lose","lost","wrong position","overload","not know","doesnt know","does not know","wont know","error"]]],"need":2,"model":"There is no feedback sensor; the controller assumes each pulse moved one step. If a heavy load makes it miss a step, nothing notices and the position is wrong.","p":3,"a":63},{"id":"B306","k":"explain","q":"How do you make a standard DC motor turn faster?","ideas":[["Increase the supply voltage",["increase the voltage","increase the supply","increasing the voltage","raise the voltage","raising the voltage","higher voltage","more voltage","more volts","bigger voltage","turn up the voltage","up the voltage"]]],"need":1,"model":"Increase the supply voltage. More voltage, faster.","p":3,"a":60},{"id":"B307","k":"term","q":"The angle a stepper shaft turns for one pulse.","acc":["step angle","angle per step","stepping angle"],"p":3,"a":64,"why":"The step angle."}],"4":[{"id":"B401","k":"explain","q":"Explain the difference between an active and a passive sensor, with an example of each.","ideas":[["Active: sends a signal out and measures what comes back",["send","emit","transmit","gives out","echo","comes back","reflect"]],["Passive: only monitors, sending nothing out",["only monitor","monitors","nothing out","doesnt send","does not send","receive","just measures","only measures","only detect","listens"]],["A correct example of each, such as ultrasonic and LDR",["ultrasonic","laser","infrared","radar","sonar","inductive","ldr","thermistor","pir","temperature","microphone","thermocouple"]]],"need":3,"model":"An active sensor sends a signal into the environment and measures the response, for example an ultrasonic or laser sensor. A passive sensor only monitors changes and sends nothing out, for example an LDR, a thermistor or a PIR sensor.","p":4,"a":75},{"id":"B402","k":"short","q":"Which proximity sensor detects any material, even through a tank wall?","acc":["capacitive","capacitive proximity sensor","capacitive sensor","capacitive proximity"],"p":4,"a":79,"why":"Capacitive.","rivals":["inductive","photoelectric","ultrasonic"]},{"id":"B403","k":"num","q":"A laser sensor is 650 mm above the belt and measures 410 mm to the top of a box. How tall is the box?","v":240,"unit":"mm","tol":0.01,"p":4,"a":null,"why":"650 − 410 = 240 mm."},{"id":"B404","k":"explain","q":"Give one advantage and one disadvantage of a wireless sensor connection.","ideas":[["Advantage: quick to install, easy to move, reaches moving equipment",["quick","easy","move","moving","remote","no cable","no wires","no cables","flexible","install","anywhere"]],["Disadvantage: batteries, interference, walls, hacking or slower",["batter","interference","wall","block","hack","security","slower","signal","range","drop"]]],"need":2,"model":"Advantage: quick to install, easy to move, reaches moving or remote equipment. Disadvantage: batteries to look after, walls and interference can block the signal, it needs security against hacking and can be slower.","p":4,"a":86},{"id":"B405","k":"short","q":"Is a limit switch analogue or digital?","acc":["digital","it is digital","digital sensor","digital output"],"p":4,"a":78,"why":"Digital: its contacts are open or closed, on or off.","rivals":["analogue","analog"]},{"id":"B406","k":"explain","q":"Why would a vision system check labels rather than a person?","ideas":[["It checks every item, fast, around the clock",["every","all the","fast","quick","speed","around the clock","24","tire","nonstop","non stop"]],["It is consistent and accurate, and records data",["consistent","accura","reliable","data","record","mistake","error","same standard","standard"]]],"need":2,"model":"It checks every bottle at line speed, around the clock, to the same standard every time, and records the data. A person tires and misses faults.","p":4,"a":83},{"id":"B407","k":"term","q":"Senses metal objects without contact, using a magnetic field.","acc":["inductive proximity sensor","inductive sensor","inductive","inductive proximity"],"p":4,"a":79,"why":"An inductive proximity sensor."}],"5":[{"id":"B501","k":"num","q":"A 4 to 20 mA sensor covers 0 to 100 °C. It reads 12 mA. What is the temperature?","v":50,"unit":"°C","tol":0.01,"p":5,"a":null,"why":"(12 − 4) ÷ 16 = 0.5, and 0.5 × 100 = 50 °C."},{"id":"B502","k":"explain","q":"Explain why a 4 to 20 mA signal starts at 4 mA, not 0 mA.","ideas":[["A broken wire gives 0 mA",["broken","break","fault","0 ma","zero","wire","cable","cut","snapped","no current"]],["So a fault can be told apart from the lowest real reading",["tell","difference","apart","distinguish","shows up","detect","know","lowest","minimum","bottom","live zero","spot"]]],"need":2,"model":"The 4 mA is a live zero. A broken wire gives 0 mA, which is outside the range, so the controller can tell a fault apart from a real lowest reading.","p":5,"a":101},{"id":"B503","k":"explain","q":"Give three reasons companies automate.","ideas":[["Consistent quality",["quality","consistent","accura"]],["Faster, or works around the clock",["fast","speed","quick","around the clock","24","nonstop","non stop","all day","productiv"]],["Safer: people kept away from hazards",["safe","hazard","danger","injur"]],["Every item checked, with data recorded",["data","record","every item","checked","check"]]],"need":3,"model":"Consistent quality; faster, working around the clock; safer, keeping people away from hazards; every item checked with data recorded.","p":5,"a":92},{"id":"B504","k":"short","q":"Which sensor measures the temperature in a heat treatment furnace?","acc":["thermocouple","thermo couple","thermocouples"],"p":5,"a":95,"why":"A thermocouple: a thermal measurement.","rivals":["thermistor","ldr","load cell"]},{"id":"B505","k":"explain","q":"On the bottle line, what senses and what acts at the reject station?","ideas":[["It uses the vision system's result",["vision","camera","inspect","result"]],["A pneumatic pusher removes the faulty bottle",["pneumatic","pusher","cylinder","push","remove","ram"]]],"need":2,"model":"It uses the result from the vision system; a pneumatic pusher removes the faulty bottle.","p":5,"a":97},{"id":"B506","k":"num","q":"A 0 to 10 V sensor covers 0 to 500 mm. It reads 4 V. What distance is that?","v":200,"unit":"mm","tol":0.01,"p":5,"a":null,"why":"4 ÷ 10 = 0.4, and 0.4 × 500 = 200 mm."},{"id":"B507","k":"term","q":"Using technology to reduce the need for human involvement in a process.","acc":["automation","automated","automating"],"p":5,"a":92,"why":"Automation."}]},"taboo":[{"id":"TB01","term":"Mechatronics","ban":["mechanical","electronic","system"],"p":1,"a":7,"ideas":[["Machines with moving parts",["move","moving","motion","movement","parts","machine"]],["Joined with sensing, control or computing",["control","computer","chip","sense","sensor","decide","program","electric"]]],"model":"Machines where moving parts are combined with electrical control, so they can sense, decide and move, like a robot arm."},{"id":"TB02","term":"Gear ratio","ban":["teeth","driven","driver"],"p":1,"a":13,"ideas":[["Compares the sizes of the input and output gears",["size","bigger","smaller","compare","divide","input","output","number"]],["Tells you how much the speed changes",["speed","faster","slower","times","rpm","turns"]]],"model":"It compares the output gear with the input gear, and tells you how many times slower (or faster) the output turns."},{"id":"TB03","term":"Idler gear","ban":["direction","ratio","middle"],"p":1,"a":15,"ideas":[["Sits between two other gears",["between","in line","third","extra","another gear"]],["Makes the output turn the same way as the input",["same way","same","way round","clockwise","rotation"]],["The speed change stays the same",["same speed","not change the speed","doesnt change the speed","no effect","speed stays","without changing"]]],"model":"An extra gear between two others. It makes the last gear spin the same way as the first, without changing the speed."},{"id":"TB04","term":"Cam","ban":["rotary","follower","reciprocating"],"p":1,"a":19,"ideas":[["A shaped part that turns",["shape","turn","spin","wheel","rotat","egg","pear"]],["Makes something move up and down",["up and down","back and forth","push","lift","rise","straight line","linear"]]],"model":"A specially shaped piece that spins round and pushes a rod up and down as it turns."},{"id":"TB05","term":"Fulcrum","ban":["pivot","lever","turn"],"p":1,"a":25,"ideas":[["The fixed point",["point","fixed","hinge","balance","centre","middle"]],["Everything swings about it",["rotat","swing","about","around","seesaw"]]],"model":"The fixed point a bar swings about, like the middle of a seesaw."},{"id":"TB06","term":"Mechanical advantage","ban":["load","effort","ratio"],"p":1,"a":25,"ideas":[["How many times a machine multiplies your force",["force","multipl","times","easier","help"]],["Output force divided by input force, no units",["divide","unit","output","input","weight"]]],"model":"How many times a machine multiplies your force: the force you get out divided by the force you put in. It has no units."},{"id":"TB07","term":"Sensor","ban":["input","detect","signal"],"p":2,"a":40,"ideas":[["Notices a change around it",["change","notice","sense","measure","temperature","light","environment","surroundings"]],["Tells the controller electrically",["electric","voltage","controller","current","tell","send"]]],"model":"A device that notices a change around it, like light or heat, and tells the controller about it electrically."},{"id":"TB08","term":"Actuator","ban":["movement","output","motor"],"p":2,"a":44,"ideas":[["Makes something move",["move","motion","push","pull","turn","rotat","lift","open"]],["When it gets an electrical or control signal",["electric","signal","current","control","told","command"]]],"model":"A device that pushes, pulls or turns something when the controller sends it an electrical signal, like a solenoid in a door lock."},{"id":"TB09","term":"Microcontroller","ban":["chip","computer","program"],"p":2,"a":49,"ideas":[["Memory, inputs and outputs built in with the processor",["memory","inputs","outputs","ports","built in","everything","cpu"]],["Controls a product such as a washing machine",["control","washing","toy","decide","read","sensor","product"]]],"model":"A tiny brain with its own memory and connections built in, that reads sensors and controls a product like a washing machine."},{"id":"TB10","term":"Servo motor","ban":["angle","feedback","precise"],"p":3,"a":61,"ideas":[["Turns to a set position and stays there",["position","stay","hold","stop","degree","set"]],["Checks itself with a sensor",["sensor","check","measure","correct","potentiometer","loop"]],["The pulse width tells it where to go",["pulse","width","signal"]]],"model":"A motor that turns to a set number of degrees and stays there, checking itself with a built-in sensor. The width of the pulse tells it where to go."},{"id":"TB11","term":"Stepper motor","ban":["step","steps","pulse"],"p":3,"a":63,"ideas":[["Moves in small, equal jumps",["jump","bits","small","equal","increment","tick","click","fixed amount","amount"]],["The controller counts to know where it is",["count","knows","position","no sensor","printer"]]],"model":"A motor that moves in small, equal jumps. The controller counts the jumps, so it knows where the shaft is without a sensor, as in a 3D printer."},{"id":"TB12","term":"Active sensor","ban":["send","signal","echo"],"p":4,"a":75,"ideas":[["Gives out something, like sound or light",["sound","light","laser","ultrasonic","emit","beam","wave","fire","puts out","gives out","transmit"]],["Listens for what comes back",["return","comes back","bounce","reflect","listen","receive"]]],"model":"A sensor that fires out sound or light and listens for what bounces back, like a bat."},{"id":"TB13","term":"Inductive proximity sensor","ban":["metal","magnetic","proximity"],"p":4,"a":79,"ideas":[["Spots steel or iron objects close by",["steel","iron","close","near","cans","aluminium","conductive"]],["Without touching, at very short range",["touch","contact","short","millimetre","mm","range"]]],"model":"It spots steel or iron objects a few millimetres away without touching them. Plastic and cardboard go straight past."},{"id":"TB14","term":"Vision system","ban":["camera","image","picture"],"p":4,"a":83,"ideas":[["Looks at every item and compares it with a standard",["look","compare","check","inspect","standard","see"]],["Software decides pass or fail",["software","pass","fail","reject","decide","computer","light"]]],"model":"It looks at every item under good lighting, and software compares what it sees with a standard to pass or fail it."},{"id":"TB15","term":"Automation","ban":["human","technology","automatic"],"p":5,"a":92,"ideas":[["Machines doing jobs people used to do",["machine","robot","people","worker","person","job","manual"]],["Faster, safer and more consistent",["fast","safe","consistent","quality","less","reduce"]]],"model":"Using machines and robots to do jobs that people used to do, so the work is faster, safer and more consistent."},{"id":"TB16","term":"Live zero","ban":["4 mA","zero","broken"],"p":5,"a":101,"ideas":[["The lowest reading is above nothing",["four","lowest","bottom","minimum","start","above","not nothing","4"]],["So a cut wire shows up as a fault",["wire","cut","fault","nothing","no current","snapped","damaged","0"]]],"model":"The bottom of the signal range is set a little above nothing, so if a wire is cut and the current drops right off, the controller knows it is a fault."}],"why":[{"id":"Y01","q":"A small gear drives a large gear. What happens to the output?","a":13,"steps":[{"label":"Pick the answer","correct":"It turns slower, with more torque","wrongs":["It turns faster, with more torque","It turns slower, with less torque","Its speed and torque do not change"]},{"label":"Pick the reason","correct":"The large gear turns once for several turns of the small one, and the turning force goes up as the speed comes down","wrongs":["Bigger gears always make more power","The two gears turn the same way","Friction slows the large gear down"]}]},{"id":"Y02","q":"An idler is added between a 20-tooth driver and a 40-tooth driven gear. What is the gear ratio now?","a":15,"steps":[{"label":"Pick the answer","correct":"Still 2:1","wrongs":["3.75:1","1:2","4:1"]},{"label":"Pick the reason","correct":"Only the driver and driven teeth count; the idler's teeth cancel out","wrongs":["The idler turns the opposite way to the driver","The idler is bigger than the driver","An idler always halves the ratio"]}]},{"id":"Y03","q":"A robot arm picks up parts of different weights and must stop at the same angle each time. Which motor?","a":68,"steps":[{"label":"Pick the answer","correct":"Servo motor","wrongs":["Stepper motor","Standard motor","Solar motor"]},{"label":"Pick the reason","correct":"Its position sensor feeds back, so it corrects itself when the load changes","wrongs":["It turns in equal steps, one per pulse","It gives continuous rotation cheaply","It runs straight from a solar panel"]}]},{"id":"Y04","q":"A 3D printer head has no position sensor. Which motor moves it?","a":63,"steps":[{"label":"Pick the answer","correct":"Stepper motor","wrongs":["Servo motor","Standard motor","Solenoid"]},{"label":"Pick the reason","correct":"Each pulse moves one equal step, so the controller knows the position by counting pulses","wrongs":["It has a built-in position sensor","It gives the most torque of any motor","Its speed follows the voltage"]}]},{"id":"Y05","q":"Plastic bottles must be counted on a conveyor. Inductive or photoelectric sensor?","a":98,"steps":[{"label":"Pick the answer","correct":"Photoelectric","wrongs":["Inductive","Either would work","Neither would work"]},{"label":"Pick the reason","correct":"An inductive sensor only detects metal; a bottle breaks a light beam","wrongs":["Photoelectric sensors are always cheaper","Inductive sensors cannot count","Plastic is magnetic"]}]},{"id":"Y06","q":"Why do factories use 4 to 20 mA signals rather than 0 to 20 mA?","a":101,"steps":[{"label":"Pick the answer","correct":"So a broken wire shows up","wrongs":["So the sensor uses less power","Because 4 mA is safer to touch","So the reading is more precise"]},{"label":"Pick the reason","correct":"A broken wire gives 0 mA, which is outside the 4 to 20 mA range","wrongs":["4 mA is the most a wire can carry","0 mA would damage the sensor","The span of 16 mA is easier to divide"]}]},{"id":"Y07","q":"Microprocessor or microcontroller for a TV remote?","a":50,"steps":[{"label":"Pick the answer","correct":"Microcontroller","wrongs":["Microprocessor","Neither: a PLC","Both together"]},{"label":"Pick the reason","correct":"It has memory, inputs and outputs on one chip, so it is small, cheap and low power","wrongs":["It is the most powerful processor available","It needs separate memory chips","Only microcontrollers can be programmed"]}]},{"id":"Y08","q":"Is a PIR motion sensor active or passive?","a":77,"steps":[{"label":"Pick the answer","correct":"Passive","wrongs":["Active","Neither","Both"]},{"label":"Pick the reason","correct":"It only receives the heat a person gives off; it sends nothing out","wrongs":["It sends out infrared and times the echo","It needs a power supply","Its output is digital"]}]},{"id":"Y09","q":"A block and tackle with four supporting ropes has an MA of 3.6, not 4. Is something wrong?","a":30,"steps":[{"label":"Pick the answer","correct":"No, that is normal","wrongs":["Yes, a rope is missing","Yes, the load is too light","Yes, the effort was measured wrongly"]},{"label":"Pick the reason","correct":"Some of the effort is used against friction and lifting the bottom pulley block","wrongs":["MA is always 10% below the number of ropes","The ropes stretch, so MA is always 3.6","Pulleys add energy to the system"]}]},{"id":"Y10","q":"Should a machine's guard interlock switch be hard-wired or wireless?","a":86,"steps":[{"label":"Pick the answer","correct":"Hard-wired","wrongs":["Wireless","Either is fine","Neither: use a camera"]},{"label":"Pick the reason","correct":"It is safety-critical: cables are reliable and not affected by interference or flat batteries","wrongs":["Wireless is too expensive","Hard-wired is quicker to install","Wireless cannot carry an on or off signal"]}]},{"id":"Y11","q":"Why is a paint tin easier to open with a long screwdriver than a coin?","a":25,"steps":[{"label":"Pick the answer","correct":"The effort is further from the fulcrum","wrongs":["The screwdriver is stronger","The coin is too thin","The screwdriver is heavier"]},{"label":"Pick the reason","correct":"Moment = force × distance, so a bigger distance needs a smaller force for the same moment","wrongs":["Longer tools always reduce friction","Steel is harder than the coin","It changes the class of lever"]}]},{"id":"Y12","q":"A loudspeaker's cone moves. Is it usually called an actuator?","a":43,"steps":[{"label":"Pick the answer","correct":"No, it is an output transducer","wrongs":["Yes, it is an actuator","No, it is a sensor","Yes, it is a drive device"]},{"label":"Pick the reason","correct":"Its job is sound, not movement, so we do not usually call it an actuator","wrongs":["It has no coil inside","It is an input device","It only works on AC"]}]}],"errors":[{"id":"E01","a":33,"chunks":["A 25-tooth driver at 800 rpm drives a 75-tooth gear.","Gear ratio = 25 ÷ 75 = 1:3,","so the output turns slower."],"wrong":1,"fix":"The ratio is driven ÷ driver = 75 ÷ 25 = 3:1. The output speed is 800 ÷ 3 = 267 rpm (to 3 s.f.)."},{"id":"E02","a":33,"chunks":["A class 1 lever has a 300 N load 0.2 m from the fulcrum, with the effort 0.6 m away.","Effort = 300 × 0.6 ÷ 0.2 = 900 N.","MA = load ÷ effort."],"wrong":1,"fix":"The distances are swapped: effort = 300 × 0.2 ÷ 0.6 = 100 N, so MA = 300 ÷ 100 = 3."},{"id":"E03","a":33,"chunks":["A pulley system lifts 600 N with 200 N of effort,","so MA = 600 ÷ 200","= 3 N."],"wrong":2,"fix":"MA is a ratio of two forces, so it has no units. MA = 3."},{"id":"E04","a":15,"chunks":["An idler gear sits between the driver and the driven gear.","It makes the driven gear turn the same way as the driver.","It doubles the gear ratio."],"wrong":2,"fix":"An idler does not change the ratio. Only the driver and driven teeth count."},{"id":"E05","a":41,"chunks":["An LDR is a sensor.","In bright light its resistance is high.","It is used in street lights."],"wrong":1,"fix":"In bright light an LDR's resistance is low."},{"id":"E06","a":40,"chunks":["An NTC thermistor senses temperature.","As it gets hotter, its resistance rises.","It is used in battery packs."],"wrong":1,"fix":"NTC means negative temperature coefficient: hotter, lower resistance."},{"id":"E07","a":48,"chunks":["A microprocessor is a powerful CPU on one chip.","Its memory and inputs and outputs are on the same chip.","It is used in computers."],"wrong":1,"fix":"That describes a microcontroller. A microprocessor's memory and inputs and outputs are separate chips."},{"id":"E08","a":60,"chunks":["To reverse a DC motor, reverse the current.","To make it faster, reverse the voltage.","Speed and direction are controlled separately."],"wrong":1,"fix":"To make it faster, increase the supply voltage."},{"id":"E09","a":63,"chunks":["A stepper motor turns one step per pulse.","It uses a position sensor to know where it is.","It needs a motor driver circuit."],"wrong":1,"fix":"A stepper is open loop: the controller counts pulses. No position sensor is needed."},{"id":"E10","a":75,"chunks":["An ultrasonic sensor sends out sound pulses","and times the echo,","so it is a passive sensor."],"wrong":2,"fix":"It sends a signal out, so it is an active sensor."},{"id":"E11","a":79,"chunks":["An inductive proximity sensor makes a magnetic field.","It can detect plastic bottles.","Its range is a few millimetres."],"wrong":1,"fix":"Inductive sensors detect metal only. Use a photoelectric or capacitive sensor for plastic."},{"id":"E12","a":96,"chunks":["A 4 to 20 mA sensor covers 0 to 200 bar and reads 16 mA.","Fraction of the range = 16 ÷ 20 = 0.8.","Multiply that fraction by 200 bar."],"wrong":1,"fix":"Take off the 4 mA live zero first: (16 − 4) ÷ 16 = 0.75, so the pressure is 0.75 × 200 = 150 bar."},{"id":"E13","a":9,"chunks":["In a mechatronic system the sensor detects,","the actuator decides what to do,","and the motor makes the movement."],"wrong":1,"fix":"The microcontroller (the process stage) decides. The actuator acts on that decision."},{"id":"E14","a":86,"chunks":["Wireless sensors are quick to install","and are never affected by thick walls.","They need batteries looking after."],"wrong":1,"fix":"Thick walls and interference can block a wireless signal."}],"examiner":[{"id":"X01","src":"8730-031 Summer 2026 Paper 1, question 5","q":"State the function of each of the following mechanical components: cams, linkages.","max":2,"a":"Cams turn rotary motion into up and down motion. Linkages are rods joined together.","got":1,"why":"The cam mark is earned: rotary into up and down (reciprocating). 'Linkages are rods joined together' says what they are, not their function.","model":"Cams convert rotary motion into reciprocating or linear motion [1]. Linkages transfer motion or force between components, or change the direction of motion or the amount of force [1].","sl":36},{"id":"X02","src":"8730-031 Summer 2026 Paper 1, question 5","q":"State the function of each of the following mechanical components: cams, linkages.","max":2,"a":"Cams convert rotary motion into reciprocating motion. Linkages change the direction of a movement or the size of a force.","got":2,"why":"Both functions are stated precisely.","model":"Cams convert rotary motion into reciprocating or linear [1]. Linkages transfer motion or force, or change the direction of motion or amount of force [1].","sl":36},{"id":"X03","src":"8730-031 Autumn 2024 Paper 1, question 2","q":"State the function of a thermistor.","max":1,"a":"It is a type of resistor.","got":0,"why":"It says what a thermistor is, not what it does. The mark needs the link to temperature.","model":"Responds to changes in temperature, or changes its resistance in response to changes in temperature [1]. Allow measure or read the temperature.","sl":56},{"id":"X04","src":"8730-031 Autumn 2024 Paper 1, question 2","q":"State the function of a thermistor.","max":1,"a":"It measures the temperature.","got":1,"why":"The mark scheme allows 'measure or read the temperature'.","model":"Responds to changes in temperature / changes its resistance with temperature [1].","sl":56},{"id":"X05","src":"8730-031 Autumn 2024 Paper 1, question 9","q":"Explain the purpose of microcontrollers and give two examples of their use.","max":4,"a":"A microcontroller replaces lots of separate components with one chip, and it can be programmed to do different jobs. They are used as timers.","got":3,"why":"Two purpose marks (replaces discrete components; programmable for different functions) and one example (timers). A second example is needed for the fourth mark.","model":"Purpose (max 2): replaces discrete electronic components with a single device [1]; can be programmed to perform different functions [1]; reduces the size of circuits [1]; adds flexibility in design [1]. Examples (max 2): timers [1], latches [1], counters [1].","sl":56},{"id":"X06","src":"8730-032 June 2025 Paper 2, question 8 a)","q":"Outline the function of active actuators in control systems.","max":2,"a":"They use an external source of energy to turn a control signal into movement, for example moving a robot arm.","got":2,"why":"External energy source [1] and converting a signal into movement [1]. The robot arm example would also earn credit.","model":"Uses an external source of energy [1] to convert an electrical, mechanical or fluid power signal into force or movement [1]. Max 2.","sl":89},{"id":"X07","src":"8730-032 June 2025 Paper 2, question 8 a)","q":"Outline the function of active actuators in control systems.","max":2,"a":"Active actuators are sensors that detect movement in the system.","got":0,"why":"It confuses actuators with sensors. An actuator makes the movement; it does not detect it. No marking point is met.","model":"Uses an external source of energy [1] to convert a signal into force or movement [1]. Max 2.","sl":89},{"id":"X08","src":"8730-032 Autumn 2024 Paper 2, question 12 a)","q":"A control system measures the height of boxes on a conveyor. Suggest a suitable input sensor.","max":1,"a":"A laser sensor.","got":1,"why":"Laser sensor is on the mark scheme.","model":"Laser sensor / vision system / infrared sensor / photoelectronic sensor [1].","sl":100},{"id":"X09","src":"8730-032 Autumn 2024 Paper 2, question 12 b)","q":"Explain how this sensor would work for this application.","max":3,"a":"The laser shines down on the box as it goes under it and the light bounces back to the sensor. This tells you the height.","got":2,"why":"Beam emitted as the box moves under it [1]; the return signal reaches the sensor [1]. 'This tells you the height' is too vague for a third mark: it needs to say the beam measures the distance to the top of the box, or that this is compared with the known distance to the belt.","model":"Sensor emits a laser or infrared beam as the product moves under it [1]; this measures the position of the top of the box [1]; the return signal gives this to the sensor [1]; compared with the known distance to the belt to give the height [1]. Max 3.","sl":100},{"id":"X10","src":"8730-032 Autumn 2024 Paper 2, question 12 c)","q":"Boxes above a certain height are removed by a robotic arm. Explain how actuators could be used.","max":3,"a":"Actuators make the robot arm move so it can pick the box up.","got":1,"why":"One mark for actuators giving the arm's motion. It needs where the actuators go (each joint, the base, the grabber) and what they convert. A generous examiner might read 'pick the box up' as operating the grabber, but it does not say how.","model":"Actuators convert electrical signals or energy into the motion needed [1]; one at each point in the arm where movement is needed [1], for example moving the base into position [1] or operating the grabber [1]. Max 3.","sl":100},{"id":"X11","src":"Practice question, written for this lesson","q":"Explain how a stepper motor knows its position.","max":2,"a":"It counts the pulses.","got":1,"why":"Counting pulses earns one mark. It needs the link: each pulse moves the shaft one equal step, so no sensor is needed.","model":"Each pulse moves the shaft one equal step [1]; the controller counts the pulses, so no feedback sensor is needed (open loop) [1].","sl":63},{"id":"X12","src":"Practice question, written for this lesson","q":"A 20-tooth driver at 1200 rpm drives a 60-tooth gear. Calculate the output speed.","max":2,"a":"60 ÷ 20 = 3, so 1200 × 3 = 3600 rpm.","got":1,"why":"The ratio is right (method mark), but a small gear driving a big one slows down: divide, do not multiply.","model":"Ratio = 60 ÷ 20 = 3 [1]; output = 1200 ÷ 3 = 400 rpm [1].","sl":14}],"gearfacts":[{"id":"GF1","q":"Two gears mesh. The driver turns clockwise. Which way does the driven gear turn?","opts":["Anticlockwise","Clockwise","It depends on the teeth","It does not turn"],"why":"Two meshing gears always turn in opposite directions.","fb":{"Clockwise":"That needs an idler in between."},"a":12,"t":{"k":"short","acc":["anticlockwise","anti clockwise","counterclockwise","counter clockwise","the opposite way","opposite","opposite direction"]},"p":1},{"id":"GF2","q":"What does an idler gear change?","opts":["Only the direction of rotation","Only the gear ratio","The ratio and the direction","Nothing at all"],"why":"An idler changes the direction only. The ratio depends on the driver and driven gears alone.","fb":{"Only the gear ratio":"The idler's teeth cancel out, so the ratio is unchanged."},"a":15,"p":1},{"id":"GF3","q":"A small gear drives a large one. What happens at the output?","opts":["Slower, with more torque","Faster, with more torque","Slower, with less torque","No change"],"why":"Low gear: easy to push, but slow. The torque goes up as the speed goes down.","fb":{"Faster, with more torque":"You cannot get both. Faster means less torque."},"a":13,"p":1},{"id":"GF4","q":"How do you find the total ratio of a compound gear train?","opts":["Multiply the stage ratios","Add the stage ratios","Use the first stage only","Divide the first by the second"],"why":"Total ratio = stage 1 ratio × stage 2 ratio.","fb":{"Add the stage ratios":"Ratios multiply: 3:1 then 4:1 gives 12:1, not 7:1."},"a":16,"t":{"k":"short","acc":["multiply","multiply them","multiply the ratios","multiply the stage ratios","times them","times","product"]},"p":1},{"id":"GF5","q":"In a compound train, gears B and C are fixed on the same shaft. What is true?","opts":["They turn at the same speed","They have the same number of teeth","They turn opposite ways","They do not turn"],"why":"Gears on the same shaft turn together, at the same speed and in the same direction.","a":16,"p":1}],"checkinRecall":{"p1":[{"id":"CK11","k":"term","q":"Load ÷ effort. A number with no units.","acc":["mechanical advantage","ma"],"p":1,"a":25,"why":"Mechanical advantage."},{"id":"CK12","k":"num","q":"A 16-tooth driver at 1600 rpm drives a 64-tooth gear. What is the output speed?","v":400,"unit":"rpm","tol":0.01,"p":1,"a":null,"why":"64 ÷ 16 = 4:1, so 1600 ÷ 4 = 400 rpm."}],"p2":[{"id":"CK21","k":"term","q":"Converts an electrical, electronic or mechanical signal into physical movement.","acc":["actuator","actuators"],"p":2,"a":44,"why":"An actuator."},{"id":"CK22","k":"short","q":"Which chip has the CPU, memory and inputs and outputs all on one chip?","acc":["microcontroller","micro controller","mcu","pic","pic microcontroller"],"p":2,"a":49,"why":"A microcontroller (a PIC is one).","rivals":["microprocessor"]}],"p3":[{"id":"CK31","k":"num","q":"A stepper has a 3.6° step angle. How many steps make one turn?","v":100,"unit":"steps","tol":0.01,"p":3,"a":64,"why":"360 ÷ 3.6 = 100 steps."},{"id":"CK32","k":"short","q":"What sets the angle a servo motor turns to?","acc":["pulse width","width of the pulse","width of the pulses","the width of the control pulses","pulse length","pulse duration"],"p":3,"a":61,"why":"The width of the control pulse.","rivals":["number of pulses","voltage","current"]}],"p4":[{"id":"CK41","k":"short","q":"Which proximity sensor detects metal only?","acc":["inductive","inductive proximity sensor","inductive sensor"],"p":4,"a":79,"why":"Inductive.","rivals":["capacitive","photoelectric","ultrasonic"]},{"id":"CK42","k":"short","q"       } else if (m === "remote") {

  flush: function(){
    var self = this, m = Net.mode();
    if (self.busy || !self.q.length || (m!=="gas" && m!=="remote")) return;
    if (navigator.onLine === false) return;
    self.busy = true;
    var batch = self.q.slice(0, 25);

/* ---------- analogue scale and laser height ---------- */
function scaleArt(sLo, sHi, sU, qLo, qHi, qU, reading, qval){

  s += '<path class="a-i" d="M100 '+(y0+14)+'V'+yb.toFixed(1)+'"/>' + arrowAt(100, y0+20, 0, -1, "a-fi") + arrowAt(100, yb-6, 0, 1, "a-fi") + lab(94, (y0+14+yb)/2, belt+" mm", {a:"end", size:12});

}

<script>

PARTN.forEach(function(n){ TITLE["last"+n] = "Last lesson Part "+n; TITLE["dump"+n] = "Brain dump Part "+n; TITLE["boss"+n] = "Boss round Part "+n;
  TITLE["checkin"+n] = CONTENT.checkin["p"+n].title; });
var LEVELS = [{name:"Apprentice",at:0},{name:"Engineering Technician",at:400},{name:"Incorporated Engineer",at:1000},{name:"Chartered Engineer",at:2000}];
function levelOf(xp){ var i=0; while (i<LEVELS.length-1 && xp>=LEVELS[i+1].at) i++; return {i:i, name:LEVELS[i].name, next:LEVELS[i+1]||null, from:LEVELS[i].at}; }
function streak(){

}
function firstName(){ if (!S.me) return ""; var n = S.me.name || S.me.code; return n.split(" ")[0]; }
function initials(){ var n = (S.me && (S.me.name || S.me.code)) || "?"; var p = n.trim().split(/\s+/); return (p[0][0] + (p[1] ? p[1][0] : (p[0][1]||""))).toUpperCase(); }
function guided(){ return S.prefs.mode !== "independent"; }

/* ---------- spaced review (Embedding: revisit once-learnt material to stop it being forgotten) ----------
   Each question in the review bank sits in a box. Wrong: back to box 0, due tomorrow.
   Right: up one box, due after 1, 3, 7 then 14 days. Lesson-anchored questions (section 1.6) also come back
   one day and one week after they were first answered right, because a right answer straight after the

var GAPS = [1, 3, 7, 14];
function addDays(n){ var d = new Date(); d.setDate(d.getDate()+n); return todayKey(d); }

/* ---------- item builders shared by the games ---------- */
function cap1(s){ s = String(s||""); return s.charAt(0).toUpperCase() + s.slice(1); }

function mcqFrom(x, lead){ var m = mix(x.opts[0], x.opts.slice(1));

function typedFrom(x, lead){ var t = x.t;
  return {id:x.id, rid:x.id, k:t.k, lead:lead||"", q:x.q, acc:t.acc, v:t.v, unit:t.unit, tol:t.tol, why:x.why, a:x.a, ans:x.opts[0], rivals:x.opts.slice(1), ladder:true, lvl:2, levelName:"From memory"}; }
/* other key words and every form they accept: typing one of those is a different term, not a spelling slip */
function rivalsFor(kw){ var r = []; CONTENT.keywords.forEach(function(o){ if (o.id !== kw.id) r = r.concat([o.term], o.acc); }); return r; }
/* first-letter clue (cue level 2): each word stays on one line, so the clue never breaks mid-word */
function cueHtml(t){
  var words = t.split(" ");
  return '<p class="cue" aria-label="'+esc("First letters clue: " + words.map(function(w){ return w.charAt(0) + ", " + w.length + " letters"; }).join("; "))+'">' +
    words.map(function(w){ return '<span class="cw" aria-hidden="true">'+esc(w.split("").map(function(c, i){ return i === 0 || !/[a-z]/i.test(c) ? c : "_"; }).join("\u2009"))+'</span>'; }).join(" ") + '</p>'; }
/* a key word as a retrieval item at cue level L (1 pick it, 2 first letters, 3 from memory) */
function termItem(kw, L){
  L = L || S.prog.lvl[kw.id] || (guided() ? 2 : 3);
  var base = {id:kw.id, rid:kw.id, q:kw.def, acc:kw.acc, ans:kw.term, a:kw.slide, ladder:true, rivals:rivalsFor(kw), lvl:L, why:kw.term+": "+kw.def};
  if (L <= 1) {
    var same = shuffle(CONTENT.keywords.filter(function(o){ return o.part === kw.part && o.id !== kw.id && o.term !== kw.term; })).slice(0, 3).map(function(o){ return o.term; });
    var m = mix(kw.term, same);

  CONTENT.recall.concat(CONTENT.which, CONTENT.gearfacts).forEach(function(x){ REG[x.id] = function(){ return x.t ? typedFrom(x) : mcqItem(x); }; });
  CONTENT.keywords.forEach(function(k){ REG[k.id] = function(){ return termItem(k, Math.max(S.prog.lvl[k.id]||2, 2)); }; });
  PARTN.forEach(function(n){ CONTENT.last[n].concat(CONTENT.boss[n], CONTENT.checkinRecall["p"+n]).forEach(function(x){ REG[x.id] = function(){ return Object.assign({rid:x.id}, x); }; }); });
}

/* ---------- sign in ---------- */
function signIn(msg){
  var list = CLASS.length > 0;
  screen(fullHeader() + '<div class="wrap stack">' +
    '<div class="card stack"><h2 style="margin:0">Sign in</h2>' +
    (list ? '<p class="muted" style="margin:0">Tap your name.</p><div class="names">' + CLASS.map(function(c,i){ return '<button data-i="'+i+'">'+esc(c.name)+'</button>'; }).join("") + '</div><p class="muted small" style="margin:6px 0 0">Name not there? Type your code instead.</p>' : '') +
    '<label for="code"><b>Your hub code</b><br><span class="small muted">Four letters and numbers, on the slip from your tutor.</span></label>' +
    '<input id="code" class="textin codebox" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="err">' +
    '<button class="btn amber block" id="go">Start</button>' +

/* ---------- home ---------- */
async function loadServer(){
  var m = Net.mode(); if (m !== "gas" && m !== "remote") return;
  try {
    var r = await Net.call("stats", {});

function gameByKey(k){ return GAMES.filter(function(g){ return g.key === k; })[0]; }
function stampOf(k){ var g = gameByKey(k); if (g && g.parts) return PARTN.some(function(n){ return S.prog.stamps[k+n]; }); return !!S.prog.stamps[k]; }
function bestOf(k){ var g = gameByKey(k), b = null; if (g && g.parts) { PARTN.forEach(function(n){ var v = S.prog.best[k+n]; if (v != null && (b == null || v > b)) b = v; }); return b; } return S.prog.best[k]; }
function playsOf(k){ var g = gameByKey(k); if (g && g.parts) return PARTN.reduce(function(a, n){ return a + (S.prog.plays[k+n]||0); }, 0); return S.prog.plays[k]||0; }
function suggestNext(){
  /* first game in path order not yet checked */

  }
  function row(act, ic, title, sub, pill){

  }
  var goal = (p.goal != null) ? CONTENT.goals[p.goal] : null;
  var goalCard = goal ?

/* ---------- my record ---------- */
var TRANSFER = "U91-";   /* this hub's own transfer-code prefix */
var RECORD_KEYS = []; GAMES.forEach(function(g){ if (g.parts) PARTN.forEach(function(n){ RECORD_KEYS.push(g.key+n); }); else RECORD_KEYS.push(g.key); });
RECORD_KEYS = RECORD_KEYS.concat(["review","flash","exit","checkin1","checkin2","checkin3","checkin4","checkin5"]);
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode();
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });
  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  var cal = p.cal || {sr:0, sw:0, gr:0, gw:0}, calN = cal.sr + cal.sw + cal.gr + cal.gw;
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (calN ? '<div class="card" style="margin-bottom:12px"><b style="color:var(--head)">Do you know what you know?</b><p class="small" style="margin:6px 0 0">From Sure or Not?: sure and right '+cal.sr+', sure but wrong '+cal.sw+', guessed and right '+cal.gr+', guessed and wrong '+cal.gw+'. '+
      (cal.sw ? 'Sure but wrong is the one to shrink: those are the mistakes you would not spot in the exam.' : 'No confident mistakes so far. Good.')+'</p></div>' : '') +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="'+TRANSFER+'..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = TRANSFER + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf(TRANSFER) !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(TRANSFER.length)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done); Object.assign(cur.srs, inc.srs); Object.assign(cur.rag, inc.rag); Object.assign(cur.lvl, inc.lvl||{}); Object.assign(cur.flash, inc.flash||{});
      if (cur.goal == null) cur.goal = inc.goal;
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code. Copy it again on the other phone."; }
  };
}

function startGame(key){
  var m = /^(last|dump|boss)([1-5])$/.exec(key);
  if (m) return ({last:runLast, dump:runDump, boss:runBoss})[m[1]](+m[2]);
  var g = gameByKey(key); if (g && g.parts) return openPartPicker(key);
  var run = {recall:runRecall, gears:runGears, mechsort:runMechSort, nameparts:runNameParts, swipe:runSwipe, motor:runMotor, stepper:runStepper,
    sensorsort:runSensorSort, whichsensor:runWhich, analogue:runAnalogue, line:runLine, ladder:runLadder, term:runTerm, taboo:runTaboo,
    why:runWhy, errors:runErrors, examiner:runExaminer, flash:runFlash, review:runReview}[key];
  if (run) run();
}
document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var conf = $$(".conf button:not([disabled])");   /* Sure or Not?: once an answer is picked, the keys rate confidence */
    var b = (conf.length ? conf : $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])"))[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var Speech = {live:null, denied:false};
function speechOK(){ return !!SR && window.isSecureContext !== false && S.prefs.speech !== "off" && !Speech.denied; }
function micBlock(id){
  if (S.prefs.speech === "off") return '';
