  screen(fullHeader() + '<div class="wrap">' +
    '<div class="card"><div class="me"><span class="avatar" aria-hidden="true">'+esc(initials())+'</span><div><h2>Hello, '+esc(firstName())+'</h2>' +
    '<div class="lvl">'+esc(lv.name)+', '+p.xp+' points</div></div></div>' +
    '<div class="meter" aria-hidden="true"><i style="width:'+fill+'%"></i></div>' +
    '<div class="small muted" style="margin-top:6px">'+(lv.next ? toNext+' points to '+esc(lv.next.name) : 'Top level reached. Keep your scores sharp.')+'</div>' +
    '<div class="chips"><span class="chip">'+icon("flame")+streak()+' day streak</span><span class="chip">'+icon("check")+checked+' checked</span><span class="chip">'+icon("games")+played+' played</span></div></div>' +
    (S.server.message ? '<div class="panel amber" style="margin-top:12px"><p>'+esc(S.server.message)+'</p></div>' : '') +
    (cls ? '<div style="margin-top:12px">'+cls+'</div>' : '') +

    '</div><p class="foot">This is formative. Nothing here is marked or graded. <span data-sync>'+esc(syncText())+'</span></p></div>', {tab:"games"});
  $$(".tile").forEach(function(t){ t.onclick = function(){ startGame(t.dataset.game); }; });

/* ---------- my record ---------- */
var RECORD_KEYS = GAMES.map(function(g){ return g.key; }).concat(["flash","exit","checkin1","checkin2"]);
function recordLines(){
  var p = S.prog;
  return RECORD_KEYS.filter(function(k){ return p.raw[k]; }).map(function(k){ return resultLine(TITLE[k], p.raw[k][0], p.raw[k][1], p.last[k]); });
}
function record(){
  S.tab = "record";
  var p = S.prog, mode = Net.mode();
  var played = RECORD_KEYS.filter(function(k){ return (p.plays[k]||0) > 0 || p.raw[k]; });
  var notYet = RECORD_KEYS.filter(function(k){ return played.indexOf(k) < 0; });
  var cards = played.map(function(k){
    var r = p.raw[k], t = TITLE[k], n = p.plays[k]||1;
    var meta = (r ? "Best " + r[0] + " of " + r[1] : "Best " + (p.best[k]||0) + "%") + ", played " + n + (n>1?" times":" time") + (p.last[k] ? ", last " + niceDate(p.last[k]) : "");
    var send = (mode === "forms" && r) ? '<a class="btn small amber act" target="_blank" rel="noopener" href="'+esc(formsLink(t, r[0], r[1], "Sent from My record"))+'">'+icon("send")+'Send</a>' : '';
    return '<div class="card recard"><b>'+esc(t)+'</b>'+send+'<span class="meta">'+esc(meta)+(r ? '. Check code <span class="code">'+checkCode(S.me.code, t, r[0], r[1])+'</span>' : '')+'</span></div>';
  }).join("");
  var lines = recordLines().join("\n");
  screen(fullHeader() + '<div class="wrap">' +
    '<div class="sec" style="margin-top:6px"><h2>My record</h2><span class="muted small">'+esc(S.me.name || S.me.code)+'</span></div>' +
    (cards ? '<div class="stack">'+cards+'</div>' : '<div class="panel"><p>Nothing played yet. Your best score for each game appears here.</p></div>') +
    (notYet.length ? '<p class="small muted" style="margin:14px 2px">Not played yet: '+notYet.map(function(k){ return esc(TITLE[k]); }).join(", ")+'.</p>' : '') +
    '<div class="sec"><h2>Copy all my results</h2></div>' +
    '<div class="card stack"><p style="margin:0">One line per game, with its check code. Paste it into the class chat if the form will not open.</p>' +
    '<textarea class="copyline" id="block" readonly aria-label="All my results">'+esc(lines || "Nothing to copy yet.")+'</textarea>' +
    '<button class="btn ghost block" id="copyAll">'+icon("copy")+'Copy the block</button></div>' +
    '<div class="sec"><h2>Moving to another phone</h2></div>' +
    '<div class="card stack"><p style="margin:0">Your record lives on this phone. To move it, copy your transfer code here, then paste it on the other phone and press Bring it across.</p>' +
    '<button class="btn ghost block" id="pack">'+icon("copy")+'Copy my transfer code</button>' +
    '<label for="unpack"><b>Coming from another phone? Paste the code here</b></label><textarea class="textin" id="unpack" placeholder="U11-..."></textarea>' +
    '<button class="btn block" id="bring">Bring it across</button><p class="small" id="mUnpack" role="status" style="margin:0"></p></div>' +
    '<p class="foot">Clearing your browser data clears this record. Send your results first.</p></div>', {tab:"record"});
  $("#copyAll").onclick = function(){ copyText(lines, function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the text and copy it."); }); };
  $("#pack").onclick = function(){
    var code = "U11-" + btoa(unescape(encodeURIComponent(JSON.stringify({me:S.me, prog:S.prog}))));
    copyText(code, function(ok){ toast(ok ? "Transfer code copied." : "Could not copy. Try again."); });
  };
  $("#bring").onclick = function(){
    var v = $("#unpack").value.trim(), msg = $("#mUnpack");
    try {
      if (v.indexOf("U11-") !== 0) throw 0;
      var d = JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));
      if (!d.me || !d.prog) throw 0;
      var cur = S.prog, inc = Object.assign(freshProg(), d.prog);
      cur.xp = Math.max(cur.xp, inc.xp);
      Object.keys(inc.best).forEach(function(k){ if ((inc.best[k]||0) > (cur.best[k]||-1)) { cur.best[k] = inc.best[k]; if (inc.raw[k]) cur.raw[k] = inc.raw[k]; } });
      Object.keys(inc.plays).forEach(function(k){ cur.plays[k] = Math.max(cur.plays[k]||0, inc.plays[k]); });
      Object.keys(inc.last).forEach(function(k){ if (!cur.last[k] || inc.last[k] > cur.last[k]) cur.last[k] = inc.last[k]; });
      Object.assign(cur.stamps, inc.stamps); Object.assign(cur.done, inc.done);
      inc.days.forEach(function(x){ if (cur.days.indexOf(x) < 0) cur.days.push(x); });
      saveProg(); toast("Record brought across."); record();
    } catch(e) { msg.style.color = "var(--red)"; msg.textContent = "That does not look like a transfer code. Copy it again on the other phone."; }
  };
}

/* ---------- navigation ---------- */
function startGame(key){
  var run = {family:runFamily, parts:runParts, errors:runErrors, sequence:runSequence, briefspec:runBriefSpec, body:runBody, ladder:runLadder,
    fault:runFault, expert:runExpert, sixr:runSixR, words:runWords, command:runCommand, quick:runQuick, flash:runFlash}[key];
  if (run) run();
}
document.addEventListener("keydown", function(e){
  var t = e.target, tag = (t && t.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var b = $$(".opt:not([disabled]), .chunk:not([disabled]), [data-ans]:not([disabled])")[Number(e.key)-1];
    if (b) { e.preventDefault(); b.click(); }
  } else if (e.key === "Enter" && tag !== "BUTTON" && tag !== "A") {
    var n = $("#next"); if (n) { e.preventDefault(); n.click(); }
  }
});
</script>
<script>
"use strict";
/* ---------- results ---------- */
function resultMessage(pct){
  if (pct >= 90) return "Excellent. That is exam ready.";
  if (pct >= 70) return "Good work. Check the ones below, then go again.";
  if (pct >= 40) return "Getting there. Read the fixes, then play it again.";
  return "Early days. Read each fix below and try again. It gets easier every round.";
}
function sendPanel(title, score, max, detail){
  var m = Net.mode(), code = S.me ? S.me.code : "", chk = checkCode(code, title, score, max);
  if (m === "forms") return '<div class="panel amber stack" style="margin-top:12px"><h3>Send this to your tutor</h3>' +
    '<p>One tap opens the form with your code, the game and your score already filled in. Press Submit on the form.</p>' +
    '<p>Check code <span class="code">'+chk+'</span></p>' +
    '<div class="row"><a class="btn amber" id="send" target="_blank" rel="noopener" href="'+esc(formsLink(title, score, max, detail))+'">'+icon("send")+'Send my result</a>' +
    '<button class="btn ghost" id="copy1">'+icon("copy")+'Copy it instead</button></div></div>';
  if (m === "local") return '<div class="panel amber stack" style="margin-top:12px"><h3>Keep a copy</h3>' +
    '<p>This hub is not linked to your tutor&#39;s form yet. Copy this line and paste it where your tutor asks.</p>' +
    '<p class="small"><b>'+esc(resultLine(title, score, max))+'</b></p><button class="btn ghost" id="copy1">'+icon("copy")+'Copy it</button></div>';
  return '<p class="small muted" style="margin:12px 2px" data-sync>'+esc(syncText())+'</p>';
}
function wireSend(title, score, max){
  var c = $("#copy1"); if (c) c.onclick = function(){ copyText(resultLine(title, score, max), function(ok){ toast(ok ? "Copied. Paste it into the class chat." : "Select the line and copy it."); }); };
  var s = $("#send"); if (s) s.addEventListener("click", function(){ toast("The form is opening. Press Submit on it."); });
}
function finishGame(key, score, max, items, started, review, extra){
  extra = extra || {};
  var p = S.prog, title = TITLE[key], pct = max ? Math.round(100*score/max) : 0, secs = Math.round((Date.now()-started)/1000);
  var prev = p.best[key], newBest = prev == null || pct > prev;
  if (newBest) { p.best[key] = pct; p.raw[key] = [score, max]; }
  p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  var gain = 20 + score*10 + (extra.bonus||0); p.xp += gain;
  var stamp = pct >= 80, firstStamp = stamp && !p.stamps[key]; if (stamp) p.stamps[key] = true;
  var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t);
  saveProg();
  logEvent("finish", title, {score:score, max:max, secs:secs, items:items});
  var missed = items.filter(function(x){ return !x.ok; }).map(function(x){ return x.l; });
  var detail = missed.length ? "To go over: " + missed.slice(0,6).join("; ") : "All correct";
  screen(gameHeader(title, 0, 0) + '<div class="wrap">' +
    '<div class="card result"><p class="muted" style="margin:0 0 4px">'+esc(title)+'</p><div class="big">'+score+'<small> of '+max+'</small></div>' +
    '<p style="margin:10px 0 4px">'+resultMessage(pct)+'</p><p class="small muted" style="margin:0">+'+gain+' points'+(newBest && prev != null ? ', a new best' : '')+'</p>' +
    (stamp ? '<span class="seal'+(firstStamp?' pop':'')+'">'+icon("check")+'Checked</span>' : '') + '</div>' +
    sendPanel(title, score, max, detail) +
    (review.length ? '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">What to fix</h3><ol class="review">' +
      review.map(function(r){ return '<li><b>'+esc(r.q)+'</b><br>The answer: '+esc(r.right)+(r.why ? '. <span class="muted">'+esc(r.why)+'</span>' : '')+'</li>'; }).join("") + '</ol></div>'
      : '<div class="panel" style="margin-top:12px"><p>Nothing to fix this round.</p></div>') +
    '<div class="dock"><div class="row"><button class="btn amber" id="again">Play again</button><button class="btn ghost" id="hub">Back to the games</button></div></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#again").onclick = function(){ startGame(key); };
  $("#hub").onclick = function(){ home(); };
  say(score + " out of " + max + ". " + resultMessage(pct));
}

/* ---------- one engine for every multiple choice game ---------- */
function optButtons(opts){ return opts.map(function(o,k){ return '<button class="opt" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span class="l">'+esc(o)+'</span><span class="s"></span></button>'; }).join(""); }
function markOpts(correct, chosen){
  var ok = correct.indexOf(chosen) >= 0;
  $$(".opt").forEach(function(b){

      '<div class="dock" id="dock"><button class="btn amber block" id="chk">Check</button></div></div>', {game:true});
    var inp = $("#ans");
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); var b = $("#chk") || $("#next"); if (b) b.click(); } });
    $("#hint").onclick = function(){ $("#hintbox").innerHTML = '<div class="worked">'+esc(it.hint)+'</div>'; };
    $('[data-act="datacard"]').onclick = function(){ openDataCard(); };
    function done(ok){
      if (ok) score++;
      log.push({i:it.id, ok:ok?1:0, l:it.q.slice(0,90)});
      if (!ok) review.push({q:it.q, right:it.ans+" "+it.unit, why:it.work.join(" ")});
      inp.disabled = true;
      var fb = $("#fb"); fb.className = "fb" + (ok ? "" : " bad");
      fb.innerHTML = '<strong>'+(ok ? (tries === 1 ? "Correct first time." : "Correct on the second go.") : "The answer is "+it.ans+" "+it.unit+".")+'</strong>' +
        '<ol>'+it.work.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join("")+'</ol>';
      $("#dock").innerHTML = '<button class="btn amber block" id="next">'+(i+1 < rungs.length ? "Next rung" : "See my score")+'</button>';
      $("#next").onclick = function(){ i++; show(); };
      say(ok ? "Correct." : "The answer is " + it.ans + " " + it.unit);
    }
    $("#chk").onclick = function(){
      var v = parseFloat(inp.value.replace(/,/g,"").replace(/[^\d.\-]/g,""));
      if (isNaN(v)) { var f = $("#fb"); f.className = "fb info"; f.innerHTML = "<strong>Type a number first.</strong>"; return; }
      tries++;
      if (Math.abs(v - it.ans) <= it.tol + 1e-9) return done(true);
      if (tries === 1) {
        $("#hintbox").innerHTML = '<div class="worked">'+esc(it.hint)+'</div>';
        var f2 = $("#fb"); f2.className = "fb info"; f2.innerHTML = "<strong>Not quite. Have one more go.</strong>The hint is showing above.";
        inp.select(); say("Not quite. Have one more go.");
      } else done(false);
    };
    setTimeout(function(){ try { inp.focus(); } catch(e) {} }, 60);
  }
  show();
}

/* ---------- key word cards: look, think, flip, be honest ---------- */
function runFlash(){
  var queue = shuffle(CONTENT.flash).map(function(c){ return Object.assign({n:0}, c); }), total = queue.length, firstGo = 0, log = [], started = Date.now();
  function show(){
    if (!queue.length) return finishGame("flash", firstGo, total, log, started,
      log.filter(function(x){ return !x.ok; }).map(function(x){ var c = CONTENT.flash.filter(function(f){ return f.id === x.i; })[0] || {}; return {q:x.l, right:c.def||"", why:""}; }));
    var c = queue[0], known = total - queue.length;
    screen(gameHeader(TITLE.flash, known, total) + '<div class="wrap">' +
      '<p class="qprompt" style="margin:0 0 6px">Say the meaning out loud, then turn the card over.</p>' +
      '<button class="flip" id="fc" aria-label="'+esc(c.term)+'. Tap to turn over."><span class="inner"><span class="face front"><strong>'+esc(c.term)+'</strong><span class="small muted" style="margin-top:10px">Tap to turn over</span></span>' +
      '<span class="face back"><span>'+esc(c.def)+'</span></span></span></button>' +
      '<div class="dock" id="dock"><div class="row"><button class="btn ghost" id="no" disabled>Not yet</button><button class="btn" id="yes" disabled>I knew that</button></div>' +
      '<button class="link" id="stop" style="width:100%">Stop here and see my score</button></div></div>', {game:true});
    var fc = $("#fc");
    fc.onclick = function(){ fc.classList.toggle("on"); $("#yes").disabled = false; $("#no").disabled = false; fc.setAttribute("aria-label", fc.classList.contains("on") ? c.def : c.term); };
    $("#yes").onclick = function(){ if (c.n === 0) { firstGo++; log.push({i:c.id, ok:1, l:c.term}); } queue.shift(); show(); };
    $("#no").onclick = function(){ if (c.n === 0) log.push({i:c.id, ok:0, l:c.term}); c.n++; queue.shift(); if (c.n < 3) queue.push(c); show(); };
    $("#stop").onclick = function(){ queue.forEach(function(q){ if (q.n === 0) log.push({i:q.id, ok:0, l:q.term}); }); queue = []; show(); };
  }
  show();
}

/* ---------- exit ticket and check-ins ---------- */
function ragBlock(prefix, lines){
  return lines.map(function(l,k){ return '<div class="q"><p id="'+prefix+k+'l" style="font-weight:400;color:var(--ink)">'+(k+1)+'. '+esc(l)+'</p>' +
    '<div class="rag" role="group" aria-labelledby="'+prefix+k+'l">' +
    '<button class="r" data-rag="'+prefix+k+'" data-v="R" aria-pressed="false">Not yet</button><button class="a" data-rag="'+prefix+k+'" data-v="A" aria-pressed="false">Nearly</button><button class="g" data-rag="'+prefix+k+'" data-v="G" aria-pressed="false">Got it</button></div></div>'; }).join("");
}
function wireRag(){ $$("[data-rag]").forEach(function(b){ b.onclick = function(){ $$('[data-rag="'+b.dataset.rag+'"]').forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); }); }; }); }
function readRag(prefix, n){ var out = ""; for (var k=0;k<n;k++){ var on = $('[data-rag="'+prefix+k+'"][aria-pressed="true"]'); out += on ? on.dataset.v : "-"; } return out; }
function doneScreen(key, title, score, max, heading, body, detail){
  var p = S.prog; p.raw[key] = [score, max]; p.best[key] = Math.round(100*score/max); p.plays[key] = (p.plays[key]||0) + 1; p.last[key] = new Date().toISOString();
  p.done[key] = true; p.xp += 30; var t = todayKey(); if (p.days.indexOf(t) < 0) p.days.push(t); saveProg();
  screen(gameHeader(title, 0, 0) + '<div class="wrap"><div class="card stack"><h2 style="margin:0">'+heading+'</h2>'+body+'</div>' +
    sendPanel(title, score, max, detail) + '<div class="dock"><button class="btn amber block" id="hub">Back to the games</button></div></div>', {game:true, done:true});
  wireSend(title, score, max);
  $("#hub").onclick = function(){ home(); };
}
function runExit(){
  var E = CONTENT.exit;
  function radios(name, q){ return '<fieldset class="q"><legend>'+esc(q.q)+'</legend>'+q.opts.map(function(o,k){ return '<label class="check"><input type="radio" name="'+name+'" value="'+k+'"><span>'+esc(o)+'</span></label>'; }).join("")+'</fieldset>'; }
  screen(gameHeader(TITLE.exit, 0, 0) + '<div class="wrap"><div class="card">' +
    '<p style="margin:0">Five minutes, on your own. This is for feedback, not a mark.</p>' +
    '<div class="q"><label for="q1">1. '+esc(E.q1)+'</label><textarea id="q1" class="textin" maxlength="400"></textarea></div>' +
    radios("q2", {q:"2. "+E.q2.q, opts:E.q2.opts}) +
    '<fieldset class="q"><legend>'+esc(E.q2b.q)+'</legend>'+E.q2b.opts.map(function(o,k){ return '<label class="check"><input type="checkbox" name="q2b" value="'+k+'"><span>'+esc(o)+'</span></label>'; }).join("")+'</fieldset>' +
    radios("q3", {q:"3. "+E.q3.q, opts:E.q3.opts}) + radios("q4", {q:"4. "+E.q4.q, opts:E.q4.opts}) +
    '<div class="q"><label for="q4b">'+esc(E.q4b)+'</label><textarea id="q4b" class="textin" maxlength="300" style="min-height:70px"></textarea></div>' +
    '<h3 style="margin:22px 0 4px">Can you do all eight? Be honest.</h3>' + ragBlock("x", E.rag) +
    '<div class="q"><label for="fz">Anything still fuzzy? (optional)</label><textarea id="fz" class="textin" maxlength="300" style="min-height:70px"></textarea></div>' +
    '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Hand it in</button></div></div>', {game:true});
  wireRag();
  $("#send2").onclick = function(){
    var q1 = $("#q1").value.trim(), q2 = $('input[name="q2"]:checked'), q3 = $('input[name="q3"]:checked'), q4 = $('input[name="q4"]:checked');
    var q2b = $$('input[name="q2b"]:checked').map(function(x){ return +x.value; }), rag = readRag("x", E.rag.length);
    if (!q1 || !q2 || !q3 || !q4 || rag.indexOf("-") >= 0) { $("#err").textContent = "Answer questions 1 to 4 and rate all eight lines before handing in."; return; }
    var ok2 = +q2.value === E.q2.ans, ok2b = q2b.length === 3 && E.q2b.ans.every(function(a){ return q2b.indexOf(a) >= 0; }), ok3 = +q3.value === E.q3.ans, ok4 = +q4.value === E.q4.ans;
    var score = (ok2 ? 1 : 0) + (ok2b ? 1 : 0) + (ok3 ? 1 : 0) + (ok4 ? 1 : 0);
    var lowest = E.rag[rag.indexOf("R") >= 0 ? rag.indexOf("R") : (rag.indexOf("A") >= 0 ? rag.indexOf("A") : 0)];
    var extra = {q1:q1, q2:E.q2.opts[+q2.value], q2b:q2b.map(function(k){ return E.q2b.opts[k]; }).join("; "), q3:E.q3.opts[+q3.value], q4:E.q4.opts[+q4.value], q4b:$("#q4b").value.trim(), rag:rag, fuzzy:$("#fz").value.trim()};
    logEvent("exit", TITLE.exit, {score:score, max:4, extra:extra, items:[{i:"X2",ok:ok2?1:0,l:"Casting is part of shaping"},{i:"X2b",ok:ok2b?1:0,l:"Other three shaping categories"},{i:"X3",ok:ok3?1:0,l:"Linear versus iterative"},{i:"X4",ok:ok4?1:0,l:"Shelf reach percentile"}]});
    function li(ok, good, bad){ return '<li>'+(ok ? '<b style="color:var(--green)">Right:</b> '+good : '<b style="color:var(--red)">Check this:</b> '+bad)+'</li>'; }
    var body = '<p style="margin:0">Thank you. Your tutor will read this before the next lesson.</p><ul class="review">' +
      li(ok2, "casting is one of the four categories of shaping.", "casting is one of the four categories of <b>shaping</b>.") +
      li(ok2b, "the other three are manipulative processes, powder techniques, and cutting and grinding.", "the other three are <b>manipulative processes, powder techniques, and cutting and grinding</b>.") +
      li(ok3, "iterative design makes and tests a prototype before manufacture.", "iterative design <b>makes and tests a prototype before manufacture</b>, and feeds improvements back.") +
      li(ok4, "a shelf is a reach problem, so design for the 5th percentile.", "a shelf is a reach problem, so design for the <b>smallest user, the 5th percentile</b>.") + '</ul>' +
      '<div class="panel amber"><p><b>Your first thing to work on:</b> '+esc(lowest)+'</p></div>';
    var detail = "Q1: " + q1 + " | Q4 reason: " + extra.q4b + " | Lines: " + rag + (extra.fuzzy ? " | Fuzzy: " + extra.fuzzy : "");
    doneScreen("exit", TITLE.exit, score, 4, "Handed in", body, detail);
  };
}
function runCheckin(part, key){
  var C = CONTENT.checkin[part];
  screen(gameHeader(C.title, 0, 0) + '<div class="wrap"><div class="card"><p style="margin:0">Rate each line honestly. It tells your tutor what to go over again.</p>' +
    ragBlock("c", C.lines) + '<p id="err" class="small" role="alert" style="color:var(--red)"></p></div>' +
    '<div class="dock"><button class="btn amber block" id="send2">Send my check-in</button></div></div>', {game:true});
  wireRag();
  $("#send2").onclick = function(){
    var rag = readRag("c", C.lines.length);
    if (rag.indexOf("-") >= 0) { $("#err").textContent = "Rate every line first."; return; }
    var g = rag.split("").filter(function(x){ return x === "G"; }).length;
    logEvent("checkin", C.title, {score:g, max:C.lines.length, extra:{rag:rag, part:part}});
    var weak = C.lines.filter(function(_,k){ return rag[k] !== "G"; });
    var body = '<p style="margin:0">You rated '+g+' of '+C.lines.length+' lines as got it.</p>' +
      (weak.length ? '<p style="margin:0">Go over these next:</p><ul class="review">'+weak.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join("")+'</ul>' : '<p style="margin:0">Everything rated got it. Try the games to prove it.</p>');
    doneScreen(key, C.title, g, C.lines.length, "Sent", body, "Lines: " + rag);
  };
}

/* ---------- start ---------- */
(function init(){
  applyPrefs();
  var labels = {games:["games","Games"], record:["record","My record"], help:["help","Help"]};
  $$("#tabs button").forEach(function(b){ var l = labels[b.dataset.tab]; b.innerHTML = icon(l[0]) + '<span>'+l[1]+'</span>';
    b.onclick = function(){ if (b.dataset.tab === "games") home(); else if (b.dataset.tab === "record") record(); else help(); }; });
  if (!CONTENT) { $("#app").innerHTML = '<div class="wrap"><p>The question bank did not load. Ask your tutor for a fresh copy of this file.</p></div>'; return; }
  var qc = ""; try { qc = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase(); } catch(e) {}
  if (/^[A-Z0-9]{4}$/.test(qc)) {
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
    if (!S.me || S.me.code !== qc) {
      var hit = CLASS.filter(function(c){ return c.code === qc; })[0];
      S.me = {code:qc, name: hit ? hit.name : qc}; Store.set("me", S.me); try { localStorage.setItem("tlhub.me", JSON.stringify(S.me)); } catch(e) {} logEvent("open","hub");
    }
  }
  if (S.me) { loadProg(); home(); loadServer().then(function(){ if (!inGame && S.tab === "games" && S.me) home(); }); Sync.flush(); }
  else { loadServer().then(function(){ signIn(); }); signIn(); }
})();
</script>
