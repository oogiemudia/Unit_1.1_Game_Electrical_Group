<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16335B">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="9.2 PLC games">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Programmable logic controllers games</title>
<style>
:root{--navy:#16335B;--navy2:#22497D;--amber:#E8A33D;--amb:#96610F;--green:#0B6E4F;--red:#B3261E;
--ink:#1F2F4D;--head:#16335B;--muted:#5A6472;--line:#D8E2EE;--bg:#F4F7FB;--card:#FFFFFF;--tint:#EEF3FA;
--goodbg:#E7F4EE;--badbg:#FBEAEA;--ambbg:#FFF6E5;--btn:#16335B;--btnh:#22497D;--art:#16335B;--r:14px;--scale:1;
--shadow:0 1px 2px rgba(22,51,91,.06),0 3px 10px rgba(22,51,91,.05)}
[data-theme="cream"]{--bg:#F6EFE1;--card:#FFFDF8;--line:#E4D9C4;--tint:#F2EADB;--ambbg:#FBEFD6}
[data-theme="dark"]{--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;
--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0E1A2B;--card:#16263D;--ink:#E4ECF7;--head:#D3E3F8;--muted:#A6B4C7;--line:#2B3F5E;--tint:#1C3050;
--goodbg:#123A2D;--badbg:#401E1E;--ambbg:#3A2E14;--btn:#2F5E9C;--btnh:#3A6DB0;--art:#BFD4F2;--green:#63D3A8;--red:#FF8F86;--amb:#F2C879;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:Arial,"Liberation Sans",Helvetica,sans-serif;
font-size:calc(17px * var(--scale));line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-theme="cream"] body{letter-spacing:.01em;word-spacing:.06em;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.86em}
h2,h3{color:var(--head);line-height:1.25}

/* header: full on the menu, compact while playing */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.hdr .kick{color:var(--amber);font-weight:700;font-size:.8em}
.hdr h1{margin:3px 0 2px;font-size:1.5em;line-height:1.2}
.hdr .sub{color:#C3D3EA;font-size:.86em}
.rule{height:4px;background:var(--amber)}
.hdr.compact{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.hdr.compact .t{flex:1;min-width:0;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr.compact .n{font-size:.86em;color:#C3D3EA;white-space:nowrap;padding-right:6px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
display:inline-flex;align-items:center;justify-content:center}
.iconbtn.plain{background:var(--tint);color:var(--head)}
.pbar{height:6px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--amber);transition:width .35s}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
body.playing .wrap{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1.1em}
.panel{border-radius:var(--r);padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.panel.amber{background:var(--ambbg);border-color:transparent;border-left:5px solid var(--amber)}
.panel h3{margin:0 0 4px;font-size:1em}
.panel p{margin:.35em 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;
border:2px solid var(--btn);background:var(--btn);color:#fff;font-weight:700;text-decoration:none;text-align:center;line-height:1.2}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#241802}
.btn.amber:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.small{min-height:42px;padding:0 14px;font-size:.9em}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}
.link{background:none;border:0;padding:10px 4px;color:var(--head);text-decoration:underline;text-underline-offset:3px;font-weight:700;min-height:44px}
.dock{position:sticky;bottom:0;padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:8px;
background:linear-gradient(to top,var(--bg) 72%,rgba(0,0,0,0));z-index:5}

/* me strip */
.me{display:flex;gap:14px;align-items:center}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:1.05em;
display:flex;align-items:center;justify-content:center;border:3px solid var(--amber)}
.me h2{margin:0;font-size:1.2em}
.me .lvl{color:var(--muted);font-size:.88em}
.meter{height:10px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:.84em;color:var(--head);font-weight:700}
.chip svg.i{width:18px;height:18px}

/* game tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--amber)}
.tile:active{transform:scale(.98)}
.tile .art{height:80px;background:var(--tint);display:flex;align-items:center;justify-content:center}
.tile .art svg{width:128px;height:64px}
.tile .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.tile .ttl{font-weight:700;color:var(--head);line-height:1.25}
.tile .what{font-size:.82em;color:var(--muted);line-height:1.35}
.tile .rec{margin-top:auto;padding-top:8px;font-size:.8em;color:var(--muted)}
.tile .rec.good{color:var(--green);font-weight:700}
.badge{align-self:flex-start;margin-bottom:3px;background:var(--amber);color:#241802;font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px}
.tick{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.tick svg.i{width:18px;height:18px;stroke-width:3}
.rows{display:flex;flex-direction:column;gap:10px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
border-radius:var(--r);padding:12px 14px;min-height:66px;box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--amber)}
.rowbtn .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{color:var(--head);display:block}
.rowbtn .tx span{display:block;color:var(--muted);font-size:.84em;line-height:1.35}
.pill{flex:none;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--goodbg);color:var(--green)}
.pill.amber{background:var(--ambbg);color:var(--amb)}
.foot{margin:28px 4px 0;color:var(--muted);font-size:.8em;line-height:1.5}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.76em;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--head);font-weight:700}
.tabbar button[aria-current="page"] svg.i{color:var(--amber);stroke-width:2.4}
body.playing .tabbar, body.out .tabbar{display:none}

/* questions */
.qno{color:var(--amb);font-weight:700;font-size:.86em}
.qtext{font-size:1.2em;font-weight:700;color:var(--head);line-height:1.35;margin:4px 0 6px}
.qprompt{color:var(--muted);margin:8px 0 12px}
.qart{background:var(--tint);border-radius:12px;padding:10px;margin:12px 0;display:flex;justify-content:center}
.qart svg{width:100%;max-width:340px;height:auto}
.stepnote{background:var(--goodbg);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border-radius:12px;
border:2px solid var(--line);background:var(--card);text-align:left;line-height:1.35}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.88em}
.opt .l{flex:1;min-width:0}
.opt .s{flex:none;font-size:.76em;font-weight:700;text-align:right;max-width:5.5em;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--amber)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--goodbg)} .opt.correct .s{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--badbg)} .opt.wrong .s{color:var(--red)}
.opt.dim{opacity:.6}
.opts.two .opt .s{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border-left:5px solid var(--green);background:var(--goodbg)}
.fb.bad{border-left-color:var(--red);background:var(--badbg)}
.fb.info{border-left-color:var(--amber);background:var(--ambbg)}
.fb strong{display:block;margin-bottom:2px}
.fb ol{margin:.4em 0 0 1.2em;padding:0}

/* spot the error */
.chunks{display:flex;flex-wrap:wrap;gap:8px}
.chunk{padding:10px 12px;border:2px dashed var(--line);border-radius:10px;background:var(--card);text-align:left;min-height:48px;line-height:1.35}
.chunk:not(:disabled):hover{border-color:var(--amber)}
.chunk.is-error{border:2px solid var(--red);background:var(--badbg)}
.chunk.wrong-pick{border:2px solid var(--amber);background:var(--ambbg)}
.chunk.fine{opacity:.55}
.chunk:disabled{cursor:default}

/* brief or spec swipe */
.deck{position:relative;height:230px;margin:6px 0 16px;touch-action:pan-y;overflow:hidden;border-radius:20px}
.scard{position:absolute;inset:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
border-radius:18px;background:var(--card);border:2px solid var(--head);font-size:1.12em;font-weight:700;color:var(--head);
box-shadow:0 8px 24px rgba(22,51,91,.12);transition:transform .25s,opacity .25s;user-select:none}
.scard.back{transform:translateY(10px) scale(.96);opacity:.5;color:transparent;border-color:var(--line)}
.scard .hint{position:absolute;top:12px;font-size:.72em;padding:3px 10px;border-radius:999px;opacity:0;font-weight:700}
.scard .hint.l{left:12px;background:var(--tint);color:var(--head)}
.scard .hint.r{right:12px;background:var(--amber);color:#241802}

/* sequence */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip2{min-height:46px;padding:8px 12px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px 10px;background:var(--card);text-align:left;width:100%}
.slot b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--head);display:flex;align-items:center;justify-content:center;font-size:.85em}
.slot.filled{border-style:solid;border-color:var(--head)}
.slot.ok{border-color:var(--green);background:var(--goodbg)} .slot.no{border-color:var(--red);background:var(--badbg)}

/* ladder */
.rungs{display:flex;gap:5px;margin:0 0 12px}
.rungs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.rungs i.done{background:var(--green)} .rungs i.miss{background:var(--red)} .rungs i.now{background:var(--amber)}
.numrow{display:flex;gap:10px;align-items:center}
.textin{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:1.05em}
.textin:focus{border-color:var(--amber);outline:none}
.numrow .textin{flex:1;font-size:1.2em;font-weight:700}
.unit{font-weight:700;color:var(--head)}
.worked{background:var(--tint);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.92em}
.worked ol{margin:.3em 0 0 1.2em;padding:0}

/* flash cards */
.flip{display:block;perspective:1200px;width:100%;border:0;background:none;padding:0;margin:4px 0 14px}
.flip .inner{display:block;position:relative;height:250px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.front{background:var(--card);border:2px solid var(--head)}
.face.front strong{font-size:1.45em;color:var(--head);line-height:1.25}
.face.back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:1.02em;line-height:1.45}
.face.back .muted{color:#C3D3EA}

/* results */
.result{text-align:center;padding:22px 16px}
.big{font-size:3.2em;font-weight:700;color:var(--head);line-height:1.1}
.big small{font-size:.38em;color:var(--muted);font-weight:700}
.seal{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--goodbg);color:var(--green);font-weight:700}
.seal.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.code{display:inline-block;font-weight:700;letter-spacing:.08em;background:var(--card);border:2px solid var(--amber);border-radius:8px;padding:4px 10px;color:var(--head)}
.review{margin:0;padding-left:1.1em} .review li{margin:.55em 0}
.copyline{width:100%;min-height:90px;font-size:.84em;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--tint)}

/* record */
.recard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.recard b{color:var(--head)} .recard .meta{grid-column:1/2;color:var(--muted);font-size:.84em}
.recard .act{grid-row:1/3;grid-column:2/3}

/* check-ins and exit ticket */
.q{margin:18px 0}
.q > p, .q > label, .q legend{display:block;font-weight:700;color:var(--head);margin-bottom:8px}
fieldset.q{border:0;padding:0;margin-left:0;margin-right:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card);min-height:48px;font-weight:400;color:var(--ink)}
.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--navy)}
textarea.textin{min-height:96px;resize:vertical}
.rag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rag button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.rag button[aria-pressed="true"].r{background:var(--badbg);border-color:var(--red);color:var(--red)}
.rag button[aria-pressed="true"].a{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}

/* sign in */
.card label[for="code"]{display:block}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.names button{min-height:50px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--head);text-align:left;padding:8px 12px}
.names button:hover{border-color:var(--amber)}
.codebox{display:block;margin:6px auto 0;text-transform:uppercase;letter-spacing:.3em;font-size:1.5em;font-weight:700;text-align:center;max-width:260px}

/* settings */
.seg{display:grid;gap:6px;margin:6px 0 14px}
.seg button{min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9em}
.seg button[aria-pressed="true"]{border-color:var(--head);background:var(--tint);color:var(--head)}
details.tut{margin-top:12px}
details.tut summary{cursor:pointer;font-weight:700;color:var(--head);min-height:48px;display:flex;align-items:center}
.tut table{width:100%;border-collapse:collapse;font-size:.86em;margin:8px 0}
.tut td,.tut th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

/* data card */
.modal{position:fixed;inset:0;background:rgba(14,26,43,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em;font-variant-numeric:tabular-nums}
.dtable th,.dtable td{border:1px solid var(--line);padding:8px;text-align:right}
.dtable th:first-child,.dtable td:first-child{text-align:left}
.dtable thead th{background:var(--tint);color:var(--head)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;font-size:.9em}

/* tile and question art */
.a-i{fill:none;stroke:var(--art);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.a-a{fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-f{fill:var(--card);stroke:var(--art);stroke-width:2.2;stroke-linejoin:round}
.a-fa{fill:var(--amber);stroke:none}
.a-fi{fill:var(--art);stroke:none}
.a-d{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.a-t{fill:var(--art);font:700 13px Arial,sans-serif}


/* activating hard thinking layer (from the criterion 8.1 (continued) and 10.1 reference hub) */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.badges:empty{display:none}
.badge{margin-bottom:0}
.badge.next{background:var(--green);color:#fff}
.step{align-self:flex-start;background:var(--tint);color:var(--head);font-weight:700;font-size:.72em;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.part{margin-top:6px}
.part .sec{align-items:center}
.part .sec h2{font-size:1.05em}
details.goals{margin:-4px 2px 10px}
details.goals summary{cursor:pointer;color:var(--head);font-weight:700;font-size:.88em;min-height:44px;display:flex;align-items:center}
details.goals ul{margin:0 0 4px;padding-left:1.2em;font-size:.9em}
.modebox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.goal .btn.small{flex:1 1 120px}
.pill.red{background:var(--badbg);color:var(--red)}
.opt.picked{border-color:var(--amber);background:var(--ambbg)}
.rag.conf button{min-height:50px}
.rag button[aria-pressed="true"].g{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.whyno{display:block;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--card);border:1px dashed var(--red)}
.nextstep{margin-top:12px;border-left:5px solid var(--green)}
.calgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calgrid div{background:var(--tint);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.calgrid div.warn{background:var(--badbg)}
.calgrid b{font-size:1.5em;color:var(--head);line-height:1.1}
.calgrid div.warn b{color:var(--red)}
.calgrid span{font-size:.84em;color:var(--muted)}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-height:56px;padding:8px 10px;border-radius:10px;border:2px solid var(--head);background:var(--card);color:var(--head);font-weight:700;text-align:left;line-height:1.3;font-size:.92em}
.pb.r{font-weight:400;color:var(--ink);border-color:var(--line)}
.pb.sel{border-color:var(--amber);background:var(--ambbg)}
.pb.ok{border-color:var(--green);background:var(--goodbg);color:var(--green);cursor:default}
.pb.no{border-color:var(--red);background:var(--badbg)}
.ftable td{text-align:left}

@media (min-width:900px){.wrap{max-width:980px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-motion="reduce"] *{transition:none!important;animation:none!important}
/* retrieval layer and the unit games */
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.tag{font-size:.72em;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--head);border:1px solid var(--line);line-height:1.5}
.tag.sl{background:var(--ambbg);border-color:transparent;color:var(--amb)}
.tile .tags{margin:4px 0 0}
.flabel{font-size:.8em;color:var(--muted);font-weight:700;margin:10px 2px 4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.filters button{min-height:44px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--head);font-weight:700;font-size:.84em}
.filters button[aria-pressed="true"]{border-color:var(--head);background:var(--tint)}
.microw{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mic.on{background:var(--ambbg);border-color:var(--amber);color:var(--head)}
.micnote{margin:6px 0 0}
.cue{font-size:1.15em;font-weight:700;color:var(--amb);margin:2px 0 10px;line-height:1.7}
.cue .cw{display:inline-block;white-space:nowrap;margin-right:.8em}
.ideas{margin:8px 0 0;padding:0;list-style:none}
.ideas li{display:flex;gap:8px;align-items:flex-start;margin:6px 0;line-height:1.35}
.ideas li b{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85em;color:#fff;margin-top:1px}
.ideas li b svg.i{width:16px;height:16px;stroke-width:3}
.ideas li.y b{background:var(--green)} .ideas li.n b{background:var(--amb)}
.model{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.selfmark{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.selfmark.two{grid-template-columns:1fr 1fr}
.selfmark button{min-height:54px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.92em;color:var(--head);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.selfmark button .small{font-weight:400;color:var(--muted);font-size:.75em}
.selfmark button.sug{border-style:dashed;border-color:var(--amber)}
.selfmark button[aria-pressed="true"].got{background:var(--goodbg);border-color:var(--green);color:var(--green)}
.selfmark button[aria-pressed="true"].part{background:var(--ambbg);border-color:var(--amber);color:var(--amb)}
.selfmark button[aria-pressed="true"].miss{background:var(--badbg);border-color:var(--red);color:var(--red)}
.bins{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
@media (min-width:560px){.bins{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.bins.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,8em),1fr))}
.bin{border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:80px;min-width:0}
.binhead{overflow-wrap:break-word;min-height:46px;border:0;border-radius:8px;background:var(--tint);color:var(--head);font-weight:700;text-align:left;padding:6px 10px;line-height:1.25}
.binhead:not(:disabled):hover{outline:2px solid var(--amber)}
.placed{min-height:44px;border-radius:8px;border:2px solid var(--head);background:var(--card);color:var(--ink);text-align:left;padding:6px 10px;font-size:.9em;line-height:1.3;overflow-wrap:anywhere}
.placed.ok{border-color:var(--green);background:var(--goodbg)} .placed.no{border-color:var(--red);background:var(--badbg)}
.chip2{overflow-wrap:anywhere}
.chip2.sel{border-color:var(--amber);background:var(--ambbg)}
.timer{display:inline-block;margin:2px 0 10px;padding:4px 12px;border-radius:999px;background:var(--tint);color:var(--head);font-size:.9em}
.timer b{font-size:1.15em}
.timer.up{background:var(--ambbg);color:var(--amb)}
.ban{display:inline-block;margin:2px 2px;padding:1px 8px;border-radius:6px;background:var(--badbg);color:var(--red)}
.fambtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fambtns .btn{min-height:50px}
.fambtns .btn.rightans{border-color:var(--green);background:var(--goodbg);color:var(--green);opacity:1}
.fambtns .btn.wrongans{border-color:var(--red);background:var(--badbg);color:var(--red);opacity:1}
.flip[disabled]{cursor:default}
.flip[disabled] .face.front{border-style:dashed}
.scard span{font-size:1em}

</style>

var CONTENT = {"parts":[{"id":"p0","title":"Warm up","sub":"Wake up what you need from criteria 9.1, 10.2 and 8.1.","goals":["Recall the sensors, actuators, signals and circuits a PLC works with","Answer last lesson's questions from memory","Write down everything you can remember about a part"],"games":["recall","last","dump"]},{"id":"p1","title":"Part 1: What a PLC is, its parts and types","sub":"Criterion 9.2. Core Paper 1. Week 20.","goals":["Say what a PLC is and why industry uses them","Name the parts of a PLC and explain the scan cycle","Explain the three types of PLC and choose one for a job"],"games":["nameparts","scanlab","plctype"]},{"id":"p2","title":"Part 2: How a PLC operates: signal conditioning and programming","sub":"Criterion 9.2. Core Paper 1. Week 21.","goals":["Explain why sensor signals need conditioning, and four ways to do it","Name the five PLC programming languages","Read and write simple ladder logic, including a start and stop latch"],"games":["signallab","sortit","ladderlab"]},{"id":"p3","title":"Part 3: What a PLC does in a system, and where it is used","sub":"Criterion 9.2. Core Paper 1. Week 22.","goals":["Show a PLC as a process block in a system","Explain motor driver ICs and interface devices","Describe PLC applications and weigh PLCs against dedicated ICs and computers"],"games":["driver","swipe","appsort","recommend"]},{"id":"mix","title":"Pull it together","sub":"The whole criterion, mixed. Play these once you have met all three parts.","goals":["Work out scan, signal and divider calculations without the worked example","Recall and explain every key word","Mark exam answers the way an examiner does"],"games":["ladder","term","taboo","why","errors","examiner","boss"]}],"goals":[{"t":"Say what a PLC is and why industry uses them","games":["nameparts","term","why"]},{"t":"Name the parts of a PLC and explain the scan cycle","games":["nameparts","scanlab","taboo"]},{"t":"Explain the three types of PLC and choose one for a job","games":["plctype","why","errors"]},{"t":"Explain why sensor signals need conditioning, and four ways to do it","games":["sortit","signallab","examiner"]},{"t":"Name the five PLC programming languages","games":["sortit","term","taboo"]},{"t":"Read and write simple ladder logic, including a start and stop latch","games":["ladderlab","errors","why"]},{"t":"Show a PLC as a process block in a system","games":["appsort","swipe","term"]},{"t":"Explain motor driver ICs and interface devices","games":["driver","appsort","why"]},{"t":"Describe PLC applications and weigh PLCs against dedicated ICs and computers","games":["recommend","swipe","examiner"]}],"recall":[{"id":"R01","q":"Which device detects a change, such as in light, heat or position, and gives out a signal?","opts":["A sensor","An actuator","A drive device","A solenoid"],"why":"A sensor is an input device: it detects a change and gives a signal (criteria 9.1 and 10.2).","fb":{"An actuator":"An actuator is the output: it turns a signal into movement."},"t":{"k":"short","acc":["sensor","a sensor","sensors","input sensor","input transducer","input device"]}},{"id":"R02","q":"Which device turns an electrical signal into physical movement?","opts":["An actuator","A sensor","A thermistor","A microcontroller"],"why":"An actuator is an output device, such as a motor, solenoid or cylinder (criterion 9.1).","fb":{"A sensor":"A sensor is the input. It detects a change; it does not move anything."},"t":{"k":"short","acc":["actuator","an actuator","actuators","output device","output transducer"]}},{"id":"R03","q":"What is a microcontroller?","opts":["A small computer on one chip that reads inputs and controls outputs","A chip that only stores data","A motor with a position sensor","A program that runs on a laptop"],"why":"A microcontroller has the processor, memory and inputs and outputs on one chip (criterion 9.1).","fb":{"A motor with a position sensor":"That is a servo motor, a drive device."}},{"id":"R04","q":"Which describes an analogue signal?","opts":["It varies smoothly over a range","It has only two levels, on and off","It is always a square wave","It only exists inside computers"],"why":"Analogue varies smoothly over a range. Digital has set levels, usually on and off (1 or 0).","fb":{"It has only two levels, on and off":"That is a digital signal."},"t":{"k":"short","acc":["varies smoothly","varies continuously","continuous","continuously variable","any value in a range","it varies smoothly over a range","smoothly varying","continuously varying"]}},{"id":"R05","q":"A limit switch is either pressed or not. What kind of signal does it give?","opts":["Digital","Analogue","4 to 20 mA","Sine wave"],"why":"On or off is a digital signal. A limit switch, a push button and a proximity sensor all give digital signals.","fb":{"Analogue":"Analogue gives any value in a range. A limit switch only has two states."},"t":{"k":"short","acc":["digital","a digital signal","digital signal","on off","on or off"]}},{"id":"R06","q":"Which drive device moves in precise steps, one step for each pulse?","opts":["Stepper motor","Servo motor","Standard DC motor","Solenoid"],"why":"A stepper turns one step per pulse, so the controller knows its position by counting (criterion 9.1).","fb":{"Servo motor":"A servo turns to an angle set by the pulse width and holds it with a position sensor."},"t":{"k":"short","acc":["stepper","stepper motor","stepping motor","a stepper motor","steppers"]}},{"id":"R07","q":"Which drive device turns to a set angle and holds it using a position sensor?","opts":["Servo motor","Stepper motor","Standard DC motor","Solenoid"],"why":"A servo uses feedback from a position sensor to hold its angle (closed loop).","fb":{"Stepper motor":"A stepper counts pulses with no sensor (open loop)."},"t":{"k":"short","acc":["servo","servo motor","servomotor","a servo motor","servos"]}},{"id":"R08","q":"What does a proximity sensor do?","opts":["Detects an object close by without touching it","Measures the temperature of a liquid","Counts the pulses sent to a stepper","Turns light into movement"],"why":"Proximity sensors detect a nearby object with no contact: inductive ones see metal (criterion 10.2)."},{"id":"R09","q":"A potential divider has R1 = 20 kΩ and R2 = 5 kΩ across 10 V. What is Vout across R2?","opts":["2 V","8 V","4 V","2.5 V"],"why":"Vout = Vin × R2 ÷ (R1 + R2) = 10 × 5 ÷ 25 = 2 V (criterion 8.1).","fb":{"8 V":"That is the voltage across R1. Vout is across R2.","2.5 V":"That is 10 ÷ 4. Use Vin × R2 ÷ (R1 + R2)."},"t":{"k":"num","v":2,"unit":"V","tol":0.01}},{"id":"R10","q":"In a 4 to 20 mA signal, what does 0 mA tell the controller?","opts":["Something is wrong, such as a broken wire","The reading is at the bottom of its range","The reading is at the top of its range","The sensor is in standby"],"why":"4 mA is the bottom of the range, so 0 mA can only mean a fault. That is the live zero (criterion 10.2).","fb":{"The reading is at the bottom of its range":"The bottom of the range is 4 mA, not 0 mA."}},{"id":"R11","q":"A 4 to 20 mA level sensor covers 0 to 400 mm. It sends 12 mA. What is the level?","opts":["200 mm","240 mm","300 mm","120 mm"],"why":"Take off the live zero: (12 − 4) ÷ 16 × 400 = 200 mm (criterion 10.2).","fb":{"240 mm":"That is 12 ÷ 20 × 400. Take off the 4 mA live zero first.","300 mm":"That is 12 ÷ 16 × 400. Take off the 4 mA first."},"t":{"k":"num","v":200,"unit":"mm","tol":0.01}},{"id":"R12","q":"A controller's output pin cannot supply enough current for a motor. What is used to switch the motor current?","opts":["A transistor","A diode","A capacitor","A fuse"],"why":"A small control current switches a transistor, which switches the bigger motor current. Motor driver chips are built from transistors.","fb":{"A diode":"A diode lets current through one way only. It does not switch on and off from a control signal.","A fuse":"A fuse protects a circuit. It does not switch a motor."},"t":{"k":"short","acc":["transistor","a transistor","mosfet","motor driver","motor driver ic","driver ic","darlington","relay"]}},{"id":"R13","q":"A small current in a coil closes a switch that controls a separate, bigger circuit. What is this device?","opts":["A relay","A thermistor","A capacitor","An LDR"],"why":"A relay lets a small control signal switch a big load, with the two circuits kept apart.","t":{"k":"short","acc":["relay","a relay","relays","contactor"]}},{"id":"R14","q":"24 V is across a 1.2 kΩ resistor. What current flows?","opts":["20 mA","28.8 A","50 mA","0.2 A"],"why":"I = V ÷ R = 24 ÷ 1200 = 0.02 A = 20 mA (Ohm's law, criterion 8.1). That is about what one output pin can give.","fb":{"28.8 A":"You multiplied. I = V ÷ R.","50 mA":"That is R ÷ V. I = V ÷ R."},"t":{"k":"num","v":0.02,"unit":"A","tol":0.01}},{"id":"R15","q":"In an input, process, output block diagram, where does the controller go?","opts":["Process","Input","Output","Feedback"],"why":"The controller decides what to do, so it is the process block (criteria 3.1 and 9.1).","fb":{"Input":"Inputs are the sensors and switches. The controller decides, so it is the process."},"t":{"k":"short","acc":["process","the process","process block","processing","processor"]}},{"id":"R16","q":"A diode is fitted across a motor or relay coil. What is it for?","opts":["To give the voltage spike a safe path when the coil switches off","To make the motor run faster","To store charge for later","To turn AC into DC for the motor"],"why":"Switching off a coil makes a voltage spike. The diode gives it a safe path so it cannot damage the switch.","fb":{"To turn AC into DC for the motor":"That is rectification, which needs more than one diode and is a different job."}}],"keywords":[{"id":"K101","term":"PLC","acc":["plc","programmable logic controller","plcs","programmable logic controllers","a plc"],"part":1,"slide":24,"def":"A programmable device that reads inputs and controls outputs in industrial control systems."},{"id":"K102","term":"CPU","acc":["cpu","central processing unit","the cpu","processor"],"part":1,"slide":24,"def":"The part of the PLC that runs the program and holds it in memory."},{"id":"K103","term":"Input module","acc":["input module","input modules","input card","input unit","inputs module"],"part":1,"slide":24,"def":"Connects sensors and switches to the PLC and protects the CPU."},{"id":"K104","term":"Output module","acc":["output module","output modules","output card","output unit","outputs module"],"part":1,"slide":24,"def":"Switches motors, valves and lamps using relays, transistors or triacs."},{"id":"K105","term":"Programming device","acc":["programming device","programming unit","programmer","programming terminal","programming console"],"part":1,"slide":24,"def":"A laptop or hand-held unit used to write, download and monitor the program."},{"id":"K106","term":"Scan cycle","acc":["scan cycle","scan","the scan","scanning cycle","plc scan","scan loop","the scan cycle"],"part":1,"slide":24,"def":"Read inputs, run the program, update outputs, housekeeping, then repeat."},{"id":"K107","term":"Housekeeping","acc":["housekeeping","house keeping"],"part":1,"slide":15,"def":"The last stage of every scan: self-checks and communications."},{"id":"K108","term":"Unitary PLC","acc":["unitary","unitary plc","unitary type","a unitary plc"],"part":1,"slide":24,"def":"All parts in one housing with a fixed number of I/O."},{"id":"K109","term":"Unitary with modular features","acc":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"],"part":1,"slide":24,"def":"A compact base unit that can take a limited number of add-on modules."},{"id":"K110","term":"Modular PLC","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"],"part":1,"slide":24,"def":"Separate modules in a rack that can be added, removed or swapped."},{"id":"K201","term":"Signal conditioning","acc":["signal conditioning","sensor signal conditioning","conditioning","signal conditioner","conditioning the signal"],"part":2,"slide":51,"def":"Changing a sensor's signal so a PLC can process it."},{"id":"K202","term":"Analogue to digital conversion","acc":["analogue to digital conversion","analogue to digital","adc","a to d","a to d conversion","analogue to digital converter","digitising","digitisation","analogue digital conversion"],"part":2,"slide":51,"def":"Changing a continuous analogue signal into a discrete digital signal."},{"id":"K203","term":"Amplification","acc":["amplification","amplify","amplifying","amplifier","amplified"],"part":2,"slide":51,"def":"Increasing the size, or gain, of a signal."},{"id":"K204","term":"Attenuation","acc":["attenuation","attenuate","attenuating","attenuator","attenuated"],"part":2,"slide":51,"def":"Reducing the strength of a signal."},{"id":"K205","term":"Filtering","acc":["filtering","filter","filters","filtered","noise filtering"],"part":2,"slide":51,"def":"Removing unwanted parts of a signal, such as noise."},{"id":"K206","term":"Live zero","acc":["live zero","live 0"],"part":2,"slide":51,"def":"4 mA is the bottom of the range, so 0 mA shows a fault."},{"id":"K207","term":"Ladder logic","acc":["ladder logic","ladder","ladder diagram","ladder logic diagram","ladder programming"],"part":2,"slide":51,"def":"A graphical PLC language based on relay circuit diagrams."},{"id":"K208","term":"Rung","acc":["rung","rungs","a rung","ladder rung"],"part":2,"slide":51,"def":"One line of a ladder: inputs on the left, output on the right."},{"id":"K209","term":"Contact","acc":["contact","contacts","a contact","input contact"],"part":2,"slide":51,"def":"A ladder input symbol: normally open or normally closed."},{"id":"K210","term":"Coil","acc":["coil","output coil","coils","a coil"],"part":2,"slide":51,"def":"A ladder output that turns on when power reaches it."},{"id":"K211","term":"Latch","acc":["latch","latching","seal in","seal in contact","latch circuit","latched","holding contact","self holding","latching circuit","a latch"],"part":2,"slide":51,"def":"Uses the output's own contact beside START to keep the output on after START is let go."},{"id":"K212","term":"Structured text","acc":["structured text","st"],"part":2,"slide":51,"def":"A PLC language typed as lines of code."},{"id":"K213","term":"Function block diagram","acc":["function block diagram","fbd","function block","function blocks","function block diagrams"],"part":2,"slide":37,"def":"Blocks wired together, like a system diagram. Good for timers, counters and maths blocks."},{"id":"K214","term":"Instruction list","acc":["instruction list","il","statement list","instruction lists"],"part":2,"slide":37,"def":"Short low-level commands, one per line. An older language, now being phased out."},{"id":"K215","term":"Sequential function chart","acc":["sequential function chart","sfc","sequential function charts"],"part":2,"slide":37,"def":"Steps and transitions, like a flowchart. Good for sequences such as fill, mix, empty."},{"id":"K301","term":"Process block","acc":["process block","process","processing block","the process block","process stage"],"part":3,"slide":89,"def":"The part of a system that takes inputs, decides, and controls outputs."},{"id":"K302","term":"Motor driver IC","acc":["motor driver ic","motor driver","driver ic","motor driver chip","driver chip","motor driver integrated circuit","motor driver ics"],"part":3,"slide":89,"def":"A chip that gives a motor enough current to run correctly."},{"id":"K303","term":"ULN2803","acc":["uln2803","uln 2803","uln2803a"],"part":3,"slide":89,"def":"An eight-channel Darlington driver; current flows one way only."},{"id":"K304","term":"L293D","acc":["l293d","l293","l 293d","l293 d"],"part":3,"slide":89,"def":"Two H-bridges, so it can drive two motors both ways."},{"id":"K305","term":"H-bridge","acc":["h bridge","hbridge","h bridge circuit","an h bridge"],"part":3,"slide":89,"def":"Four switches that let current flow through a motor either way."},{"id":"K306","term":"Interface device","acc":["interface device","interface","interface devices","interface module"],"part":3,"slide":89,"def":"A module that keeps signals accurate between a PLC and its I/O."},{"id":"K307","term":"Opto-isolator","acc":["opto isolator","optoisolator","opto coupler","optocoupler","optical isolator","opto","opto isolators"],"part":3,"slide":89,"def":"Passes a signal as light, so spikes cannot reach the CPU."},{"id":"K308","term":"SCADA","acc":["scada","supervisory control and data acquisition"],"part":3,"slide":89,"def":"Software to supervise, monitor and control industrial processes."},{"id":"K309","term":"HMI","acc":["hmi","human machine interface","touch screen","touchscreen"],"part":3,"slide":89,"def":"The screen operators use to see and change what the PLC is doing."},{"id":"K310","term":"RTU","acc":["rtu","remote terminal unit","remote technical unit","remote terminal units","remote technical units","remote unit"],"part":3,"slide":89,"def":"Gathers data and controls equipment at a distant site, sending it back by radio or mobile network."},{"id":"K311","term":"Animatronics","acc":["animatronics","animatronic","animatronic figure","animatronic robot"],"part":3,"slide":89,"def":"Mechanical and electronic parts used to make lifelike robots."},{"id":"K312","term":"Dedicated IC","acc":["dedicated ic","dedicated integrated circuit","dedicated chip","asic","custom chip","custom ic"],"part":3,"slide":89,"def":"A chip designed to do one fixed job in a product."},{"id":"K313","term":"Relay","acc":["relay","relays","a relay"],"part":3,"slide":64,"def":"A small output switches a big load, and the two circuits stay separate."},{"id":"K314","term":"Signal converter","acc":["signal converter","converter","signal converters"],"part":3,"slide":64,"def":"Changes one signal type into another, such as mA into volts."},{"id":"K315","term":"Timer","acc":["timer","timers","delay timer","a timer"],"part":3,"slide":57,"def":"Keeps a signal on or off for a set time, such as holding a barrier up for 10 seconds."},{"id":"K316","term":"Counter","acc":["counter","counters","a counter"],"part":3,"slide":57,"def":"Counts events, such as 12 bottles, then acts."},{"id":"K317","term":"Comparator","acc":["comparator","comparators","compare block","a comparator"],"part":3,"slide":57,"def":"Compares a value with a set point, such as starting the cooling fan above 60 °C."},{"id":"K318","term":"Computer-based system","acc":["computer based system","computer","pc","industrial pc","computer system","computer based","computer based systems","a computer"],"part":3,"slide":77,"def":"A general-purpose machine that controls equipment through I/O cards or a network, programmed in languages such as Python or C#."}],"formulas":[["Scans per second","1 ÷ scan time (in seconds)"],["Scan time","1 ÷ scans per second"],["Time an object blocks a sensor","length ÷ speed (metres and m/s)"],["Scans while it is blocked","time blocked ÷ scan time"],["4 to 20 mA reading","value = (reading − 4) ÷ 16 × range"],["Current for a value","current = 4 + (value ÷ range) × 16 mA"],["Amplifier gain","gain = output voltage ÷ input voltage (same units, no unit on the answer)"],["ADC values","2ⁿ for an n-bit ADC"],["ADC step size","input range ÷ 2ⁿ"],["Potential divider","Vout = Vin × R2 ÷ (R1 + R2)"],["Divider for a set Vout","R1 + R2 = Vin × R2 ÷ Vout, then take away R2"]],"formulaNote":"Change ms to s and mm to m before you divide. For 4 to 20 mA, take off the 4 mA live zero first. Gain has no unit.","checkin":{"p1":{"title":"Part 1 check-in: what a PLC is, its parts and types","lines":["Say what a PLC is and give three reasons industry uses them.","Name the four main components of a PLC and say what each does.","Put the four stages of the scan cycle in order.","Work out scans per second, and say when a PLC could miss a short signal.","Describe unitary, unitary with modular features and modular PLCs.","Choose a PLC type for an installation and give a reason."]},"p2":{"title":"Part 2 check-in: signal conditioning and ladder logic","lines":["Explain what signal conditioning is and why it is needed.","Name and describe ADC, amplification, attenuation and filtering.","Turn a 4 to 20 mA reading into a value, using the live zero.","Work out an amplifier gain and an ADC step size.","Name the five PLC programming languages.","Read a rung: series is AND, parallel is OR, normally closed is NOT.","Write a start and stop latch with a seal-in contact."]},"p3":{"title":"Part 3 check-in: functions, applications and alternatives","lines":["Show a PLC as the process block between inputs and outputs.","Explain why a motor driver IC is needed.","Compare the ULN2803 and the L293D, and choose one for a job.","Explain what interface devices do, including the opto-isolator.","Describe robotic arms, conveyors, packaging, SCADA, RTUs and animatronics.","Weigh a PLC against a dedicated IC and a computer-based system for a job."]}},"checkinRecall":{"p1":[{"id":"CK11","k":"term","q":"Which type of PLC has separate modules plugged into a rack, so it can be expanded easily?","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"],"rivals":["unitary","unitary plc","unitary type","a unitary plc","unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"],"p":1,"a":21,"why":"A modular PLC: modules can be added, removed or swapped."},{"id":"CK12","k":"num","q":"A PLC has a scan time of 5 ms. How many scans does it make each second?","v":200,"unit":"scans per second","tol":0.01,"p":1,"a":16,"why":"1 ÷ 0.005 s = 200 scans per second."}],"p2":[{"id":"CK21","k":"short","q":"Which method of signal conditioning removes electrical noise from a signal?","acc":["filtering","filter","filters","noise filtering"],"rivals":["amplification","attenuation","analogue to digital conversion","adc"],"p":2,"a":31,"why":"Filtering removes unwanted parts of a signal, such as noise."},{"id":"CK22","k":"num","q":"A 0 to 40 mV sensor feeds a 0 to 10 V PLC input. What gain is needed?","v":250,"unit":"","tol":0.01,"p":2,"a":33,"why":"40 mV = 0.040 V, so gain = 10 ÷ 0.040 = 250."}],"p3":[{"id":"CK31","k":"short","q":"Which driver IC has two H-bridges, so it can drive two motors forwards and backwards?","acc":["l293d","l293","l 293d"],"rivals":["uln2803"],"p":3,"a":60,"why":"The L293D: two H-bridges, so current can flow either way through each motor."},{"id":"CK32","k":"term","q":"Software used to supervise, monitor and control whole industrial processes from a control room.","acc":["scada","supervisory control and data acquisition"],"rivals":["hmi","rtu","plc"],"p":3,"a":70,"why":"SCADA: supervisory control and data acquisition."}]},"exit":{"q1":{"q":"Explain how a start and stop latch keeps motor M1 running after START is let go, and how STOP turns it off.","ideas":[["START and an M1 contact are in parallel",["parallel","beside","next to","alongside","around start","across start","branch"]],["The M1 seal-in contact keeps the rung powered",["seal","latch","its own contact","m1 contact","own contact","holds itself","stays on","remains on"]],["STOP is a normally closed contact in series",["normally closed","nc","series","closed contact"]],["Pressing STOP opens the rung, so M1 and its seal-in drop out",["breaks","break","opens","cuts","no power","drops out","drop out","turns off","switches off","de energ","unlatch","goes off","stops the power"]]],"need":3,"model":"START and an M1 contact sit in parallel, then STOP as a normally closed contact, then the M1 coil. Pressing START powers the coil and the M1 contact closes. When START is let go, power still flows through that seal-in contact, so M1 stays on. Pressing STOP opens the rung, the coil goes off and the seal-in drops out."},"q2":{"q":"Which is the right order for one PLC scan?","opts":["Run program, read inputs, update outputs, housekeeping","Read inputs, update outputs, run program, housekeeping","Read inputs, run program, update outputs, housekeeping","Housekeeping, update outputs, run program, read inputs"],"ans":2},"q2b":{"q":"Tick the three reasons a PLC suits a packaging line better than a dedicated IC.","opts":["It is the cheapest option when millions are made","A new pack size is just a program change","It is tiny and uses very little power","It is built to run in factory conditions","It is excellent at storing and analysing data","Faults can be found by watching the program live"],"ans":[1,3,5]},"q3":{"q":"A robot buggy has two small motors that must go forwards and backwards. Which chip drives them?","opts":["ULN2803","Opto-isolator","L293D","A relay on each pin"],"ans":2},"q4":{"id":"XQ4","k":"num","q":"A 4 to 20 mA transmitter covers 0 to 200 °C. It sends 16 mA. What is the temperature? Type the number and the unit.","v":150,"unit":"°C","tol":0.01,"p":2,"a":32,"why":"(16 − 4) ÷ 16 × 200 = 150 °C."},"q5":{"id":"XQ5","k":"term","q":"Type the name of the PLC type that keeps everything in one housing, with a fixed number of inputs and outputs.","acc":["unitary","unitary plc","unitary type","a unitary plc"],"rivals":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules","modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"],"p":1,"a":19,"why":"A unitary PLC: everything in one housing, with fixed I/O."}},"last":{"1":[{"id":"L101","k":"gap","q":"Fill the gap: a ___ is a programmable device used in manufacturing and industrial control systems.","acc":["plc","programmable logic controller","programmable logic controllers","a plc"],"p":1,"a":7,"why":"A programmable logic controller (PLC)."},{"id":"L102","k":"explain","q":"Why did factories move from relay panels to PLCs?","ideas":[["A new job meant rewiring the relay panel, which took days",["rewir","wiring","wires","days","slow","took ages","time"]],["A PLC is changed by changing its program instead",["program","reprogram","software","code"]]],"need":2,"model":"With a relay panel, changing what the machine did meant rewiring it, which took days and was easy to get wrong. A PLC is changed by changing its program instead.","p":1,"a":8},{"id":"L103","k":"short","q":"Which part of a PLC turns the incoming 230 V AC into the low-voltage DC the electronics need?","acc":["power supply","psu","power supply unit","the power supply","power unit"],"p":1,"a":12,"why":"The power supply, usually giving 24 V DC.","rivals":["cpu","input module","output module","programming device"]},{"id":"L104","k":"explain","q":"What does the PLC do in each stage of the scan cycle, in order?","ideas":[["Reads every input into memory",["read","copy","inputs"]],["Runs the program, top to bottom",["run","program","execute","logic"]],["Updates the outputs",["update","outputs","switch the outputs","write"]],["Housekeeping, then repeats",["housekeep","self check","checks","communicat","repeat","again","loop"]]],"need":4,"model":"It reads every input into memory, runs the program top to bottom, updates the outputs, does housekeeping (self-checks and communications), then repeats.","p":1,"a":15},{"id":"L105","k":"num","q":"In the worked example the scan time was 10 ms. How many scans did the PLC make each second?","v":100,"unit":"scans per second","tol":0.01,"p":1,"a":16,"why":"1 ÷ 0.010 s = 100 scans every second."},{"id":"L106","k":"explain","q":"In the worked example, why could the PLC miss the 6 mm label?","ideas":[["The label blocks the sensor for only 4 ms",["4 ms","4ms","0.004","4 milliseconds","four milliseconds","only 4","tiny"]],["That is shorter than one 10 ms scan, so it can pass between two input reads",["scan","10 ms","10ms","between","read"]]],"need":2,"model":"The label blocks the sensor for 0.006 ÷ 1.5 = 0.004 s = 4 ms. That is shorter than one 10 ms scan, so it can come and go between two input reads.","p":1,"a":16},{"id":"L107","k":"short","q":"Which type of PLC keeps the power supply, CPU and a fixed number of I/O in one housing?","acc":["unitary","unitary plc","unitary type","a unitary plc"],"p":1,"a":19,"why":"Unitary: everything in one housing, with a fixed number of I/O.","rivals":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules","modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},{"id":"L108","k":"short","q":"A water treatment works has about 600 sensors, pumps and valves. Which type of PLC suits it?","acc":["modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"],"p":1,"a":23,"why":"Modular: a huge I/O count, easy to expand, and a faulty card can be swapped in minutes.","rivals":["unitary","unitary plc","unitary type","a unitary plc","unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"]},{"id":"L109","k":"gap","q":"Fill the gap: digital inputs read on or off. Analogue inputs read a value in a ___, usually 4 to 20 mA or 0 to 10 V.","acc":["range","a range"],"p":1,"a":13,"why":"A range: analogue inputs read any value in a range."}],"2":[{"id":"L201","k":"explain","q":"What is signal conditioning?","ideas":[["Changing or modifying a sensor's signal",["modif","chang","convert","adjust","alter"]],["So it meets the requirements for processing by the PLC",["plc","process","requirement","read","use it","understand","input"]]],"need":2,"model":"Signal conditioning means modifying the signal from a sensor so that it meets the requirements for processing by a PLC.","p":2,"a":30},{"id":"L202","k":"explain","q":"Why does a 4 to 20 mA signal start at 4 mA, not 0 mA?","ideas":[["0 mA then shows a fault, such as a broken wire",["fault","broken","break","wire","wrong","failure","error","cut"]],["4 mA is the bottom of the range: a live zero",["live zero","bottom","lowest","minimum","zero reading","start of the range"]]],"need":2,"model":"4 mA means the bottom of the range, so 0 mA can only mean something is wrong, such as a broken wire. This is called a live zero.","p":2,"a":32},{"id":"L203","k":"num","q":"In the slide 32 example, a 0 to 100 °C transmitter sent 12 mA. What was the temperature?","v":50,"unit":"°C","tol":0.01,"p":2,"a":32,"why":"(12 − 4) ÷ 16 × 100 = 50 °C."},{"id":"L204","k":"num","q":"In the worked example, a 0 to 20 mV load cell fed a 0 to 10 V input. What gain did the amplifier need?","v":500,"unit":"","tol":0.01,"p":2,"a":33,"why":"20 mV = 0.020 V, so gain = 10 ÷ 0.020 = 500."},{"id":"L205","k":"short","q":"Which method of signal conditioning reduces a signal that is too large, for example with a potential divider?","acc":["attenuation","attenuate","attenuating","attenuator"],"p":2,"a":31,"why":"Attenuation reduces the strength of a signal that is too large for the input.","rivals":["amplification","amplify","filtering","analogue to digital conversion"]},{"id":"L206","k":"explain","q":"When does a normally closed contact pass power?","ideas":[["When its input is off",["off","not pressed","not on","not active","false","released","not operated","isnt on","is not on","not switched on"]]],"need":1,"model":"A normally closed contact passes power when its input is off. It asks: is it off?","p":2,"a":40},{"id":"L207","k":"explain","q":"In ladder logic, how are AND and OR drawn?","ideas":[["AND: contacts in series",["series"]],["OR: contacts in parallel",["parallel"]]],"need":2,"model":"AND is contacts in series: every one must pass power. OR is contacts in parallel: any one branch can pass power.","p":2,"a":41},{"id":"L208","k":"explain","q":"In the latch model, what does the seal-in contact do?","ideas":[["It is the output's own contact, in parallel with START",["own contact","pump contact","m1 contact","output contact","parallel","beside","around start"]],["It keeps the output on after START is let go",["keep","stay","remain","hold","let go","released","latch"]]],"need":2,"model":"The seal-in is a contact from the PUMP coil, wired in parallel with START. Once the pump is on it keeps its own rung powered, so the pump stays on after START is let go.","p":2,"a":43},{"id":"L209","k":"short","q":"Name the PLC language typed as lines of code, a bit like a computer program (IF ... THEN).","acc":["structured text","st"],"p":2,"a":37,"why":"Structured text: typed lines of code, good for maths and complex decisions.","rivals":["ladder logic","function block diagram","instruction list","sequential function chart"]}],"3":[{"id":"L301","k":"short","q":"In a system diagram, which block is the PLC: input, process or output?","acc":["process","process block","the process","processing","the process block"],"p":3,"a":56,"why":"The process block: it takes inputs, decides, and controls outputs.","rivals":["input","output","input block","output block"]},{"id":"L302","k":"explain","q":"Why is a motor driver IC needed between a controller and a motor?","ideas":[["The controller's output cannot supply enough current (about 20 mA)",["current","20 ma","not enough","too small","too little","weak","cannot supply","cant supply","cannot provide"]],["The driver IC gives the motor the bigger current, from its own supply",["driver","supply","provides","gives","amplif","bigger","extra","larger","boost"]]],"need":2,"model":"A controller's output pin gives only about 20 mA, but a small motor draws a few hundred milliamps. The driver IC takes the small control signal and gives the motor the current it needs from its own supply.","p":3,"a":58},{"id":"L303","k":"explain","q":"Why can a ULN2803 not reverse a motor?","ideas":[["Current flows through it in one direction only",["one direction","one way","single direction","only one way","same direction","cannot reverse the current","cant reverse the current"]]],"need":1,"model":"Current flows through a ULN2803 in one direction only, so a motor can be switched on and off but not reversed. Reversing needs an H-bridge, as in the L293D.","p":3,"a":59},{"id":"L304","k":"short","q":"Which IC has two H-bridges, so it can drive two motors forwards and backwards?","acc":["l293d","l293","l 293d","l293 d"],"p":3,"a":60,"why":"The L293D: two H-bridges, up to 600 mA per motor.","rivals":["uln2803","uln 2803"]},{"id":"L305","k":"explain","q":"How does an opto-isolator protect the PLC's CPU?","ideas":[["The signal crosses as light, from an LED to a phototransistor",["light","led","phototransistor","optical","infrared"]],["No wire crosses the gap, so spikes or high voltages cannot reach the CPU",["no wire","no connection","not connected","no electrical","gap","isolat","separate","spike","high voltage","cannot reach","cant reach"]]],"need":2,"model":"The field signal lights a small LED. The light crosses a tiny gap to a phototransistor, which passes the signal to the CPU. No wire crosses the gap, so a spike or high voltage on the factory wiring cannot reach the CPU.","p":3,"a":65},{"id":"L306","k":"explain","q":"Name three elements of a SCADA system.","ideas":[["Supervisory computers",["supervisory","computer","pc","server"]],["RTUs",["rtu","remote"]],["PLCs with sensors and actuators",["plc","sensor","actuator"]],["A communications network",["network","communicat","radio","comms","ethernet"]],["An HMI for the operators",["hmi","human","screen","operator"]]],"need":3,"model":"Any three of: supervisory computers, remote terminal units (RTUs), PLCs with sensors and actuators, communications networks, and an HMI for the operators.","p":3,"a":70},{"id":"L307","k":"explain","q":"Why isn't the controller in an electric toothbrush a PLC?","ideas":[["A dedicated IC is very cheap per unit when made in large numbers",["cheap","cost","price","mass","millions","large numbers","volume"]],["It is tiny, uses little power and only does one fixed job",["small","tiny","size","power","battery","one job","fixed","single job","simple"]]],"need":2,"model":"A toothbrush is made in millions and only ever does one job, so a dedicated IC is far cheaper per unit, tiny and uses little power. A PLC would be too big, too costly and too power hungry.","p":3,"a":76},{"id":"L308","k":"explain","q":"Give one advantage of a PLC over a computer-based system on a factory floor.","ideas":[["More rugged and reliable in dust, heat and vibration",["rugged","robust","reliab","tough","dust","heat","vibration","harsh"]],["Fast, predictable timing, or less risk of crashes and cyber attack",["predictable","timing","real time","crash","cyber","restart","secure","fault find"]]],"need":1,"model":"Any one: more rugged and reliable in dust, heat and vibration; fast, predictable real-time control; lower crash and cyber risk; quick restart; simple fault finding.","p":3,"a":78},{"id":"L309","k":"short","q":"Which application? A light curtain stops the arm when someone reaches into the cell.","acc":["robotic arm","robot arm","robotic arms","robot","robotics","robot cell","robotic arm cell"],"p":3,"a":75,"why":"A robotic arm cell: the PLC watches the safety devices, such as a light curtain.","rivals":["conveyor belt","conveyor","packaging","scada","remote terminal unit","rtu","animatronics"]}]},"dump":{"1":{"topic":"What a PLC is, its parts and types","slides":"5 to 26","ideas":[["A PLC is a programmable device that reads inputs and controls outputs",["programmable","inputs","outputs"]],["Industry uses them: reliable, rugged, easy to program, lots of I/O",["reliab","rugged","robust","easy to program"]],["They replaced relay panels: change the program, not the wiring",["relay","rewir","wiring"]],["Parts: power supply, CPU, programming device, I/O modules",["power supply","cpu","programming device","module"]],["The CPU runs the program and holds it in memory",["memory","processor"]],["Digital inputs are on or off; analogue inputs read a value in a range",["digital","analogue"]],["Scan cycle: read inputs, run program, update outputs, housekeeping",["scan","housekeep"]],["Scans per second = 1 ÷ scan time; a very short signal can be missed",["scans per second","scan time","miss"]],["Unitary: all in one housing, fixed I/O, cheapest",["unitary"]],["Unitary with modular features: a base unit plus a few add-on modules",["modular features","add on","base unit"]],["Modular: separate modules in a rack, easy to expand and swap",["rack","swap","expand"]]]},"2":{"topic":"Signal conditioning and ladder logic","slides":"28 to 53","ideas":[["Signal conditioning changes a sensor signal so the PLC can process it",["conditioning"]],["ADC turns an analogue signal into numbers",["adc","analogue to digital","numbers"]],["Amplification makes a small signal bigger (gain)",["amplif","gain"]],["Attenuation makes a big signal smaller, such as with a potential divider",["attenuat","potential divider"]],["Filtering removes noise",["filter","noise"]],["4 to 20 mA: 4 mA is a live zero, so 0 mA shows a fault",["4 to 20","live zero","20 ma"]],["More ADC bits give more values (2ⁿ) and smaller steps",["bit","step","4096"]],["Five languages: ladder, FBD, structured text, instruction list, SFC",["structured text","function block","instruction list","sequential function","fbd","sfc"]],["Ladder: rails and rungs, contacts on the left, coils on the right",["rung","rail","coil"]],["Normally open and normally closed contacts",["normally open","normally closed"]],["Series is AND, parallel is OR, normally closed is NOT",["series","parallel"]],["A latch: a seal-in contact beside START keeps the output on",["latch","seal"]]]},"3":{"topic":"Functions, applications and alternatives","slides":"55 to 90","ideas":[["The PLC is the process block between inputs and outputs",["process"]],["Inside: logic gates, timers, counters, comparators, latches",["timer","counter","comparator"]],["Motor driver ICs give motors more current than the controller can",["driver","current"]],["ULN2803: eight channels, 500 mA, one direction only",["uln2803","darlington","eight channel","8 channel"]],["L293D: two H-bridges, so motors go forwards and backwards",["l293d","h bridge","reverse"]],["Interface devices: relay, opto-isolator, signal converter, comms, wireless, HMI",["interface","opto","relay","hmi","converter"]],["Applications: robotic arms, conveyors, packaging",["robot","conveyor","packag"]],["SCADA supervises whole processes; RTUs work at remote sites",["scada","rtu","remote"]],["Animatronics: lifelike figures moved in a timed show",["animatronic"]],["Dedicated IC: cheap in volume, one fixed job, hard to change",["dedicated"]],["Computer-based system: great with data, less rugged, timing varies",["computer","data"]],["PLC for control, computer for data, dedicated IC for mass-produced products",["mass produced","mass","for control"]]]}},"boss":{"1":[{"id":"B101","k":"num","q":"A PLC has a scan time of 4 ms. How many scans does it make each second?","v":250,"unit":"scans per second","tol":0.01,"p":1,"a":16,"why":"1 ÷ 0.004 s = 250 scans per second."},{"id":"B102","k":"explain","q":"Explain why industry uses PLCs instead of hard-wired relay panels.","ideas":[["Changes are made in the program, not by rewiring",["program","software","rewir","wiring"]],["Reliable and rugged in factory conditions",["reliab","rugged","robust","tough","dust","harsh"]],["Easy to program, with lots of inputs and outputs",["inputs","outputs","easy to program","ladder"]]],"need":2,"model":"A PLC is changed by changing its program, not by rewiring a panel for days. It is reliable and rugged enough for dusty, noisy factories, easy to program in ladder logic, and can handle hundreds of inputs and outputs.","p":1,"a":9},{"id":"B103","k":"term","q":"Self-checks and communications: the last stage of every scan.","acc":["housekeeping","house keeping"],"p":1,"a":15,"why":"Housekeeping: self-checks and communications, then the scan repeats.","rivals":["read inputs","run program","update outputs"]},{"id":"B104","k":"num","q":"Boxes 200 mm long pass a sensor on a belt moving at 0.5 m/s. How long does each box block the sensor?","v":0.4,"unit":"s","tol":0.01,"p":1,"a":16,"why":"0.200 m ÷ 0.5 m/s = 0.4 s, which is 400 ms."},{"id":"B105","k":"explain","q":"Explain two differences between a unitary PLC and a modular PLC.","ideas":[["Unitary: everything in one housing; modular: separate modules in a rack",["one housing","one box","single","rack","separate"]],["Unitary has fixed I/O; modular can be expanded",["fixed","expand","add","grow","more modules"]],["Unitary is cheaper; on a modular PLC a faulty module can be swapped on its own",["cheap","cost","swap","replace","faulty"]]],"need":2,"model":"A unitary PLC has all its parts in one housing, but a modular PLC is separate modules on a rack. A unitary PLC has a fixed number of I/O, while modules can be added to a modular one. Also accept: unitary is cheaper; a faulty modular card can be swapped on its own.","p":1,"a":26},{"id":"B106","k":"short","q":"A bakery bagging machine has 30 I/O and will get a label printer next year. Which type of PLC suits it best?","acc":["unitary with modular features","unitary with modular","unitary plc with modular features","unitary with modular feature","unitary with modules"],"p":1,"a":23,"why":"Unitary with modular features: start compact, then clip on modules when the printer arrives. A full modular PLC would work but costs more than this job needs.","rivals":["unitary","unitary plc","unitary type","a unitary plc","modular","modular plc","rack mounted","rack mounted plc","rack plc","modular plcs","a modular plc"]},{"id":"B107","k":"explain","q":"A signal lasts less than one scan time. What could happen, and why?","ideas":[["The PLC could miss it completely",["miss","not see","not detect","never see","not notice","not read","not be seen","not register"]],["Inputs are read once per scan, so it can come and go between two reads",["once","between","each scan","start of","per scan","every scan"]]],"need":2,"model":"The PLC could miss it. Inputs are copied into memory once at the start of each scan, so a signal shorter than one scan can come and go between two reads.","p":1,"a":16}],"2":[{"id":"B201","k":"num","q":"A pressure transmitter covers 0 to 80 kPa on a 4 to 20 mA signal. It sends 10 mA. What is the pressure?","v":30,"unit":"kPa","tol":0.01,"p":2,"a":32,"why":"(10 − 4) ÷ 16 × 80 = 30 kPa."},{"id":"B202","k":"num","q":"A 0 to 25 mV sensor feeds a 0 to 10 V input. What gain is needed?","v":400,"unit":"","tol":0.01,"p":2,"a":33,"why":"25 mV = 0.025 V, so gain = 10 ÷ 0.025 = 400."},{"id":"B203","k":"num","q":"How many different values can a 10-bit ADC give?","v":1024,"unit":"","tol":0.01,"p":2,"a":34,"why":"2¹⁰ = 1024 values (0 to 1023)."},{"id":"B204","k":"explain","q":"Describe two methods of sensor signal conditioning.","ideas":[["Analogue to digital conversion: a continuous signal into numbers",["analogue to digital","adc","digital","numbers"]],["Amplification: makes the signal bigger",["amplif","bigger","gain","increase"]],["Attenuation: reduces the signal",["attenuat","reduc","smaller","potential divider"]],["Filtering: removes noise",["filter","noise"]]],"need":2,"model":"Any two, each named and described: analogue to digital conversion changes a continuous signal into a discrete digital one; amplification increases its size or gain; attenuation reduces its strength; filtering removes unwanted parts such as noise.","p":2,"a":53},{"id":"B205","k":"term","q":"A graphical PLC language based on relay circuit diagrams.","acc":["ladder logic","ladder","ladder diagram","ladder logic diagram"],"p":2,"a":39,"why":"Ladder logic: contacts on the left, coils on the right, drawn like relay diagrams.","rivals":["function block diagram","structured text","instruction list","sequential function chart"]},{"id":"B206","k":"explain","q":"A start and stop rung has no seal-in contact. What happens, and how do you fix it?","ideas":[["The motor only runs while START is held down",["held","hold","while start","let go","only runs","released","stops when"]],["Add the output's own contact in parallel with START",["parallel","seal","own contact","m1 contact","beside","latch"]]],"need":2,"model":"The motor only runs while START is held, because nothing keeps the rung powered. Fix it by adding an M1 contact in parallel with START (the seal-in).","p":2,"a":48},{"id":"B207","k":"short","q":"Which kind of contact passes power only while its input is off?","acc":["normally closed","normally closed contact","nc","nc contact","n c"],"p":2,"a":40,"why":"A normally closed contact. It draws NOT.","rivals":["normally open","normally open contact"]}],"3":[{"id":"B301","k":"explain","q":"Compare the ULN2803 and the L293D.","ideas":[["ULN2803: eight channels, current one way only",["eight","8","one way","one direction","darlington","cannot reverse","cant reverse"]],["L293D: two H-bridges, so it can reverse motors",["h bridge","two motors","reverse","both ways","backwards","both directions"]],["Current: up to 500 mA per channel against 600 mA per motor",["500","600"]]],"need":2,"model":"The ULN2803 has eight Darlington channels of up to 500 mA, but current flows one way only, so it switches lamps, relays and one-way motors. The L293D has two H-bridges of up to 600 mA, so it can drive two motors forwards and backwards.","p":3,"a":63},{"id":"B302","k":"short","q":"Which interface device passes a signal as light, so spikes cannot reach the CPU?","acc":["opto isolator","optoisolator","opto coupler","optocoupler","optical isolator","opto"],"p":3,"a":65,"why":"An opto-isolator: the signal crosses a gap as light, so no wire joins the two sides.","rivals":["relay","signal converter","hmi"]},{"id":"B303","k":"explain","q":"Give two advantages of a computer-based system over a PLC.","ideas":[["Lots of processing power and storage",["processing","storage","memory","power"]],["Excellent with data, graphs and databases",["data","graph","database","analys","log","trend"]],["Good screens, common languages and links to other systems",["screen","hmi","scada","link","network","cloud","connect","python","language"]]],"need":2,"model":"Any two: much more processing power and storage; excellent at data, graphs and databases; good user screens (HMI and SCADA); common languages such as Python; easy links to other systems and the cloud.","p":3,"a":77},{"id":"B304","k":"term","q":"Gathers data and controls equipment at a distant site, sending it back by radio or mobile network.","acc":["rtu","remote terminal unit","remote technical unit","remote terminal units","remote unit"],"p":3,"a":72,"why":"A remote terminal unit (RTU), built for distant sites with radio links and backup power.","rivals":["scada","hmi","plc"]},{"id":"B305","k":"explain","q":"Why is a PLC usually chosen for a theme park animatronic show, but a dedicated IC for a toy?","ideas":[["The park needs reliability all day and easy edits to the show",["reliab","all day","edit","change","program","rugged"]],["A toy needs a low cost per unit in large numbers",["cheap","cost","price","mass","large numbers","thousands","millions","volume"]]],"need":2,"model":"A park show runs hundreds of times a day and is edited, so it needs the reliability and easy program changes of a PLC. A toy is made in thousands, so a dedicated IC gives the lowest cost per unit.","p":3,"a":80},{"id":"B306","k":"num","q":"A small DC motor draws 300 mA. A controller pin gives about 20 mA. How many times more current does the motor need?","v":15,"unit":"","tol":0.01,"p":3,"a":58,"why":"300 ÷ 20 = 15 times, which is why a motor driver IC is needed."},{"id":"B307","k":"short","q":"In a SCADA system, what do operators use to see and change what the PLCs are doing?","acc":["hmi","human machine interface","operator screen","touch screen","screen","operator screens","touchscreen","hmi screen"],"p":3,"a":70,"why":"The HMI, a touch screen for the operators.","rivals":["rtu","plc"]}]},"taboo":[{"id":"TB01","term":"PLC","ban":["programmable","logic","controller"],"p":1,"a":7,"ideas":[["A tough computer in a control cabinet",["computer","box","device","rugged","tough","cabinet"]],["Reads switches and sensors, then switches motors and lamps from its program",["sensor","switch","motor","lamp","input","output","program"]]],"model":"A tough little computer bolted into a control cabinet. It keeps checking its switches and sensors, decides what to do from its program, and switches motors, valves and lamps."},{"id":"TB02","term":"Scan cycle","ban":["read","inputs","outputs"],"p":1,"a":15,"ideas":[["Takes in what every sensor and switch is saying",["sensor","switch","copy","check","look"]],["Works through the instructions",["instruction","decide","work through","run","logic","program"]],["Switches things to match, then goes round again",["switch","motor","lamp","repeat","again","loop","round"]]],"model":"A loop the controller repeats every few milliseconds: copy what every sensor says, work through the instructions top to bottom, switch things to match, do its self-checks, then go round again."},{"id":"TB03","term":"Unitary PLC","ban":["one","housing","box"],"p":1,"a":19,"ideas":[["Everything packed into a single unit",["single","all","everything","together","case","unit"]],["A set number of connections that cannot be added to",["fixed","cannot add","cant add","no extra","expand","grow","set number"]]],"model":"Power supply, processor and a set number of connections all packed in a single case. Cheap and simple, but you cannot add more connections later."},{"id":"TB04","term":"Modular PLC","ban":["module","rack","modular"],"p":1,"a":21,"ideas":[["Separate cards or units plug in side by side",["card","separate","plug","slot","parts","units","pieces"]],["Add, remove or swap parts as the job needs",["add","remove","swap","grow","change","bigger","more"]]],"model":"Separate cards plug into a frame side by side: power, processor, connections. You add, take out or swap cards to suit
